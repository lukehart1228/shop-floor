<!-- the Supabase library, checked: the browser refuses it if even one byte differs from the published file -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="sf-common-2026-10-05.1.js"></script>
<script>
/* The two settings (project address, publishable key), the key check, the connection test, the id maker and the
   Feedback button are in the shared file loaded above, sf-common-2026-10-05.1.js.
   Purchasing (7 Nov; design: the spec's Purchasing tab, "First release: standalone", and the Lumber buying & POs tab):
   To buy (the tablets' supply requests, as on Operations), POs in Luke's PD - PO template filed as PDFs in PD - POs
   (PO 00001 on, and Lumber PO 24 on), Prices against each item's baseline with an export for the yearly check against
   the bills, Savings to chase, Lumber (the tracker), the Purchases file with Match these, and Setup. Managers only.
   purchasing.sql. What's entered is the truth: PO lines, and buys with no PO from the Purchases file. */
var PAGE_VERSION = "2026-11-07.2";          // this page's version: bump it with every change (it shows in select * from devices();)
/* ---- core: no screen code in here, so it can be tested on its own ---- */
const SCRAP_ALLOWANCE = 1.7;                 // the workbook's allowance: 1.7 bd ft bought for each bd ft in a top
function isMissing(err) { return /could not find the function|schema cache|does not exist/i.test(String((err && err.message) || err || "")); }
function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. Check the connection and try again.";
  if (/jwt expired|refresh token/i.test(m)) return "The sign-in has expired. Sign out and back in.";
  if (isMissing(err)) return "Purchasing isn't set up in the database yet. Run purchasing.sql, wait a minute, then reload this page.";
  if (/row-level security|permission denied|insufficient/i.test(m) && !/^Only a manager/.test(m)) return "This login can't do that. Purchasing is for managers.";
  return m || "Something went wrong. Try again, and if it keeps happening, take a screenshot.";
}
const n0 = (x) => Math.round(Number(x) || 0).toLocaleString("en-US");
/** $1,234 (no cents) or $1,234.56 */
function usd(x, cents) {
  const v = Number(x) || 0, s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return (v < 0 ? "−$" : "$") + s;
}
/** a price per board foot: $3.125, $3.50, $3.00 (two or three places, as typed) */
function price(x) { if (x === null || x === undefined || x === "") return ""; const v = Number(x); const s = v.toFixed(3); return "$" + (s.endsWith("0") ? v.toFixed(2) : s); }
const pct = (x) => x === null || x === undefined || !isFinite(x) ? "—" : `${(x * 100).toFixed(1)}%`;
/** "2026-11-04" → "11/4/2026" (as Luke's POs print it) */
function mdy(d) { if (!d) return ""; const [y, m, dd] = String(d).slice(0, 10).split("-").map(Number); return `${m}/${dd}/${y}`; }
const yearOf = (d) => Number(String(d || "").slice(0, 4));
/** the benchmark a 7/4 item takes from 8/4 at the same square feet (the database works it out the same way) */
function compareBenchmark(avg, quarters, asQuarters) { return Math.round(avg * asQuarters / quarters * 10000) / 10000; }
/** one line's tracker figures: bf counts (received, else ordered), its cost and saving */
function lineMoney(l) {
  const tracked = !!l.lumber, bf = tracked ? Number(l.bf) || 0 : 0, priced = l.unit_price !== null && l.unit_price !== undefined;
  const bench = l.benchmark === null || l.benchmark === undefined ? null : Number(l.benchmark);
  return { tracked, bf, priced, cost: priced ? bf * Number(l.unit_price) : null, bench,
           saving: priced && bench !== null ? bf * (bench - Number(l.unit_price)) : null, received: l.received_bf !== null && l.received_bf !== undefined };
}
/** a PO's own sums: tracked bd ft, in so far, its total (as printed), its saving, and where it stands */
function poSummary(po) {
  const ls = po.lines || [];
  let bf = 0, inBf = 0, saving = 0, tracked = 0, open = 0, ordered = 0;
  for (const l of ls) { const m = lineMoney(l); if (!m.tracked) continue; tracked++; bf += m.bf; ordered += Number(l.qty); if (m.saving !== null) saving += m.saving;
    if (m.received) inBf += Number(l.received_bf);
    // still coming: nothing in yet, or slips short of the order (a workbook figure is what came, short or not)
    if (!m.received || (l.history_in_bf === null || l.history_in_bf === undefined) && Number(l.received_bf) < Number(l.qty)) open++; }
  const total = (po.printed && po.printed.length ? po.printed : ls).reduce((a, l) => a + (l.unit_price === null || l.unit_price === undefined ? 0 : Number(l.qty) * Number(l.unit_price)), 0);
  const state = po.cancelled_at ? "cancelled" : !tracked ? "untracked" : inBf === 0 && !ls.some(l => l.received_bf !== null && l.received_bf !== undefined) ? "on order"
              : open ? "part in" : "in";
  return { bf, ordered, inBf, saving, total, state, tracked };
}
/** the months with scrap figures in a year: the workbook's, then Inventory's own (which win for the same month) */
function scrapMonths(data, year) {
  const by = new Map();
  for (const m of data.scrap_history || []) if (yearOf(m.month_end) === year) by.set(m.month_end, { ...m, from: "workbook" });
  for (const m of data.scrap_inventory || []) if (yearOf(m.month_end) === year && Number(m.zero_bf) > 0) by.set(m.month_end, { ...m, from: "Inventory" });
  return [...by.values()].sort((a, b) => String(a.month_end).localeCompare(String(b.month_end))).map(m => {
    const zero = Number(m.zero_bf), used = Number(m.used_bf), allow = zero * SCRAP_ALLOWANCE;
    return { month_end: m.month_end, from: m.from, zero, used, ratio: used / zero, allow, saved: allow - used };
  });
}
/** the workbook's Results tab for one year, from the POs and the scrap months */
function lumberResults(data, year) {
  const lines = [];
  for (const po of data.pos || []) if (!po.cancelled_at && yearOf(po.ordered_on) === year) for (const l of po.lines || []) if (l.lumber) lines.push(l);
  let bf = 0, pricedBf = 0, spent = 0, saving = 0, benchCost = 0, benchSpent = 0, onOrder = 0, noPrice = 0, noBench = 0, measured = 0, measuredOf = 0;
  for (const l of lines) {
    const m = lineMoney(l); bf += m.bf;
    if (!m.received) onOrder += m.bf;
    if (!m.priced) { noPrice++; continue; }
    pricedBf += m.bf; spent += m.cost;
    if (m.bench === null) { noBench++; continue; }
    saving += m.saving; benchCost += m.bf * m.bench; benchSpent += m.cost;
    if (l.measured_bf && m.received) { measured += Number(l.measured_bf); measuredOf += Number(l.received_bf); }
  }
  const avg = pricedBf ? spent / pricedBf : 0;
  const months = scrapMonths(data, year);
  const zero = months.reduce((a, m) => a + m.zero, 0), used = months.reduce((a, m) => a + m.used, 0), savedBf = months.reduce((a, m) => a + m.saved, 0);
  const ratio = zero ? used / zero : null;
  const costCut = benchCost ? 1 - benchSpent / benchCost : null, scrapCut = ratio === null ? null : 1 - ratio / SCRAP_ALLOWANCE;
  return { year, lines: lines.length, bf, spent, avg, saving, onOrder, noPrice, noBench, months, ratio, savedBf, scrapDollars: savedBf * avg,
           total: saving + savedBf * avg, costCut, scrapCut, totalCut: costCut === null ? null : costCut + (scrapCut || 0),
           lostOnPurchase: measuredOf ? 1 - measured / measuredOf : null };
}
/** each supplier's share of board feet and dollars: this year from the POs, the year before from what was typed in */
function supplierMix(data, year) {
  const now = new Map(), before = new Map();
  for (const po of data.pos || []) if (!po.cancelled_at && yearOf(po.ordered_on) === year)
    for (const l of po.lines || []) { const m = lineMoney(l); if (!m.tracked) continue;
      const r = now.get(po.vendor_id) || { bf: 0, dollars: 0 }; r.bf += m.bf; r.dollars += m.cost || 0; now.set(po.vendor_id, r); }
  for (const t of data.year_totals || []) if (Number(t.year) === year - 1) before.set(t.vendor_id, { bf: Number(t.bf), dollars: Number(t.dollars) });
  const sum = (m, k) => [...m.values()].reduce((a, r) => a + r[k], 0);
  const tn = { bf: sum(now, "bf"), dollars: sum(now, "dollars") }, tb = { bf: sum(before, "bf"), dollars: sum(before, "dollars") };
  const ids = [...new Set([...now.keys(), ...before.keys()])];
  const rows = ids.map(id => { const v = (data.suppliers || []).find(x => x.id === id) || {}; const a = before.get(id) || { bf: 0, dollars: 0 }, b = now.get(id) || { bf: 0, dollars: 0 };
    return { id, name: v.name || "?", before: a, now: b, bfShareBefore: tb.bf ? a.bf / tb.bf : null, bfShareNow: tn.bf ? b.bf / tn.bf : null,
             dShareBefore: tb.dollars ? a.dollars / tb.dollars : null, dShareNow: tn.dollars ? b.dollars / tn.dollars : null }; })
    .sort((a, b) => b.now.bf - a.now.bf || b.before.bf - a.before.bf);
  return { rows, totalNow: tn, totalBefore: tb, hasBefore: before.size > 0 };
}
/** the editor's lines, checked as the database will: [{qty, unit, description, job_number, unit_price, item_id, supply_request_id}] or a problem */
function checkLines(rows, items) {
  const isLumber = (id) => !!id && ((items || []).find(i => i.id === id) || {}).category_key === "lumber";
  const out = [];
  for (const [i, r] of rows.entries()) {
    const blank = !String(r.qty ?? "").trim() && !String(r.description ?? "").trim() && !String(r.unit_price ?? "").trim();
    if (blank && !r.id) continue;
    const qty = Number(String(r.qty ?? "").replace(/,/g, "")), up = String(r.unit_price ?? "").replace(/[$,\s]/g, "");
    if (!(qty > 0)) return { problem: `Line ${i + 1}: type the quantity.` };
    if (!String(r.description || "").trim()) return { problem: `Line ${i + 1}: type the description.` };
    if (up !== "" && !(Number(up) >= 0)) return { problem: `Line ${i + 1}: the unit price isn't a number.` };
    if (isLumber(r.item_id) && String(r.unit || "").trim()) return { problem: `Line ${i + 1}: a lumber line is in board feet, so leave its unit blank.` };
    out.push({ ...(r.id ? { id: r.id } : {}), qty, unit: String(r.unit || "").trim(), description: String(r.description).trim(),
               job_number: String(r.job_number || "").trim(), unit_price: up === "" ? null : Number(up), item_id: r.item_id || null,
               supply_request_id: r.supply_request_id || null });
  }
  if (!out.length) return { problem: "Add at least one line." };
  if (out.length > 22) return { problem: "A PO has room for 22 lines. Split it into two POs." };
  return { lines: out };
}

/* ---- the PO as a PDF: a copy of the PD - PO sheet in Luke's PD PO Template.xlsx ----
   Laid out from the sheet itself: its column widths and row heights, printed at the sheet's own 49% on letter
   portrait with its margins (0.7" sides, 0.75" top): rows at the sheet's 49%, columns spread to the page's width as
   Excel and LibreOffice print it (Fit to 1 page wide). Checked against the sheet itself printed by LibreOffice. The orange fills (Excel's Orange, Accent 2, 60% lighter), the
   medium outer box and title box, the thin grids, the double rule under the lines and above Total Due, the logo
   where the sheet has it, the labels and alignments as on the sheet; Calibri becomes Helvetica. */
const PO_COLS = [12.375, 4.03515625, 22.05859375, 47.484375, 18.96484375, 22.05859375, 41.02734375, 5.6484375, 9.14453125];   // A to I
const PO_ROWS = { 1: 15.75, 2: 14.45, 3: 14.45, 4: 14.45, 5: 15.95, 27: 17.1, 57: 14.45 };
for (const r of [6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 18, 19, 20]) PO_ROWS[r] = 20.1;
for (let r = 28; r <= 56; r++) PO_ROWS[r] = 24.95;
const PO_FILL = [248 / 255, 203 / 255, 173 / 255];
/** Excel's column width (characters of Calibri 11) in points */
const colPt = (w) => Math.trunc(((256 * w + Math.trunc(128 / 7)) / 256) * 7) * 0.75;
function poGrid() {
  const xs = [0]; for (const w of PO_COLS) xs.push(xs[xs.length - 1] + colPt(w));
  const ys = [0, 0]; for (let r = 1; r <= 58; r++) ys[r + 1] = ys[r] + (PO_ROWS[r] || 15);
  return { xs, ys };                                    // xs[c] = left edge of column c (0 = A); ys[r] = top of row r (1-based)
}
/** the number a PO prints: 24 for Lumber PO 24, 00001 for PO 00001 */
const poNumberText = (po) => po.series === "po" ? String(po.po_number || "").padStart(5, "0") : String(po.po_number || "");
async function poPdf(PDFLib, po, logoBytes) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib, doc = await PDFDocument.create();
  const f = await doc.embedFont(StandardFonts.Helvetica), b = await doc.embedFont(StandardFonts.HelveticaBold);
  const { xs, ys } = poGrid(), C = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8 };
  const page = doc.addPage([612, 792]), SX = (612 - 2 * 0.7 * 72) / xs[9], S = 0.49, X0 = 0.7 * 72, Y0 = 792 - 0.75 * 72, black = rgb(0, 0, 0), fill = rgb(...PO_FILL);
  const X = (col) => X0 + xs[C[col]] * SX, Xr = (col) => X0 + xs[C[col] + 1] * SX, Y = (row) => Y0 - ys[row] * S, Yb = (row) => Y0 - ys[row + 1] * S;
  const h = po.header || {}, v = h.vendor || {}, sh = h.ship_to || {};
  const clean = (t) => String(t == null ? "" : t).replace(/[^\x20-\x7e]/g, (c) => ({ "\u2018": "'", "\u2019": "'", "\u201c": '"', "\u201d": '"', "\u2013": "-", "\u2014": "-", "\u00a0": " " })[c] || "");
  const SZ = 11 * S, PAD = 2.2 * S * 2;
  /** text in a box: left, centre or right, shrunk (never below 70%) then cut to fit */
  const put = (t, x1, x2, yTop, yBot, o = {}) => {
    let s = clean(t), size = (o.size || 11) * S; const font = o.bold ? b : f, width = x2 - x1 - 2 * PAD;
    while (s && font.widthOfTextAtSize(s, size) > width && size > (o.size || 11) * S * 0.7) size -= 0.1;
    while (s && font.widthOfTextAtSize(s, size) > width) s = s.slice(0, -1);

    for (const r of open) { const g = groups.get(r.department) || { name: r.department_name, rows: [] }; g.rows.push(r); groups.set(r.department, g); }
    const n = S.ticked.size;
    const rows = [...groups.values()].map(g => `<div class="dept">${esc(g.name)}</div><div class="tw"><table><tbody>${g.rows.map(r => {
      const po = r.state === "ordered" ? poForRequest(r.id) : null;
      return `<tr><td class="chkc">${r.state === "requested" ? `<input type="checkbox" class="chk" data-tick="${esc(r.id)}" ${S.ticked.has(r.id) ? "checked" : ""} aria-label="Tick ${esc(r.item)}">` : ""}</td>
        <td class="l wrap"><b>${esc(r.qty)} × ${esc(r.item)}</b>${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}</td>
        <td class="l small muted">${esc(r.requested_by_name || "")} · ${esc(when(r.requested_at))}</td>
        <td class="l">${r.state === "ordered" ? `<span class="tag done">Ordered${po ? ` on ${esc(po.name)}` : ""}</span>` : `<span class="tag">Waiting</span>`}</td>
        <td>${S.notOrdering === r.id ? `<span class="row"><input data-noreason style="min-height:40px;border:1px solid var(--gray);border-radius:8px;padding:4px 8px" placeholder="Why (the department sees it)" aria-label="Why not ordering">
            <button class="btn ghost" data-nosave="${esc(r.id)}">Save</button><button class="link" data-nocancel>Cancel</button></span>`
          : `<button class="link" data-noorder="${esc(r.id)}">Not ordering…</button>`}</td></tr>`; }).join("")}</tbody></table></div>`).join("");
    const deptOpts = S.depts.map(d => `<option value="${esc(d.key)}">${esc(d.name)}</option>`).join("");
    return `<div class="titlerow"><div class="grow"><h2>To buy</h2><p class="sub" style="margin-bottom:0">What the departments asked for on their tablets' Supplies tab, plus anything added here. Operations shows the same list: ticking it ordered here shows there too.</p></div></div>
      <div class="row" style="margin:6px 2px 4px">
        <button class="btn or" data-reqpo ${n ? "" : "disabled"}>Put ${n ? n + " ticked" : "ticked"} on a PO</button>
        <button class="btn ghost" data-reqorder ${n ? "" : "disabled"}>Mark ${n ? n + " ticked" : "ticked"} as ordered</button></div>
      ${open.length ? rows : `<p class="muted" style="margin:16px 2px">Nothing waiting to be bought.</p>`}
      <h3>Add something to buy</h3>
      ${S.adding ? `<div class="card"><div class="form">
          <label>For<select id="adDept">${deptOpts}</select></label><label>What<input id="adItem" placeholder="Titebond III, 1 gallon"></label>
          <label>Quantity<input id="adQty" class="n" inputmode="numeric" value="1"></label><label>Note<input id="adNote"></label>
          <button class="btn" data-addsave ${S.busy ? "disabled" : ""}>Add it</button><button class="link" data-addcancel>Cancel</button></div></div>`
        : `<button class="btn ghost" data-addreq>Add something to buy</button>`}`;
  }

  // ---------- POs ----------
  function stateTag(po, sum) {
    if (sum.state === "cancelled") return `<span class="tag">Cancelled</span>`;
    if (sum.state === "untracked") return "";
    if (sum.state === "in") return `<span class="tag done">In</span>`;
    if (sum.state === "part in") return `<span class="tag">${n0(sum.inBf)} of ${n0(sum.ordered)} in</span>`;
    return `<span class="tag">On order</span>`;
  }
  function fileTag(po) {
    if (!po.file_name) return `<span class="muted small">From the workbook</span>`;
    if (po.cancelled_at) return "";
    return po.filed_at ? `<span class="tag done">Filed</span>` : `<span class="tag flag">Not filed</span>`;
  }
  function filingBanner() {
    const wait = waiting();
    return !wait.length ? "" : !canPickFolder()
      ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " isn't" : "s aren't"} in PD - POs yet<small>This browser can't save into a folder. Download ${wait.length === 1 ? "it" : "each"} with PDF below and put ${wait.length === 1 ? "it" : "them"} in Production Utilization › PD - POs, or use Chrome or Edge on the office PC.</small></div>`
      : !S.folder ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " isn't" : "s aren't"} in PD - POs yet<small>Choose the folder once on this computer and they're filed there from then on.</small><div style="margin-top:8px"><button class="btn" data-pickfolder>Choose the PD - POs folder</button></div></div>`
      : S.perm !== "granted" ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " is" : "s are"} waiting to be filed in PD - POs<small>The browser wants permission for the folder again.</small><div style="margin-top:8px"><button class="btn" data-resume>Resume filing</button></div></div>`
      : `<div class="banner">${wait.length} PO${wait.length === 1 ? " is" : "s are"} waiting to be filed in ${esc(S.folder.name)}<div style="margin-top:8px"><button class="btn" data-filenow ${S.filing ? "disabled" : ""}>File ${wait.length === 1 ? "it" : "them"} now</button></div></div>`;
  }
  const nextName = (series) => series === "lumber" ? `Lumber PO ${S.data.next_lumber}` : `PO ${String(S.data.next_po).padStart(5, "0")}`;
  function viewPos() {
    const pos = (S.data.pos || []).filter(p => yearOf(p.ordered_on) === S.year);
    const rows = pos.map(po => {
      const sum = poSummary(po), open = S.open === po.id, n = (po.lines || []).length;
      return `<tr class="click ${open ? "open" : ""} ${po.cancelled_at ? "off" : ""}" data-openpo="${esc(po.id)}"><td><b>${esc(po.name)}</b>${po.revision > 1 && po.file_name ? ` <span class="tag">r${po.revision}</span>` : ""}</td>
        <td class="l">${esc(po.vendor)}</td><td>${esc(mdy(po.ordered_on))}</td><td class="l">${sum.tracked ? `${n0(sum.bf)} bd ft` : `${n} line${n === 1 ? "" : "s"}`}</td><td class="num">${usd(sum.total)}</td>
        <td class="l">${stateTag(po, sum)}</td><td class="l">${fileTag(po)}</td></tr>
        ${open ? `<tr><td colspan="7" style="padding:0">${poDetail(po)}</td></tr>` : ""}`;
    }).join("");
    const ready = S.data.issuer.ready;
    return `<div class="titlerow"><div class="grow"><h2>POs ${S.year}</h2><p class="sub" style="margin-bottom:0">Every PO the shop makes, in your PD - PO template, filed in PD - POs. Next: ${esc(nextName("po"))} and ${esc(nextName("lumber"))}. Tap a PO for its lines.</p></div>${yearPicker()}</div>
      <div class="row" style="margin:0 2px 12px"><button class="btn or" data-newpo="po" ${ready ? "" : "disabled"}>Make a PO</button><button class="btn ghost" data-newpo="lumber" ${ready ? "" : "disabled"}>Make a lumber PO</button></div>
      ${ready ? "" : `<div class="banner">Fill in the PO details first<small>Setup › PO details: who issues it, phone, e-mail, address and the tax-exempt line (the Arrow POs use the same).</small></div>`}
      ${filingBanner()}
      ${pos.length ? `<div class="tw"><table><thead><tr><th>PO</th><th class="l">Supplier</th><th>Issued</th><th class="l">What</th><th>Total</th><th class="l">In</th><th class="l">PDF</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<p class="muted">No POs in ${S.year} yet.</p>`}
      <p class="note" style="margin:10px 2px">Buys off a website, by card or at a store have no PO: they come in through the Purchases file and count in Prices.</p>`;
  }
  function poDetail(po) {
    const anyLumber = (po.lines || []).some(l => l.lumber), reqs = new Map(S.reqs.map(r => [r.id, r]));
    const lines = (po.lines || []).map(l => {
      const m = lineMoney(l), it = l.item_id ? itemById(l.item_id) : null, rq = l.supply_request_id ? reqs.get(l.supply_request_id) : null;
      return `<tr><td>${l.position}</td><td class="num">${esc(Number(l.qty).toLocaleString("en-US", { maximumFractionDigits: 3 }))}${l.unit ? " " + esc(l.unit) : ""}</td>
        <td class="l wrap">${esc(l.description)}${l.supply_request_id ? ` <span class="pill">${rq ? esc(rq.department_name) + " asked" : "supply request"}</span>` : ""}</td><td class="l">${esc(l.job_number)}</td>
        <td class="num">${esc(price(l.unit_price))}</td><td class="l">${it ? esc(it.name) : `<span class="muted">no item</span>`}</td>
        ${anyLumber ? `<td class="num">${!m.tracked ? "" : m.bench === null ? "—" : esc(price(m.bench))}</td>
        <td class="num">${!m.tracked ? "" : m.received ? `${n0(l.received_bf)}${l.slips ? ` <span class="muted small">(${l.slips} slip${l.slips === 1 ? "" : "s"})</span>` : ""}` : `<span class="muted">on order</span>`}</td>
        <td class="num">${m.saving === null ? "" : usd(m.saving)}</td>
        <td>${!m.tracked || po.cancelled_at ? "" : `<input class="n" style="width:110px" data-measured="${esc(l.id)}" inputmode="decimal" value="${l.measured_bf === null || l.measured_bf === undefined ? "" : esc(l.measured_bf)}" placeholder="—" aria-label="Measured after SLR, line ${l.position}">`}</td>` : ""}</tr>`;
    }).join("");
    const earlier = (po.earlier || []).filter(e => e.file_name).map(e => `${esc(e.file_name)} (${esc(String(e.at || "").slice(0, 10))}, ${esc(e.by || "")})`).join("; ");
    const bills = (S.data.buys || []).filter(b => b.po_id === po.id);
    return `<div class="detail">
      <div class="note">${po.from_history ? "From the workbook (no PDF). " : `Made by ${esc(po.made_by_name || "")}${po.changed_by_name ? `, changed by ${esc(po.changed_by_name)}` : ""}. `}${po.cancelled_at ? `Cancelled by ${esc(po.cancelled_by_name)}${po.cancel_reason ? `: ${esc(po.cancel_reason)}` : ""}.` : ""}
        ${po.filed_at ? `Filed in PD - POs as ${esc(po.file_name)}.` : ""}</div>
      <div class="tw"><table><thead><tr><th>#</th><th>Qty</th><th class="l">Description</th><th class="l">Job</th><th>Price</th><th class="l">Item</th>
        ${anyLumber ? `<th>Measured against</th><th>In (bd ft)</th><th>Saved</th><th>Measured after SLR</th>` : ""}</tr></thead><tbody>${lines}</tbody></table></div>
      ${earlier ? `<p class="note">Earlier versions, kept: ${earlier}</p>` : ""}
      ${bills.length ? `<p class="note">On record against this PO from the Purchases file (not counted again): ${bills.map(b => `${esc(b.doc || b.supplier)} ${esc(mdy(b.on))}, ${usd(b.amount, true)}`).join("; ")}.</p>` : ""}
      <div class="row">
        ${po.cancelled_at ? `<button class="btn ghost" data-uncancel="${esc(po.id)}">Put it back</button>` : `<button class="btn ghost" data-changepo="${esc(po.id)}">Change the PO</button>`}
        ${po.file_name ? `<button class="btn ghost" data-pdf="${esc(po.id)}">PDF</button>` : ""}
        ${!po.cancelled_at ? `<button class="link" data-cancelpo="${esc(po.id)}">Cancel the PO</button>` : ""}
        ${anyLumber ? `<span class="note">Received board feet come from Inventory's lumber slips, picked on the Lumber tab.</span>` : ""}</div></div>`;
  }

  // ---------- the PO editor ----------
  const blankLine = () => ({ qty: "", unit: "", description: "", job_number: "", unit_price: "", item_id: "", supply_request_id: "" });
  function startEdit(po, series, fromRequests) {
    if (!po) {
      const lines = (fromRequests || []).map(r => ({ ...blankLine(), qty: String(r.qty), description: r.item, supply_request_id: r.id }));
      while (lines.length < 3) lines.push(blankLine());
      S.edit = { series, vendor_id: "", ordered_on: S.data.today, date: "", date_required: "", terms: "", method: "", po_job: "", lines };
    } else {
      const h = po.header || {};
      S.edit = { id: po.id, name: po.name, series: po.series, history: po.from_history, vendor_id: po.vendor_id, ordered_on: po.ordered_on, date: h.date || "", date_required: h.date_required || "",
                 terms: h.terms || "", method: h.method || "", po_job: h.po_job || "",
                 lines: (po.lines || []).map(l => ({ id: l.id, qty: String(l.qty), unit: l.unit || "", description: l.description, job_number: l.job_number || "",
                                                     unit_price: l.unit_price === null || l.unit_price === undefined ? "" : String(Number(l.unit_price)), item_id: l.item_id || "",
                                                     supply_request_id: l.supply_request_id || "" })) };
    }
    S.edit.client_id = newId(); S.msg = null; render(); window.scrollTo(0, 0);
  }
  function readEdit() {
    const E = S.edit; if (!E) return;
    const val = (sel) => { const el = app.querySelector(sel); return el ? el.value : undefined; };
    for (const k of ["vendor_id", "ordered_on", "date", "date_required", "terms", "method", "po_job"]) { const x = val(`[data-e="${k}"]`); if (x !== undefined) E[k] = x; }
    E.lines.forEach((l, i) => { for (const k of ["qty", "unit", "description", "job_number", "unit_price", "item_id"]) { const x = val(`[data-l="${i}|${k}"]`); if (x !== undefined) l[k] = x; } });
  }
  function lastPaidText(itemId, ents) {
    const lp = itemId ? lastPaid(S.data, itemId, ents) : null;
    return lp ? `Last paid ${price(lp.price)}${lp.unit ? " a " + esc(lp.unit) : ""} · ${esc(lp.supplier)} · ${esc(mdy(lp.date))}` : "";
  }
  function viewEdit() {
    const E = S.edit, lumber = E.series === "lumber", ents = entries(S.data);
    const vendors = (S.data.suppliers || []).filter(v => !v.retired || v.id === E.vendor_id);
    const items = (S.data.items || []).filter(i => (!i.retired || E.lines.some(l => l.item_id === i.id)));
    const cats = (S.data.categories || []).filter(c => items.some(i => i.category_key === c.key));
    const itemOpts = (sel) => `<option value="">No item</option>${cats.map(c => `<optgroup label="${esc(c.name)}">${items.filter(i => i.category_key === c.key)
      .map(it => `<option value="${esc(it.id)}" ${it.id === sel ? "selected" : ""}>${esc(it.name)}</option>`).join("")}</optgroup>`).join("")}`;
    const reqs = new Map(S.reqs.map(r => [r.id, r]));
    const descs = [...new Set((S.data.pos || []).filter(p => p.series === E.series).flatMap(p => (p.lines || []).map(l => l.description)))].slice(0, 300);
    let total = 0;
    const rows = E.lines.map((l, i) => {
      const q = Number(String(l.qty).replace(/,/g, "")), up = Number(String(l.unit_price).replace(/[$,]/g, ""));
      const amt = String(l.unit_price).trim() !== "" && q > 0 && up >= 0 ? Math.round(q * up * 100) / 100 : null; if (amt) total += amt;
      const rq = l.supply_request_id ? reqs.get(l.supply_request_id) : null;
      return `<tr><td>${i + 1}</td>
        <td style="width:110px"><input class="n" data-l="${i}|qty" inputmode="decimal" value="${esc(l.qty)}" aria-label="Quantity, line ${i + 1}"></td>
        <td style="width:90px"><input data-l="${i}|unit" value="${esc(l.unit)}" placeholder="${lumber ? "bd ft" : "each"}" aria-label="Unit, line ${i + 1}"></td>
        <td><input data-l="${i}|description" list="descs" value="${esc(l.description)}" aria-label="Description, line ${i + 1}">
          <div class="note" id="lp-${i}">${l.supply_request_id ? `<span class="pill">${rq ? esc(rq.department_name) + " asked for it" : "a supply request"}</span> ` : ""}${lastPaidText(l.item_id, ents)}</div></td>
        <td style="width:100px"><input data-l="${i}|job_number" value="${esc(l.job_number)}" aria-label="Job number, line ${i + 1}"></td>
        <td style="width:110px"><input class="n" data-l="${i}|unit_price" inputmode="decimal" value="${esc(l.unit_price)}" aria-label="Unit price, line ${i + 1}"></td>
        <td style="width:190px"><select data-l="${i}|item_id" aria-label="Item, line ${i + 1}">${itemOpts(l.item_id)}</select></td>
        <td class="num" style="width:110px" id="amt-${i}">${amt === null ? "" : usd(amt, true)}</td>
        <td style="width:40px"><button class="x" data-rmline="${i}" aria-label="Take off line ${i + 1}">×</button></td></tr>`;
    }).join("");
    const field = (k, label, type = "text") => `<label>${label}<input type="${type}" data-e="${k}" value="${esc(E[k] || "")}"></label>`;
    return `<h2>${E.id ? `Change ${esc(E.name)}` : `Make ${esc(nextName(E.series))}`}</h2>
      <p class="sub">${E.history ? "From the workbook: a change corrects the record, and no PDF is made." : E.id ? "A change keeps the number and makes a new version (r2, r3…), filed in PD - POs beside the first. The first version is kept." : "Printed in your PD - PO template and filed in PD - POs as a PDF. The number is given when you make it."}</p>
      <div class="card"><div class="form">
        <label>Supplier<select data-e="vendor_id"><option value="">Choose…</option>${vendors.map(v => `<option value="${esc(v.id)}" ${v.id === E.vendor_id ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></label>
        ${field("ordered_on", "Date issued", "date")}${field("date", "Date", "date")}${field("date_required", "Date required", "date")}
        ${field("terms", "Terms")}${field("method", "Method")}${field("po_job", "PO # / Job #")}
      </div>${!vendors.length ? `<p class="note">No suppliers yet: add one in Setup › Suppliers.</p>` : ""}</div>
      <div class="tw"><table class="edit"><thead><tr><th>#</th><th>Quantity</th><th class="l">Unit</th><th class="l">Description</th><th class="l">Job Number</th><th>Unit Price</th><th class="l">Item</th><th>Amount</th><th></th></tr></thead>
        <tbody>${rows}<tr class="subtot"><td colspan="7">Total</td><td class="num" id="amt-total">${usd(total, true)}</td><td></td></tr></tbody></table></div>
      <datalist id="descs">${descs.map(d => `<option value="${esc(d)}">`).join("")}</datalist>
      <p class="note" style="margin:8px 2px">Item: what the line counts as in Prices. ${lumber ? "Lumber lines are in board feet, so leave Unit blank; plywood and anything else: its own item, with its unit (Sheets)." : "Last paid: the most recent price for that item from any supplier, so a creep shows before you sign."}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" data-addline ${E.lines.length >= 22 ? "disabled" : ""}>Add a line</button>
        ${E.history ? "" : `<button class="btn ghost" data-preview>Preview the PDF</button>`}
        <button class="btn or" data-savepo ${S.busy ? "disabled" : ""}>${E.id ? "Save the change" : "Make the PO"}</button>
        <button class="link" data-canceledit>Cancel</button></div>`;
  }
  function editAmounts() {
    let total = 0; const ents = entries(S.data);
    S.edit.lines.forEach((l, i) => {
      const q = Number(String(l.qty).replace(/,/g, "")), up = Number(String(l.unit_price).replace(/[$,]/g, ""));
      const amt = String(l.unit_price).trim() !== "" && q > 0 && up >= 0 ? Math.round(q * up * 100) / 100 : null; if (amt) total += amt;
      const c = document.getElementById("amt-" + i); if (c) c.textContent = amt === null ? "" : usd(amt, true);
      const lp = document.getElementById("lp-" + i);
      if (lp && !l.supply_request_id) lp.innerHTML = lastPaidText(l.item_id, ents);
    });
    const t = document.getElementById("amt-total"); if (t) t.textContent = usd(total, true);
  }
  /** what the PO would print, for the preview: the same shape purchase_po_save() makes */
  function draftPo(lines) {
    const E = S.edit, v = supplierById(E.vendor_id), is = S.data.issuer || {}, addr = String(is.address || "").split(/\s*\n\s*/);
    const num = E.id ? Number(String(E.name).replace(/\D+/g, "")) : E.series === "lumber" ? S.data.next_lumber : S.data.next_po;
    return { name: E.id ? E.name : nextName(E.series), series: E.series, po_number: num,
      header: { vendor: { name: v.contact, company: v.company || v.name, street: v.street, city: v.city, phone: v.phone, email: v.email },
                issued_by: is.issued_by, phone: is.phone, email: is.email, tax_line: is.tax_line, ship_to: { company: addr[0], street: addr[1], city: addr[2] },
                date_issued: E.ordered_on, date: E.date, date_required: E.date_required, terms: E.terms, method: E.method, po_job: E.po_job },
      printed: lines.map(l => ({ ...l, amount: l.unit_price === null ? null : Math.round(l.qty * l.unit_price * 100) / 100 })) };
  }
  async function savePo() {
    readEdit();
    const E = S.edit, chk = checkLines(E.lines, S.data.items);
    if (!E.vendor_id) { S.msg = { ok: false, text: "Choose the supplier." }; return render(); }
    if (chk.problem) { S.msg = { ok: false, text: chk.problem }; return render(); }
    const p = { series: E.series, vendor_id: E.vendor_id, ordered_on: E.ordered_on, date: E.date, date_required: E.date_required, terms: E.terms, method: E.method, po_job: E.po_job, lines: chk.lines };
    if (E.id) p.id = E.id;
    S.busy = true; render();
    const r = await Promise.resolve(db.rpc("purchase_po_save", { p_client_id: E.id ? null : E.client_id, p })).catch(e => ({ error: e }));
    S.busy = false;
    if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); }
    const d = r.data || {};
    S.edit = null; S.tab = "pos"; store.set("tab", "pos"); S.open = d.id; S.ticked = new Set();
    const reqText = d.requests_ordered ? ` ${d.requests_ordered} supply request${d.requests_ordered === 1 ? " is" : "s are"} marked ordered.` : "";
    S.msg = { ok: true, text: (d.unchanged ? `Nothing changed on ${d.name}.` : E.id ? `${d.name} changed${d.file_name ? `: it's ${d.file_name} now` : ""}.` : `${d.name} made.`) + reqText };
    await load();
    const made = (S.data.pos || []).find(x => x.id === d.id);
    if (made) S.year = yearOf(made.ordered_on);
    render();
    if (made && made.file_name && !made.filed_at) {
      if (S.folder && S.perm === "granted") await fileWaiting();
      else { S.msg = { ok: true, text: `${S.msg.text} It isn't in PD - POs yet: ${!canPickFolder() ? "download it with PDF and put it there." : !S.folder ? "choose the folder below and it's filed." : "Resume filing below."}` }; render(); }
    }
  }

  // ---------- Prices ----------
  const stat = (o, t, s, big) => `<div class="stat ${big ? "big" : ""}"><div class="o">${o}</div><div class="t num">${t}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  const signed = (x) => x === null ? "—" : x >= 0 ? usd(x) : "−" + usd(-x);
  function viewPrices() {
    const P = pricesFor(S.data, S.year), ents = entries(S.data);

  // ---------- the Purchases file, and Match these ----------
  const inflateRaw = async (bytes) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  async function readFile(f) {
    S.file = { name: f.name, reading: true }; render();
    try {
      const buf = await f.arrayBuffer();
      if (buf.byteLength > 15 * 1024 * 1024) throw new Error("That file is over 15 MB. The Purchases file is a few hundred lines; check it's the right one.");
      let rows;
      if (/\.csv$/i.test(f.name)) rows = readCsv(new TextDecoder().decode(buf));
      else if (/\.xlsx$/i.test(f.name)) { if (typeof DecompressionStream !== "function") throw new Error("This browser can't open .xlsx files. Use Chrome or Edge, or save the Lines tab as a .csv."); rows = pickSheet(await readXlsx(buf, inflateRaw)); }
      else throw new Error("Drop the Purchases file as .xlsx or .csv.");
      const r = sheetToLines(rows);
      S.file = { name: f.name, sha256: await sha256Hex(buf), client_id: newId(), lines: r.lines, problems: r.problems };
    } catch (e) { S.file = { name: f.name, error: friendlyError(e) }; }
    render();
  }
  async function sendFile() {
    const F = S.file; if (!F || !F.lines || F.problems.length) return;
    S.busy = true; render();
    const r = await Promise.resolve(db.rpc("purchases_drop", { p_client_id: F.client_id, p_file: { name: F.name, sha256: F.sha256 }, p_lines: F.lines })).catch(e => ({ error: e }));
    S.busy = false;
    if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); }
    S.file = null; S.msg = { ok: true, text: `${F.name}: ${r.data.summary}` }; await load(); render();
  }

          <td><select data-fndo="${i}" aria-label="What to do with ${esc(n.name)}"><option value="new" ${!n.same && n.category ? "selected" : ""}>Make it a new item</option><option value="" ${!n.same && !n.category ? "selected" : ""}>Leave it for now</option>
            ${items.filter(it => !n.category || it.category_key === n.category).map(it => `<option value="${esc(it.id)}" ${n.same && n.same.id === it.id ? "selected" : ""}>Same as ${esc(it.name)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
        <div class="row" style="margin:8px 2px 4px"><button class="btn" data-fnapply ${S.busy ? "disabled" : ""}>Do these</button>
          <span class="note">A new item takes the file's name, category and unit. "Same as" keeps the file's name as one of that item's other names. Either way the lines are filed now, and every future file's lines naming it file themselves.</span></div>` : ""}
      <h3>Match these${groups.length ? ` <span class="pill">${groups.reduce((a, g) => a + g.ids.length, 0)} lines</span>` : ""}</h3>
      ${mrows ? `<div class="tw"><table><thead><tr><th class="l">Bought</th><th>Spent</th><th class="l">Item</th><th></th></tr></thead><tbody>${mrows}</tbody></table></div>
        <p class="note" style="margin:8px 2px">Matching remembers: the next file's line from the same supplier with the same words, or naming the same item, files itself. ${groups.length > 60 ? `Showing the 60 biggest of ${groups.length}.` : ""}</p>`
        : `<p class="muted">Nothing waiting: every line is filed under an item.</p>`}
      <div class="row" style="margin:12px 2px"><button class="btn ghost" data-itemscsv>Download the item list</button><span class="note">For the Purchases project, so it uses the shop's names for things.</span></div>
      ${files ? `<h3>Files added</h3><div class="tw"><table><thead><tr><th class="l">File</th><th>Added</th><th class="l">By</th><th>New lines</th><th>Already in</th></tr></thead><tbody>${files}</tbody></table></div>` : ""}
      ${left.length ? `<details class="fold"><summary>Left out (${left.length})</summary><div class="tw"><table><tbody>${left.map(b => `<tr><td class="l wrap">${esc(b.description)}<div class="note">${esc(b.supplier)} · ${esc(mdy(b.on))} · ${esc(b.ignore_reason || "")}</div></td>
          <td class="num">${usd(b.amount, true)}</td><td><button class="link" data-putback="${esc(b.id)}">Put it back</button></td></tr>`).join("")}</tbody></table></div></details>` : ""}`;
  }

  // ---------- Setup ----------
  function viewSetup() {
    const is = S.data.issuer || {}, D = S.data, ed = S.setupEdit || {};
    const sup = (D.suppliers || []).map(v => ed.supplier === v.id ? supplierForm(v) : `<tr class="${v.retired ? "off" : ""}"><td><b>${esc(v.name)}</b>${(v.aliases || []).length ? `<div class="note">also ${esc(v.aliases.join(", "))}</div>` : ""}</td><td class="l">${esc(v.company || "")}</td><td class="l">${esc(v.contact || "")}</td>
        <td class="l wrap">${esc([v.street, v.city, v.phone, v.email].filter(Boolean).join(" · "))}</td><td><button class="link" data-editsupplier="${esc(v.id)}">Change</button></td></tr>`).join("");
    const cats = (D.categories || []).filter(c => !c.retired || ed.cat === c.key);
    const itemRows = (c) => (D.items || []).filter(i => i.category_key === c.key).map(i => ed.item === i.id ? itemForm(i) : `<tr class="${i.retired ? "off" : ""}"><td><b>${esc(i.name)}</b>${(i.aliases || []).length ? `<div class="note">also ${esc(i.aliases.join(", "))}</div>` : ""}</td>
        <td class="l">${esc(i.unit)}${i.quarters ? ` · ${i.quarters}/4` : ""}</td><td class="l">${i.compare_as ? `as ${esc((itemById(i.compare_as) || {}).name || "?")}` : ""}${i.inv_name ? `<div class="note">Inventory: ${esc(i.inv_name)}</div>` : ""}</td>
        <td class="num">${i.benchmark === null || i.benchmark === undefined ? "" : esc(price(i.benchmark))}</td><td><button class="link" data-edititem="${esc(i.id)}">Change</button></td></tr>`).join("");
    const items = cats.map(c => `<tr class="subtot"><td colspan="5">${esc(c.name)}${c.retired ? " (retired)" : ""} <button class="link" data-editcat="${esc(c.key)}">Rename</button></td></tr>
        ${ed.cat === c.key ? catForm(c) : ""}${itemRows(c)}${ed.item === "new:" + c.key ? itemForm({ category_key: c.key }) : ""}
        <tr><td colspan="5"><button class="link" data-edititem="new:${esc(c.key)}">Add a${/^[aeiou]/i.test(c.name) ? "n" : ""} ${esc(c.name.toLowerCase())} item</button></td></tr>`).join("");
    const bl = (D.baselines || []).slice().sort((a, b) => b.year - a.year || String((itemById(a.item_id) || {}).name).localeCompare(String((itemById(b.item_id) || {}).name)))
      .map(b => `<tr><td class="l">${esc((itemById(b.item_id) || {}).name || "?")}</td><td>${b.year}</td><td class="num">${esc(price(b.price))}</td><td class="l small muted">${esc(b.note || "")}</td>
        <td><button class="link" data-rmbase="${esc(b.item_id)}|${b.year}">Take it away</button></td></tr>`).join("");
    const last = yearOf(D.today) - 1, lumberSup = (D.suppliers || []).filter(v => !v.retired);
    const yt = lumberSup.map(v => { const t = (D.year_totals || []).find(x => x.vendor_id === v.id && Number(x.year) === last) || {};
      return `<tr><td>${esc(v.name)}</td><td><input class="n" data-ytbf="${esc(v.id)}" inputmode="decimal" value="${t.bf === undefined ? "" : esc(t.bf)}" aria-label="${last} board feet, ${esc(v.name)}"></td>
        <td><input class="n" data-ytd="${esc(v.id)}" inputmode="decimal" value="${t.dollars === undefined ? "" : esc(t.dollars)}" aria-label="${last} dollars, ${esc(v.name)}"></td></tr>`; }).join("");
    const folder = !canPickFolder() ? `<p class="muted">This browser can't save into a folder: use Chrome or Edge on the office PC, or download each PO with PDF.</p>`
      : S.folder ? `<p>Filing in <b>${esc(S.folder.name)}</b>${S.perm === "granted" ? "" : ` <span class="tag flag">needs permission again</span> <button class="btn ghost" data-resume>Resume filing</button>`}. <button class="link" data-pickfolder>Choose another folder</button></p>`
      : `<p class="muted">Not chosen on this computer yet.</p><button class="btn" data-pickfolder>Choose the PD - POs folder</button>`;
    const itemSel = `<select id="blItem"><option value="">Item…</option>${(D.items || []).filter(i => !i.retired && !i.compare_as).map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join("")}</select>`;
    return `<h2>Setup</h2>
      <h3>PO details <span class="muted small">(the Arrow POs print the same)</span></h3>
      <div class="card"><div class="form">
        <label>Issued by<input id="isBy" value="${esc(is.issued_by || "")}"></label><label>Contact #<input id="isPhone" value="${esc(is.phone || "")}"></label>
        <label>Contact e-mail<input id="isEmail" value="${esc(is.email || "")}"></label>
        <label style="grid-column:1/-1">Purposeful Design's name and address, one line each: company, street, city/state/zip (the PO's Ship to)<textarea id="isAddr">${esc(is.address || "")}</textarea></label>
        <label style="grid-column:1/-1">The tax-exempt sentence (printed under the signature)<input id="isTax" value="${esc(is.tax_line || "")}"></label>
        <button class="btn" data-saveissuer>Save the PO details</button></div></div>
      <h3>PO numbers</h3>
      <div class="card"><div class="form">
        <label>Next PO<input id="nextPo" class="n" inputmode="numeric" value="${esc(D.next_po)}"></label><button class="btn ghost" data-savenext="po">Save</button>
        <label>Next lumber PO<input id="nextLumber" class="n" inputmode="numeric" value="${esc(D.next_lumber)}"></label><button class="btn ghost" data-savenext="lumber">Save</button></div>
        <p class="note">${D.last_po ? `The last PO is PO ${esc(String(D.last_po).padStart(5, "0"))}. ` : ""}${D.last_lumber ? `The last lumber PO is Lumber PO ${esc(D.last_lumber)}. ` : ""}The next has to be higher; a number is never used twice. Arrow POs keep their own on the Arrow tab.</p></div>
      <h3>The PD - POs folder on this computer</h3>
      <div class="card">${folder}<p class="note">Production › Production Utilization › PD - POs. Each PO made here is filed there as a PDF (PO 00001.pdf, Lumber PO 24.pdf; a change is … r2.pdf beside it). A file already there is never overwritten.</p></div>
      <h3>Suppliers</h3>
      <div class="tw"><table><thead><tr><th>Name</th><th class="l">Company (on the PO)</th><th class="l">Contact</th><th class="l">Address, phone, e-mail</th><th></th></tr></thead>
        <tbody>${sup}${ed.supplier === "new" ? supplierForm({}) : ""}</tbody></table></div>
      ${ed.supplier ? "" : `<button class="btn ghost" style="margin-top:8px" data-editsupplier="new">Add a supplier</button>`}
      <h3>Items, by category</h3>
      <div class="tw"><table><thead><tr><th>Item</th><th class="l">Unit</th><th class="l">Compared as</th><th>Measured against now</th><th></th></tr></thead><tbody>${items}${ed.cat === "new" ? catForm({}) : ""}</tbody></table></div>
      ${ed.cat ? "" : `<button class="btn ghost" style="margin-top:8px" data-editcat="new">Add a category</button>`}
      <p class="note">Other names: what a Purchases file or a supplier's bill calls it, so those lines file themselves. A lumber item compared as another (7/4 Ash as 8/4 Ash) takes that item's price at the same square feet: 8/4's × 8/7.</p>
      <h3>Baselines</h3>
      <p class="sub">An item's price for a year, typed. A buy is measured against the year before's; without one, against the year before's average paid, or the first price paid this year.</p>
      ${bl ? `<div class="tw"><table><thead><tr><th class="l">Item</th><th>Year</th><th>Price</th><th class="l">Note</th><th></th></tr></thead><tbody>${bl}</tbody></table></div>` : ""}
      <div class="card" style="margin-top:8px"><div class="form"><label>Item${itemSel}</label><label>Year<input id="blYear" class="n" inputmode="numeric" value="${last}"></label>
        <label>Price per unit<input id="blPrice" class="n" inputmode="decimal"></label><label>Note<input id="blNote" placeholder="2025 average"></label><button class="btn ghost" data-savebase>Save the baseline</button></div></div>
      <h3>Earlier lumber years: ${last}</h3>
      ${yt ? `<div class="tw"><table><thead><tr><th>Supplier</th><th>Board feet</th><th>Dollars</th></tr></thead><tbody>${yt}</tbody></table></div>
        <button class="btn ghost" style="margin-top:8px" data-saveyears>Save ${last}</button>` : `<p class="muted">Add a supplier first.</p>`}`;
  }
  function supplierForm(v) {
    const i = (k, label) => `<label>${label}<input data-v="${k}" value="${esc(v[k] || "")}"></label>`;
    return `<tr><td colspan="5"><div class="form" style="padding:6px 0">${i("name", "Name")}${i("company", "Company on the PO")}${i("contact", "Contact name")}
      ${i("street", "Street address")}${i("city", "City/State/Zip")}${i("phone", "Phone")}${i("email", "E-mail")}
      <label style="grid-column:1/-1">Other names on bills, one per line (Amazon.com, AMZN Mktp US)<textarea data-v="aliases">${esc((v.aliases || []).join("\n"))}</textarea></label>
      ${v.id ? `<label><span>&nbsp;</span><span style="display:flex;gap:6px;align-items:center;min-height:42px"><input type="checkbox" data-v="retired" ${v.retired ? "checked" : ""}> No longer used</span></label>` : ""}
      <button class="btn" data-savesupplier="${esc(v.id || "")}">Save</button><button class="link" data-closesetup>Cancel</button></div></td></tr>`;
  }
  function catForm(c) {
    return `<tr><td colspan="5"><div class="form" style="padding:6px 0"><label>Category name<input data-c="name" value="${esc(c.name || "")}"></label>
      ${c.key && c.key !== "lumber" ? `<label><span>&nbsp;</span><span style="display:flex;gap:6px;align-items:center;min-height:42px"><input type="checkbox" data-c="retired" ${c.retired ? "checked" : ""}> No longer used</span></label>` : ""}
      <button class="btn" data-savecat="${esc(c.key || "")}">Save</button><button class="link" data-closesetup>Cancel</button></div></td></tr>`;
  }
  function itemForm(it) {
    const lumber = it.category_key === "lumber", others = (S.data.items || []).filter(x => x.id !== it.id && !x.compare_as && x.category_key === "lumber");
    return `<tr><td colspan="5"><div class="form" style="padding:6px 0">
      <label>Item<input data-i="name" value="${esc(it.name || "")}" placeholder="${lumber ? "6/4 Maple" : "3/4 Maple Plywood"}"></label>
      <label>Category<select data-i="category_key">${(S.data.categories || []).filter(c => !c.retired || c.key === it.category_key).map(c => `<option value="${esc(c.key)}" ${c.key === it.category_key ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
      ${lumber ? `<label>Thickness in quarters<input data-i="quarters" class="n" inputmode="numeric" value="${esc(it.quarters || "")}" placeholder="6"></label>
        <label>Compare as<select data-i="compare_as"><option value="">— its own baseline —</option>${others.map(o => `<option value="${esc(o.id)}" ${o.id === it.compare_as ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select></label>
        <label>Inventory item<select data-i="inv_item_id"><option value="">None</option>${(S.data.inv_items || []).map(o => `<option value="${esc(o.id)}" ${o.id === it.inv_item_id ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select></label>`
        : `<label>Unit<input data-i="unit" value="${esc(it.unit || "")}" placeholder="sheet, each, gallon, box, ft"></label>`}
      <label style="grid-column:1/-1">Other names on bills, one per line<textarea data-i="aliases">${esc((it.aliases || []).join("\n"))}</textarea></label>
      ${it.id ? `<label><span>&nbsp;</span><span style="display:flex;gap:6px;align-items:center;min-height:42px"><input type="checkbox" data-i="retired" ${it.retired ? "checked" : ""}> No longer used</span></label>` : ""}
      <button class="btn" data-saveitem="${esc(it.id || "")}">Save</button><button class="link" data-closesetup>Cancel</button></div></td></tr>`;
  }

  // ---------- wiring ----------
  const val = (sel) => { const el = app.querySelector(sel); return el ? el.value : ""; };
  const lines = (t) => String(t || "").split(/\n/).map(x => x.trim()).filter(Boolean);
  function wire() {
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (S.edit && !confirm("Leave the PO without saving it?")) return; S.edit = null; go(b.dataset.tab); });
    const on = (sel, fn) => app.querySelectorAll(sel).forEach(el => el.onclick = (e) => fn(el, e));
    on("[data-tabgo]", (b) => go(b.dataset.tabgo));
    app.querySelectorAll("[data-year]").forEach(s => s.onchange = () => { S.year = Number(s.value); S.open = null; S.openItem = null; render(); });
    // To buy
    app.querySelectorAll("[data-tick]").forEach(c => c.onchange = () => { if (c.checked) S.ticked.add(c.dataset.tick); else S.ticked.delete(c.dataset.tick); render(); });
    on("[data-reqorder]", () => call("order_supplies", { p_requests: [...S.ticked] }, (d) => { S.ticked = new Set(); return d.summary || "Marked ordered."; }));
    on("[data-reqpo]", () => startEdit(null, "po", S.reqs.filter(r => S.ticked.has(r.id))));
    on("[data-noorder]", (b) => { S.notOrdering = b.dataset.noorder; render(); const i = app.querySelector("[data-noreason]"); if (i) i.focus(); });
    on("[data-nocancel]", () => { S.notOrdering = null; render(); });
    on("[data-nosave]", (b) => { const reason = val("[data-noreason]"); call("not_ordering_supply", { p_request: b.dataset.nosave, p_reason: reason }, (d) => { S.notOrdering = null; S.ticked.delete(b.dataset.nosave); return d.summary; }); });
    on("[data-addreq]", () => { S.adding = true; render(); });
    on("[data-addcancel]", () => { S.adding = false; render(); });
    on("[data-addsave]", async () => { const d = await call("request_supply", { p_department: val("#adDept"), p_item: val("#adItem"), p_qty: Number(val("#adQty")), p_note: val("#adNote") || null, p_client_id: newId() },
      (x) => x.summary || "Added."); if (d) { S.adding = false; render(); } });
    // POs
    on("[data-openpo]", (r, e) => { if (e.target.closest("button,input,select,a")) return; S.open = S.open === r.dataset.openpo ? null : r.dataset.openpo; render(); });
    on("[data-newpo]", (b) => startEdit(null, b.dataset.newpo));
    on("[data-changepo]", (b) => startEdit(S.data.pos.find(p => p.id === b.dataset.changepo)));
    on("[data-pdf]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.pdf);
      try { saveBlob(await pdfFor(po), po.file_name); } catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); } });
    on("[data-cancelpo]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.cancelpo);
      const why = window.prompt(`Cancel ${po.name}? It stays on record and stops counting; any supply request on it goes back to be ordered. Why (optional)?`, "");
      if (why === null) return;
      await call("purchase_po_cancel", { p_id: po.id, p_cancel: true, p_reason: why }, `${po.name} cancelled. It stays on record.`); });
    on("[data-uncancel]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.uncancel);
      await call("purchase_po_cancel", { p_id: po.id, p_cancel: false, p_reason: null }, `${po.name} is back.`); });
    app.querySelectorAll("[data-measured]").forEach(inp => inp.onchange = async () => { const v = inp.value.replace(/,/g, "").trim();
      await call("purchase_measured_save", { p_line: inp.dataset.measured, p_bf: v === "" ? null : Number(v) }, v === "" ? "Measurement cleared." : `Saved: ${n0(v)} bd ft measured after SLR.`); });
    on("[data-pickfolder]", () => pickFolder());
    on("[data-resume]", () => resumeFolder());
    on("[data-filenow]", () => fileWaiting().then(render));
    if (S.edit) {
      app.querySelectorAll("[data-e],[data-l]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => { readEdit(); editAmounts(); }));
      on("[data-addline]", () => { readEdit(); S.edit.lines.push(blankLine()); render(); });
      on("[data-rmline]", (b) => { readEdit(); S.edit.lines.splice(Number(b.dataset.rmline), 1); if (!S.edit.lines.length) S.edit.lines.push(blankLine()); render(); });
      on("[data-canceledit]", () => { S.edit = null; S.msg = null; render(); });
      on("[data-savepo]", () => savePo());
      on("[data-preview]", async () => { readEdit(); const chk = checkLines(S.edit.lines, S.data.items);
        if (chk.problem) { S.msg = { ok: false, text: chk.problem }; return render(); }
        try { const po = draftPo(chk.lines); saveBlob(await pdfFor(po), `${po.name} (preview).pdf`); } catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); } });
    }
    // Prices
    on("[data-openitem]", (r) => { S.openItem = S.openItem === r.dataset.openitem ? null : r.dataset.openitem; render(); });
    on("[data-export]", () => { const rows = exportRows(S.data, S.year);
      saveBlob(new TextEncoder().encode(exportCsv(rows)), `Purchasing ${S.year} - every line (${S.data.today}).csv`, "text/csv;charset=utf-8");
      S.msg = { ok: true, text: `Downloaded ${rows.length} line${rows.length === 1 ? "" : "s"} for ${S.year}.` }; render(); });
    // months left out of the scrap results
    on("[data-skipmonth]", (b) => {
      const m = b.dataset.skipmonth, name = new Date(m.slice(0, 10) + "T12:00").toLocaleString("en-US", { month: "long", year: "numeric" });
      const why = window.prompt(`Leave ${name} out of the scrap results? It stays as it is on the Inventory page. Why (for example: the counts weren't done)?`, "");
      if (!why) return;
      call("lumber_scrap_skip_save", { p_month: m.slice(0, 10), p_out: true, p_reason: why }, (d) => d.summary);
    });
    on("[data-putbackmonth]", (b) => call("lumber_scrap_skip_save", { p_month: b.dataset.putbackmonth.slice(0, 10), p_out: false, p_reason: null }, (d) => d.summary));
    // Lumber slips
    on("[data-loadslips]", async () => { await loadSlips(); render(); });
    app.querySelectorAll("[data-slip]").forEach(s => s.onchange = async () => {
      const r = await Promise.resolve(db.rpc("purchase_slip_link", { p_receipt: s.dataset.slip, p_line: s.value || null })).catch(e => ({ error: e }));
      S.msg = r.error ? { ok: false, text: friendlyError(r.error) } : { ok: true, text: r.data.summary };
      await load(); await loadSlips(); render(); });
    // the Purchases file
    const fileIn = app.querySelector("#fileIn"), zone = app.querySelector("#dropzone");
    if (fileIn) fileIn.onchange = () => { if (fileIn.files[0]) readFile(fileIn.files[0]); };
    if (zone) {
      zone.ondragover = (e) => { e.preventDefault(); zone.classList.add("over"); };
      zone.ondragleave = () => zone.classList.remove("over");
      zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) readFile(f); };
    }
    on("[data-fileclear]", () => { S.file = null; render(); });
    on("[data-filesend]", () => sendFile());
    const groups = () => matchGroups(S.data);
    on("[data-match]", (b) => { const g = groups()[Number(b.dataset.match)], item = val(`[data-matchsel="${b.dataset.match}"]`);
      if (!item) { S.msg = { ok: false, text: "Choose the item first, or make a new one." }; return render(); }
      call("purchase_buys_match", { p_ids: g.ids, p_item: item, p_remember: true }, (d) => d.summary); });
    on("[data-newitemopen]", (b) => { S.matchNew = b.dataset.newitemopen; render(); });
    on("[data-newitemcancel]", () => { S.matchNew = null; render(); });
    on("[data-newitem]", async (b) => { const g = groups()[Number(b.dataset.newitem)], p = {};
      app.querySelectorAll("[data-nm]").forEach(el => p[el.dataset.nm] = el.value);
      const made = await call("purchase_item_save", { p }, null); if (!made) return;
      S.matchNew = null; await call("purchase_buys_match", { p_ids: g.ids, p_item: made.id, p_remember: true }, (d) => `${p.name} made. ${d.summary}`); });
    on("[data-forpo]", (b) => { const g = groups()[Number(b.dataset.forpo)];
      const po = window.prompt("Which PO is it for? Type it as it's named, like Lumber PO 17 or PO 00001.", ""); if (!po) return;
      (async () => { for (const id of g.ids) { const r = await Promise.resolve(db.rpc("purchase_buy_po", { p_id: id, p_po: poName(po) })).catch(e => ({ error: e }));
          if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); } }
        S.msg = { ok: true, text: `Kept against ${poName(po)}: not counted again.` }; await load(); render(); })(); });
    on("[data-leaveout]", (b) => { const g = groups()[Number(b.dataset.leaveout)];
      const why = window.prompt("Why is it left out? (For example: not a production buy.)", ""); if (!why) return;
      (async () => { for (const id of g.ids) { const r = await Promise.resolve(db.rpc("purchase_buy_ignore", { p_id: id, p_ignore: true, p_reason: why })).catch(e => ({ error: e }));
          if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); } }
        S.msg = { ok: true, text: `Left out (${g.ids.length} line${g.ids.length === 1 ? "" : "s"}). It stays on record under Left out.` }; await load(); render(); })(); });
    on("[data-putback]", (b) => call("purchase_buy_ignore", { p_id: b.dataset.putback, p_ignore: false, p_reason: null }, "Put back: it's waiting in Match these again."));
    on("[data-fnapply]", async () => {
      const names = fileItemNames(S.data), done = [], left = [];
      S.busy = true; render();
      for (const [i, n] of names.entries()) {
        const what = app.querySelector(`[data-fndo="${i}"]`) ? app.querySelector(`[data-fndo="${i}"]`).value : "";
        if (!what) { left.push(n.name); continue; }
        let item = what;
        if (what === "new") {
          const cat = n.category || val(`[data-fncat="${i}"]`), p = { name: n.name, category_key: cat };
          if (cat === "lumber") p.quarters = n.quarters || Number(val(`[data-fnq="${i}"]`)); else p.unit = val(`[data-fnunit="${i}"]`) || n.unit;
          const r = await Promise.resolve(db.rpc("purchase_item_save", { p })).catch(e => ({ error: e }));
          if (r.error) { S.busy = false; S.msg = { ok: false, text: `${n.name}: ${friendlyError(r.error)}` }; await load(); return render(); }
          item = r.data.id;
        }
        const r = await Promise.resolve(db.rpc("purchase_buys_match", { p_ids: n.ids, p_item: item, p_remember: true })).catch(e => ({ error: e }));
        if (r.error) { S.busy = false; S.msg = { ok: false, text: `${n.name}: ${friendlyError(r.error)}` }; await load(); return render(); }
        done.push(n.name);
      }
      S.busy = false;
      S.msg = { ok: true, text: `${done.length} item name${done.length === 1 ? "" : "s"} done; their lines are filed.${left.length ? ` Left for now: ${left.join(", ")}.` : ""}` };
      await load(); render();
    });
    on("[data-itemscsv]", () => saveBlob(new TextEncoder().encode(itemsCsv(S.data)), `Purchasing items (${S.data.today}).csv`, "text/csv;charset=utf-8"));
    // Setup
    on("[data-saveissuer]", () => call("set_arrow_po_settings", { p: { issued_by: val("#isBy"), phone: val("#isPhone"), email: val("#isEmail"),
      address: val("#isAddr"), tax_line: val("#isTax") } }, "PO details saved. The POs and Arrow POs print them from now on."));
    on("[data-savenext]", (b) => { const series = b.dataset.savenext, n = Number(val(series === "po" ? "#nextPo" : "#nextLumber"));
      call("purchase_next_number_save", { p_series: series, p_next: n }, () => `The next ${series === "po" ? "PO is PO " + String(n).padStart(5, "0") : "lumber PO is Lumber PO " + n}.`); });
    on("[data-editsupplier]", (b) => { S.setupEdit = { supplier: b.dataset.editsupplier }; render(); });
    on("[data-edititem]", (b) => { S.setupEdit = { item: b.dataset.edititem }; render(); });
    on("[data-editcat]", (b) => { S.setupEdit = { cat: b.dataset.editcat }; render(); });
    on("[data-closesetup]", () => { S.setupEdit = null; render(); });
    on("[data-savesupplier]", async (b) => { const p = {};
      app.querySelectorAll("[data-v]").forEach(el => p[el.dataset.v] = el.type === "checkbox" ? el.checked : el.dataset.v === "aliases" ? lines(el.value) : el.value);
      if (b.dataset.savesupplier) p.id = b.dataset.savesupplier;
      if (await call("purchase_supplier_save", { p }, `Supplier saved: ${p.name}.`)) { S.setupEdit = null; render(); } });
    on("[data-savecat]", async (b) => { const p = {}; app.querySelectorAll("[data-c]").forEach(el => p[el.dataset.c] = el.type === "checkbox" ? el.checked : el.value);
      if (b.dataset.savecat) p.key = b.dataset.savecat;
      if (await call("purchase_category_save", { p }, `Category saved: ${p.name}.`)) { S.setupEdit = null; render(); } });
    on("[data-saveitem]", async (b) => { const p = {};
      app.querySelectorAll("[data-i]").forEach(el => p[el.dataset.i] = el.type === "checkbox" ? el.checked : el.dataset.i === "aliases" ? lines(el.value) : el.value);
      if (b.dataset.saveitem) p.id = b.dataset.saveitem;
      if (await call("purchase_item_save", { p }, (d) => `Item saved: ${p.name}${d.benchmark ? `, measured against ${price(d.benchmark)}` : ""}.`)) { S.setupEdit = null; render(); } });
    app.querySelectorAll('[data-i="category_key"]').forEach(s => s.onchange = () => {   // lumber and other items ask different things
      const it = (S.setupEdit.item || "").startsWith("new:") ? {} : { ...(itemById(S.setupEdit.item) || {}) };
      app.querySelectorAll("[data-i]").forEach(el => { if (el.type !== "checkbox") it[el.dataset.i] = el.dataset.i === "aliases" ? lines(el.value) : el.value; });
      it.category_key = s.value; const row = s.closest("tr"); row.outerHTML = itemForm(it); wire(); });
    on("[data-savebase]", () => { const item = val("#blItem"); if (!item) { S.msg = { ok: false, text: "Choose the item." }; return render(); }
      call("purchase_baseline_save", { p_item: item, p_year: Number(val("#blYear")), p_price: Number(String(val("#blPrice")).replace(/[$,]/g, "")), p_note: val("#blNote") || null }, "Baseline saved."); });
    on("[data-rmbase]", (b) => { const [item, year] = b.dataset.rmbase.split("|");
      if (confirm("Take this baseline away? Buys are then measured against the year before's average paid.")) call("purchase_baseline_save", { p_item: item, p_year: Number(year), p_price: null, p_note: null }, "Baseline taken away."); });
    on("[data-saveyears]", async () => {
      const last = yearOf(S.data.today) - 1;
      for (const v of S.data.suppliers) {
        const bf = val(`[data-ytbf="${v.id}"]`), d = val(`[data-ytd="${v.id}"]`);
        if (String(bf).trim() === "" && String(d).trim() === "") continue;
        const r = await Promise.resolve(db.rpc("lumber_year_total_save", { p_year: last, p_vendor: v.id, p_bf: Number(String(bf).replace(/,/g, "")) || 0,
          p_dollars: Number(String(d).replace(/[$,]/g, "")) || 0 })).catch(e => ({ error: e }));
        if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); }
      }
      S.msg = { ok: true, text: `${last} saved.` }; await load(); render();
    });
  }

  // ---------- start ----------
  async function start(user) {
    const { data } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
    S.me = { id: user.id, email: user.email, name: (data && data.full_name) || user.email, role: data && data.role };
    render();
    if (S.me.role === "manager" || S.me.role === "admin") { await loadFolder().catch(() => {}); await load(); render(); fileWaiting(); }
  }
  (async () => {
    const { data } = await db.auth.getSession();
    if (data && data.session) return start(data.session.user);
    app.innerHTML = `<main><div class="card" style="max-width:460px;margin:30px auto"><h2>Sign in</h2><p class="sub">Use a manager's login.</p>
      <form id="f"><div class="form" style="grid-template-columns:1fr"><label>Email<input id="e" type="email" autocomplete="username" required></label>
        <label>Password<input id="p" type="password" autocomplete="current-password" required></label><button class="btn or" type="submit">Sign in</button></div></form>
      <div id="err" class="banner" style="margin-top:14px" hidden></div></div></main>`;
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      if (r.error) { const el = document.getElementById("err"); el.hidden = false; el.textContent = friendlyError(r.error); return; }
      start(r.data.user);
    };
  })();
})();
</script>
</body>
</html>
