<style>

  .link{background:none; border:none; color:var(--orange); font-weight:700; padding:6px 2px}

  .form{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; align-items:end}

  .logsheet{max-width:720px}

  .lgline:first-of-type{border-top:0}
  .lgrow{display:grid; grid-template-columns:minmax(0,1fr) 60px 88px 64px 124px 76px 30px; gap:8px; align-items:end; margin:6px 0 0}
  .lgpp input{background:var(--paper); color:var(--ink2); border-color:var(--line); font-variant-numeric:tabular-nums}
  .lglink{margin:6px 0 0; display:flex; align-items:center; gap:8px}

  .findrow{margin:0 0 8px}
  .findrow input{width:100%; max-width:520px; min-height:42px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; background:#fff}
  .lgamt{text-align:right; font-weight:600; padding-bottom:10px}

  .lgasked{font-size:13px; color:var(--ink2); margin:3px 2px 0}
  @media (max-width:600px){ .lgtop{grid-template-columns:1fr} .lgrow{grid-template-columns:1fr 1fr 30px} .lgrow .lgamt{display:none} .lgrow .lgi{grid-column:1 / -1} .lgrow .lgpp{grid-column:1 / 3} .lgrow .lab{white-space:nowrap} }
  .drop{display:block; cursor:pointer; border:2px dashed var(--gray); border-radius:12px; background:#fff; padding:22px; text-align:center; margin-bottom:6px}

<body>
<header>
  <div class="hrow"><div class="brand">PURPOSEFUL</div><h1>Purchasing</h1><div class="me" id="me"></div></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<div id="app"></div>
<!-- the Supabase library, checked: the browser refuses it if even one byte differs from the published file -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="sf-common-2026-10-05.1.js"></script>
<script>
/* The two settings (project address, publishable key), the key check, the connection test, the id maker and the
   Feedback button are in the shared file loaded above, sf-common-2026-10-05.1.js.
   Purchasing (7 Nov; simpler 10 Nov. Design: the spec's Purchasing tab, "A simpler page"). Three tabs, by what the office
   comes to do, and Setup as a button:
     Buy      what the departments asked for on their tablets (it left Operations 10 Nov), then the POs: PO 00001 on and
              Lumber PO 24 on, in Luke's PD - PO template, filed as PDFs in PD - POs. A lumber PO's slips are picked on it.
     Savings  the year as pictures: saved so far month by month, where it came from, lumber scrap against the 1.7
              allowance, the biggest movers.
     Prices   worth a look (a few plain findings), what was paid item by item, the Purchases file, the yearly export.
   Log a purchase (purchasing_log.sql): every buy with no PO is logged on Buy when it's ordered (Luke, 10 Nov: this is how
   the data comes in from now on). A Purchases file is for loading past buys: it asks nothing, its new item names become
   items as it's added, and the page says so afterwards. Managers only.
   What's entered is the truth: PO lines, and buys with no PO from the Purchases file. */
var PAGE_VERSION = "2026-11-11.1";          // this page's version: bump it with every change (it shows in select * from devices();)
/* ---- core: no screen code in here, so it can be tested on its own ---- */
const SCRAP_ALLOWANCE = 1.7;                 // the workbook's allowance: 1.7 bd ft bought for each bd ft in a top
function isMissing(err) { return /could not find the function|schema cache|does not exist/i.test(String((err && err.message) || err || "")); }
function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. Check the connection and try again.";
  if (/jwt expired|refresh token/i.test(m)) return "The sign-in has expired. Sign out and back in.";
  if (isMissing(err)) return "Purchasing isn't set up in the database yet. Run purchasing.sql, wait a minute, then reload this page.";
  if (/row-level security|permission denied|insufficient/i.test(m) && !/^Only a manager/.test(m)) return "This login can't do that. Purchasing is for managers.";
  return m || "Something went wrong. Try again, and if it keeps happening, take a screenshot.";
}
const n0 = (x) => Math.round(Number(x) || 0).toLocaleString("en-US");
/** $1,234 (no cents) or $1,234.56 */
function usd(x, cents) {
  const v = Number(x) || 0, s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return (v < 0 ? "−$" : "$") + s;
}
/** a price per board foot: $3.125, $3.50, $3.00 (two or three places, as typed) */
function price(x) { if (x === null || x === undefined || x === "") return ""; const v = Number(x); const s = v.toFixed(3); return "$" + (s.endsWith("0") ? v.toFixed(2) : s); }
const pct = (x) => x === null || x === undefined || !isFinite(x) ? "—" : `${(x * 100).toFixed(1)}%`;
/** "2026-11-04" → "11/4/2026" (as Luke's POs print it) */
function mdy(d) { if (!d) return ""; const [y, m, dd] = String(d).slice(0, 10).split("-").map(Number); return `${m}/${dd}/${y}`; }
const yearOf = (d) => Number(String(d || "").slice(0, 4));
/** the benchmark a 7/4 item takes from 8/4 at the same square feet (the database works it out the same way) */
function compareBenchmark(avg, quarters, asQuarters) { return Math.round(avg * asQuarters / quarters * 10000) / 10000; }
/** one line's tracker figures: bf counts (received, else ordered), its cost and saving */
function lineMoney(l) {
  const tracked = !!l.lumber, bf = tracked ? Number(l.bf) || 0 : 0, priced = l.unit_price !== null && l.unit_price !== undefined;
  const bench = l.benchmark === null || l.benchmark === undefined ? null : Number(l.benchmark);
  return { tracked, bf, priced, cost: priced ? bf * Number(l.unit_price) : null, bench,
           saving: priced && bench !== null ? bf * (bench - Number(l.unit_price)) : null, received: l.received_bf !== null && l.received_bf !== undefined };
}
/** a PO's own sums: tracked bd ft, in so far, its total (as printed), its saving, and where it stands */
function poSummary(po) {
  const ls = po.lines || [];
  let bf = 0, inBf = 0, saving = 0, tracked = 0, open = 0, ordered = 0;
  for (const l of ls) { const m = lineMoney(l); if (!m.tracked) continue; tracked++; bf += m.bf; ordered += Number(l.qty); if (m.saving !== null) saving += m.saving;
    if (m.received) inBf += Number(l.received_bf);
    // still coming: nothing in yet, or slips short of the order (a workbook figure is what came, short or not)
    if (!m.received || (l.history_in_bf === null || l.history_in_bf === undefined) && Number(l.received_bf) < Number(l.qty)) open++; }
  const total = (po.printed && po.printed.length ? po.printed : ls).reduce((a, l) => a + (l.unit_price === null || l.unit_price === undefined ? 0 : Number(l.qty) * Number(l.unit_price)), 0);
  const state = po.cancelled_at ? "cancelled" : !tracked ? "untracked" : inBf === 0 && !ls.some(l => l.received_bf !== null && l.received_bf !== undefined) ? "on order"
              : open ? "part in" : "in";
  return { bf, ordered, inBf, saving, total, state, tracked };
}
/** the months with scrap figures in a year: the workbook's, then Inventory's own (which win for the same month) */
function scrapMonths(data, year) {
  const by = new Map();
  for (const m of data.scrap_history || []) if (yearOf(m.month_end) === year) by.set(m.month_end, { ...m, from: "workbook" });
  for (const m of data.scrap_inventory || []) if (yearOf(m.month_end) === year && Number(m.zero_bf) > 0) by.set(m.month_end, { ...m, from: "Inventory" });
  return [...by.values()].sort((a, b) => String(a.month_end).localeCompare(String(b.month_end))).map(m => {
    const zero = Number(m.zero_bf), used = Number(m.used_bf), allow = zero * SCRAP_ALLOWANCE;
    return { month_end: m.month_end, from: m.from, zero, used, ratio: used / zero, allow, saved: allow - used };
  });
}
/** the workbook's Results tab for one year, from the POs and the scrap months */
function lumberResults(data, year) {
  const lines = [];
  for (const po of data.pos || []) if (!po.cancelled_at && yearOf(po.ordered_on) === year) for (const l of po.lines || []) if (l.lumber) lines.push(l);
  let bf = 0, pricedBf = 0, spent = 0, saving = 0, benchCost = 0, benchSpent = 0, onOrder = 0, noPrice = 0, noBench = 0, measured = 0, measuredOf = 0;
  for (const l of lines) {
    const m = lineMoney(l); bf += m.bf;
    if (!m.received) onOrder += m.bf;
    if (!m.priced) { noPrice++; continue; }
    pricedBf += m.bf; spent += m.cost;
    if (m.bench === null) { noBench++; continue; }
    saving += m.saving; benchCost += m.bf * m.bench; benchSpent += m.cost;
    if (l.measured_bf && m.received) { measured += Number(l.measured_bf); measuredOf += Number(l.received_bf); }
  }
  const avg = pricedBf ? spent / pricedBf : 0;
  const months = scrapMonths(data, year);
  const zero = months.reduce((a, m) => a + m.zero, 0), used = months.reduce((a, m) => a + m.used, 0), savedBf = months.reduce((a, m) => a + m.saved, 0);

    meEl.innerHTML = `<a href="office.html">← Office</a> · ${esc(S.me.name)} · <button id="so">Sign out</button>`;
    document.getElementById("so").onclick = async () => { await db.auth.signOut(); location.reload(); };
    if (S.me.role !== "manager" && S.me.role !== "admin") {
      tabsEl.hidden = true;
      app.innerHTML = `<main><div class="card"><h2>For managers</h2><p class="sub">Purchasing is for the office.</p></div></main>`;
      return;
    }
    tabsEl.hidden = false;
    tabsEl.innerHTML = TABS.map(([k, t]) => `<button data-tab="${k}" aria-current="${k === S.tab && !S.edit}">${t}${k === "prices" && S.data ? matchCount() : ""}</button>`).join("")
      + `<button class="setupbtn" data-tab="setup" aria-current="${S.tab === "setup" && !S.edit}">Setup</button>`;
    if (!S.loaded) { app.innerHTML = `<main><p class="muted">Loading…</p></main>`; return wire(); }
    if (S.missing) {
      app.innerHTML = `<main><div class="banner">Purchasing isn't set up in the database yet<small>Run purchasing.sql in the Supabase SQL Editor (Walkthrough 54), then purchasing_history.sql from your computer, wait a minute and reload this page.</small></div></main>`;
      return wire();
    }
    const head = S.msg ? `<div class="banner ${S.msg.ok ? "ok" : ""}" role="status">${esc(S.msg.text)}</div>` : "";
    const body = S.edit ? viewEdit() : ({ buy: viewBuy, savings: viewSavings, prices: viewPrices, setup: viewSetup }[S.tab] || viewBuy)();
    app.innerHTML = `<main>${head}${body}</main>${S.sheet && !S.edit ? sheetHtml() : ""}`;
    if (S.tab === "savings" && !S.edit) drawChart();
    if (S.tab === "prices" && !S.edit && S.find) filterPrices();
    wire();
  }
  const matchCount = () => { const n = matchGroups(S.data).reduce((a, g) => a + g.ids.length, 0); return n ? ` <span class="pill">${n}</span>` : ""; };
  function yearPicker() {
    const ys = yearsAvailable();
    return ys.length < 2 ? "" : `<label class="muted small">Year <select data-year style="min-height:40px;border:1px solid var(--gray);border-radius:8px;padding:4px 8px">${ys.map(y => `<option ${y === S.year ? "selected" : ""}>${y}</option>`).join("")}</select></label>`;
  }
  const when = (ts) => ts ? new Date(ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";

  // ---------- To buy: the tablets' supply requests, as on Operations ----------
  function poForRequest(id) {
    for (const po of S.data.pos || []) if (!po.cancelled_at) for (const l of po.lines || []) if (l.supply_request_id === id) return po;
    return null;
  }
  function viewBuy() {
    const asked = S.reqs.filter(r => r.state === "requested"), ordered = S.reqs.filter(r => r.state === "ordered"), n = S.ticked.size;
    const line = (r) => { const po = r.state === "ordered" ? poForRequest(r.id) : null;
      return `<div class="r"><span class="rc">${r.state === "requested" ? `<input type="checkbox" class="chk" data-tick="${esc(r.id)}" ${S.ticked.has(r.id) ? "checked" : ""} aria-label="Tick ${esc(r.item)}">` : ""}</span>
        <div class="grow"><b>${r.is_test ? `<span class="tag">TEST</span> ` : ""}${esc(r.qty)} × ${esc(r.item)}</b>
          <small>${esc(r.department_name)}, ${esc(r.requested_by_name || "")}, ${esc(when(r.requested_at))}${r.note ? `. ${esc(r.note)}` : ""}</small>
          ${S.notOrdering === r.id ? `<span class="row" style="margin-top:6px"><input data-noreason class="in" placeholder="Why not? The department sees this." aria-label="Why not ordering">
            <button class="btn ghost" data-nosave="${esc(r.id)}">Save</button><button class="link" data-nocancel>Cancel</button></span>` : ""}</div>
        ${r.state === "ordered" ? `<span class="tag done">Ordered${po ? ` on ${esc(po.name)}` : ""}</span><button class="link" data-received="${esc(r.id)}">Received</button>`
          : S.notOrdering === r.id ? "" : `<button class="link" data-noorder="${esc(r.id)}">Not ordering</button>`}</div>`; };
    const closed = S.closedReqs.map(r => `<div class="r"><div class="grow"><b>${esc(r.qty)} × ${esc(r.item)}</b>
        <small>${esc(r.department_name)}. ${r.state === "received" ? `Received${r.received_by_name ? ` by ${esc(r.received_by_name)}` : ""}` : r.not_ordering_reason ? `Not ordered: ${esc(r.not_ordering_reason)}` : esc(String(r.state).replace(/_/g, " "))}, ${esc(when(r.updated_at))}</small></div></div>`).join("");
    const deptOpts = S.depts.map(d => `<option value="${esc(d.key)}">${esc(d.name)}</option>`).join("");
    return `<h2>Needs buying</h2><p class="sub">What the departments asked for on their tablets, oldest first.</p>
      <div class="row" style="margin:0 2px 12px">
        ${S.logsReady ? `<button class="btn or" data-logopen>${n ? `Log a purchase for ${n} ticked` : "Log a purchase"}</button>
          <button class="btn ghost" data-reqpo ${n ? "" : "disabled"}>Put ${n ? n + " ticked" : "ticked"} on a PO</button>`
        : `<button class="btn or" data-reqpo ${n ? "" : "disabled"}>Put ${n ? n + " ticked" : "ticked"} on a PO</button>
          <button class="btn ghost" data-reqorder ${n ? "" : "disabled"}>Mark ${n ? n + " ticked" : "ticked"} as ordered</button>`}
        <span style="flex:1"></span>${S.adding ? "" : `<button class="link" data-addreq>Add something to buy</button>`}</div>
      ${S.adding ? `<div class="card"><div class="form">
          <label>For<select id="adDept">${deptOpts}</select></label><label>What<input id="adItem" placeholder="Titebond III, 1 gallon"></label>
          <label>Quantity<input id="adQty" class="n" inputmode="numeric" value="1"></label><label>Note<input id="adNote"></label>
          <button class="btn" data-addsave ${S.busy ? "disabled" : ""}>Add it</button><button class="link" data-addcancel>Cancel</button></div></div>` : ""}
      ${asked.length ? `<div class="list">${asked.map(line).join("")}</div>` : `<p class="muted" style="margin:12px 2px">Nothing waiting to be bought.</p>`}
      ${ordered.length ? `<details class="fold" data-keep="ordered" ${S.keep.has("ordered") ? "open" : ""}><summary>Ordered, not received (${ordered.length})</summary><div class="list">${ordered.map(line).join("")}</div>
        <p class="note" style="margin:6px 2px">The department taps Received on its tablet when it's in hand; Received here does the same.</p></details>` : ""}
      ${closed ? `<details class="fold" data-keep="closed" ${S.keep.has("closed") ? "open" : ""}><summary>Closed in the last 60 days (${S.closedReqs.length})</summary><div class="list">${closed}</div></details>` : ""}
      ${loggedSection()}
      ${posSection()}`;
  }
  /** the purchases logged in the last 60 days, newest first: a line each, with Change and It was a mistake */
  function loggedSection() {
    if (!S.logsReady) return "";
    const since = new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10);
    const list = (S.data.logs || []).filter(g => String(g.on).slice(0, 10) >= since);
    if (!list.length) return `<p class="note" style="margin:14px 2px 0">A buy with a PO is logged by its PO. Log a purchase is for everything else: Amazon, a card, a store run, an invoice.</p>`;
    const total = (g) => (g.lines || []).reduce((a, l) => a + Number(l.amount), 0);
    return `<h2 style="margin-top:26px">Logged lately</h2>
      <div class="list">${list.slice(0, 15).map(g => `<div class="r${g.cancelled ? " gone" : ""}"><div class="grow"><b>${esc(g.supplier)}</b>
          <small>${esc(mdy(g.on))}${g.doc ? `, ${esc(g.doc)}` : ""}. ${(g.lines || []).map(l => `${esc(l.item)} × ${n0(l.qty)}${Number(l.pack) > 1 ? ` (${n0(l.pack)} in each)` : ""}${/^https?:\/\//i.test(l.url || "") ? ` <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">link</a>` : ""}`).join(", ")}${g.logged_by_name ? `. Logged by ${esc(g.logged_by_name)}` : ""}
          ${g.cancelled ? `. <b>A mistake</b>${g.cancel_reason ? `: ${esc(g.cancel_reason)}` : ""}, not counted` : ""}</small></div>
        <span class="num">${usd(total(g), true)}</span>
        ${g.cancelled ? "" : `<button class="link" data-logchange="${esc(g.id)}">Change</button><button class="link" data-logmistake="${esc(g.id)}">It was a mistake</button>`}</div>`).join("")}</div>
      <p class="note" style="margin:8px 2px 0">A buy with a PO is logged by its PO. Log a purchase is for everything else: Amazon, a card, a store run, an invoice.</p>`;
  }

  // ---------- POs ----------
  function stateTag(po, sum) {
    if (sum.state === "cancelled") return `<span class="tag">Cancelled</span>`;
    if (sum.state === "untracked") return "";
    if (sum.state === "in") return `<span class="tag done">In</span>`;
    if (sum.state === "part in") return `<span class="tag">${n0(sum.inBf)} of ${n0(sum.ordered)} in</span>`;
    return `<span class="tag">On order</span>`;
  }
  function fileTag(po) {
    if (!po.file_name) return `<span class="muted small">From the workbook</span>`;
    if (po.cancelled_at) return "";
    return po.filed_at ? `<span class="tag done">Filed</span>` : `<span class="tag flag">Not filed</span>`;
  }
  function filingBanner() {
    const wait = waiting();
    return !wait.length ? "" : !canPickFolder()
      ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " isn't" : "s aren't"} in PD - POs yet<small>This browser can't save into a folder. Download ${wait.length === 1 ? "it" : "each"} with PDF below and put ${wait.length === 1 ? "it" : "them"} in Production Utilization › PD - POs, or use Chrome or Edge on the office PC.</small></div>`
      : !S.folder ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " isn't" : "s aren't"} in PD - POs yet<small>Choose the folder once on this computer and they're filed there from then on.</small><div style="margin-top:8px"><button class="btn" data-pickfolder>Choose the PD - POs folder</button></div></div>`
      : S.perm !== "granted" ? `<div class="banner">${wait.length} PO${wait.length === 1 ? " is" : "s are"} waiting to be filed in PD - POs<small>The browser wants permission for the folder again.</small><div style="margin-top:8px"><button class="btn" data-resume>Resume filing</button></div></div>`
      : `<div class="banner">${wait.length} PO${wait.length === 1 ? " is" : "s are"} waiting to be filed in ${esc(S.folder.name)}<div style="margin-top:8px"><button class="btn" data-filenow ${S.filing ? "disabled" : ""}>File ${wait.length === 1 ? "it" : "them"} now</button></div></div>`;
  }
  const nextName = (series) => series === "lumber" ? `Lumber PO ${S.data.next_lumber}` : `PO ${String(S.data.next_po).padStart(5, "0")}`;
  function posSection() {
    const pos = (S.data.pos || []).filter(p => yearOf(p.ordered_on) === S.year);
    const rows = pos.map(po => {
      const sum = poSummary(po), open = S.open === po.id, n = (po.lines || []).length;
      return `<tr class="click ${open ? "open" : ""} ${po.cancelled_at ? "off" : ""}" data-openpo="${esc(po.id)}"><td><b>${esc(po.name)}</b>${po.revision > 1 && po.file_name ? ` <span class="tag">r${po.revision}</span>` : ""}</td>
        <td class="l">${esc(po.vendor)}</td><td>${esc(mdy(po.ordered_on))}</td><td class="l">${sum.tracked ? `${n0(sum.bf)} bd ft` : `${n} line${n === 1 ? "" : "s"}`}</td><td class="num">${usd(sum.total)}</td>
        <td class="l">${stateTag(po, sum)}</td><td class="l">${fileTag(po)}</td></tr>
        ${open ? `<tr><td colspan="7" style="padding:0">${poDetail(po)}</td></tr>` : ""}`;
    }).join("");
    const ready = S.data.issuer.ready;
    return `<div class="titlerow" style="margin-top:26px"><div class="grow"><h2>POs</h2></div>${yearPicker()}</div>
      <div class="row" style="margin:0 2px 12px"><button class="btn or" data-newpo="po" ${ready ? "" : "disabled"}>Make a PO</button><button class="btn ghost" data-newpo="lumber" ${ready ? "" : "disabled"}>Make a lumber PO</button>
        <span style="flex:1"></span><span class="note">Next: ${esc(nextName("po"))} and ${esc(nextName("lumber"))}</span></div>
      ${ready ? "" : `<div class="banner">Fill in the PO details first<small>Setup › PO details: who issues it, phone, e-mail, address and the tax-exempt line (the Arrow POs use the same).</small></div>`}
      ${filingBanner()}
      ${pos.length ? `<div class="tw"><table><thead><tr><th>PO</th><th class="l">Supplier</th><th>Issued</th><th class="l">What</th><th>Total</th><th class="l">In</th><th class="l">PDF</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<p class="muted">No POs in ${S.year} yet.</p>`}
      <p class="note" style="margin:10px 2px">Tap a PO for its lines. Buys off a website, by card or at a store have no PO: they come in through the Purchases file, on Prices.</p>
      ${arrowPosSection()}`;
  }
  /** 11 Nov: Arrow's POs, made on the tablets' Arrow department and filed by the office's save in the Arrow folder */
  function arrowPosSection() {
    if (!S.arrowPos) return "";
    const list = S.arrowPos.filter(p => yearOf(p.gone_on) === S.year);
    const rows = list.map(p => { const bare = (p.lines || []).filter(l => !String(l.pd_color || "").trim()).length;
      return `<tr><td><b>${p.is_test ? `<span class="tag">TEST</span> ` : ""}${esc(p.name)}</b>${p.revision > 1 ? ` <span class="tag">r${esc(p.revision)}</span>` : ""}</td>
        <td class="l">${esc((p.jobs || []).join(", "))}</td><td>${esc(mdy(p.gone_on))}</td>
        <td class="l">${esc(p.made_by_name || "")}${p.remade_by_name ? `<div class="note">made again by ${esc(p.remade_by_name)}</div>` : ""}</td>
        <td class="l">${p.onedrive_at && p.backup_at ? "In the Arrow folder" : p.is_test ? "" : "At the next save"}${bare ? `<div class="note">${bare} line${bare === 1 ? "" : "s"} without colours</div>` : ""}</td>
        <td class="l"><button class="btn ghost" data-arpdf="${esc(p.id)}">PDF</button>${"revision" in p ? ` <button class="link" data-arremake="${esc(p.id)}">Make it again</button>` : ""}</td></tr>`; }).join("");
    const st = S.arrowSet || {};
    return `<h3 style="margin-top:22px">Arrow POs</h3>
      <p class="sub">Made on the tablets' Arrow department when items go to Arrow, numbered AR-…; the office's save files each one in Claudes Shop System Folder › Arrow.${st.next_number ? ` The next is AR-${esc(st.next_number)}.` : ""}</p>
      ${list.length ? `<div class="tw"><table><thead><tr><th>PO</th><th class="l">Jobs</th><th>Gone</th><th class="l">Made by</th><th class="l">Filed</th><th class="l"></th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<p class="muted">No Arrow POs in ${S.year}.</p>`}`;
  }
  function poDetail(po) {
    const anyLumber = (po.lines || []).some(l => l.lumber), reqs = new Map(S.reqs.map(r => [r.id, r]));
    const lines = (po.lines || []).map(l => {
      const m = lineMoney(l), it = l.item_id ? itemById(l.item_id) : null, rq = l.supply_request_id ? reqs.get(l.supply_request_id) : null;
      return `<tr><td>${l.position}</td><td class="num">${esc(Number(l.qty).toLocaleString("en-US", { maximumFractionDigits: 3 }))}${l.unit ? " " + esc(l.unit) : ""}</td>
        <td class="l wrap">${esc(l.description)}${l.supply_request_id ? ` <span class="pill">${rq ? esc(rq.department_name) + " asked" : "supply request"}</span>` : ""}</td><td class="l">${esc(l.job_number)}</td>
        <td class="num">${esc(price(l.unit_price))}</td><td class="l">${it ? esc(it.name) : `<span class="muted">no item</span>`}</td>
        ${anyLumber ? `<td class="num">${!m.tracked ? "" : m.bench === null ? "—" : esc(price(m.bench))}</td>
        <td class="num">${!m.tracked ? "" : m.received ? `${n0(l.received_bf)}${l.slips ? ` <span class="muted small">(${l.slips} slip${l.slips === 1 ? "" : "s"})</span>` : ""}` : `<span class="muted">on order</span>`}</td>
        <td class="num">${m.saving === null ? "" : usd(m.saving)}</td>
        <td>${!m.tracked || po.cancelled_at ? "" : `<input class="n" style="width:110px" data-measured="${esc(l.id)}" inputmode="decimal" value="${l.measured_bf === null || l.measured_bf === undefined ? "" : esc(l.measured_bf)}" placeholder="—" aria-label="Measured after SLR, line ${l.position}">`}</td>` : ""}</tr>`;
    }).join("");
    const earlier = (po.earlier || []).filter(e => e.file_name).map(e => `${esc(e.file_name)} (${esc(String(e.at || "").slice(0, 10))}, ${esc(e.by || "")})`).join("; ");
    const bills = (S.data.buys || []).filter(b => b.po_id === po.id);
    return `<div class="detail">
      <div class="note">${po.from_history ? "From the workbook (no PDF). " : `Made by ${esc(po.made_by_name || "")}${po.changed_by_name ? `, changed by ${esc(po.changed_by_name)}` : ""}. `}${po.cancelled_at ? `Cancelled by ${esc(po.cancelled_by_name)}${po.cancel_reason ? `: ${esc(po.cancel_reason)}` : ""}.` : ""}
        ${po.filed_at ? `Filed in PD - POs as ${esc(po.file_name)}.` : ""}</div>
      <div class="tw"><table><thead><tr><th>#</th><th>Qty</th><th class="l">Description</th><th class="l">Job</th><th>Price</th><th class="l">Item</th>
        ${anyLumber ? `<th>Measured against</th><th>In (bd ft)</th><th>Saved</th><th>Measured after SLR</th>` : ""}</tr></thead><tbody>${lines}</tbody></table></div>
      ${earlier ? `<p class="note">Earlier versions, kept: ${earlier}</p>` : ""}
      ${bills.length ? `<p class="note">On record against this PO from the Purchases file (not counted again): ${bills.map(b => `${esc(b.doc || b.supplier)} ${esc(mdy(b.on))}, ${usd(b.amount, true)}`).join("; ")}.</p>` : ""}
      <div class="row">
        ${po.cancelled_at ? `<button class="btn ghost" data-uncancel="${esc(po.id)}">Put it back</button>` : `<button class="btn ghost" data-changepo="${esc(po.id)}">Change the PO</button>`}
        ${po.file_name ? `<button class="btn ghost" data-pdf="${esc(po.id)}">PDF</button>` : ""}
        ${!po.cancelled_at ? `<button class="link" data-cancelpo="${esc(po.id)}">Cancel the PO</button>` : ""}
        ${anyLumber && !po.cancelled_at ? `<button class="btn ghost" data-slippo="${esc(po.id)}">${S.slipPo === po.id ? "Hide the delivery slips" : "Pick its delivery slips"}</button>` : ""}</div>
      ${anyLumber && S.slipPo === po.id ? slipPicker(po) : ""}</div>`;
  }

  // ---------- 11 Nov: the supply lists, moved from the office's Setup ----------
  function supplyForm(e) {
    return `<div class="card" style="margin:6px 0"><div class="form" style="flex-direction:column; align-items:stretch">
      <label>${e.id ? "Name" : "New item"}<input id="supName" data-supf="name" value="${esc(e.name)}" placeholder="e.g. Boxes of biscuits" maxlength="60"></label>
      <p class="note" style="margin:0">Choices (optional): up to two sets, with a comma between each choice.</p>
      ${e.groups.map((g, i) => `<div class="row"><input data-supg="${i}" data-part="label" value="${esc(g.label)}" placeholder="${i ? "e.g. Thickness" : "e.g. Wood"}" aria-label="Name of choice set ${i + 1}">
        <input data-supg="${i}" data-part="options" value="${esc(g.options)}" placeholder="${i ? "e.g. 1/4, 1/2, 3/4, 3/4 MDF" : "e.g. Ash, Maple, White Oak"}" aria-label="Choices in set ${i + 1}" style="flex:1"></div>`).join("")}
      <div class="row"><button class="btn or" data-supsave ${S.busy || !e.name.trim() ? "disabled" : ""}>${e.id ? "Save" : "Add to the list"}</button><button class="link" data-supcancel>Cancel</button></div></div></div>`;
  }
  function supplySection() {
    if (!S.supItems) return "";
    const nameOf = (d) => (S.depts.find(x => x.key === d) || {}).name || d;
    const dept = (d) => {
      const { live, retired } = supplyListFor(S.supItems, d), e = S.supEdit && S.supEdit.dept === d ? S.supEdit : null;
      const row = (i, k) => e && e.id === i.id ? supplyForm(e) : `<div class="r"><div class="grow"><b>${esc(i.name)}</b>${(i.choices || []).length ? `<small>${esc(choiceSummary(i.choices))}</small>` : ""}</div>
        ${i.retired ? `<button class="link" data-supback="${esc(i.id)}">Bring back</button>` : `
          <button class="link" data-supmove="${esc(i.id)}" data-up="1" ${k === 0 ? "disabled" : ""} aria-label="Move ${esc(i.name)} up">↑</button>
          <button class="link" data-supmove="${esc(i.id)}" data-up="0" ${k === live.length - 1 ? "disabled" : ""} aria-label="Move ${esc(i.name)} down">↓</button>
          <button class="link" data-supedit="${esc(i.id)}">Edit</button><button class="link" data-supretire="${esc(i.id)}">Retire</button>`}</div>`;
      return `<details class="fold" data-keep="sup_${d}" ${S.keep.has("sup_" + d) ? "open" : ""}><summary>${esc(nameOf(d))} (${live.length})</summary><div class="list">
        ${live.map(row).join("") || `<p class="note">No list yet: the tablet shows only the typed box.</p>`}
        ${e && !e.id ? supplyForm(e) : `<button class="btn ghost" style="margin:6px 0" data-supadd="${d}">Add an item</button>`}
        ${retired.length ? `<p class="note">Retired</p>${retired.map(row).join("")}` : ""}</div></details>`;
    };
    return `<h3>Supply lists</h3>
      <p class="sub">What each department taps on its tablet's Supplies tab; what they send arrives on Buy. An item can have up to two sets of choices, like the wood and the thickness; the tablet won't send it until each is picked. Anything not on the list can still be typed. Retiring takes an item off the tablets; past requests keep it.</p>
      ${SUP_DEPTS.map(dept).join("")}`;
  }

  // ---------- the PO editor ----------
  const blankLine = () => ({ qty: "", unit: "", description: "", job_number: "", unit_price: "", item_id: "", supply_request_id: "" });
  function startEdit(po, series, fromRequests) {
    if (!po) {
      const lines = (fromRequests || []).map(r => ({ ...blankLine(), qty: String(r.qty), description: r.item, supply_request_id: r.id }));
      while (lines.length < 3) lines.push(blankLine());
      S.edit = { series, vendor_id: "", ordered_on: S.data.today, date: "", date_required: "", terms: "", method: "", po_job: "", lines };
    } else {
      const h = po.header || {};
      S.edit = { id: po.id, name: po.name, series: po.series, history: po.from_history, vendor_id: po.vendor_id, ordered_on: po.ordered_on, date: h.date || "", date_required: h.date_required || "",
                 terms: h.terms || "", method: h.method || "", po_job: h.po_job || "",

  // ---------- Savings: the year as pictures ----------

  /** the data with the months left out of the scrap results taken away */

  /** bars on one scale either side of a line: saved to the right, paid more to the left */
  function diverging(rows, attr) {
    const pos = Math.max(1, ...rows.map(r => r.v)), neg = Math.max(0, ...rows.map(r => -r.v));
    const zero = Math.max(2, 100 * neg / (neg + pos)), unit = (100 - zero) / pos;
    return rows.map(r => {
      const w = Math.min(r.v >= 0 ? 100 - zero : zero, Math.abs(r.v) * unit), shown = Math.abs(r.v) > .5 ? Math.max(w, .8) : 0;
      const inner = `<span class="nm">${esc(r.n)}</span><span class="trk"><i class="${r.v < 0 ? "more" : ""}" style="left:${r.v >= 0 ? zero : zero - shown}%;width:${shown}%"></i><span class="zero" style="left:${zero}%"></span></span>
        <span class="v">${Math.abs(r.v) < .5 ? "same" : signed(r.v)}</span>`;

    }).join("");

    const scrap = [...R.months.map(m => ({ month_end: m.month_end, ratio: m.ratio })), ...leftOut.map(x => ({ month_end: String(x.month_end).slice(0, 10), out: x }))]

  /** savings so far, month by month: drawn to the width it has, so the words stay readable on a phone */
  function drawChart() {
    const el = document.getElementById("chart"); if (!el) return;
    const M = monthlySavings(S.data, S.year), cum = M.months.map(x => x.cum), last = cum.length - 1;
    const W = el.clientWidth || 600, H = Math.round(Math.max(210, Math.min(330, W * .4))), m = { l: 6, r: 12, t: 26, b: 28 };
    const lo = Math.min(0, ...cum), hi = Math.max(0, ...cum), span = (hi - lo) || 1;
    const raw = span / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw) || raw;
    const top = Math.ceil(hi / step) * step || step, bot = Math.floor(lo / step) * step;
    const slot = (W - m.l - m.r) / 12, x = (k) => m.l + slot * (k + 1), yv = (v) => m.t + (H - m.t - m.b) * (1 - (v - bot) / (top - bot));
    const line = `M${m.l},${yv(0).toFixed(1)} L${cum.map((v, k) => `${x(k).toFixed(1)},${yv(v).toFixed(1)}`).join(" L")}`;
    const tick = (g) => Math.abs(g) >= 1000 ? `${g < 0 ? "−" : ""}$${Math.abs(g) / 1000}k` : signed(g);
    let grid = ""; for (let g = bot; g <= top + step / 2; g += step) grid += `<line class="${Math.abs(g) < step / 2 ? "c-axis" : "c-grid"}" x1="${m.l}" x2="${W - m.r}" y1="${yv(g)}" y2="${yv(g)}"/>${Math.abs(g) >= step / 2 ? `<text class="c-txt" x="${m.l + 2}" y="${yv(g) - 5}">${tick(g)}</text>` : ""}`;
    const labels = MONTH_NAMES.map((n, k) => `<text class="c-txt" text-anchor="middle" x="${m.l + slot * (k + .5)}" y="${H - 8}">${W < 520 ? n[0] : n}</text>`).join("");
    const sel = S.month !== null && S.month <= last ? S.month : null;
    const guide = sel === null ? "" : `<line class="c-guide" x1="${x(sel)}" x2="${x(sel)}" y1="${m.t}" y2="${H - m.b}"/><circle class="c-dot" cx="${x(sel)}" cy="${yv(cum[sel])}" r="6"/>`;
    const hits = cum.map((v, k) => `<rect class="c-hit" data-m="${k}" x="${m.l + slot * k}" y="${m.t}" width="${slot}" height="${H - m.t - m.b}"><title>${MONTH_NAMES[k]}</title></rect>`).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Savings so far in ${S.year}, month by month, reaching ${signed(cum[last])} in ${MONTH_NAMES[last]}">
      ${grid}<path class="c-area" d="${line} L${x(last)},${yv(0)} Z"/><path class="c-line" d="${line}"/>
      <circle class="c-dot" cx="${x(last)}" cy="${yv(cum[last])}" r="5"/>
      <text class="c-end" text-anchor="end" x="${x(last) - 10}" y="${Math.max(18, yv(cum[last]) - 10)}">${signed(cum[last])}</text>
      ${guide}${labels}${hits}</svg>`;
    const k = sel === null ? last : sel, v = M.months[k];
    document.getElementById("readout").innerHTML = `<b>${MONTH_NAMES[k]}:</b> ${v.saved >= 0 ? `${usd(v.saved)} saved` : `${usd(-v.saved)} more than the baselines`} on ${usd(v.paid)} of buying. ${signed(v.cum)} saved by the end of it.`
      + (sel === null ? ` <span class="muted">Tap a month.</span>` : "");
    el.querySelectorAll("[data-m]").forEach(r => { const pick = () => { S.month = Number(r.dataset.m); drawChart(); }; r.onclick = pick; r.onpointerenter = (e) => { if (e.pointerType === "mouse") pick(); }; });
  }

    if (S.sheet === "newitems") {

        <div class="list">${made.map((i, k) => `<div class="r"><div class="grow"><b>${esc(i.name)}</b><small>${esc(catName(i.category_key))}, ${esc(i.unit)}${i.retired ? `. Folded: ${esc(i.item)}` : ""}</small></div>
          ${i.retired ? "" : `<select data-foldsel="${k}" aria-label="Same as, for ${esc(i.name)}" style="max-width:190px"><option value="">Same as…</option>${itemOptions(i.category_key).replace(`value="${esc(i.item_id)}"`, `value="${esc(i.item_id)}" disabled`)}</select>
            <button class="btn ghost" data-foldgo="${k}|${esc(i.item_id)}">Move</button>`}</div>`).join("")}</div>
        <div class="row end" style="margin-top:12px"><button class="btn" data-sheetclose="1">Done</button></div>`);

  // ---------- a lumber PO's delivery slips (Inventory's Deliveries in) ----------
  async function loadSlips() {
    const [l, r] = await Promise.all([Promise.resolve(db.rpc("purchase_slip_lines")).catch(e => ({ error: e })),
      Promise.resolve(db.from("inv_receipts").select("id,received_on,month_end,supplier,item_id,board_feet,mistake_at").eq("kind", "lumber")
        .is("mistake_at", null).order("received_on", { ascending: false }).limit(120)).catch(e => ({ error: e }))]);
    if (l.error || r.error) { S.msg = { ok: false, text: friendlyError(l.error || r.error) }; S.slipLines = { lines: [], links: [] }; S.slips = []; return; }
    S.slipLines = l.data || { lines: [], links: [] }; S.slips = r.data || [];
  }
  function slipPicker(po) {
    if (!S.slipLines) return `<p class="note">Loading Inventory's lumber slips…</p>`;
    const mine = new Set((po.lines || []).filter(l => l.lumber).map(l => l.id)), links = new Map((S.slipLines.links || []).map(x => [x.receipt_id, x.line_id]));
    const lines = (S.slipLines.lines || []).filter(l => mine.has(l.id)), invName = (id) => ((S.data.inv_items || []).find(i => i.id === id) || {}).name || "";
    const inv = new Set(lines.map(l => l.inv_item_id).filter(Boolean));
    // this PO's slips, then slips on no PO line yet for the same Inventory items (any, if the items aren't tied to Inventory)
    const list = S.slips.filter(r => mine.has(links.get(r.id)) || (!links.has(r.id) && (!inv.size || inv.has(r.item_id))));
    const rows = list.map(r => { const cur = links.get(r.id);
      return `<tr><td>${esc(mdy(r.received_on))}</td><td class="l">${esc(r.supplier || "")}</td><td class="l">${esc(invName(r.item_id))}</td><td class="num">${n0(r.board_feet)}</td>
        <td><select data-slip="${esc(r.id)}" aria-label="PO line this slip fills"><option value="">Not this PO</option>${lines.slice().sort((a, b) => (b.inv_item_id === r.item_id) - (a.inv_item_id === r.item_id))
          .map(l => `<option value="${esc(l.id)}" ${l.id === cur ? "selected" : ""}>Line ${l.position}: ${esc(l.item)} (${n0(l.in_bf)} of ${n0(l.qty)} in)</option>`).join("")}</select></td></tr>`; }).join("");
    return rows ? `<div class="tw" style="margin-top:10px"><table><thead><tr><th>Received</th><th class="l">Supplier</th><th class="l">Inventory item</th><th>Bd ft</th><th class="l">Fills</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="note" style="margin:6px 2px 0">Inventory's lumber slips that are on this PO, or on no PO yet. A line counts what was ordered until its slips are picked; then what they brought in. A slip in a closed month stays as it is.</p>`
      : `<p class="note" style="margin-top:10px">No lumber slips on the Inventory page for this PO's lumber yet.</p>`;
  }

  function supplierForm(v) {

  // ---------- wiring ----------
  const val = (sel) => { const el = app.querySelector(sel); return el ? el.value : ""; };
  const lines = (t) => String(t || "").split(/\n/).map(x => x.trim()).filter(Boolean);
  function wire() {
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (S.edit && !confirm("Leave the PO without saving it?")) return; S.edit = null; go(b.dataset.tab); });
    const on = (sel, fn) => app.querySelectorAll(sel).forEach(el => el.onclick = (e) => fn(el, e));
    on("[data-tabgo]", (b) => go(b.dataset.tabgo));
    app.querySelectorAll("[data-year]").forEach(s => s.onchange = () => { S.year = Number(s.value); S.open = null; S.openItem = null; S.month = null; render(); });
    app.querySelectorAll("details[data-keep]").forEach(d => d.ontoggle = () => { d.open ? S.keep.add(d.dataset.keep) : S.keep.delete(d.dataset.keep); });
    on("[data-sheet]", (b) => { S.sheet = b.dataset.sheet; S.matchNew = null; render(); });
    on("[data-sheetclose]", (el, e) => { if (el.classList.contains("scrim") && e.target !== el) return; S.sheet = null; S.matchNew = null; S.log = null; render(); });
    on("[data-received]", (b) => { if (confirm("Mark this received? It leaves the list.")) call("receive_supply", { p_request: b.dataset.received }, (d) => d.summary || "Marked received."); });
    on("[data-cat]", (b) => { S.cat = b.dataset.cat; S.openItem = null; render(); });
    on("[data-mover]", (b) => { S.tab = "prices"; store.set("tab", "prices"); S.cat = "all"; S.openItem = b.dataset.mover; render();
      const row = app.querySelector(`[data-openitem="${b.dataset.mover}"]`); if (row) row.scrollIntoView({ block: "center" }); });
    on("[data-pickfile]", () => { const i = app.querySelector("#fileIn"); if (i) i.click(); });
    on("[data-seenfile]", (b) => { store.set("fileSeen", b.dataset.seenfile); render(); });
    on("[data-split]", (b) => { const [item, name] = b.dataset.split.split("|");
      call("purchase_item_split", { p_item: item, p_name: name }, (d) => d.summary); });
    on("[data-foldgo]", (b) => { const [k, from] = b.dataset.foldgo.split("|"), into = val(`[data-foldsel="${k}"]`);
      if (!into) { S.msg = { ok: false, text: "Pick the item it's the same as first." }; S.sheet = null; return render(); }
      call("purchase_item_fold", { p_from: from, p_into: into }, (d) => d.summary); });
    on("[data-folditem]", async (b) => { const into = val("#foldInto");
      if (!into) { S.msg = { ok: false, text: "Pick the item it's the same as first." }; return render(); }
      if (!confirm("Move everything bought as this item over to the one you picked, and retire this one?")) return;
      if (await call("purchase_item_fold", { p_from: b.dataset.folditem, p_into: into }, (d) => d.summary)) { S.setupEdit = null; render(); } });
    on("[data-slippo]", async (b) => { S.slipPo = S.slipPo === b.dataset.slippo ? null : b.dataset.slippo; if (S.slipPo) { S.slipLines = null; render(); await loadSlips(); } render(); });
    // To buy
    app.querySelectorAll("[data-tick]").forEach(c => c.onchange = () => { if (c.checked) S.ticked.add(c.dataset.tick); else S.ticked.delete(c.dataset.tick); render(); });
    on("[data-logopen]", () => openLog(null));
    on("[data-logchange]", (b) => openLog((S.data.logs || []).find(g => g.id === b.dataset.logchange)));
    on("[data-logmistake]", (b) => { const g = (S.data.logs || []).find(x => x.id === b.dataset.logmistake); if (!g) return;
      const why = window.prompt(`Mark the purchase from ${g.supplier} a mistake? It stays on record and stops counting. Why (optional)?`, "");
      if (why === null) return;
      call("purchase_log_cancel", { p_id: g.id, p_reason: why }, (d) => d.summary); });
    on("[data-logadd]", () => { readLog(); S.log.lines.push(blankLogLine()); render(); const e = app.querySelector(`[data-lg="${S.log.lines.length - 1}|name"]`); if (e) e.focus(); });
    on("[data-logx]", (b) => { readLog(); S.log.lines.splice(Number(b.dataset.logx), 1); if (!S.log.lines.length) S.log.lines.push(blankLogLine()); render(); });
    on("[data-logsave]", () => saveLog());
    if (app.querySelector(".logsheet")) app.querySelectorAll(".logsheet input, .logsheet select").forEach(e => { e.oninput = logLive; e.onchange = logLive; });
    // Prices: Find an item narrows the table as you type, in place
    const fi = app.querySelector("#findItem");
    if (fi) fi.oninput = () => { S.find = fi.value; filterPrices(); };
    on("[data-reqorder]", () => call("order_supplies", { p_requests: [...S.ticked] }, (d) => { S.ticked = new Set(); return d.summary || "Marked ordered."; }));
    on("[data-reqpo]", () => startEdit(null, "po", S.reqs.filter(r => S.ticked.has(r.id))));
    on("[data-noorder]", (b) => { S.notOrdering = b.dataset.noorder; render(); const i = app.querySelector("[data-noreason]"); if (i) i.focus(); });
    on("[data-nocancel]", () => { S.notOrdering = null; render(); });
    on("[data-nosave]", (b) => { const reason = val("[data-noreason]"); call("not_ordering_supply", { p_request: b.dataset.nosave, p_reason: reason }, (d) => { S.notOrdering = null; S.ticked.delete(b.dataset.nosave); return d.summary; }); });
    on("[data-addreq]", () => { S.adding = true; render(); });
    on("[data-addcancel]", () => { S.adding = false; render(); });
    on("[data-addsave]", async () => { const d = await call("request_supply", { p_department: val("#adDept"), p_item: val("#adItem"), p_qty: Number(val("#adQty")), p_note: val("#adNote") || null, p_client_id: newId() },
      (x) => x.summary || "Added."); if (d) { S.adding = false; render(); } });
    // POs
    on("[data-openpo]", (r, e) => { if (e.target.closest("button,input,select,a")) return; S.open = S.open === r.dataset.openpo ? null : r.dataset.openpo; render(); });
    on("[data-newpo]", (b) => startEdit(null, b.dataset.newpo));
    on("[data-changepo]", (b) => startEdit(S.data.pos.find(p => p.id === b.dataset.changepo)));
    on("[data-pdf]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.pdf);
      try { saveBlob(await pdfFor(po), po.file_name); } catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); } });
    on("[data-cancelpo]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.cancelpo);
      const why = window.prompt(`Cancel ${po.name}? It stays on record and stops counting; any supply request on it goes back to be ordered. Why (optional)?`, "");
      if (why === null) return;
      await call("purchase_po_cancel", { p_id: po.id, p_cancel: true, p_reason: why }, `${po.name} cancelled. It stays on record.`); });
    on("[data-uncancel]", async (b) => { const po = S.data.pos.find(p => p.id === b.dataset.uncancel);
      await call("purchase_po_cancel", { p_id: po.id, p_cancel: false, p_reason: null }, `${po.name} is back.`); });
    app.querySelectorAll("[data-measured]").forEach(inp => inp.onchange = async () => { const v = inp.value.replace(/,/g, "").trim();
      await call("purchase_measured_save", { p_line: inp.dataset.measured, p_bf: v === "" ? null : Number(v) }, v === "" ? "Measurement cleared." : `Saved: ${n0(v)} bd ft measured after SLR.`); });
    on("[data-pickfolder]", () => pickFolder());
    on("[data-resume]", () => resumeFolder());
    on("[data-filenow]", () => fileWaiting().then(render));
    if (S.edit) {
      app.querySelectorAll("[data-e],[data-l]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => { readEdit(); editAmounts(); }));
      on("[data-addline]", () => { readEdit(); S.edit.lines.push(blankLine()); render(); });
      on("[data-rmline]", (b) => { readEdit(); S.edit.lines.splice(Number(b.dataset.rmline), 1); if (!S.edit.lines.length) S.edit.lines.push(blankLine()); render(); });
      on("[data-canceledit]", () => { S.edit = null; S.msg = null; render(); });
      on("[data-savepo]", () => savePo());
      on("[data-preview]", async () => { readEdit(); const chk = checkLines(S.edit.lines, S.data.items);
        if (chk.problem) { S.msg = { ok: false, text: chk.problem }; return render(); }
        try { const po = draftPo(chk.lines); saveBlob(await pdfFor(po), `${po.name} (preview).pdf`); } catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); } });
    }
    // Prices
    on("[data-openitem]", (r) => { S.openItem = S.openItem === r.dataset.openitem ? null : r.dataset.openitem; render(); });
    on("[data-export]", () => { const rows = exportRows(S.data, S.year);
      saveBlob(new TextEncoder().encode(exportCsv(rows)), `Purchasing ${S.year} - every line (${S.data.today}).csv`, "text/csv;charset=utf-8");
      S.msg = { ok: true, text: `Downloaded ${rows.length} line${rows.length === 1 ? "" : "s"} for ${S.year}.` }; render(); });
    // months left out of the scrap results
    on("[data-skipmonth]", (b) => {
      const m = b.dataset.skipmonth, name = new Date(m.slice(0, 10) + "T12:00").toLocaleString("en-US", { month: "long", year: "numeric" });
      const why = window.prompt(`Leave ${name} out of the scrap results? It stays as it is on the Inventory page. Why (for example: the counts weren't done)?`, "");
      if (!why) return;
      call("lumber_scrap_skip_save", { p_month: m.slice(0, 10), p_out: true, p_reason: why }, (d) => d.summary);
    });
    on("[data-putbackmonth]", (b) => call("lumber_scrap_skip_save", { p_month: b.dataset.putbackmonth.slice(0, 10), p_out: false, p_reason: null }, (d) => d.summary));
    // Lumber slips
    app.querySelectorAll("[data-slip]").forEach(s => s.onchange = async () => {
      const r = await Promise.resolve(db.rpc("purchase_slip_link", { p_receipt: s.dataset.slip, p_line: s.value || null })).catch(e => ({ error: e }));
      S.msg = r.error ? { ok: false, text: friendlyError(r.error) } : { ok: true, text: r.data.summary };
      await load(); await loadSlips(); render(); });
    // the Purchases file
    const fileIn = app.querySelector("#fileIn"), zone = app.querySelector("#dropzone");
    if (fileIn) fileIn.onchange = () => { if (fileIn.files[0]) readFile(fileIn.files[0]); };
    if (zone) {
      zone.ondragover = (e) => { e.preventDefault(); zone.classList.add("over"); };
      zone.ondragleave = () => zone.classList.remove("over");
      zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) readFile(f); };
    }
    on("[data-fileclear]", () => { S.file = null; render(); });
    on("[data-filesend]", () => sendFile());
    const groups = () => matchGroups(S.data);
    on("[data-match]", (b) => { const g = groups()[Number(b.dataset.match)], item = val(`[data-matchsel="${b.dataset.match}"]`);
      if (!item) { S.msg = { ok: false, text: "Choose the item first, or make a new one." }; return render(); }
      call("purchase_buys_match", { p_ids: g.ids, p_item: item, p_remember: true }, (d) => d.summary); });
    on("[data-newitemopen]", (b) => { S.matchNew = b.dataset.newitemopen; render(); });
    on("[data-newitemcancel]", () => { S.matchNew = null; render(); });
    on("[data-newitem]", async (b) => { const g = groups()[Number(b.dataset.newitem)], p = {};
      app.querySelectorAll("[data-nm]").forEach(el => p[el.dataset.nm] = el.value);
      const made = await call("purchase_item_save", { p }, null); if (!made) return;
      S.matchNew = null; await call("purchase_buys_match", { p_ids: g.ids, p_item: made.id, p_remember: true }, (d) => `${p.name} made. ${d.summary}`); });
    on("[data-forpo]", (b) => { const g = groups()[Number(b.dataset.forpo)];
      const po = window.prompt("Which PO is it for? Type it as it's named, like Lumber PO 17 or PO 00001.", ""); if (!po) return;
      (async () => { for (const id of g.ids) { const r = await Promise.resolve(db.rpc("purchase_buy_po", { p_id: id, p_po: poName(po) })).catch(e => ({ error: e }));
          if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); } }
        S.msg = { ok: true, text: `Kept against ${poName(po)}: not counted again.` }; await load(); render(); })(); });
    on("[data-leaveout]", (b) => { const g = groups()[Number(b.dataset.leaveout)];
      const why = window.prompt("Why is it left out? (For example: not a production buy.)", ""); if (!why) return;
      (async () => { for (const id of g.ids) { const r = await Promise.resolve(db.rpc("purchase_buy_ignore", { p_id: id, p_ignore: true, p_reason: why })).catch(e => ({ error: e }));
          if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); } }
        S.msg = { ok: true, text: `Left out (${g.ids.length} line${g.ids.length === 1 ? "" : "s"}). It stays on record under Left out.` }; await load(); render(); })(); });
    on("[data-putback]", (b) => call("purchase_buy_ignore", { p_id: b.dataset.putback, p_ignore: false, p_reason: null }, "Put back: it's waiting in Match these again."));
    on("[data-itemscsv]", () => saveBlob(new TextEncoder().encode(itemsCsv(S.data)), `Purchasing items (${S.data.today}).csv`, "text/csv;charset=utf-8"));
    // Setup
    on("[data-saveissuer]", () => call("set_arrow_po_settings", { p: { issued_by: val("#isBy"), phone: val("#isPhone"), email: val("#isEmail"),
      address: val("#isAddr"), tax_line: val("#isTax") } }, "PO details saved. The POs and Arrow POs print them from now on."));
    on("[data-savenext]", (b) => { const series = b.dataset.savenext, n = Number(val(series === "po" ? "#nextPo" : "#nextLumber"));
      call("purchase_next_number_save", { p_series: series, p_next: n }, () => `The next ${series === "po" ? "PO is PO " + String(n).padStart(5, "0") : "lumber PO is Lumber PO " + n}.`); });
    // 11 Nov: the next Arrow PO number, the Arrow POs' PDF and Make it again, and the supply lists (all moved from the office)
    on("[data-savenextarrow]", () => { const n = Number(val("#nextArrow"));
      call("set_arrow_po_settings", { p: { next_number: n } }, `The next Arrow PO is AR-${n}.`); });
    on("[data-arpdf]", async (b) => { const po = (S.arrowPos || []).find(p => p.id === b.dataset.arpdf); if (!po) return;
      try { saveBlob(await arrowPoPdf(await pdfLib(), po), po.file_name, "application/pdf"); } catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); } });
    on("[data-arremake]", (b) => { const po = (S.arrowPos || []).find(p => p.id === b.dataset.arremake); if (!po) return;
      if (confirm(`Make ${po.name} again? It keeps its number, items and dates, takes the colours from the jobs' Arrow lines now and the PO details as they are now, and the next save files it as a new PDF (r${(po.revision || 1) + 1}) beside the first one. The first one is kept.`))
        call("arrow_po_remake", { p_po: po.id }, `${po.name} made again (r${(po.revision || 1) + 1}). The office's next save files it beside the first.`); });
    const supOpen = (d, item) => {
      const g = [0, 1].map(i => { const c = item && (item.choices || [])[i]; return { label: c ? c.label : "", options: c ? c.options.join(", ") : "" }; });
      S.supEdit = { id: item ? item.id : null, dept: d, name: item ? item.name : "", groups: g }; S.keep.add("sup_" + d); S.msg = null; render();
      const n = app.querySelector("#supName"); if (n) n.focus(); };
    on("[data-supadd]", (b) => supOpen(b.dataset.supadd, null));
    on("[data-supedit]", (b) => { const i = (S.supItems || []).find(x => x.id === b.dataset.supedit); if (i) supOpen(i.department, i); });
    on("[data-supcancel]", () => { S.supEdit = null; render(); });
    app.querySelectorAll("[data-supf]").forEach(el => el.oninput = () => { S.supEdit.name = el.value; const go = app.querySelector("[data-supsave]"); if (go) go.disabled = !el.value.trim(); });
    app.querySelectorAll("[data-supg]").forEach(el => el.oninput = () => { S.supEdit.groups[Number(el.dataset.supg)][el.dataset.part] = el.value; });
    on("[data-supsave]", async () => { const e = S.supEdit;
      if (await call("set_supply_item", { p_id: e.id, p_department: e.dept, p_name: e.name.trim(), p_choices: choicesFromForm(e.groups) }, "Saved. The tablets show it from their next look.")) { S.supEdit = null; render(); } });
    on("[data-supmove]", (b) => call("move_supply_item", { p_id: b.dataset.supmove, p_up: b.dataset.up === "1" }));
    on("[data-supretire]", (b) => { if (confirm("Retire this item? It comes off the tablets. Past requests keep it, and you can bring it back.")) call("retire_supply_item", { p_id: b.dataset.supretire, p_retire: true }, "Retired."); });
    on("[data-supback]", (b) => call("retire_supply_item", { p_id: b.dataset.supback, p_retire: false }, "Back on the list."));
    on("[data-editsupplier]", (b) => { S.setupEdit = { supplier: b.dataset.editsupplier }; render(); });
    on("[data-edititem]", (b) => { S.setupEdit = { item: b.dataset.edititem }; render(); });
    on("[data-editcat]", (b) => { S.setupEdit = { cat: b.dataset.editcat }; render(); });
    on("[data-closesetup]", () => { S.setupEdit = null; render(); });
    on("[data-savesupplier]", async (b) => { const p = {};
      app.querySelectorAll("[data-v]").forEach(el => p[el.dataset.v] = el.type === "checkbox" ? el.checked : el.dataset.v === "aliases" ? lines(el.value) : el.value);
      if (b.dataset.savesupplier) p.id = b.dataset.savesupplier;
      if (await call("purchase_supplier_save", { p }, `Supplier saved: ${p.name}.`)) { S.setupEdit = null; render(); } });
    on("[data-savecat]", async (b) => { const p = {}; app.querySelectorAll("[data-c]").forEach(el => p[el.dataset.c] = el.type === "checkbox" ? el.checked : el.value);
      if (b.dataset.savecat) p.key = b.dataset.savecat;
      if (await call("purchase_category_save", { p }, `Category saved: ${p.name}.`)) { S.setupEdit = null; render(); } });
    on("[data-saveitem]", async (b) => { const p = {};
      app.querySelectorAll("[data-i]").forEach(el => p[el.dataset.i] = el.type === "checkbox" ? el.checked : el.dataset.i === "aliases" ? lines(el.value) : el.value);
      if (b.dataset.saveitem) p.id = b.dataset.saveitem;
      if (await call("purchase_item_save", { p }, (d) => `Item saved: ${p.name}${d.benchmark ? `, measured against ${price(d.benchmark)}` : ""}.`)) { S.setupEdit = null; render(); } });
    app.querySelectorAll('[data-i="category_key"]').forEach(s => s.onchange = () => {   // lumber and other items ask different things
      const it = (S.setupEdit.item || "").startsWith("new:") ? {} : { ...(itemById(S.setupEdit.item) || {}) };
      app.querySelectorAll("[data-i]").forEach(el => { if (el.type !== "checkbox") it[el.dataset.i] = el.dataset.i === "aliases" ? lines(el.value) : el.value; });
      it.category_key = s.value; const row = s.closest("tr"); row.outerHTML = itemForm(it); wire(); });
    on("[data-savebase]", () => { const item = val("#blItem"); if (!item) { S.msg = { ok: false, text: "Choose the item." }; return render(); }
      call("purchase_baseline_save", { p_item: item, p_year: Number(val("#blYear")), p_price: Number(String(val("#blPrice")).replace(/[$,]/g, "")), p_note: val("#blNote") || null }, "Baseline saved."); });
    on("[data-rmbase]", (b) => { const [item, year] = b.dataset.rmbase.split("|");
      if (confirm("Take this baseline away? Buys are then measured against the year before's average paid.")) call("purchase_baseline_save", { p_item: item, p_year: Number(year), p_price: null, p_note: null }, "Baseline taken away."); });
    on("[data-saveyears]", async () => {
      const last = yearOf(S.data.today) - 1;
      for (const v of S.data.suppliers) {
        const bf = val(`[data-ytbf="${v.id}"]`), d = val(`[data-ytd="${v.id}"]`);
        if (String(bf).trim() === "" && String(d).trim() === "") continue;
        const r = await Promise.resolve(db.rpc("lumber_year_total_save", { p_year: last, p_vendor: v.id, p_bf: Number(String(bf).replace(/,/g, "")) || 0,
          p_dollars: Number(String(d).replace(/[$,]/g, "")) || 0 })).catch(e => ({ error: e }));
        if (r.error) { S.msg = { ok: false, text: friendlyError(r.error) }; return render(); }
      }
      S.msg = { ok: true, text: `${last} saved.` }; await load(); render();
    });
  }

  // the address names a tab (a bookmark, or one of the old tabs' names): follow it when it changes on an open page too
  addEventListener("hashchange", () => { const k = tabOf((location.hash || "").replace("#", "")); if (k && k !== S.tab && S.me && !S.edit) go(k); });
  addEventListener("resize", () => { if (S.tab === "savings" && !S.edit && S.loaded && !S.missing) drawChart(); });

  // ---------- start ----------
  async function start(user) {
    const { data } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
    S.me = { id: user.id, email: user.email, name: (data && data.full_name) || user.email, role: data && data.role };
    render();
    if (S.me.role === "manager" || S.me.role === "admin") { await loadFolder().catch(() => {}); await load(); render(); fileWaiting(); }
  }
  (async () => {
    const { data } = await db.auth.getSession();
    if (data && data.session) return start(data.session.user);
    app.innerHTML = `<main><div class="card" style="max-width:460px;margin:30px auto"><h2>Sign in</h2><p class="sub">Use a manager's login.</p>
      <form id="f"><div class="form" style="grid-template-columns:1fr"><label>Email<input id="e" type="email" autocomplete="username" required></label>
        <label>Password<input id="p" type="password" autocomplete="current-password" required></label><button class="btn or" type="submit">Sign in</button></div></form>
      <div id="err" class="banner" style="margin-top:14px" hidden></div></div></main>`;
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      if (r.error) { const el = document.getElementById("err"); el.hidden = false; el.textContent = friendlyError(r.error); return; }
      start(r.data.user);
    };
  })();
})();
</script>
</body>
</html>
