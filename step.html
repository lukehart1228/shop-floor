<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEP viewer (test) — Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sf-style-2026-10-20.1.css">
<!--
  step.html — the STEP viewer test (31 Oct 2026). On the PC: pick a STEP file; the page converts it with OpenCascade
  (occt-import-js, run in the browser) into a light view file, shows it, and a manager saves it for the tablets. On a
  tablet: open a saved view file, turn it, pinch to zoom, see the overall size, and tap two points to measure (a tap
  snaps to the nearest corner or edge point). It tells us conversion time, file size and accuracy on real designs and
  real tablets before the viewer joins the zip drop. View files live in the private designs bucket (designs.sql,
  run order 49): shop logins read them, managers add and clear test ones. The libraries load from jsDelivr with
  integrity checks, only when needed, like the PDF viewer. Design: the spec's 3D design viewer tab.
-->
<style>
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0; background:var(--paper); color:var(--midnight)}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px; line-height:1.4; -webkit-text-size-adjust:100%}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--bright); outline-offset:2px}
.num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--midnight)}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--midnight); color:var(--sawdust); padding:0 24px}
.top-row{display:flex; align-items:center; gap:12px; min-height:52px; max-width:1240px; margin:0 auto}
.brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.14em; color:var(--orange); font-size:16px; white-space:nowrap}
.place{font-weight:600; font-size:18px; white-space:nowrap}
.right{margin-left:auto; display:flex; align-items:center; gap:8px}
.who{font-size:14px; color:#CFC9B8; white-space:nowrap}
.out{background:var(--midnight2); border:none; color:var(--sawdust); border-radius:8px; padding:6px 12px; font-weight:600; font-size:14px; min-height:36px}
main{max-width:1240px; margin:0 auto; padding:16px 24px 60px}
@media (max-width:560px){ .top{padding:0 12px} main{padding:12px 12px 40px} .who{display:none} .brand{display:none} }
.card{background:#fff; border-radius:10px; padding:14px 16px; margin:0 0 12px}
.card h2{font-size:18px; margin:0 0 8px}
.sub{color:var(--ink2); font-size:15px; margin:0 0 10px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.go{background:var(--orange); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:700; min-height:48px}
.go:disabled{opacity:.5; cursor:default}
.ghost{background:#fff; color:var(--midnight); border:1.5px solid var(--edge); border-radius:10px; padding:8px 14px; font-weight:600; min-height:48px}
.ghost.on{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
select{min-height:48px; border:1.5px solid var(--edge); border-radius:8px; background:#fff; padding:0 10px}
.pick{display:inline-flex; align-items:center; gap:8px}
.pick input[type=file]{max-width:100%}
.banner{border-radius:10px; padding:10px 14px; margin:0 0 12px; font-weight:600; background:var(--sawdust); color:var(--warn); border-left:5px solid var(--bright)}
.note{background:var(--paper); border-radius:8px; padding:8px 12px; font-size:15px; margin-top:10px}
.facts{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:15px; margin-top:8px}

.saved b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.view{position:relative; background:#fff; border-radius:10px; overflow:hidden; margin:0 0 12px}
.stage{position:relative; width:100%; height:min(70vh, 720px); min-height:340px; background:#F4F1EA; touch-action:none}
.stage canvas{display:block; width:100%; height:100%}
.tools{display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; border-top:1px solid var(--line); align-items:center}
.size{position:absolute; left:10px; top:10px; background:rgba(255,255,255,.92); border-radius:8px; padding:6px 10px; font-size:15px; pointer-events:none}

.meas b{font-family:'Barlow Condensed',sans-serif; font-size:24px; color:#fff}

.hint{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); background:rgba(31,42,68,.85); color:#fff; border-radius:99px; padding:4px 12px; font-size:14px; pointer-events:none; white-space:nowrap}
.empty{display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink2); text-align:center; padding:20px}
details.parts{padding:0 12px 10px}
details.parts summary{min-height:40px; display:flex; align-items:center; font-weight:600}
.plist{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 12px; font-size:15px}
.plist label{display:flex; gap:8px; align-items:center; min-height:36px}
.signin{background:#fff; border-radius:10px; padding:16px; max-width:460px; margin:24px auto}
.signin h1{font-size:26px; margin:0 0 4px}
.signin label{display:block; font-weight:600; margin-top:12px}
.signin input{display:block; width:100%; min-height:52px; padding:0 12px; margin-top:4px; border:1.5px solid var(--edge); border-radius:6px; background:#fff}
.signin .go{width:100%; margin-top:16px}
</style>
</head>
<body>
<header class="top"><div class="top-row">
  <span class="brand">PRODUCTION</span><span class="place">STEP viewer · test</span>
  <span class="right" id="right"></span>
</div></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="sf-common-2026-10-05.1.js"></script>
<script>
/* Connection settings, the key check, the device report and the Feedback button are in sf-common-2026-10-05.1.js. */
var PAGE_VERSION = "2026-11-04.1";          // this page's version: bump it with every change (it shows in select * from devices();)

/* ---- core: no screen code in here, so it can be tested on its own ---- */
var StepCore = (function () {
  // the libraries, pinned and checked; loaded only when needed
  const LIBS = {
    three: [
      { src: "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js", integrity: "sha384-vV17nr/rMaJqmeZkFUzXLpHdQ+ME5QHKdydaqqN+3Ga39RJlNrTatJxHwGV4ml2C" },
      { src: "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js", integrity: "sha384-I0DMsfimAPIqWT8lF+oA997gRgdUi3jhidoTq3fN0zmn35smXZukD01FLnsPRU9i" },
    ],
    occt: { src: "https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js", integrity: "sha384-Z8pO9JEhFZF+mvDKxMuLvPT85VP7nly8CqYjBatl0bMeW9OsaKCes4gEUPL4nihc" },
    wasm: { src: "https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.wasm", integrity: "sha384-6BbVZ7iPDgcRszsoavxGz4TaYCwC2EkeYCy1aR9XFwqMZYXDQP+0vZSTP6Yw35iD", bytes: 7604031 },
  };
  // how closely curves are followed, in inches (corners are exact at every setting)
  const DETAIL = {
    normal:   { label: "Normal (curves within 0.005 in)",     linear: 0.005,  angular: 0.2 },
    fine:     { label: "Fine (curves within 0.002 in)",       linear: 0.002,  angular: 0.1 },
    veryfine: { label: "Very fine (curves within 0.0005 in)", linear: 0.0005, angular: 0.05 },
  };
  const VIEW_KIND = "shop-floor-view", VIEW_FORMAT = 1;

  function b64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(s) { const bin = atob(s), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
  function safeName(file) {
    const base = String(file || "").replace(/^.*[\\/]/, "").replace(/\.(step|stp)$/i, "");
    return base.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^[-.]+|[-.]+$/g, "").slice(0, 80) || "design";
  }
  function stamp(d) { const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
  /** 23.875 → { text: "23 7/8", exact: true }: the nearest 64th, and whether it's within half a thousandth */
  function frac(x) {
    const neg = x < 0; x = Math.abs(x);
    let n = Math.round(x * 64), whole = Math.floor(n / 64), r = n % 64, d = 64;
    while (r && r % 2 === 0) { r /= 2; d /= 2; }
    const text = (neg ? "-" : "") + (whole || !r ? String(whole) : "") + (r ? `${whole ? " " : ""}${r}/${d}` : "");
    return { text, exact: Math.abs(x - n / 64) < 0.0005 };
  }
  function fmtIn(x) { const f = frac(x); return `${x.toFixed(3)} in (${f.exact ? "" : "≈ "}${f.text}")`; }
  /** A face's outline: the edges of its triangles used once. Vertices are never shared between faces, so these are
   *  the shape's true edges. index: triangle corners; faces: [{first, last}] triangle ranges. Returns pairs. */
  function boundaryEdges(index, faces) {
    const out = [];
    for (const f of faces) {
      const seen = new Map();
      for (let t = f.first; t <= f.last; t++) for (let k = 0; k < 3; k++) {
        const a = index[t * 3 + k], b = index[t * 3 + (k + 1) % 3], key = a < b ? a * 4294967296 + b : b * 4294967296 + a;
        seen.set(key, (seen.get(key) || 0) + 1);
      }
      for (const [key, n] of seen) if (n === 1) out.push(Math.floor(key / 4294967296), key % 4294967296);
    }
    return new Uint32Array(out);
  }
  /** occt-import-js's result → a view file (plain object). Normals are left out: the tablet works them out. */
  function buildView(result, meta) {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity], parts = [], names = new Map();
    for (const m of result.meshes || []) {
      const pos = new Float32Array(m.attributes.position.array), idx = new Uint32Array(m.index.array);
      if (!idx.length) continue;
      for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) { if (pos[i + k] < min[k]) min[k] = pos[i + k]; if (pos[i + k] > max[k]) max[k] = pos[i + k]; }
      let name = (m.name || "").trim() || "Part";
      const n = (names.get(name) || 0) + 1; names.set(name, n); if (n > 1) name = `${name} (${n})`;
      const faces = (m.brep_faces || []).map(f => ({ first: f.first, last: f.last }));
      parts.push({ name, color: Array.isArray(m.color) ? m.color.map(c => Math.round(c * 1000) / 1000) : null,
        pos: b64(new Uint8Array(pos.buffer)), idx: b64(new Uint8Array(idx.buffer)),
        edges: b64(new Uint8Array(boundaryEdges(idx, faces).buffer)), faces: faces.length, triangles: idx.length / 3 });
    }
    if (!parts.length) throw new Error("There's no shape in that file: it may point to other files for its parts, or hold only a drawing. Export the whole piece as one STEP file.");
    return { kind: VIEW_KIND, format: VIEW_FORMAT, units: "in", up: meta.up || "y", name: meta.name, made_at: meta.made_at,
      source: { file: meta.file, bytes: meta.bytes }, detail: meta.detail, convert_ms: meta.convert_ms,
      min, max, size: max.map((v, k) => v - min[k]), parts };
  }
  /** a view file's parts as typed arrays, after checking it's one */
  function readView(v) {
    if (!v || v.kind !== VIEW_KIND) throw new Error("That isn't a view file.");
    if (v.format > VIEW_FORMAT) throw new Error("That view file was made by a newer page than this one. Reload the page.");
    return { ...v, parts: v.parts.map(p => ({ ...p,
      pos: new Float32Array(unb64(p.pos).buffer), idx: new Uint32Array(unb64(p.idx).buffer), edges: new Uint32Array(unb64(p.edges).buffer) })) };
  }
  async function gzip(text) { return await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"))).blob(); }
  async function gunzip(blob) { return await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
  return { LIBS, DETAIL, VIEW_KIND, b64, unb64, safeName, stamp, frac, fmtIn, boundaryEdges, buildView, readView, gzip, gunzip };
})();

/* ---- the screen ---- */
(function () {
  const C = StepCore;
  const app = document.getElementById("app"), right = document.getElementById("right");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtBytes = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
  const secs = (ms) => ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`;
  const problem = keyProblem(SUPABASE_URL, SUPABASE_KEY);
  if (problem) { app.innerHTML = `<div class="banner">${problem.secret ? "Stop — wrong key in this file" : "This page isn't set up yet"}: ${esc(problem.text)}</div>`; return; }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sfReportDevice(db, "step", PAGE_VERSION);

  const S = { user: null, manager: false, detail: "fine", up: "y", saved: null, savedErr: "", busy: "", msg: "", err: "",
              view: null, viewFrom: "", raw: null, gz: null, measuring: false, pts: [], openMs: 0 };

  // ---------- loading the libraries (once, checked) ----------
  const loaded = new Map();
  function script(lib) {
    if (!loaded.has(lib.src)) loaded.set(lib.src, new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = lib.src; s.integrity = lib.integrity; s.crossOrigin = "anonymous";
      s.onload = res; s.onerror = () => rej(new Error("A part of the viewer couldn't be loaded. Check the internet connection and reload.")); document.head.appendChild(s);
    }));
    return loaded.get(lib.src);
  }
  async function needThree() { for (const l of C.LIBS.three) await script(l); }
  let occtReady = null;
  function needOcct() {
    if (!occtReady) occtReady = (async () => {
      await script(C.LIBS.occt);
      const r = await fetch(C.LIBS.wasm.src, { integrity: C.LIBS.wasm.integrity, mode: "cors" });
      if (!r.ok) throw new Error("The STEP engine couldn't be downloaded. Check the internet connection and try again.");
      return await window.occtimportjs({ wasmBinary: await r.arrayBuffer() });
    })().catch(e => { occtReady = null; throw e; });
    return occtReady;
  }

  // ---------- the 3D view ----------
  const V = { ready: false };
  const BRAND = { part: 0xC9C2B0, edge: 0x1F2A44, mark: 0xE8772E };
  function setupStage() {
    const T = window.THREE, el = document.getElementById("stage");
    if (!el) return;
    if (!V.ready) {
      V.renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      V.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      V.scene = new T.Scene(); V.scene.background = new T.Color(0xF4F1EA);
      V.camera = new T.PerspectiveCamera(40, 1, 0.01, 100000);
      V.scene.add(new T.HemisphereLight(0xffffff, 0x8a8478, 0.9));
      const sun = new T.DirectionalLight(0xffffff, 0.7); sun.position.set(1, 2, 1.5); V.camera.add(sun); V.scene.add(V.camera);
      V.controls = new T.OrbitControls(V.camera, V.renderer.domElement);
      V.controls.enableDamping = false; V.controls.addEventListener("change", draw);
      V.raycaster = new T.Raycaster();
      V.ready = true;
      const c = V.renderer.domElement;
      let down = null;
      c.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: Date.now(), n: (down && Date.now() - down.t < 300) ? 2 : 1 }; });
      c.addEventListener("pointerup", (e) => { if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
        if (moved < 8 && Date.now() - down.t < 450 && S.measuring) tap(e.clientX, e.clientY); });
      window.addEventListener("resize", () => { size(); draw(); });
    }
    el.prepend(V.renderer.domElement);
    size();
  }
  function size() { const el = document.getElementById("stage"); if (!el || !V.ready) return;
    const w = el.clientWidth, h = el.clientHeight; V.renderer.setSize(w, h, false); V.camera.aspect = w / Math.max(1, h); V.camera.updateProjectionMatrix(); }
  function draw() { if (!V.ready || !V.model) return; V.renderer.render(V.scene, V.camera); placeTags(); }
  function showModel(view) {
    const T = window.THREE;
    if (V.model) { V.scene.remove(V.model); V.model.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
    V.model = new T.Group(); V.parts = [];
    for (const p of view.parts) {
      const g = new T.BufferGeometry();
      g.setAttribute("position", new T.BufferAttribute(p.pos, 3)); g.setIndex(new T.BufferAttribute(p.idx, 1)); g.computeVertexNormals();
      const color = p.color ? new T.Color(p.color[0], p.color[1], p.color[2]) : new T.Color(BRAND.part);
      const mesh = new T.Mesh(g, new T.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
      const eg = new T.BufferGeometry(); eg.setAttribute("position", g.getAttribute("position")); eg.setIndex(new T.BufferAttribute(p.edges, 1));
      const lines = new T.LineSegments(eg, new T.LineBasicMaterial({ color: BRAND.edge }));
      const grp = new T.Group(); grp.add(mesh); grp.add(lines); grp.userData.part = p; V.model.add(grp);
      V.parts.push({ name: p.name, grp, mesh, corners: [...new Set(p.edges)] });
    }
    // which way is up: three.js draws Y up
    V.model.rotation.set(0, 0, 0);
    if (S.up === "z") V.model.rotation.x = -Math.PI / 2; else if (S.up === "x") V.model.rotation.z = Math.PI / 2;
    V.scene.add(V.model); V.model.updateMatrixWorld(true);
    clearMeasure(); frame();
  }
  function frame() {
    const T = window.THREE, box = new T.Box3().setFromObject(V.model), c = box.getCenter(new T.Vector3()), r = box.getSize(new T.Vector3()).length() / 2 || 1;
    V.radius = r; V.controls.target.copy(c);
    const fit = r / Math.sin(V.camera.fov * Math.PI / 360) * 1.1 / Math.min(1, V.camera.aspect);   // the whole shape in view, with a margin
    V.camera.position.copy(c).add(new T.Vector3(1, 0.8, 1.4).normalize().multiplyScalar(fit));
    V.camera.near = r / 1000; V.camera.far = r * 100; V.camera.updateProjectionMatrix(); V.controls.update(); draw();
  }
  /** screen position (page pixels) of a point in the model's own inches */
  function screenOf(p) { const T = window.THREE, v = new T.Vector3(p[0], p[1], p[2]).applyMatrix4(V.model.matrixWorld).project(V.camera);
    const r = V.renderer.domElement.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height, z: v.z }; }
  function tap(cx, cy) {
    const T = window.THREE, el = V.renderer.domElement, r = el.getBoundingClientRect(), shown = V.parts.filter(p => p.grp.visible);
    V.raycaster.setFromCamera(new T.Vector2((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), V.camera);
    const hit = V.raycaster.intersectObjects(shown.map(p => p.mesh), false)[0];
    // the nearest corner or edge point within reach of the finger, on the tapped part first; one hidden behind the
    // surface that was tapped doesn't count. A tap just off the model's edge still finds the corner it was meant for.
    const eye = V.camera.position, inv = new T.Matrix4().copy(V.model.matrixWorld).invert();
    const far = hit ? hit.distance + V.radius * 0.02 : Infinity;
    const nearest = (parts) => {
      let best = null, bestD = 30;
      for (const part of parts) {
        const pos = part.mesh.geometry.getAttribute("position");
        for (const i of part.corners) {
          const p = [pos.getX(i), pos.getY(i), pos.getZ(i)], s = screenOf(p), d = Math.hypot(s.x - cx, s.y - cy);
          if (d >= bestD || s.z >= 1) continue;
          if (new T.Vector3(p[0], p[1], p[2]).applyMatrix4(V.model.matrixWorld).distanceTo(eye) > far) continue;
          bestD = d; best = p;
        }
      }
      return best;
    };
    const tapped = hit && V.parts.find(p => p.mesh === hit.object);
    const best = (tapped && nearest([tapped])) || nearest(shown);
    if (best) return addPoint(best, false);
    if (hit) { const local = hit.point.clone().applyMatrix4(inv); addPoint([local.x, local.y, local.z], true); }
  }
  function addPoint(p, loose) {
    if (S.pts.length >= 2) clearMeasure();
    S.pts.push({ p, loose });
    const T = window.THREE, dot = new T.Mesh(new T.SphereGeometry(V.radius * 0.012, 16, 12), new T.MeshBasicMaterial({ color: BRAND.mark, depthTest: false }));
    dot.position.set(p[0], p[1], p[2]); dot.renderOrder = 10; V.model.add(dot); (V.marks = V.marks || []).push(dot);
    if (S.pts.length === 2) {
      const g = new T.BufferGeometry().setFromPoints(S.pts.map(x => new T.Vector3(x.p[0], x.p[1], x.p[2])));
      const line = new T.Line(g, new T.LineBasicMaterial({ color: BRAND.mark, depthTest: false })); line.renderOrder = 10; V.model.add(line); V.marks.push(line);
    }
    draw(); paintMeasure();
  }
  function clearMeasure() { for (const m of V.marks || []) { V.model && V.model.remove(m); if (m.geometry) m.geometry.dispose(); } V.marks = []; S.pts = []; paintMeasure(); draw(); }
  function measured() {
    if (S.pts.length < 2) return null;
    const [a, b] = S.pts, d = [0, 1, 2].map(k => b.p[k] - a.p[k]);
    return { dist: Math.hypot(d[0], d[1], d[2]), d, loose: a.loose || b.loose };
  }
  function placeTags() {
    const tag = document.getElementById("tag"), m = measured();
    if (!tag) return;
    if (!m) { tag.hidden = true; return; }
    const mid = [0, 1, 2].map(k => (S.pts[0].p[k] + S.pts[1].p[k]) / 2), s = screenOf(mid), r = V.renderer.domElement.getBoundingClientRect();
    tag.hidden = false; tag.textContent = `${m.dist.toFixed(3)}"`; tag.style.left = `${s.x - r.left}px`; tag.style.top = `${s.y - r.top}px`;
  }
  function paintMeasure() {
    const box = document.getElementById("meas"), hint = document.getElementById("hint"), m = measured();
    if (hint) { hint.hidden = !S.measuring; hint.textContent = S.pts.length === 1 ? "Now tap the second point" : "Tap a corner or edge to start measuring"; }
    if (!box) return;
    if (!m) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<b class="num">${esc(C.fmtIn(m.dist))}</b><br>across X ${Math.abs(m.d[0]).toFixed(3)} · Y ${Math.abs(m.d[1]).toFixed(3)} · Z ${Math.abs(m.d[2]).toFixed(3)} in${m.loose ? `<br><small>A point wasn't on a corner or edge, so this is approximate.</small>` : ""}`;
    placeTags();
  }

  // ---------- the screens ----------
  function viewer() {
    const v = S.view;
    if (!v) return `<section class="view"><div class="stage" id="stage"><div class="empty">Open a saved design, or convert a STEP file, to see it here.</div></div></section>`;
    const sz = v.size;
    return `<section class="view">
      <div class="stage" id="stage">
        <div class="size">Overall <b class="num">${sz.map(x => x.toFixed(3)).join(" × ")}</b> in<br><small>X × Y × Z · ${esc(v.name)}</small></div>
        <div class="meas" id="meas" hidden></div><div class="tag" id="tag" hidden></div><div class="hint" id="hint" hidden></div>
      </div>
      <div class="tools">
        <button class="ghost ${S.measuring ? "on" : ""}" data-measure="1">${S.measuring ? "Measuring" : "Measure"}</button>
        <button class="ghost" data-clear="1">Clear</button>
        <button class="ghost" data-reset="1">Reset view</button>
        <label class="pick">Up <select id="up" aria-label="Which way is up">${["y", "z", "x"].map(a => `<option value="${a}" ${S.up === a ? "selected" : ""}>${a.toUpperCase()}</option>`).join("")}</select></label>
        <span class="sub" style="margin:0">One finger turns it; two fingers zoom and slide.</span>
      </div>
      <details class="parts"><summary>Parts (${v.parts.length})</summary><div class="plist">${v.parts.map((p, i) =>
        `<label><input type="checkbox" data-part="${i}" ${p.hidden ? "" : "checked"}> ${esc(p.name)}</label>`).join("")}</div></details>
      <div class="note">${esc(S.viewFrom)}</div>
    </section>`;
  }
  function render() {
    const conv = S.raw;
    app.innerHTML = `
      ${S.err ? `<div class="banner">${esc(S.err)}</div>` : ""}
      ${S.msg ? `<div class="banner" style="color:var(--midnight)">${esc(S.msg)}</div>` : ""}
      <section class="card"><h2>Saved designs</h2>
        ${S.saved === null ? `<p class="sub">Loading…</p>` : S.savedErr ? `<p class="sub">${esc(S.savedErr)}</p>` : !S.saved.length
          ? `<p class="sub">Nothing saved yet. Convert a STEP file on the PC below, and a manager saves it for the tablets.</p>`
          : `<div class="list">${S.saved.map(f => `<button class="saved" data-open="${esc(f.name)}"><b>${esc(f.label)}</b>
              <small>${esc(f.when)} · ${esc(fmtBytes(f.bytes))}</small><span class="act">Open</span></button>`).join("")}</div>`}
      </section>
      ${viewer()}
      <section class="card"><h2>Convert a STEP file</h2>
        <p class="sub">Best on the PC. The first time, the STEP engine downloads (${fmtBytes(C.LIBS.wasm.bytes)}); after that it's kept.</p>
        <div class="row">
          <label class="pick"><input type="file" id="file" accept=".step,.stp,.STEP,.STP" ${S.busy ? "disabled" : ""}></label>
          <select id="detail" aria-label="Detail">${Object.entries(C.DETAIL).map(([k, d]) => `<option value="${k}" ${S.detail === k ? "selected" : ""}>${esc(d.label)}</option>`).join("")}</select>
        </div>
        ${S.busy ? `<p class="note">${esc(S.busy)}</p>` : ""}
        ${conv ? `<div class="facts">
            <span>Converted in <b>${esc(secs(conv.convert_ms))}</b></span>
            <span><b>${conv.parts}</b> part${conv.parts === 1 ? "" : "s"}, <b>${conv.faces}</b> faces, <b>${conv.triangles.toLocaleString()}</b> triangles</span>
            <span>STEP <b>${esc(fmtBytes(conv.step_bytes))}</b> → view file <b>${esc(fmtBytes(conv.gz_bytes))}</b></span></div>
          ${S.manager ? `<div class="row" style="margin-top:10px"><button class="go" data-save="1" ${S.busy || conv.saved ? "disabled" : ""}>${conv.saved ? "Saved for the tablets" : "Save for the tablets"}</button>
            <span class="sub" style="margin:0">Saves the way up you've chosen.</span></div>`
          : `<p class="sub" style="margin-top:10px">Only a manager's login saves view files for the tablets.</p>`}` : ""}
      </section>`;
    on();
    if (S.view && window.THREE) { setupStage(); draw(); paintMeasure(); }
  }
  function on() {
    const q = (s) => app.querySelectorAll(s);
    q("[data-open]").forEach(b => b.onclick = () => openSaved(b.dataset.open));
    const f = document.getElementById("file"); if (f) f.onchange = () => f.files[0] && convert(f.files[0]);
    const d = document.getElementById("detail"); if (d) d.onchange = () => { S.detail = d.value; };
    q("[data-save]").forEach(b => b.onclick = save);
    q("[data-measure]").forEach(b => b.onclick = () => { S.measuring = !S.measuring; render(); });
    q("[data-clear]").forEach(b => b.onclick = () => { clearMeasure(); });
    q("[data-reset]").forEach(b => b.onclick = () => frame());
    const up = document.getElementById("up"); if (up) up.onchange = () => { S.up = up.value; if (S.view) S.view.up = S.up; if (S.raw) S.raw.saved = false; showModel(S.view); render(); };
    q("[data-part]").forEach(b => b.onchange = () => { const p = S.view.parts[+b.dataset.part]; p.hidden = !b.checked; V.parts[+b.dataset.part].grp.visible = b.checked; clearMeasure(); draw(); });
  }

  // ---------- converting, saving, opening ----------
  async function convert(file) {
    S.err = ""; S.msg = ""; S.raw = null;
    try {
      S.busy = "Loading the STEP engine…"; render();
      const [occt] = await Promise.all([needOcct(), needThree()]);
      S.busy = `Converting ${file.name}… the page may pause for a few seconds.`; render();
      await new Promise(r => setTimeout(r, 60));
      const bytes = new Uint8Array(await file.arrayBuffer()), d = C.DETAIL[S.detail] || C.DETAIL.fine, t0 = performance.now();
      const result = occt.ReadStepFile(bytes, { linearUnit: "inch", linearDeflectionType: "absolute_value", linearDeflection: d.linear, angularDeflection: d.angular });
      const ms = Math.round(performance.now() - t0);
      if (!result || !result.success) throw new Error("That file couldn't be read as a STEP file. Export it again from Fusion as STEP and try once more.");
      const view = C.buildView(result, { name: C.safeName(file.name), file: file.name, bytes: bytes.length, detail: S.detail, convert_ms: ms, up: S.up, made_at: new Date().toISOString() });
      const gz = await C.gzip(JSON.stringify(view));
      S.raw = { convert_ms: ms, parts: view.parts.length, faces: view.parts.reduce((a, p) => a + p.faces, 0), triangles: view.parts.reduce((a, p) => a + p.triangles, 0),
                step_bytes: bytes.length, gz_bytes: gz.size, saved: false, json: view };
      S.view = C.readView(view); S.viewFrom = `Converted here from ${file.name} (${C.DETAIL[S.detail].label.toLowerCase()}).`;
      S.busy = ""; render(); showModel(S.view); render();
    } catch (e) { S.busy = ""; S.err = e && e.message ? e.message : String(e); render(); }
  }
  async function save() {
    if (!S.raw) return;
    S.err = ""; S.busy = "Saving…"; render();
    try {
      const view = { ...S.raw.json, up: S.up }, gz = await C.gzip(JSON.stringify(view));
      const path = `test/${C.stamp(new Date())}-${view.name}.view.json.gz`;
      // typed, as supabase-js sends a Blob as its own type and the designs bucket takes gzip only (2 Nov)
      const { error } = await db.storage.from("designs").upload(path, new Blob([gz], { type: "application/gzip" }), { contentType: "application/gzip", upsert: false });
      if (error) throw error;
      S.raw.saved = true; S.busy = ""; S.msg = `Saved for the tablets: ${view.name}. Open it from Saved designs on a tablet.`;
      await loadSaved(); render();
    } catch (e) {
      S.busy = "";
      S.err = /row-level|permission|not allowed|security/i.test(String(e && e.message)) ? "Only a manager's login can save view files. Nothing was saved."
            : /bucket/i.test(String(e && e.message)) ? "The designs storage isn't set up yet: run designs.sql in Supabase (Walkthrough 42)." : `Couldn't save: ${e && e.message ? e.message : e}`;
      render();
    }
  }
  async function loadSaved() {
    const { data, error } = await db.storage.from("designs").list("test", { limit: 100, sortBy: { column: "name", order: "desc" } });
    if (error) { S.saved = []; S.savedErr = /bucket/i.test(String(error.message)) ? "The designs storage isn't set up yet: run designs.sql in Supabase (Walkthrough 42)." : `Couldn't list the saved designs: ${error.message}`; return; }
    S.savedErr = "";
    S.saved = (data || []).filter(f => /\.view\.json\.gz$/.test(f.name)).map(f => {
      const m = f.name.match(/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)\d\d-(.+)\.view\.json\.gz$/);
      return { name: f.name, label: m ? m[6] : f.name, when: m ? `${+m[2]}/${+m[3]}/${m[1]} ${m[4]}:${m[5]}` : "", bytes: (f.metadata && f.metadata.size) || 0 };
    });
  }
  async function openSaved(name) {
    S.err = ""; S.msg = ""; S.busy = ""; S.raw = null;
    const t0 = performance.now();
    try {
      app.querySelector(`[data-open="${CSS.escape(name)}"] .act`).textContent = "Opening…";
      const [{ data, error }] = await Promise.all([db.storage.from("designs").download(`test/${name}`), needThree()]);
      if (error) throw error;
      const v = C.readView(JSON.parse(await C.gunzip(data)));
      S.up = v.up || "y"; S.view = v; S.openMs = Math.round(performance.now() - t0);
      S.viewFrom = `Opened in ${secs(S.openMs)} (${fmtBytes(data.size)}). Made from ${v.source.file} (${fmtBytes(v.source.bytes)}), converted in ${secs(v.convert_ms)} at ${(C.DETAIL[v.detail] || C.DETAIL.fine).label.toLowerCase()}.`;
      render(); showModel(S.view); render();
    } catch (e) { S.err = `Couldn't open that design: ${e && e.message ? e.message : e}`; render(); }
  }

  async function start(user) {
    S.user = user;
    right.innerHTML = `<span class="who">${esc(user.email || "")}</span><button class="out" id="out">Sign out</button>`;
    document.getElementById("out").onclick = async () => { await db.auth.signOut(); location.reload(); };
    const r = await Promise.resolve(db.rpc("my_role")).catch(() => ({ data: null }));
    S.manager = r && (r.data === "manager" || r.data === "admin");
    render(); await loadSaved(); render();
  }
  window.__step = { S, V, C, screenOf: (p) => screenOf(p), measured, frame };      // for the tests
  (async () => {
    const { data } = await db.auth.getSession();
    if (data && data.session) return start(data.session.user);
    app.innerHTML = `<form class="signin" id="f"><h1>STEP viewer</h1><p class="sub">Sign in with your shop login.</p>
      <label>Email<input id="e" type="email" autocomplete="username" required></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
      <button class="go" type="submit">Sign in</button><div id="err" class="banner" hidden></div></form>`;
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      if (r.error) { const el = document.getElementById("err"); el.hidden = false; el.textContent = /invalid/i.test(r.error.message || "") ? "That email and password don't match. Try again." : (r.error.message || "Couldn't sign in."); return; }
      start(r.data.user);
    };
  })();
})();
</script>
</body>
</html>
