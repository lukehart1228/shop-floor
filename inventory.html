<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181D2E">
<title>Inventory · Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#181D2E; --orange:#ED5E0F; --bright:#F0A721; --teal:#00B4B2;
    --teal-ink:#00807E; --teal-bg:#DDF2F1; --sawdust:#FFF4D5; --gray:#C2BAA0;
    --paper:#EFEDE6; --line:#E4DFCF; --ink2:#6B7082; --warn:#8A4B00;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--midnight);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; line-height:1.45}
  button,input,select{font:inherit; color:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bright); outline-offset:2px}
  [hidden]{display:none!important}
  .num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums}
  header{background:var(--midnight); color:var(--sawdust); padding:0 16px; position:sticky; top:0; z-index:10}
  .hrow{display:flex; align-items:center; gap:14px; min-height:52px; flex-wrap:wrap}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.14em; color:var(--orange); white-space:nowrap}
  header h1{margin:0; font-size:19px; font-weight:600}
  .me{margin-left:auto; color:var(--gray); font-size:15px; white-space:nowrap}
  .me a,.me button{color:var(--sawdust); background:none; border:none; padding:0; text-decoration:underline; font-weight:500}
  nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
  nav.tabs button{background:none; border:none; color:#9AA0B4; padding:0 12px; min-height:48px; font-weight:600; white-space:nowrap;
                  border-bottom:4px solid transparent; border-radius:0}
  nav.tabs button[aria-current="true"]{color:var(--sawdust); border-bottom-color:var(--orange)}
  nav.tabs .badge{display:inline-grid; place-items:center; min-width:20px; height:20px; border-radius:99px; background:var(--orange); color:#fff; font-size:13px; margin-left:6px; padding:0 5px}
  main{max-width:1060px; margin:0 auto; padding:16px 14px 90px}
  h2{font-size:25px; margin:4px 2px 2px}
  h3{font-size:17px; color:var(--ink2); margin:24px 2px 10px}
  .sub{color:var(--ink2); margin:0 2px 16px}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .btn{background:var(--midnight); color:var(--sawdust); border:none; border-radius:10px; padding:10px 18px; font-weight:700; min-height:46px}
  .btn.ghost{background:#fff; color:var(--midnight); border:1px solid var(--gray)}
  .btn.or{background:var(--orange); color:#fff}
  .btn:disabled{opacity:.4; cursor:default}
  .link{background:none; border:none; color:var(--orange); font-weight:700; padding:6px 2px}
  .muted{color:var(--ink2)} .small{font-size:14px}
  .banner{border-radius:10px; padding:12px 16px; margin-bottom:14px; font-weight:600; background:var(--sawdust); color:var(--warn); border-left:5px solid var(--bright)}
  .banner.ok{background:var(--teal-bg); color:var(--teal-ink); border-left-color:var(--teal)}
  .banner small{display:block; font-weight:500}
  .alarm{background:var(--midnight); color:var(--sawdust); border-radius:12px; padding:20px}
  .alarm h2{color:var(--bright)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .stat.done{background:var(--teal-bg); border-color:transparent}
  .stat .t{font-weight:700; font-size:19px}
  .stat .o{color:var(--ink2); font-size:14px}
  .stat .s{margin-top:10px; font-weight:600}
  .stat.done .s{color:var(--teal-ink)}
  .stat.off{background:transparent}
  .step{display:flex; gap:10px; align-items:baseline; padding:6px 0}
  .step .mk{font-weight:700; color:var(--ink2); width:18px}
  .step.ok .mk{color:var(--teal-ink)}
  /* lumber */
  .spec{background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden}
  .spec>summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px; padding:14px 16px; flex-wrap:wrap}
  .spec>summary::-webkit-details-marker{display:none}
  .spec>summary .nm{font-weight:700; font-size:19px; flex:1 1 200px}
  .spec>summary .bf{font-size:24px; font-weight:700}
  .spec>summary .was{color:var(--ink2); font-size:14px; white-space:nowrap}
  .spec>summary .chev{color:var(--ink2); transition:transform .15s}
  .spec[open]>summary .chev{transform:rotate(90deg)}
  .lens{padding:0 16px 14px}
  .len{border-top:1px solid var(--line); padding:12px 0}
  .lenhead{display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap}
  .lenhead b{font-size:18px}
  .lenhead .tot{margin-left:auto; color:var(--ink2); white-space:nowrap}
  .lenhead .tot b{color:var(--midnight); font-size:17px}
  .bundle{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0}
  .bundle .lbl{width:78px; color:var(--ink2); font-size:14px}
  .bundle input{width:78px; min-height:44px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; font-size:20px; text-align:right; background:#fff}
  .q{display:flex; gap:4px}
  .q button{min-width:44px; min-height:44px; border:1px solid var(--gray); background:#fff; border-radius:8px; font-weight:700}
  .q button[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .bundle .x{background:none; border:none; color:var(--ink2); font-size:14px; text-decoration:underline}
  .addrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .addrow input,.addrow select{min-height:44px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; background:#fff}
  .saving{font-size:14px; color:var(--ink2)}
  /* tables */
  .tw{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:12px}
  table{border-collapse:collapse; width:100%; min-width:640px}
  th,td{padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:14px; color:var(--ink2); font-weight:700; background:#fff}
  th:first-child,td:first-child,.l{text-align:left}
  tr.subtot td{font-weight:700; background:var(--paper)}
  tr.grand td{font-weight:700; font-size:18px}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--paper)}
  tr.mistake td{color:var(--ink2); text-decoration:line-through}
  .rate{font-size:20px; font-weight:700}
  .flag{display:inline-block; font-size:13px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--bright); color:var(--midnight)}
  .flag.o{background:var(--orange); color:#fff}
  .tag{display:inline-block; font-size:12px; font-weight:700; padding:2px 7px; border-radius:5px; border:1.5px solid var(--ink2); color:var(--ink2)}
  /* roll-over / rows */
  .ro{display:flex; gap:14px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .ro:last-child{border-bottom:none}
  .ro .w{flex:1 1 300px; min-width:0}
  .ro .w b{margin-right:8px}
  .ro .bfv{white-space:nowrap; text-align:right}
  .ro .bfv b{font-size:20px}
  .ro label.tick{display:flex; align-items:center; gap:8px; font-weight:600; min-height:44px; white-space:nowrap}
  .ro input[type=checkbox]{width:26px; height:26px; accent-color:var(--midnight)}
  .ro.rolled{background:var(--paper)}
  .ro.rolled .bfv{text-decoration:line-through; color:var(--ink2)}
  .note{font-size:14px; color:var(--ink2)}
  .form{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; align-items:end}
  .form label{display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--ink2); font-weight:600}
  .form input,.form select{min-height:46px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; background:#fff; font-size:17px}
  select.pick{min-height:44px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; background:#fff; max-width:100%}
  input.price{width:110px; min-height:40px; border:1px solid var(--gray); border-radius:8px; padding:4px 8px; text-align:right}
  .monthpick{display:flex; gap:8px; align-items:center; margin:0 2px 14px; flex-wrap:wrap}
  .drawer{position:fixed; inset:0; z-index:40; background:rgba(24,29,46,.35); display:flex; justify-content:flex-end}
  .drawer .pane{background:#fff; width:min(620px,100%); height:100%; overflow:auto; padding:18px 18px 40px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--midnight); color:var(--sawdust); padding:12px 20px; border-radius:10px; font-weight:600; z-index:60; max-width:90vw}
  /* department counts: laid out like the tablet's Inventory tab */
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:0 2px 14px}
  .seg button{background:#fff; border:1px solid var(--gray); border-radius:10px; padding:8px 14px; min-height:46px; font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .seg button .mk{margin-left:6px; font-weight:700}
  .seg button .mk.ok{color:var(--teal)}
  .invlist{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px}
  .invgroup{background:var(--paper); font-weight:700; color:var(--ink2); padding:8px 16px; font-size:14px; text-transform:uppercase; letter-spacing:.04em}
  .invitem{display:flex; align-items:center; gap:8px; padding:10px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
  .invgroup+.invitem{border-top:none}
  .invitem .nm{flex:1 1 240px; font-weight:600}
  .invitem .nm small{display:block; font-weight:500; color:var(--ink2); font-size:14px}
  .invitem input{width:92px; min-height:46px; border:1px solid var(--gray); border-radius:8px; padding:6px 10px; font-size:20px; text-align:right; background:#fff}
  .invitem input:disabled{background:var(--paper); color:var(--midnight); opacity:1}
  .invitem .u{color:var(--ink2); font-size:14px; min-width:40px}
  .invitem .eq{color:var(--ink2); font-size:14px; min-width:70px}
  .invbar{position:sticky; bottom:0; background:var(--paper); display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 2px}
  .invbar .invcount{flex:1; font-weight:600}
  /* 10 Nov: two tabs, a Setup button, the month-end steps, screens of their own */
  nav.tabs{align-items:center}
  nav.tabs .sp{flex:1 1 auto}
  nav.tabs .back{display:inline-flex; align-items:center; gap:6px; background:none; border:1px solid #4A5068; color:var(--sawdust); border-radius:10px;
                 padding:0 14px; min-height:40px; margin:4px 0; font-weight:600; white-space:nowrap}
  nav.tabs .back .badge{margin-left:4px}
  nav.tabs .ttl{font-weight:700; font-size:18px; color:var(--sawdust); padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  nav.tabs .saving{margin-left:auto; color:var(--gray); white-space:nowrap; padding-left:8px}
  .sec{font-size:14px; color:var(--ink2); margin:22px 2px 8px; text-transform:uppercase; letter-spacing:.05em; font-weight:700}
  .sechead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:22px 2px 8px}
  .sechead .sec{margin:0; flex:1 1 auto}
  .steps{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px}
  .steps>*+*{border-top:1px solid var(--line)}
  .srow{display:flex; align-items:center; gap:14px; padding:14px 16px; width:100%; background:none; border:none; text-align:left;
        min-height:68px; cursor:pointer; color:inherit; list-style:none; flex-wrap:wrap}
  summary.srow::-webkit-details-marker{display:none}
  .srow.done{background:var(--teal-bg)}
  .srow .tx{flex:1 1 220px; min-width:0}
  .srow .tt{display:block; font-weight:700; font-size:19px}
  .srow .ss{display:block; color:var(--ink2); font-size:15px}
  .srow.done .ss{color:var(--teal-ink); font-weight:600}
  .srow .big{font-size:26px; font-weight:700; white-space:nowrap}
  .srow .chev{color:var(--ink2); flex:none; transition:transform .15s}
  details[open]>summary .chev{transform:rotate(90deg)}
  .circ{width:32px; height:32px; border-radius:99px; border:2px solid var(--gray); display:grid; place-items:center; flex:none;
        font-family:'Barlow Condensed',sans-serif; font-weight:700; color:var(--ink2)}
  .circ.ok{background:var(--teal); border-color:var(--teal); color:var(--midnight)}
  .fbody{padding:0 16px 12px 62px}
  .fbody.flat{padding:4px 16px 14px}
  .fbody.flush{padding:0}
  .fbody .rointro{margin:0; padding:10px 14px; border-top:1px solid var(--line)}
  .fbody.flush .ro{border-top:1px solid var(--line); border-bottom:none}
  .ro.robar{background:var(--paper)}
  .subrow{display:flex; gap:14px; align-items:center; padding:6px 0; border-top:1px solid var(--line); flex-wrap:wrap; min-height:56px}
  .subrow .nm{flex:0 0 150px; font-weight:700}
  .subrow .nm small{display:block; font-weight:500; color:var(--ink2); font-size:14px}
  .subrow .st{flex:1 1 220px; font-weight:600}
  .subrow.ok .st{color:var(--teal-ink)}
  .subrow.off .st,.subrow.off .nm{color:var(--ink2)}
  .slipform{margin-top:6px}
  .closebar{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .closebar .note{flex:1 1 300px}
  .lumtop{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .lumtot{font-size:30px; font-weight:700; white-space:nowrap}
  .resbar{margin:4px 2px 14px}
  .resbar .btn{display:inline-flex; align-items:center; gap:8px}
  select.pick.big{font-size:20px; font-weight:700; min-height:46px}
  .kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:12px}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px}
  .kpi .kt{color:var(--ink2); font-weight:600}
  .kpi .n{font-size:46px; font-weight:700; line-height:1.1}
  details.more{margin-top:8px}
  details.more>summary{list-style:none; cursor:pointer; display:inline-block; min-height:44px; padding:10px 2px}
  details.more>summary::-webkit-details-marker{display:none}
  @media (max-width:700px){ .fbody{padding-left:16px} .subrow .nm{flex-basis:100%} }
  @media (max-width:700px){ .brand{display:none} h2{font-size:22px} .bundle .lbl{width:100%} }
</style>
</head>
<body>
<header>
  <div class="hrow"><div class="brand">PURPOSEFUL</div><h1>Inventory</h1><div class="me" id="me"></div></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<div id="app"></div>

<!-- the Supabase library, checked: the browser refuses it if even one byte differs from the published file -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="sf-common-2026-10-05.1.js"></script>
<script>
/* The two settings (project address, publishable key), the key check, the connection test, the id maker and the
   Feedback button are in the shared file loaded above, sf-common-2026-10-05.1.js. */
var PAGE_VERSION = "2026-11-10.1";          // this page's version: bump it with every change (it shows in select * from devices();)


/* ---- core: no screen code in here, so it can be tested on its own ---- */

const ROW_W = 42;
function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. What you typed is kept on this computer and sends when the connection is back.";
  if (/invalid login credentials/i.test(m)) return "That email and password didn't match. Check them and try again.";
  if (/jwt expired|refresh token/i.test(m)) return "The sign-in has expired. Sign out and back in.";
  if (/could not find the function|schema cache|does not exist/i.test(m)) return "Inventory isn't set up in the database yet. Run inventory.sql (Walkthrough 15), wait a minute, then reload this page.";
  if (/row-level security|permission denied|insufficient/i.test(m) && !/Only a manager/.test(m)) return "This login can't do that. The Inventory page is for managers.";
  return m || "Something went wrong. Try again, and if it keeps happening, take a screenshot.";
}
/** "6/4" → 1.5 */
const stockIn = (s) => { const m = /^(\d+)\/4$/.exec(String(s || "")); return m ? Number(m[1]) / 4 : 0; };
/** Board feet of one rack line: length × width × rows × stock thickness ÷ 144 */
const lineBf = (len, width, rows, stock) => (Number(len) || 0) * (Number(width) || ROW_W) * (Number(rows) || 0) * stockIn(stock) / 144;
const rowsOf = (bundles) => (bundles || []).reduce((a, b) => a + (Number(b) || 0), 0);
/** 19.25 → "19¼" */
function fracText(r) {
  r = Number(r) || 0;
  const w = Math.floor(r + 1e-9), f = Math.round((r - w) * 4);
  return (w || !f ? String(w) : "") + ["", "¼", "½", "¾"][f];
}
/** A bundle number with its whole part and quarter set separately (the ¼ ½ ¾ buttons) */
function setWhole(cur, whole) { const f = (Number(cur) || 0) - Math.floor((Number(cur) || 0) + 1e-9); return whole === "" && !f ? null : Math.max(0, parseInt(whole, 10) || 0) + f; }
function toggleQuarter(cur, q) { const c = Number(cur) || 0, w = Math.floor(c + 1e-9), f = Math.round((c - w) * 4); return w + (f === q ? 0 : q / 4); }
const ftin = (len) => { const ft = Math.floor(len / 12), i = Math.round((len % 12) * 100) / 100; return i ? `${ft}' ${i}"` : `${ft}'`; };
const f0 = (n) => Math.round(Number(n) || 0).toLocaleString("en-US");
const f1 = (n) => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString("en-US");
const money = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("en-US");
const monthName = (d) => { if (!d) return ""; const [y, m] = String(d).split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" }); };
const monthShort = (d) => { if (!d) return ""; const [y, m] = String(d).split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-US", { month: "long" }); };
const dayShort = (d) => { if (!d) return ""; const [y, m, dd] = String(d).slice(0, 10).split("-").map(Number); return `${dd} ${new Date(y, m - 1, 1).toLocaleString("en-US", { month: "short" })}`; };
/** The month before a month-end date: "2026-09-30" → "2026-08-31" */
function prevMonthEnd(d) { const [y, m] = String(d).split("-").map(Number); const x = new Date(Date.UTC(y, m - 1, 0)); return x.toISOString().slice(0, 10); }

/** Lumber lines to show for the month: this month's lines, plus last month's lengths (empty) not yet on it. */
function lumberLines(items, cur, prev) {
  const out = new Map();
  for (const it of items) out.set(it.id, []);
  for (const l of prev || []) if (out.has(l.item_id) && !out.get(l.item_id).some(x => Number(x.length_in) === Number(l.length_in)))
    out.get(l.item_id).push({ item_id: l.item_id, length_in: Number(l.length_in), width_in: Number(l.width_in) || ROW_W, bundles: [], fromLast: true });
  for (const l of cur || []) {
    if (!out.has(l.item_id)) continue;
    const arr = out.get(l.item_id), i = arr.findIndex(x => Number(x.length_in) === Number(l.length_in));
    const row = { item_id: l.item_id, length_in: Number(l.length_in), width_in: Number(l.width_in) || ROW_W, bundles: (l.bundles || []).map(b => b === null ? null : Number(b)) };
    if (i >= 0) arr[i] = row; else arr.push(row);
  }
  for (const arr of out.values()) { arr.sort((a, b) => a.length_in - b.length_in); for (const l of arr) if (!l.bundles.length) l.bundles = [null]; }
  return out;
}
/** Latest match per work-order species (the rows come newest first or not — sorted here) */
function currentMatches(rows) {
  const by = new Map();
  for (const r of [...(rows || [])].sort((a, b) => String(a.set_at).localeCompare(String(b.set_at)) || a.id - b.id)) by.set(r.wo_norm, r);
  return by;
}
const norm = (s) => String(s || "").toLowerCase().replace(/[\s\-_]+/g, " ").trim();
/** Department counts from the office: every item typed, as absolute numbers (steel as full sticks + loose feet).
 *  The same shape the tablet sends. Items left blank aren't sent; the database counts them as 0. */
function deptPayload(items, draft) {
  const out = [];
  for (const it of items || []) {
    const d = (draft || {})[it.id]; if (!d) continue;
    if (it.std_length_ft) { if ((d.sticks ?? "") === "" && (d.loose ?? "") === "") continue; out.push({ item_id: it.id, sticks: d.sticks === "" || d.sticks === undefined ? null : Number(d.sticks), loose_ft: d.loose === "" || d.loose === undefined ? null : Number(d.loose) }); }
    else { if ((d.n ?? "") === "") continue; out.push({ item_id: it.id, qty: Number(d.n) }); }
  }

    return `<h2>${esc(monthName(m))}</h2><p class="sub">Counted on the last day of the month, ${esc(dayShort(m))}.</p>
      <div class="sec">All month</div>
      ${viewDeliveries()}
      <div class="sec">Month-end</div>
      <div class="steps">${step1}${step2}${step3}</div>
      <div class="card closebar">${closed() ? `<span class="muted">Closed.</span>`
        : `<button class="btn or" data-close ${canClose ? "" : "disabled"}>Close ${esc(monthShort(m))}</button>
          <span class="note">${canClose ? "Everything's in." : `Still to do: ${esc(leftText)}.`} Closing saves the counts, the sheets and today's prices for good. It can't be done before ${esc(dayShort(m))}.</span>`}</div>`;
  }

  // the slips, all month: one line, opening to one form and the list
  function viewDeliveries() {
    const rec = S.receipts.filter(r => r.month_end === S.month), live = rec.filter(r => !r.mistake_at);
    const lum = live.filter(r => r.kind === "lumber"), ply = live.filter(r => r.kind === "plywood");
    const lumTot = lum.reduce((a, r) => a + Number(r.board_feet), 0), plyTot = ply.reduce((a, r) => a + r.sheets, 0);
    const today = new Date(), iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    const maxDate = iso < S.month ? iso : S.month, kind = S.slipKind === "plywood" ? "plywood" : "lumber";
    const slips = (n) => `${n} slip${n === 1 ? "" : "s"}`;
    const sum = rec.length ? `Lumber ${f0(lumTot)} bd ft on ${slips(lum.length)} · Plywood ${plyTot} sheet${plyTot === 1 ? "" : "s"} on ${slips(ply.length)}` : "None yet this month";
    const rows = [...rec].sort((a, b) => String(a.received_on).localeCompare(String(b.received_on))).map(r => `<tr class="${r.mistake_at ? "mistake" : ""}"><td>${esc(dayShort(r.received_on))}</td>
      <td class="l">${esc(r.supplier || "—")}</td><td class="l">${r.kind === "plywood" ? `Plywood · <b class="num">${r.sheets}</b> sheets` : `${esc((itemById(r.item_id) || {}).name || "?")} · <b class="num">${f0(r.board_feet)}</b> bd ft`}</td>
      <td>${r.mistake_at ? `<span class="note">Entered by mistake · ${esc(r.mistake_by_name)}</span>` : closed() ? "" : `<button class="link" data-mistake="${esc(r.id)}">Entered by mistake</button>`}</td></tr>`).join("");
    const form = closed() ? "" : `<div class="form slipform">
        <label>Lumber or plywood<select id="rkind"><option value="lumber" ${kind === "lumber" ? "selected" : ""}>Lumber</option><option value="plywood" ${kind === "plywood" ? "selected" : ""}>Plywood</option></select></label>
        <label>Date<input type="date" id="rd" value="${esc(maxDate)}" max="${esc(maxDate)}"></label>
        <label>Supplier<input id="rs" list="suppliers" placeholder="${kind === "plywood" ? "Hood Distribution – DSI" : "Frank Miller Lumber"}"></label>
        <label data-for="lumber" ${kind === "lumber" ? "" : "hidden"}>Species and thickness<select id="rk"><option value="">Choose…</option>${lumberItems(false).map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join("")}</select></label>
        <label data-for="lumber" ${kind === "lumber" ? "" : "hidden"}>Board feet<input id="rb" type="number" inputmode="decimal" min="1"></label>
        <label data-for="plywood" ${kind === "plywood" ? "" : "hidden"}>Sheets<input id="pn" type="number" inputmode="numeric" min="1"></label>
        <button class="btn" data-addslip>Add the slip</button></div>
      <datalist id="suppliers">${[...new Set(["Frank Miller Lumber", "Charles F. Shiels & Co.", "Hood Distribution – DSI", ...S.receipts.map(r => r.supplier).filter(Boolean)])].map(s => `<option>${esc(s)}</option>`).join("")}</datalist>`;
    return `<details class="sfold steps" data-fold="deliv" ${foldOpen("deliv", false) ? "open" : ""}>
      <summary class="srow"><span class="tx"><span class="tt">Deliveries in</span><span class="ss">${sum}</span></span>
        <span class="link">${closed() ? "See the slips" : "Add or see slips"}</span>${CHEV}</summary>
      <div class="fbody flat">${form}
        ${rec.length ? `<div class="tw" style="margin-top:12px"><table style="min-width:520px"><thead><tr><th>Date</th><th class="l">Supplier</th><th class="l">What</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
        <p class="note">One line per packing slip; the totals add themselves up. Nothing is deleted: a wrong slip is marked <i>Entered by mistake</i> and stops counting, but stays on record.</p></div></details>`;
  }

  function rolloverBody() {
    const pool = S.pool.filter(p => !p.mill_finished).sort((a, b) => (b.mill_done === 0) - (a.mill_done === 0) || a.project_id.localeCompare(b.project_id) || a.sheet_number - b.sheet_number);
    const fromBefore = S.pool.filter(p => p.carried_over).length, finished = S.pool.length - pool.length;
    const rolled = pool.filter(p => p.rolled), rolledBf = rolled.reduce((a, p) => a + (Number(p.board_feet) || 0), 0);
    const done = !!monthRow().rollover_done_at, probs = probsOf();
    return `<p class="note rointro">${S.pool.length} sheets go through Milling this month${fromBefore ? ` (${fromBefore} rolled over from before)` : ""}; ${finished} are finished in Milling and count by themselves. These ${pool.length} are still in Milling.</p>
      ${pool.length ? pool.map(p => `<div class="ro ${p.rolled ? "rolled" : ""}"><div class="w"><b>${esc(p.project_id)}</b><span>Sheet ${p.sheet_number} · ${esc(p.item_code || "")}</span>
          ${p.carried_over ? ` <span class="tag">From ${esc(monthShort(p.upload_month))}</span>` : ""}${p.is_active ? "" : ` <span class="tag">Job not in production</span>`}
          <div class="note">${esc(p.species || "no species")} · ${esc(p.shape || "")} ${esc(p.width || "?")}${p.length ? ` × ${esc(p.length)}` : ""} · ${esc(p.thickness || "?")} · ${p.qty} top${p.qty === 1 ? "" : "s"} · Milling ${p.mill_done} of ${p.mill_required}</div>
          ${p.problem ? `<div style="margin-top:4px"><span class="flag">${esc(p.problem)}</span></div>` : p.leave_out ? `<div class="note">Left out — not lumber</div>` : ""}</div>
        <div class="bfv"><b class="num">${p.board_feet !== null ? f0(p.board_feet) : "—"}</b><div class="note">${p.board_feet !== null ? `bd ft ${esc(p.stock)}` : p.leave_out ? "left out" : "fix in Setup"}</div></div>
        ${p.mill_done > 0 ? `<span class="note" style="width:160px">Pieces counted — lumber is out</span>`
          : `<label class="tick"><input type="checkbox" data-roll="${esc(p.job_id)}|${p.sheet_number}" ${p.rolled ? "checked" : ""} ${closed() ? "disabled" : ""}> Not pulled</label>`}</div>`).join("")
        : `<div class="ro muted">Nothing is still in Milling. Every sheet on the list counts this month.</div>`}
      <div class="ro robar"><span style="flex:1 1 240px">${rolled.length} sheet${rolled.length === 1 ? "" : "s"} roll${rolled.length === 1 ? "s" : ""} to next month (${f0(rolledBf)} bd ft).${probs.length ? ` ${probs.length} sheet${probs.length === 1 ? " needs" : "s need"} a match in Setup.` : ""}</span>
        ${probs.length ? `<button class="link" data-go="setup">Match in Setup</button>` : ""}
        ${closed() ? "" : done ? `<span style="color:var(--teal-ink);font-weight:700">✓ Reviewed by ${esc(monthRow().rollover_done_by)}</span> <button class="link" data-rodone="0">Change it</button>`
                              : `<button class="btn" data-rodone="1">Done — these are right</button>`}</div>`;
  }

  // ---- export a month's counts as a spreadsheet file (CSV): on Results, for the month picked there ----
  function exportMonths() {
    const ms = S.months.map(r => r.month_end);
    if (S.month && !ms.includes(S.month)) ms.push(S.month);
    return [...new Set(ms)].sort().reverse();
  }
  const monthRowOf = (me) => S.months.find(r => r.month_end === me) || { month_end: me, kind: "count", status: "open" };
  async function all(make) {                                 // every row, a thousand at a time (the API's limit)
    const out = [];
    for (let from = 0; ; from += 1000) {
      const r = await make().range(from, from + 999);
      if (r.error) throw r.error;
      out.push(...(r.data || []));
      if (!r.data || r.data.length < 1000) return out;
    }
  }
  async function exportCounts(me) {
    S.exporting = true; S.exportMsg = null; render();
    try {
      const [lists, counts, sends, lumberLines] = await Promise.all([
        all(() => db.from("inv_lists").select("*").order("sort_order")),
        all(() => db.from("inv_counts").select("month_end,item_id,qty,sticks,loose_ft,counted_by_name,counted_at").eq("month_end", me).order("item_id")),
        all(() => db.from("inv_sends").select("*").eq("month_end", me).order("id")),
        all(() => db.from("inv_lumber_lines").select("month_end,item_id,length_in,width_in,bundles,updated_by_name,updated_at").eq("month_end", me).order("id")),
      ]);
      const m = monthRowOf(me);
      const rows = exportRows({ month: m, lists, items: S.items, counts, sends, lumberLines });
      if (!rows.length) { S.exportMsg = { ok: false, text: `Nothing has been counted for ${monthName(me)} yet, so there's nothing to export.` }; return; }
      const blob = new Blob([exportCsv(rows)], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = exportName(m);
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      const waiting = me === S.month ? Object.keys(S.pending).length : 0;
      S.exportMsg = { ok: true, text: `Exported ${a.download} — ${rows.length} row${rows.length === 1 ? "" : "s"}.${
        waiting ? ` ${waiting} lumber line${waiting === 1 ? " is" : "s are"} still waiting to save and aren't in it.` : ""}` };
    } catch (e) {
      S.exportMsg = { ok: false, text: isNetworkError(e) ? "Can't reach the database right now, so nothing was exported. Try again when the connection is back." : friendlyError(e) };
    } finally { S.exporting = false; render(); }
  }

  // ---- a department's list, as its tablet shows it; the office can count and send it on their behalf (its own screen) ----
  const DEPT_LISTS = () => S.status.filter(s => s.list_key !== "lumber");
  function deptDraft(key) { const k = key + "_" + S.month; return S.deptDrafts[k] || (S.deptDrafts[k] = {}); }
  const deptItems = (key) => S.items.filter(i => i.list_key === key && !i.retired).sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name));
  function lastCount(itemId) { let best = null; for (const c of S.counts) if (c.item_id === itemId && c.month_end < S.month && (!best || c.month_end > best.month_end)) best = c; return best; }
  const curCount = (itemId) => S.counts.find(c => c.item_id === itemId && c.month_end === S.month) || null;
  function viewDept() {
    const lists = DEPT_LISTS();
    if (!lists.some(l => l.list_key === S.deptList)) S.deptList = lists[0] ? lists[0].list_key : null;
    const s = statusOf(S.deptList); if (!s.list_key) return `<p class="sub">No department lists yet.</p>`;
    const dept = s.department_name || s.name, m = monthShort(S.month), sent = !!s.done, locked = sent || closed();
    const canSend = s.due && !sent && !closed() && s.count_day_reached;
    const quarterly = s.every_months === 3, items = deptItems(s.list_key), d = deptDraft(s.list_key);
    let filled = 0, sec = null, body = "";
    for (const it of items) {
      const cur = curCount(it.id), steel = !!it.std_length_ft;
      const v = locked ? (cur ? (steel && cur.sticks !== null && cur.sticks !== undefined ? { sticks: cur.sticks, loose: cur.loose_ft ?? "" } : steel ? { sticks: "", loose: cur.qty } : { n: cur.qty }) : {}) : (d[it.id] || {});
      const has = deptHas(it, v); if (has) filled++;
      if (it.section !== sec) { sec = it.section; body += `<div class="invgroup">${esc(sec || s.name)}</div>`; }
      const lc = lastCount(it.id);
      const last = lc ? ` · last ${quarterly ? "count" : "month"} ${Number(lc.qty).toLocaleString("en-US")}${steel ? " ft" : ""}` : "";
      const shown = it.section && it.name.toLowerCase().startsWith(it.section.toLowerCase() + ", ") ? it.name.slice(it.section.length + 2) : it.name;
      const dis = locked || !s.due ? "disabled" : "";
      body += `<div class="invitem"><div class="nm">${esc(shown)}<small>${steel ? `${Number(it.std_length_ft)}' sticks` : esc(it.unit)}${esc(last)}</small></div>` + (steel
        ? `<input type="number" inputmode="numeric" min="0" value="${esc(v.sticks ?? "")}" data-dinv="${esc(it.id)}|sticks" aria-label="${esc(it.name)} full sticks" ${dis}><span class="u">sticks +</span>
           <input type="number" inputmode="decimal" min="0" value="${esc(v.loose ?? "")}" data-dinv="${esc(it.id)}|loose" aria-label="${esc(it.name)} loose feet" ${dis}><span class="u">ft</span>
           <span class="eq" data-deq="${esc(it.id)}">${has ? "= " + deptFeet(it, v).toLocaleString("en-US") + " ft" : ""}</span>`
        : `<input type="number" inputmode="decimal" min="0" value="${esc(v.n ?? "")}" data-dinv="${esc(it.id)}|n" aria-label="${esc(it.name)} count" ${dis}><span class="u">${esc(it.unit)}</span>`) + `</div>`;
    }
    const head = !s.due ? `<div class="banner">Not due in ${esc(m)}<small>${esc(s.name)} is counted every three months — March, June, September and December. This is the list as it stands.</small></div>`
      : sent ? `<div class="banner ok">${esc(s.name)} count sent ${esc(dayShort(s.done_at))} by ${esc(s.done_by)}<small>These are the numbers as sent.${closed() ? "" : " \"Change the count\" opens it again — on this page and on the tablet — until the month closes."}</small></div>`
      : closed() ? `<div class="banner">${esc(m)} is closed<small>This list wasn't sent.</small></div>`
      : !s.count_day_reached ? `<div class="banner">Preview — this is the list ${esc(dept)} sees on their tablet from ${esc(dayShort(S.month))}<small>You can type numbers to try it; nothing is sent. From ${esc(dayShort(S.month))} the office can send it here if ${esc(dept)} can't.</small></div>`
      : `<div class="banner">Waiting for ${esc(dept)}'s tablet<small>If they're out, count it here and send it. It's recorded as sent by you, and their tablet shows it as sent.</small></div>`;
    return `<div class="seg" role="group" aria-label="Which list">${lists.map(l => `<button data-dlist="${esc(l.list_key)}" aria-pressed="${l.list_key === s.list_key}">${esc(l.name)}${l.department_name && l.department_name !== l.name ? `<span class="note"> · ${esc(l.department_name)}</span>` : ""}${
        !l.due ? `<span class="mk">–</span>` : l.done ? `<span class="mk ok">✓</span>` : ""}</button>`).join("")}</div>
      ${head}<div class="invlist">${body || `<div class="invitem">Nothing on the list. Add items in Setup → Count lists and prices.</div>`}</div>
      ${s.due ? `<div class="invbar"><span class="invcount">${filled} of ${items.length} counted${!locked && filled < items.length ? " — blanks count as 0" : ""}</span>
        ${sent && !closed() ? `<button class="btn ghost" data-dreopen="${esc(s.list_key)}">Change the count</button>`
          : locked ? "" : `<button class="btn or" data-dsend="${esc(s.list_key)}" ${canSend ? "" : "disabled"}>Send for ${esc(dept)}</button>${canSend ? "" : `<span class="note">Opens ${esc(dayShort(S.month))}</span>`}`}</div>` : ""}`;
  }

  // ---- the lumber count (its own screen) ----
  function viewLumber() {
    const items = lumberItems(false);
    const shown = items.filter(i => (S.lines.get(i.id) || []).length > 0 || S.open["add_" + i.id]);
    const tot = items.reduce((a, i) => a + closingBf(i.id), 0), openTot = items.reduce((a, i) => a + openingBf(i.id), 0);
    const addable = items.filter(i => !shown.includes(i));
    const done = !!monthRow().lumber_done_at;
    const doneBar = closed() ? "" : done ? `<span class="note">Marked counted by ${esc(monthRow().lumber_done_by)}. You can still correct a number until the month closes.</span><button class="link" data-lumdone="0">Not done yet</button>`
      : `<button class="btn" data-lumdone="1">Lumber count is done</button>`;
    return `<div class="card lumtop"><span class="num lumtot">${f0(tot)} bd ft</span>
        <span class="muted" style="flex:1 1 200px">on the racks · ${esc(dayShort(prevMonthEnd(S.month)))} was ${f0(openTot)}</span>${doneBar}</div>
      <p class="sub">Each length has its bundles; type the rows in each. Row width is 42". Leave out lumber already marked for jobs in production. Every number saves itself.</p>
      ${shown.sort((a, b) => closingBf(b.id) - closingBf(a.id) || openingBf(b.id) - openingBf(a.id)).map(specCard).join("")}
      ${closed() ? "" : `<div class="addrow card"><select class="pick" id="newkey" aria-label="Add a species and thickness"><option value="">Add a species and thickness…</option>${addable.map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join("")}</select>
        <button class="btn ghost" data-addkey>Add</button><span class="note">Not on the list? Add it in Setup → Count lists and prices.</span></div>`}
      <div class="card lumtop"><span style="flex:1 1 240px">${done ? "Marked counted. Back to This month for the next step." : "When every rack is counted, mark it done."}</span>
        ${closed() || done ? `<button class="btn ghost" data-go="month">Back to This month</button>` : `<button class="btn" data-lumdone="1">Lumber count is done</button>`}</div>`;
  }
  function specCard(it) {

    return `<details class="spec" data-item="${esc(it.id)}" ${isOpen ? "open" : ""}><summary><span class="chev">▸</span><span class="nm">${esc(it.name)}</span>
      <span class="was">${esc(dayShort(prevMonthEnd(S.month)))} ${f0(openingBf(it.id))}</span><span class="bf num" data-bf="${esc(it.id)}">${f0(closingBf(it.id))} bd ft</span></summary>
      <div class="lens">${lines.map((l, li) => {
        const rows = rowsOf(l.bundles);
        return `<div class="len"><div class="lenhead"><b>${l.length_in}"</b><span class="note">${ftin(l.length_in)}${Number(l.width_in) !== ROW_W ? ` · ${l.width_in}" wide` : ""}</span>
          <span class="tot" data-tot="${esc(it.id)}|${li}">${fracText(rows)} rows = <b class="num">${f0(lineBf(l.length_in, l.width_in, rows, it.stock))}</b> bd ft</span></div>
          ${l.bundles.map((b, bi) => {
            const w = b === null ? "" : Math.floor(b + 1e-9), fr = b === null ? 0 : Math.round((b - Math.floor(b + 1e-9)) * 4);
            return `<div class="bundle"><span class="lbl">Bundle ${bi + 1}</span>
              <input type="number" inputmode="numeric" min="0" step="1" value="${b === null ? "" : (w === 0 && fr ? "" : w)}" data-b="${esc(it.id)}|${li}|${bi}" aria-label="${esc(it.name)} ${l.length_in} inch, bundle ${bi + 1}, whole rows" ${closed() ? "disabled" : ""}>
              <span class="q">${[1, 2, 3].map(q => `<button data-frac="${esc(it.id)}|${li}|${bi}|${q}" aria-pressed="${fr === q}" aria-label="plus ${["", "a quarter", "a half", "three quarters"][q]} row" ${closed() ? "disabled" : ""}>${["", "¼", "½", "¾"][q]}</button>`).join("")}</span>
              <span class="note">rows</span>${l.bundles.length > 1 && !closed() ? `<button class="x" data-del="${esc(it.id)}|${li}|${bi}">Remove</button>` : ""}</div>`;
          }).join("")}
          ${closed() ? "" : `<button class="link" data-add="${esc(it.id)}|${li}">+ Add a bundle</button>`}</div>`;
      }).join("")}
      ${closed() ? "" : `<div class="addrow"><input type="number" inputmode="decimal" placeholder="Length in inches" id="nl-${esc(it.id)}" style="width:170px" aria-label="New length in inches for ${esc(it.name)}">
        <button class="btn ghost" data-addlen="${esc(it.id)}">Add a length</button></div>`}</div></details>`;
  }

  // ---- Results: one month picked, the scrap rate and the values, and the export ----
  function viewResults() {
    const ms = exportMonths();
    if (!S.pickMonth || !ms.includes(S.pickMonth)) S.pickMonth = ms.includes(S.month) ? S.month : ms[0];
    const pm = S.pickMonth, mr = monthRowOf(pm), starting = mr.kind === "starting";
    const isOpen = pm === S.month && !closed();
    const label = (me) => { const r = monthRowOf(me); return monthName(me) + (r.kind === "starting" ? " (starting count)" : r.status === "closed" ? "" : " (not closed)"); };
    const rows = S.scrap.filter(r => r.month_end === pm && (Number(r.used_bf) || Number(r.zero_bf) || Number(r.received_bf)));
    const probs = isOpen ? probsOf() : [];
    const sum = (a, f) => a.reduce((x, r) => x + (Number(r[f]) || 0), 0);
    const counted = rows.filter(r => r.used_bf !== null && r.used_bf !== undefined);
    const usedAll = sum(counted, "used_bf"), zeroAll = sum(counted, "zero_bf"), rateAll = usedAll > 0 && zeroAll > 0 ? (usedAll - zeroAll) / usedAll : null;
    const vals = S.values.filter(v => v.month_end === pm), valTot = vals.reduce((a, v) => a + Number(v.value || 0), 0);

    const kScrap = starting ? `<div class="n num">—</div><div class="note">The starting count: there's no month before it to work from</div>`
      : rateAll === null ? `<div class="n num">—</div><div class="note">${rows.length ? "No tops started yet" : "Nothing to work out yet"}</div>`
      : `<div class="n num">${f1(rateAll * 100)}%</div><div class="note">${f0(usedAll - zeroAll)} of ${f0(usedAll)} bd ft used</div>`;
    const kValue = `<div class="n num">${money(valTot)}</div><div class="note">${isOpen ? "At today's prices; they're saved when the month closes" : "At the prices the month closed with"}</div>`;
    return `<div class="monthpick resbar"><label class="muted small" for="xm">Month</label>
        <select class="pick big" id="xm">${ms.map(me => `<option value="${esc(me)}" ${me === pm ? "selected" : ""}>${esc(label(me))}</option>`).join("")}</select>
        <button class="btn" data-export ${S.exporting ? "disabled" : ""}>${S.exporting ? "Exporting…" : `${DOWN}Export counts`}</button></div>
      ${S.exportMsg ? `<div class="banner ${S.exportMsg.ok ? "ok" : ""}" role="status">${esc(S.exportMsg.text)}</div>` : ""}
      <p class="note" style="margin:-6px 2px 14px">Export counts: a spreadsheet file (CSV) of every list's counts for the month picked, as sent — one row per item, and lumber one row per bundle. No prices. It goes to your Downloads folder.</p>
      <div class="kpis"><div class="kpi"><div class="kt">Scrap rate, all lumber</div>${kScrap}</div><div class="kpi"><div class="kt">Inventory value</div>${kValue}</div></div>
      ${isOpen && !monthRow().rollover_done_at ? `<div class="banner">The month-end roll-over isn't done yet<small>Until you pick the sheets whose lumber hasn't been pulled, they count as used and the 0-scrap numbers run high.</small></div>` : ""}
      ${isOpen && !monthRow().lumber_done_at ? `<div class="banner">The lumber count isn't marked done<small>Until it is, "this month's count" is whatever has been typed so far.</small></div>` : ""}
      ${probs.length ? `<div class="banner">${probs.length} sheet${probs.length === 1 ? "" : "s"} left out of 0-scrap<small>${probs.slice(0, 6).map(p => `${esc(p.project_id)} sheet ${p.sheet_number}: ${esc(p.problem)}`).join(" · ")}${probs.length > 6 ? " …" : ""} — fix in Setup.</small></div>` : ""}
      ${scrapTable(rows)}
      ${valuesTable(vals)}`;
  }
  function scrapTable(rows) {
    const work = !!S.working, by = {}; rows.forEach(r => (by[r.stock] = by[r.stock] || []).push(r));
    const sum = (a, f) => a.reduce((x, r) => x + (Number(r[f]) || 0), 0);
    const line = (r, cls, click) => {
      const used = Number(r.used_bf) || 0, zero = Number(r.zero_bf) || 0, rate = used > 0 && zero > 0 ? (used - zero) / used : null;
      const verdict = r.opening_bf === null || r.opening_bf === undefined ? (cls ? "" : `<span class="note">starting count</span>`)
        : zero > used + 0.5 ? `<span class="flag o">Check</span>` : rate === null ? `<span class="note">${used > 0 ? "no tops" : "—"}</span>` : `<span class="rate num">${f1(rate * 100)}%</span>`;
      const name = `<td>${esc(r.label || r.name)}</td>`, usedC = `<td class="num"><b>${r.used_bf === null ? "—" : f0(used)}</b></td>`, scrapC = `<td class="num">${r.used_bf === null ? "—" : f0(used - zero)}</td>`;
      return `<tr class="${cls || ""} ${click ? "click" : ""}" ${click ? `data-drill="${esc(r.species)}|${esc(r.stock)}"` : ""}>${name}${work
        ? `<td class="num">${r.opening_bf === null ? "—" : f0(r.opening_bf)}</td><td class="num">+ ${f0(r.received_bf)}</td><td class="num">− ${f0(r.closing_bf)}</td>${usedC}<td class="num">${f0(zero)}</td>${scrapC}`
        : `${usedC}${scrapC}`}<td>${verdict}</td></tr>`;
    };
    let body = "";
    for (const st of Object.keys(by).sort()) {
      by[st].sort((a, b) => (Number(b.used_bf) || 0) - (Number(a.used_bf) || 0)).forEach(r => body += line(r, "", true));
      body += line({ label: `All ${st}`, opening_bf: sum(by[st], "opening_bf"), received_bf: sum(by[st], "received_bf"), closing_bf: sum(by[st], "closing_bf"), used_bf: sum(by[st], "used_bf"), zero_bf: sum(by[st], "zero_bf") }, "subtot");
    }
    body += line({ label: "All lumber", opening_bf: sum(rows, "opening_bf"), received_bf: sum(rows, "received_bf"), closing_bf: sum(rows, "closing_bf"), used_bf: sum(rows, "used_bf"), zero_bf: sum(rows, "zero_bf") }, "grand");
    const headRow = work ? `<th>Species and thickness</th><th>Last count</th><th>Received</th><th>This count</th><th>Used</th><th>0-scrap</th><th>Scrap</th><th>Scrap rate</th>`
      : `<th>Species and thickness</th><th>Used</th><th>Scrap</th><th>Scrap rate</th>`;
    return `<div class="sechead"><div class="sec">Scrap by species · board feet</div>${rows.length ? `<button class="link" data-working aria-expanded="${work}">${work ? "Hide the working" : "Show the working"}</button>` : ""}</div>
      ${rows.length ? `<div class="tw"><table style="min-width:${work ? 640 : 0}px"><thead><tr>${headRow}</tr></thead><tbody>${body}</tbody></table></div>
        <p class="note">${work ? `Used = last count + received − this count. 0-scrap = every top started this month at full rectangle × stock thickness. Scrap rate = (used − 0-scrap) ÷ used. ` : ""}Tap a row to see its tops. <span class="flag o">Check</span> means more tops started than lumber used — usually a sheet that should roll over, a missed delivery slip, or a counting slip.</p>`
        : `<div class="card muted">Nothing to show for this month yet.</div>`}`;
  }
  function valuesTable(rows) {
    const gl = { "1201": 0, "1204-01": 0, "1207": 0, "1208": 0 };
    for (const v of rows) if (v.gl_account) gl[v.gl_account] = (gl[v.gl_account] || 0) + Number(v.value || 0);
    const names = { "1201": "Wood (lumber + plywood)", "1204-01": "Steel", "1207": "Other", "1208": "Finishing materials" };
    const tot = Object.values(gl).reduce((a, b) => a + b, 0);
    const byList = {}; rows.filter(v => v.gl_account).forEach(v => (byList[v.list_key] = byList[v.list_key] || []).push(v));
    const listName = (k) => ({ lumber: "Lumber", plywood: "Plywood", metal: "Metal", finish: "Finish", other: "Other" }[k] || k);
    const noPrice = rows.filter(v => v.gl_account && Number(v.qty) > 0 && (v.price === null || v.price === undefined));
    const items = !!S.valItems;
    return `<div class="sechead"><div class="sec">Value by GL account</div><button class="link" data-valitems aria-expanded="${items}">${items ? "Hide the items" : "See every item"}</button></div>
      <div class="tw"><table style="min-width:0"><thead><tr><th>GL account</th><th class="l">What</th><th>Value</th></tr></thead><tbody>
        ${["1201", "1204-01", "1207", "1208", ...Object.keys(gl).filter(a => !["1201", "1204-01", "1207", "1208"].includes(a))].map(a => `<tr><td>${a}</td><td class="l">${names[a] || ""}</td><td class="num">${money(gl[a])}</td></tr>`).join("")}
        <tr class="grand"><td>Total</td><td></td><td class="num">${money(tot)}</td></tr></tbody></table></div>
      <p class="note">Count × price — the same totals as the Summary tab of your spreadsheet. A count not in yet adds nothing. Metal's shop supplies have no dollar value, as on your sheet.${noPrice.length ? ` ${noPrice.length} counted item${noPrice.length === 1 ? " has" : "s have"} no price <button class="link" data-go="setup">Set prices in Setup</button>` : ""}</p>
      ${items ? Object.keys(byList).map(k => `<div class="sec">${esc(listName(k))} · ${money(byList[k].reduce((a, v) => a + Number(v.value || 0), 0))}</div>
        <div class="tw"><table style="min-width:520px"><thead><tr><th>Item</th><th>Count</th><th>Price</th><th>Value</th></tr></thead><tbody>
        ${byList[k].filter(v => Number(v.qty) > 0).sort((a, b) => Number(b.value) - Number(a.value)).map(v => `<tr><td>${esc(v.name)}</td><td class="num">${f1(v.qty)} ${esc(v.unit)}</td>
          <td class="num">${v.price === null ? `<span class="flag">No price</span>` : "$" + Number(v.price).toFixed(2)}</td><td class="num">${money(v.value)}</td></tr>`).join("")}</tbody></table></div>`).join("") : ""}`;
  }
  function drillPane() {
    const [sp, st] = S.drill.split("|"), pm = S.pickMonth || S.month;
    const r = S.scrap.find(x => x.month_end === pm && x.species === sp && x.stock === st) || {};
    const isOpen = pm === S.month && !closed();
    const list = isOpen ? S.pool.filter(p => !p.rolled && !p.problem && p.board_feet !== null && norm(p.inventory_species) === norm(sp) && p.stock === st) : null;
    return `<div class="drawer" data-shut><div class="pane" data-stay>

      ${list === null ? `<p class="muted">A closed month's tops are saved with it; this list shows the open month.</p>` : list.length ? `<div class="tw"><table style="min-width:0"><thead><tr><th>Sheet</th><th class="l">Top</th><th>Tops</th><th>bd ft</th></tr></thead><tbody>
        ${list.sort((a, b) => b.board_feet - a.board_feet).map(p => `<tr><td>${esc(p.project_id)}<br><span class="note">Sheet ${p.sheet_number} · ${esc(p.item_code || "")}</span></td>
          <td class="l">${esc(p.width)}${p.length ? ` × ${esc(p.length)}` : ""} · ${esc(p.thickness)}<br><span class="note">counted as ${Number(p.width_in)}" × ${Number(p.length_in)}" × ${stockIn(p.stock)}" (${esc(p.stock)})</span></td>
          <td class="num">${p.qty}</td><td class="num"><b>${f0(p.board_feet)}</b></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No tops started in this species and thickness this month.</p>`}
      <p class="note">Only the sheet number, item code and the top size used for the maths — the work order page itself stays the source.</p></div></div>`;
  }

  // ---- Setup (its own screen): three folded lists, each saying what needs you ----
  function viewSetup() {
    const cur = currentMatches(S.matches);
    const invSpecies = [...new Set(lumberItems(false).map(i => i.species))].sort();
    const woSpecies = new Map();
    for (const p of S.pool) if (p.species) woSpecies.set(norm(p.species), p.species);
    for (const m of cur.values()) if (!woSpecies.has(m.wo_norm)) woSpecies.set(m.wo_norm, m.wo_species);
    const speciesRow = ([n, name]) => {
      const m = cur.get(n), auto = !m && invSpecies.find(s => norm(s) === n);
      const val = m ? (m.leave_out ? "__out" : m.inventory_species) : auto || "";
      const waiting = S.pool.some(p => norm(p.species) === n && p.problem && /matched/.test(p.problem));
      return { waiting, html: `<div class="ro"><div class="w"><b>${esc(name)}</b>${waiting ? ` <span class="flag">Not matched</span>` : auto ? ` <span class="note">matches by itself</span>` : ""}</div>
        <select class="pick" data-match="${esc(name)}" aria-label="Inventory species for ${esc(name)}"><option value="">Choose inventory species…</option>
          ${invSpecies.map(s => `<option ${val === s ? "selected" : ""}>${esc(s)}</option>`).join("")}<option value="__out" ${val === "__out" ? "selected" : ""}>Not lumber — leave out</option></select></div>` };
    };
    const sp = [...woSpecies.entries()].sort((a, b) => a[1].localeCompare(b[1])).map(speciesRow);
    const spWait = sp.filter(r => r.waiting), spRest = sp.filter(r => !r.waiting);
    const rules = S.rules.filter(r => !r.retired_at), probs = probsOf(), noPrice = noPriceItems();
    const L = S.setupList, list = S.items.filter(i => i.list_key === L).sort((a, b) => (a.retired - b.retired) || String(a.section).localeCompare(String(b.section)) || a.sort_order - b.sort_order || a.name.localeCompare(b.name));
    const lists = [["lumber", "Lumber"], ["plywood", "Plywood"], ["metal", "Metal"], ["finish", "Finish"], ["other", "Other"]];
    const e = S.editItem;
    const fold = (k, title, sub, flag, dflt, inner) => `<details class="sfold" data-fold="${k}" ${foldOpen(k, dflt) ? "open" : ""}>
      <summary class="srow"><span class="tx"><span class="tt">${title}</span><span class="ss">${sub}</span></span>${flag ? `<span class="flag">${flag}</span>` : ""}${CHEV}</summary>
      <div class="fbody flat">${inner}</div></details>`;
    const speciesInner = `<p class="note" style="margin:0 0 8px">Names that are the same apart from spacing, capitals or hyphens match by themselves. Pick one for the rest; "Not lumber" leaves those sheets out of the scrap rate.</p>
      ${!sp.length ? `<div class="card muted">No work order species on this month's list yet.</div>`
        : `${spWait.length ? `<div class="card" style="padding:0">${spWait.map(r => r.html).join("")}</div>` : `<p class="note">Every work order species on this month's list has a match.</p>`}
          ${spRest.length ? `<details class="more" data-fold="spmore" ${foldOpen("spmore", false) ? "open" : ""}><summary class="link">See the ${spRest.length} that match</summary><div class="card" style="padding:0">${spRest.map(r => r.html).join("")}</div></details>` : ""}`}`;
    const rulesInner = `<div class="card" style="padding:0">${rules.map(r => `<div class="ro"><div class="w"><b class="num">${Number(r.from_in)}"${Number(r.to_in) !== Number(r.from_in) ? ` – ${Number(r.to_in)}"` : ""}</b> → <b>${esc(r.stock)}</b> <span class="note">· ${esc(r.set_by_name)}</span></div>
        <button class="link" data-retirerule="${r.id}">Retire</button></div>`).join("") || `<div class="ro muted">No rules yet.</div>`}</div>
      <div class="form">
        <label>Finished thickness from (inches)<input id="tf" type="number" step="0.01" min="0" placeholder="1.75"></label>
        <label>to (leave blank for just one)<input id="tt" type="number" step="0.01" min="0"></label>
        <label>Stock<select id="ts"><option>4/4</option><option>5/4</option><option>6/4</option><option selected>8/4</option><option>10/4</option><option>12/4</option></select></label>
        <button class="btn" data-addrule>Add rule</button></div>`;
    const listsInner = `<div class="monthpick">${lists.map(([k, t]) => `<button class="btn ${k === L ? "" : "ghost"}" data-setlist="${k}">${t}</button>`).join("")}</div>
      <div class="card" style="padding:0">${list.map(i => {
        const p = S.prices.get(i.id);
        return `<div class="ro"><div class="w"><b>${esc(i.name)}</b>${i.retired ? ` <span class="tag">Retired</span>` : ""}<div class="note">${esc(i.section || "")}${i.section ? " · " : ""}${esc(i.unit)}${i.std_length_ft ? ` · ${Number(i.std_length_ft)}' sticks` : ""} · ${i.gl_account ? "GL " + esc(i.gl_account) : "no dollar value"}</div></div>
          <label class="note" style="display:flex;gap:6px;align-items:center">$<input class="price" type="number" step="0.01" min="0" value="${p ? Number(p.price) : ""}" data-price="${esc(i.id)}" aria-label="Price of ${esc(i.name)}"> per ${esc(i.unit)}</label>
          <button class="link" data-edititem="${esc(i.id)}">Edit</button><button class="link" data-retire="${esc(i.id)}|${i.retired ? 0 : 1}">${i.retired ? "Bring back" : "Retire"}</button></div>`;
      }).join("")}</div>
      <div class="card"><b>${e && e.id ? "Change an item" : "Add an item"}</b><div class="form" style="margin-top:8px">
        ${L === "lumber" ? `<label>Species<input id="ei_sp" value="${esc(e ? e.species || "" : "")}" placeholder="Maple"></label>
          <label>Stock<select id="ei_st">${["4/4", "5/4", "6/4", "8/4", "10/4", "12/4"].map(s => `<option ${e && e.stock === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>`
        : `<label>Name<input id="ei_nm" value="${esc(e ? e.name || "" : "")}"></label>
          <label>Group<input id="ei_sec" value="${esc(e ? e.section || "" : "")}" placeholder="${L === "metal" ? "Square Tube" : ""}"></label>
          <label>Unit<input id="ei_un" value="${esc(e ? e.unit || "" : L === "plywood" ? "sheets" : "each")}"></label>
          ${L === "metal" ? `<label>Stick length in feet (steel only)<input id="ei_len" type="number" min="0" step="0.5" value="${esc(e && e.std_length_ft ? Number(e.std_length_ft) : "")}"></label>` : ""}
          <label>GL account (blank = no dollar value)<input id="ei_gl" value="${esc(e ? e.gl_account || "" : { plywood: "1201", metal: "1204-01", finish: "1208", other: "1207" }[L] || "")}"></label>`}
        <button class="btn" data-saveitem>${e && e.id ? "Save" : "Add"}</button>${e && e.id ? `<button class="link" data-canceledit>Cancel</button>` : ""}</div></div>
      <p class="note">Every price change is kept with who made it; a closed month keeps its own prices. Retired items keep their history.</p>`;
    return `${probs.length ? `<div class="banner">${probs.length} sheet${probs.length === 1 ? " is" : "s are"} left out of the scrap rate until matched<small>${probs.slice(0, 6).map(p => `${esc(p.project_id)} sheet ${p.sheet_number}: ${esc(p.problem)}`).join(" · ")}${probs.length > 6 ? " …" : ""}</small></div>` : ""}
      <div class="steps">
      ${fold("species", "Species matches", `Work order name to inventory name · ${spRest.length} matched`, spWait.length ? `${spWait.length} need${spWait.length === 1 ? "s" : ""} you` : "", spWait.length > 0, speciesInner)}
      ${fold("rules", "Thickness rules", `Finished top to stock · ${rules.length} rule${rules.length === 1 ? "" : "s"}`, "", false, rulesInner)}
      ${fold("lists", "Count lists and prices", "Lumber, Plywood, Metal, Finish, Other", noPrice.length ? `${noPrice.length} item${noPrice.length === 1 ? " has" : "s have"} no price` : "", !!S.editItem, listsInner)}
      </div>`;
  }
  // ---------- events ----------
  function wire() {
    const on = (sel, fn, ev = "click") => app.querySelectorAll(sel).forEach(el => el.addEventListener(ev, (e) => fn(el, e)));
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
    tabsEl.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
    on("[data-go]", (el) => go(el.dataset.go));
    on("details[data-fold] > summary", (el) => { const d = el.parentElement; S.folds[d.dataset.fold] = !d.open; store.set("folds", S.folds); });
    on("[data-working]", () => { S.working = !S.working; store.set("working", S.working); render(); });
    on("[data-valitems]", () => { S.valItems = !S.valItems; render(); });
    on("details.spec", (el) => { S.open[el.dataset.item] = el.open; store.set("open", S.open); }, "toggle");
    on("[data-b]", (el) => {
      const [id, li, bi] = el.dataset.b.split("|"), line = S.lines.get(id)[li];
      line.bundles[bi] = setWhole(line.bundles[bi], el.value);
      queueLine(id, line.length_in, line.width_in, line.bundles); refreshCard(id, Number(li));
    }, "input");
    on("[data-frac]", (el) => {
      const [id, li, bi, q] = el.dataset.frac.split("|"), line = S.lines.get(id)[li];
      line.bundles[bi] = toggleQuarter(line.bundles[bi], Number(q));
      queueLine(id, line.length_in, line.width_in, line.bundles); S.open[id] = true; render();
    });
    on("[data-add]", (el) => { const [id, li] = el.dataset.add.split("|"); S.lines.get(id)[li].bundles.push(null); S.open[id] = true; render();
      const ins = app.querySelectorAll(`[data-b^="${id}|${li}|"]`); if (ins.length) ins[ins.length - 1].focus(); });
    on("[data-del]", (el) => { const [id, li, bi] = el.dataset.del.split("|"), line = S.lines.get(id)[li]; line.bundles.splice(Number(bi), 1);
      queueLine(id, line.length_in, line.width_in, line.bundles); S.open[id] = true; render(); });
    on("[data-addlen]", (el) => {
      const id = el.dataset.addlen, len = Number(document.getElementById("nl-" + id).value);
      if (!len || len < 12 || len > 480) { S.msg = { ok: false, text: "Type a row length in inches, between 12 and 480." }; return render(); }
      const arr = S.lines.get(id);
      if (arr.some(l => l.length_in === len)) { S.msg = { ok: false, text: `${len}" is already on the list.` }; return render(); }
      arr.push({ item_id: id, length_in: len, width_in: ROW_W, bundles: [null] }); arr.sort((a, b) => a.length_in - b.length_in);
      queueLine(id, len, ROW_W, []); S.open[id] = true; S.msg = null; render();
    });
    on("[data-addkey]", () => { const id = document.getElementById("newkey").value; if (!id) return; S.open["add_" + id] = true; S.open[id] = true;
      if (!(S.lines.get(id) || []).length) S.lines.set(id, [{ item_id: id, length_in: 114, width_in: ROW_W, bundles: [null] }]); render(); });
    on("#xm", (el) => { S.pickMonth = el.value; S.exportMsg = null; render(); }, "change");
    on("[data-export]", () => { const el = document.getElementById("xm"); exportCounts(el ? el.value : S.pickMonth); });
    on("[data-golist]", (el) => { S.deptList = el.dataset.golist; store.set("deptlist", S.deptList); go("dept"); });
    on("[data-dlist]", (el) => { S.deptList = el.dataset.dlist; store.set("deptlist", S.deptList); S.msg = null; render(); });
    on("[data-dinv]", (el) => {
      const [id, part] = el.dataset.dinv.split("|"), d = deptDraft(S.deptList);
      d[id] = { ...(d[id] || {}), [part]: el.value }; store.set("deptdrafts", S.deptDrafts);
      const it = itemById(id), eq = app.querySelector(`[data-deq="${id}"]`);
      if (eq && it) eq.textContent = deptHas(it, d[id]) ? "= " + deptFeet(it, d[id]).toLocaleString("en-US") + " ft" : "";
      const items = deptItems(S.deptList), f = items.filter(i => deptHas(i, d[i.id])).length, c = app.querySelector(".invcount");
      if (c) c.textContent = `${f} of ${items.length} counted${f < items.length ? " — blanks count as 0" : ""}`;
    }, "input");
    on("[data-dsend]", async (el) => {
      const key = el.dataset.dsend, s = statusOf(key), items = deptItems(key), payload = deptPayload(items, deptDraft(key)), blanks = items.length - payload.length;
      if (!confirm(`Send the ${s.name} count for ${s.department_name || s.name}?\n\n${blanks ? `${blanks} item${blanks === 1 ? " is" : "s are"} blank and will count as 0.` : "Every item has a number."}\nIt's recorded as sent by ${S.me.name}.`)) return;
      el.disabled = true;
      const r = await rpc("send_inventory_count", { p_list: key, p_counts: payload, p_client_id: newId() });
      if (r) { delete S.deptDrafts[key + "_" + S.month]; store.set("deptdrafts", S.deptDrafts); go("month"); }
    });
    on("[data-dreopen]", async (el) => {
      const key = el.dataset.dreopen, s = statusOf(key);
      if (!confirm(`Open the ${s.name} count again? It goes back to "not sent" — here and on ${s.department_name || "the"} tablet — until someone sends it again.`)) return;
      el.disabled = true;
      await load();                                        // the numbers as sent, straight from the database
      const d = deptDraft(key);
      for (const it of deptItems(key)) {
        const c = curCount(it.id);
        d[it.id] = !it.std_length_ft ? { n: c ? c.qty : "" }
          : c && c.sticks !== null && c.sticks !== undefined ? { sticks: c.sticks, loose: c.loose_ft ?? "" } : { sticks: "", loose: c ? c.qty : "" };
      }
      store.set("deptdrafts", S.deptDrafts);
      rpc("reopen_inventory_count", { p_list: key });
    });
    on("[data-lumdone]", async (el) => { el.disabled = true; const r = await rpc("set_lumber_done", { p_done: el.dataset.lumdone === "1" }); if (r && el.dataset.lumdone === "1") go("month"); });
    on("[data-rodone]", (el) => rpc("set_rollover_done", { p_done: el.dataset.rodone === "1" }));
    on("[data-roll]", (el) => { const [job, n] = el.dataset.roll.split("|"); rpc("set_rollover", { p_job: job, p_sheet_number: Number(n), p_rolled: el.checked }); }, "change");
    on("#rkind", (el) => { S.slipKind = el.value; app.querySelectorAll("[data-for]").forEach(x => { x.hidden = x.dataset.for !== el.value; }); }, "change");
    on("[data-addslip]", () => {                          // one form for both kinds of slip; the same call as before
      const ply = val("rkind") === "plywood";
      rpc("add_inventory_receipt", ply
        ? { p_kind: "plywood", p_date: val("rd"), p_supplier: val("rs"), p_item: null, p_board_feet: null, p_sheets: Number(val("pn")) || null, p_note: null, p_client_id: newId() }
        : { p_kind: "lumber", p_date: val("rd"), p_supplier: val("rs"), p_item: val("rk") || null, p_board_feet: Number(val("rb")) || null, p_sheets: null, p_note: null, p_client_id: newId() });
    });
    on("[data-mistake]", (el) => { if (confirm("Mark this slip as entered by mistake? It stays on record but stops counting.")) rpc("mark_receipt_mistake", { p_id: el.dataset.mistake }); });
    on("[data-close]", () => { if (confirm(`Close ${monthName(S.month)}? The counts, the sheets and today's prices are saved for good, and next month's list starts with the rolled-over sheets.`)) rpc("close_inventory_month", {}); });
    on("[data-drill]", (el) => { S.drill = el.dataset.drill; render(); });
    app.querySelectorAll("[data-shut]").forEach(el => el.addEventListener("click", (e) => { if (e.target.closest("[data-stay]") && !e.target.matches("button[data-shut]")) return; S.drill = null; render(); }));
    on("[data-addrule]", () => rpc("add_thickness_rule", { p_from: Number(val("tf")) || null, p_to: Number(val("tt")) || null, p_stock: val("ts") }));
    on("[data-retirerule]", (el) => { if (confirm("Retire this rule? Tops at that thickness will need a new one.")) rpc("retire_thickness_rule", { p_id: Number(el.dataset.retirerule) }); });
    on("[data-match]", (el) => { const v = el.value; if (!v) return; rpc("set_species_match", { p_wo_species: el.dataset.match, p_inventory_species: v === "__out" ? null : v, p_leave_out: v === "__out" }); }, "change");
    on("[data-setlist]", (el) => { S.setupList = el.dataset.setlist; S.editItem = null; render(); });
    on("[data-price]", (el) => { if (el.value === "") return; rpc("set_inventory_price", { p_item: el.dataset.price, p_price: Number(el.value) }); }, "change");
    on("[data-edititem]", (el) => { S.editItem = { ...itemById(el.dataset.edititem) }; render(); });
    on("[data-canceledit]", () => { S.editItem = null; render(); });
    on("[data-retire]", (el) => { const [id, r] = el.dataset.retire.split("|"); rpc("retire_inventory_item", { p_id: id, p_retired: r === "1" }); });
    on("[data-saveitem]", async () => {
      const e = S.editItem || {}, L = S.setupList;
      const ok = await rpc("set_inventory_item", L === "lumber"
        ? { p_id: e.id || null, p_list: L, p_section: "Lumber", p_name: null, p_unit: "bd ft", p_std_length_ft: null, p_gl_account: "1201", p_species: val("ei_sp"), p_stock: val("ei_st") }
        : { p_id: e.id || null, p_list: L, p_section: val("ei_sec"), p_name: val("ei_nm"), p_unit: val("ei_un"), p_std_length_ft: Number(val("ei_len")) || null,
            p_gl_account: val("ei_gl") || null, p_species: null, p_stock: null });
      if (ok) { S.editItem = null; render(); }
    });
  }
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  function refreshCard(id, li) {
    const it = itemById(id), line = S.lines.get(id)[li], rows = rowsOf(line.bundles);
    const t = app.querySelector(`[data-tot="${id}|${li}"]`); if (t) t.innerHTML = `${fracText(rows)} rows = <b class="num">${f0(lineBf(line.length_in, line.width_in, rows, it.stock))}</b> bd ft`;
    const b = app.querySelector(`[data-bf="${id}"]`); if (b) b.textContent = `${f0(closingBf(id))} bd ft`;
  }

  // ---------- start ----------
  async function start(user) {
    const { data } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
    S.me = { id: user.id, email: user.email, name: (data && data.full_name) || user.email, role: data && data.role };
    render();
    if (S.me.role === "manager" || S.me.role === "admin") { await load(); render(); flushLines(); }
  }
  (async () => {
    const { data } = await db.auth.getSession();
    if (data && data.session) return start(data.session.user);
    app.innerHTML = `<main><div class="card" style="max-width:460px;margin:30px auto"><h2>Sign in</h2><p class="sub">Use a manager's login.</p>
      <form id="f"><div class="form" style="grid-template-columns:1fr"><label>Email<input id="e" type="email" autocomplete="username" required></label>
        <label>Password<input id="p" type="password" autocomplete="current-password" required></label><button class="btn or" type="submit">Sign in</button></div></form>
      <div id="err" class="banner" style="margin-top:14px" hidden></div></div></main>`;
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      if (r.error) { const el = document.getElementById("err"); el.hidden = false; el.textContent = friendlyError(r.error); return; }
      start(r.data.user);
    };
  })();
})();
</script>
</body>
</html>
