<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181D2E">
<title>Shop Floor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#181D2E; --orange:#ED5E0F; --bright:#F0A721; --teal:#00B4B2;
    --teal-ink:#00807E; --teal-bg:#DDF2F1; --sawdust:#FFF4D5; --gray:#C2BAA0;
    --paper:#EFEDE6; --line:#E4DFCF; --ink2:#6B7082; --warn:#8A4B00; --warn-bg:#FFF4D5;
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--midnight)}
  body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px; line-height:1.4;
       padding-bottom:env(safe-area-inset-bottom,0px); -webkit-tap-highlight-color:transparent}
  button{font:inherit; color:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--bright); outline-offset:2px}
  .num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* top bar: one row — brand, department tabs, save status, who */
  .top{position:sticky; top:0; z-index:10; background:var(--midnight); color:var(--sawdust);
       padding:env(safe-area-inset-top,0px) 16px 0}
  .top-row{display:flex; align-items:center; gap:12px; min-height:52px}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.14em; color:var(--orange); font-size:16px; white-space:nowrap}
  .who{text-align:right; font-size:14px; line-height:1.2; white-space:nowrap; color:#CFC9B8}
  .who b{font-size:16px; color:var(--sawdust)}
  .sync{margin-left:auto; font-size:13px; padding:3px 9px; border-radius:99px; background:#2C3348; color:#CFC9B8; white-space:nowrap}
  .sync.waiting{background:var(--bright); color:var(--midnight); font-weight:700}
  .sync.offline{background:#5A3A1A; color:var(--sawdust)}
  .tabs{display:flex; gap:2px; overflow-x:auto; align-self:stretch; min-width:0; flex:0 1 auto; scrollbar-width:none}
  .tab{background:none; border:none; color:#9AA0B4; padding:0 14px; min-height:52px; font-weight:600;
       border-top:4px solid transparent; border-bottom:4px solid transparent; white-space:nowrap}
  .tab[aria-current="true"]{color:var(--sawdust); border-bottom-color:var(--orange)}
  @media (max-width: 700px){ .brand{display:none} }

  main{max-width:1100px; margin:0 auto; padding:12px 14px 80px}
  .banner{border-radius:10px; padding:12px 16px; margin-bottom:14px; font-weight:600}
  .banner.warn{background:var(--warn-bg); color:var(--warn); border-left:5px solid var(--bright)}
  .banner.info{background:#fff; color:var(--ink2); border:1px solid var(--line)}
  h1{font-size:26px; margin:2px 2px 4px}
  .sub{color:var(--ink2); margin:0 2px 16px; font-size:16px}
  .back{background:none; border:none; color:var(--orange); font-weight:700; padding:10px 2px; font-size:18px}
  h2.sec{font-size:16px; color:var(--ink2); font-weight:700; margin:26px 2px 10px; letter-spacing:.01em}
  /* job and sheet screens: back link, title and job line share one line */
  .head{display:flex; align-items:baseline; flex-wrap:wrap; gap:0 14px; margin:0 0 10px}
  .head .back{padding:8px 2px}
  .head h1{margin:0; font-size:24px; white-space:nowrap}
  .head .hsub{flex:1 1 220px; min-width:0; color:var(--ink2); font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* the four areas */
  .subtabs{display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap}
  .subtab{background:#fff; border:1px solid var(--gray); border-radius:10px; padding:12px 18px; font-weight:700; color:var(--ink2); min-height:52px}
  .subtab[aria-current="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .subtab .c{margin-left:8px; color:var(--bright); font-family:'Barlow Condensed',sans-serif}

  /* queue */
  .job{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
       border-radius:12px; padding:16px 18px; margin-bottom:12px}
  .job.f-critical{border-left:8px solid var(--orange)}
  .job.f-priority{border-left:8px solid var(--bright)}
  .job-top{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
  .pid{font-weight:700; letter-spacing:.02em}
  .jname{color:var(--ink2); flex:1 1 220px; min-width:0}
  .due{color:var(--ink2); font-size:16px; white-space:nowrap}
  .due b{color:var(--midnight)}
  .tally{display:flex; align-items:center; gap:12px; margin-top:10px}
  .tally .big{font-size:40px; font-weight:700; line-height:.9}
  .tally .of{color:var(--ink2); white-space:nowrap}
  .bar{flex:1 1 auto; height:10px; background:var(--paper); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--orange); border-radius:99px}
  .tag{display:inline-block; border:1.5px solid var(--midnight); border-radius:4px; font-size:13px; font-weight:700;
       letter-spacing:.06em; padding:0 5px; margin-right:8px; vertical-align:2px}
  .chip{display:inline-block; margin-top:10px; font-size:14px; font-weight:600; padding:4px 10px; border-radius:6px;
        background:var(--warn-bg); color:var(--warn)}
  .marks{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .marks .chip{margin-top:0}
  .flagtag{display:inline-block; font-size:14px; font-weight:700; padding:4px 10px; border-radius:6px; max-width:100%}
  .flagtag.critical{background:var(--orange); color:#fff}
  .flagtag.priority{background:var(--bright); color:var(--midnight)}
  .flagtag.watch{border:1.5px solid var(--midnight); color:var(--midnight); padding:3px 9px}
  .stoptag{display:inline-block; font-size:14px; font-weight:700; padding:4px 10px; border-radius:6px; background:var(--warn-bg); color:var(--warn); border:1.5px solid var(--warn)}
  .band{border-radius:10px; padding:12px 16px; margin-bottom:14px; font-weight:600}
  .band.critical{background:var(--orange); color:#fff}
  .band.priority{background:var(--bright); color:var(--midnight)}
  .band.watch{background:#fff; border:1.5px solid var(--midnight)}
  .band.stop{background:var(--warn-bg); color:var(--warn); border:1.5px solid var(--warn)}
  .band small{display:block; font-weight:500; opacity:.85; font-size:14px}
  .empty{background:#fff; border:1px dashed var(--gray); border-radius:12px; padding:36px 20px; text-align:center; color:var(--ink2)}
  .empty b{display:block; color:var(--midnight); font-size:20px; margin-bottom:6px}

  /* job */
  .sheet{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:#fff;
         border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:10px; min-height:72px}
  .sheet .no{font-size:26px; font-weight:700; width:2.2em}
  .sheet .meta{flex:1 1 auto; min-width:0}
  .sheet .code{font-weight:700}
  .sheet .desc{color:var(--ink2); font-size:15px}
  .sheet .cnt{font-size:28px; font-weight:700; white-space:nowrap}
  .sheet.done{background:var(--teal-bg); border-color:transparent}
  .sheet.done .no,.sheet.done .cnt{color:var(--teal-ink)}

  /* sheet */
  .pager{display:flex; gap:10px; margin:0 0 10px}
  .pager button{flex:1 1 0; min-width:0; background:#fff; border:1px solid var(--gray); border-radius:10px;
                padding:6px 14px; text-align:left; font-weight:700; min-height:40px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pager button:last-child{text-align:right}
  .pager button:disabled{opacity:.35}
  .pager .pos{flex:0 0 auto; align-self:center; color:var(--ink2); font-weight:700; padding:0 6px}
  /* the counter: − count + and "Mark all done", on one row */
  .counter{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:10px}
  .count-row{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px 18px}
  .step{width:92px; height:92px; border-radius:50%; border:2px solid var(--gray); background:var(--paper);
        font-size:44px; font-weight:600; line-height:1}
  .step:disabled{opacity:.3}
  .counter .step{width:60px; height:60px; font-size:32px; flex:0 0 auto}
  .readout{display:flex; align-items:center; justify-content:center; gap:8px; min-width:150px}
  .readout .n{font-size:52px; font-weight:700; line-height:1}
  .readout .l{color:var(--ink2); font-size:16px; line-height:1.2; text-align:left}
  .readout .l small{display:block; font-size:14px}
  .all{flex:1 1 220px; height:60px; background:var(--orange); color:#fff; border:none;
       border-radius:12px; padding:0 18px; font-weight:700; font-size:19px}
  .complete{margin-top:16px; background:var(--teal-bg); color:var(--teal-ink); text-align:center; font-weight:700;
            font-size:20px; border-radius:12px; padding:16px}
  .counter .complete{flex:1 1 220px; margin:0; height:60px; padding:0 16px; display:flex; align-items:center; justify-content:center; font-size:19px}
  .page{background:#fff; border:1px solid var(--midnight); border-radius:6px; overflow:auto; margin-bottom:10px;
        -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom}
  .page img{display:block; width:100%; min-width:720px; height:auto}
  .page .missing{padding:60px 20px; text-align:center; color:var(--ink2)}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 14px}
  .actions button{flex:1 1 200px; background:#fff; border:1px solid var(--gray); border-radius:12px; padding:14px; font-weight:700; min-height:56px}

  /* log entries and lists */
  .li{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px}
  .li.open{border-left:6px solid var(--midnight)}
  .li.stop{border-left:6px solid var(--warn)}
  .li-top{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .li-top b{font-weight:700}
  .meta2{font-size:15px; color:var(--ink2); margin-top:3px}
  .st{font-size:13px; font-weight:700; padding:2px 8px; border-radius:5px; border:1.5px solid var(--midnight)}
  .st.ok{background:var(--teal-bg); color:var(--teal-ink); border-color:transparent}
  .msg{background:var(--paper); border-radius:9px; padding:10px 12px; margin-top:8px}
  .msg.answer,.msg.office_note{background:#fff; border:1.5px solid var(--midnight)}
  .msg-meta{font-size:13px; color:var(--ink2); margin-top:3px; font-weight:600}
  .rowbtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
  .rowbtns button,.btn{background:#fff; border:1px solid var(--gray); border-radius:10px; padding:12px 16px; font-weight:700; min-height:52px}
  .go,.rowbtns .go{background:var(--orange); color:#fff; border:none; border-radius:10px; padding:14px 20px; font-weight:700; min-height:54px}
  .rowbtns .step{border-radius:50%; padding:0; min-height:0; border:2px solid var(--gray); background:var(--paper)}
  .go:disabled{opacity:.4}
  .wide{display:block; width:100%}
  .taskrow{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:8px}
  .taskrow .t{flex:1 1 auto; min-width:0}
  .taskrow .when{font-size:15px; color:var(--ink2)}
  .taskrow .when b{color:var(--midnight)}
  .taskrow.ok{background:var(--teal-bg); border-color:transparent}
  .taskrow.ok .when{color:var(--teal-ink)}
  .taskrow .go{padding:12px 22px}
  .pinned{background:#fff; border:2px solid var(--midnight); border-radius:12px; padding:10px 14px 4px; margin-bottom:16px}
  .pinned h2{font-size:15px; margin:2px 0 6px; color:var(--ink2)}
  .pinned .taskrow{border:none; border-top:1px solid var(--line); border-radius:0; padding:10px 0; margin:0}
  .countline{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
  .countline:last-child{border-bottom:none}
  .countline .n{margin-left:auto; font-weight:700; font-size:22px}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .hist{font-size:15px; color:var(--ink2); margin-top:8px}
  .hist div{padding:3px 0}
  .linkish{background:none; border:none; color:var(--ink2); text-decoration:underline; padding:6px 0; font-size:15px}

  /* photos */
  .phs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .ph{position:relative; width:96px; height:96px; padding:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper); flex-shrink:0}
  .ph img{display:block; width:100%; height:100%; object-fit:cover}
  .ph .cap{position:absolute; left:0; right:0; bottom:0; background:rgba(24,29,46,.78); color:var(--sawdust); font-size:12px; font-weight:600; padding:2px 5px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ph .x{position:absolute; top:3px; right:3px; width:30px; height:30px; border-radius:50%; border:none; background:rgba(24,29,46,.8); color:#fff; font-weight:700; line-height:30px; padding:0}
  .ph.nofile{display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--ink2); padding:4px}
  .addph{display:flex; align-items:center; gap:10px; background:#fff; border:1.5px dashed var(--gray); border-radius:10px; padding:12px 16px; font-weight:700; min-height:52px; margin-top:12px; width:100%; text-align:left}
  .addph small{font-weight:500; color:var(--ink2)}
  .viewer{background:var(--midnight); border-radius:14px; width:100%; max-width:900px; max-height:94vh; overflow:auto; padding:14px; color:var(--sawdust)}
  .viewer img{display:block; max-width:100%; max-height:72vh; margin:0 auto; border-radius:6px}
  .viewer .vcap{margin:10px 2px 0; font-size:16px}
  .viewer .vcap small{display:block; color:#CFC9B8; font-size:14px}
  .viewer .mdl-btns button{background:#2C3348; color:var(--sawdust); border:none}

  /* load-out */
  .lohead{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px}
  .lohead .big{font-size:44px; font-weight:700; line-height:.9}
  .lohead .of{color:var(--ink2)}
  .losheets{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; margin-bottom:14px}
  .losheet{background:#fff; border:1.5px solid var(--gray); border-radius:12px; padding:12px; text-align:left; min-height:84px}
  .losheet .no{font-size:28px; font-weight:700; line-height:1}
  .losheet small{display:block; color:var(--ink2); font-size:13px; font-weight:600; margin-top:4px}
  .losheet.here{background:var(--teal-bg); border-color:transparent}
  .losheet.here .no, .losheet.here small{color:var(--teal-ink)}
  .losheet.earlier{background:var(--paper); border-style:dashed}

  /* forms */
  label.f{display:block; font-weight:700; margin:14px 0 6px}
  .in,textarea.in{width:100%; font:inherit; padding:14px; border:1px solid var(--gray); border-radius:10px; background:#fff; color:var(--midnight)}
  textarea.in{min-height:96px; resize:vertical}
  .picklist{max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:8px; background:#fff}
  .pj{display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid var(--line); padding:13px 14px; min-height:54px}
  .pj:last-child{border-bottom:none}
  .pj span{color:var(--ink2); font-size:15px}
  .pj[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust)}
  .pj[aria-pressed="true"] span{color:#CFC9B8}
  .chosen{display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:10px; padding:10px 14px}
  .chosen b{flex:1}
  .schips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .schip{background:#fff; border:1.5px solid var(--gray); border-radius:9px; padding:10px 14px; font-weight:700; min-width:64px; min-height:50px}
  .schip small{display:block; font-weight:500; font-size:13px; color:var(--ink2)}
  .schip[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .schip[aria-pressed="true"] small{color:#CFC9B8}
  .pick{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:14px; margin-bottom:8px; font-weight:700; min-height:54px}
  .pick[aria-pressed="true"]{background:var(--orange); color:#fff; border-color:var(--orange)}
  .chk{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; font-weight:700}
  .chk input{width:26px; height:26px; margin:0; flex-shrink:0; accent-color:var(--orange)}
  .chk small{display:block; font-weight:500; color:var(--ink2); font-size:14px}
  .seg{display:flex; gap:8px}
  .seg button{flex:1; background:#fff; border:1.5px solid var(--gray); border-radius:10px; padding:12px; font-weight:700; min-height:52px}
  .seg button[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .qty{display:flex; align-items:center; gap:14px}
  .qty .step{width:64px; height:64px; font-size:32px}
  .qty .n{font-size:44px; font-weight:700; min-width:60px; text-align:center}
  .qty.small .step{width:48px; height:48px; font-size:26px}
  .qty.small .n{font-size:30px; min-width:44px}

  /* Advance (managers): pick a job, pick a sheet, set where it is */
  .tab.adv{border-left:1px solid #2C3348; margin-left:4px}
  .advjob{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:10px; min-height:60px}
  .advjob.f-critical{border-left:8px solid var(--orange)}
  .advjob.f-priority{border-left:8px solid var(--bright)}
  .advsheet{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px}
  .advsheet .top2{display:flex; gap:12px; align-items:baseline}
  .advsheet .no{font-size:24px; font-weight:700; width:2.2em}
  .stgs{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .stg{font-size:14px; font-weight:600; padding:4px 9px; border-radius:6px; border:1px solid var(--gray); background:#fff; white-space:nowrap}
  .stg.done{background:var(--teal); border-color:var(--teal); color:#fff}
  .stg.part{background:var(--sawdust)}
  .lane{font-size:15px; font-weight:700; color:var(--ink2); margin:14px 2px 6px}
  .lane small{font-weight:500}
  .advrow{display:grid; grid-template-columns:minmax(110px,1fr) auto 280px; align-items:center; gap:10px 14px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px}
  .advrow.done{border-color:var(--teal)}
  .advrow.changed{border-color:var(--midnight)}
  .advrow .nm{font-weight:700}
  .advrow .nm small{display:block; font-weight:500; color:var(--ink2); font-size:14px}
  .advrow .cnt{display:flex; align-items:center; gap:10px}
  .advrow .cnt .n{font-size:30px; font-weight:700; min-width:76px; text-align:center; line-height:1}
  .advrow .cnt .n small{font-size:18px; color:var(--ink2); font-weight:600}
  .advrow .step{width:56px; height:56px; font-size:30px}
  .advrow .btns{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
  .advrow .btns button{background:#fff; border:1px solid var(--gray); border-radius:10px; padding:0 14px; font-weight:700; min-height:52px; white-space:nowrap}
  .advrow .btns .isdone{display:inline-flex; align-items:center; justify-content:center; background:var(--teal); border:1px solid var(--teal); color:#fff; border-radius:10px; padding:0 14px; font-weight:700; min-height:52px; min-width:112px}
  @media (max-width: 760px){ .advrow{grid-template-columns:1fr auto} .advrow .btns{grid-column:1 / -1; justify-content:stretch} .advrow .btns > *{flex:1} }
  .advsave{position:sticky; bottom:10px; z-index:5; background:var(--sawdust); border:2px solid var(--midnight); border-radius:12px; padding:12px 14px; margin:12px 0}
  .advsave .what{font-weight:600}
  .advsave .what b{font-family:'Barlow Condensed',sans-serif; font-size:19px}
  .advsave .rowbtns{margin-top:10px}

  /* modal */
  .ovl{position:fixed; inset:0; background:rgba(24,29,46,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:40}
  .mdl{background:var(--paper); border-radius:14px; width:100%; max-width:620px; max-height:92vh; overflow:auto; padding:20px}
  .mdl h3{margin:0 0 4px; font-size:22px}
  .mdl .sub{margin-bottom:10px}
  .mdl-btns{display:flex; gap:10px; margin-top:18px}

<body>
<div id="app"></div>
<div id="printArea"></div>
<!-- the camera: a plain file input that opens the tablet's rear camera -->
<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   THE TWO SETTINGS — the same two lines as upload.html.
   Publishable key only. NEVER the secret key — this file is public.
   ===================================================================== */
const SUPABASE_URL = "https://fueyfxjxlicqekaqtydi.supabase.co";
const SUPABASE_KEY = "sb_publishable_A5rEVQSSejSsQW7nhAX6iw_gNA5EZ9A";


/* ---- core: no screen code in here, so it can be tested on its own ---- */

const DEPTS = [
  ["milling", "Milling"], ["cnc", "CNC"], ["sanding", "Sanding"], ["finishing", "Finishing"],
  ["full_custom", "Full Custom"], ["metal", "Metal"], ["assembly_qc", "Assembly / QC"], ["delivery", "Delivery"],
];
const DEPT_NAME = Object.fromEntries(DEPTS);
/* Delivery is log-only for now: no work orders to count, no supplies tab. */
const LOG_ONLY = ["delivery"];
const ARROW_DEPTS = ["metal", "assembly_qc", "delivery"];
const TAB_NAME = { work: "Work orders", problems: "Problems", log: "Log", supplies: "Supplies", loadout: "Load-out" };
const PHOTO_MAX_EACH = 3;          // photos on one defect, problem or reply, from the tablet

function keyProblem(url, key) {
  if (!url || !key || url.includes("PASTE-") || key.includes("PASTE-"))
    return { secret: false, text: "The project address and key haven't been filled in yet. Copy the two SUPABASE lines from upload.html into this file (walkthrough 4, step 2)." };
  const secret = { secret: true, text: "This is the SECRET key, not the publishable one. It bypasses every security rule, and this file is public. Take it out of the file now and use the publishable key — the same one upload.html has. If this file was already put on GitHub with it, create a new secret key in Supabase so the old one stops working." };
  if (key.startsWith("sb_secret_")) return secret;
  const parts = key.split(".");
  if (parts.length === 3) {
    try { if (JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role") return secret; }
    catch (e) { /* not a readable token */ }
  }
  if (!/^https:\/\//.test(url)) return { secret: false, text: "The project address should start with https:// — copy it from upload.html." };
  return null;
}

/** Which departments this person can open. Managers can open all of them. */
function departmentsFor(me) {
  if (!me) return [];
  if (me.role === "manager" || me.role === "admin") return DEPTS.map(d => d[0]);
  return DEPTS.map(d => d[0]).filter(k => (me.departments || []).includes(k));
}
const isLogOnly = (dept) => LOG_ONLY.includes(dept);
/** The areas a department's tablet has. */
function tabsFor(dept) {
  if (dept === "delivery") return ["loadout", "problems", "log"];
  return isLogOnly(dept) ? ["problems", "log"] : ["work", "problems", "log", "supplies"];
}

/** Put any counts still waiting to send on top of what the database last said. */
function withPending(rows, outbox) {
  return rows.map(r => outbox[r.progress_id] ? { ...r, qty_done: outbox[r.progress_id].qty } : r);
}

const FLAG_RANK = { critical: 3, priority: 2, watch: 1 };
/** The strongest open flag on a job that applies to this department (whole-job flags apply everywhere). */
function flagFor(flags, jobId, dept) {
  let best = null;
  for (const f of flags || []) {
    if (f.job_id !== jobId || (f.department && f.department !== dept)) continue;
    if (!best || FLAG_RANK[f.level] > FLAG_RANK[best.level]) best = f;
  }
  return best;
}

/** One card per job that still has pieces left for this department.
 *  Critical and priority flags first, then soonest delivery. */
function buildQueue(rows, flags = [], dept = null) {
  const jobs = new Map();
  for (const r of rows) {
    if (!jobs.has(r.job_id)) jobs.set(r.job_id, {
      job_id: r.job_id, project_id: r.project_id, name: r.job_name,
      delivery_date: r.delivery_date, materials_ordered: r.materials_ordered, is_test: !!r.is_test,
      done: 0, total: 0, sheets: 0, sheetsDone: 0 });
    const j = jobs.get(r.job_id);
    j.done += Math.min(r.qty_done, r.qty_required);
    j.total += r.qty_required;
    j.sheets += 1;
    if (r.qty_done >= r.qty_required) j.sheetsDone += 1;
  }
  const pin = (j) => (j.flag && j.flag.level !== "watch") ? FLAG_RANK[j.flag.level] : 0;
  return [...jobs.values()]
    .map(j => ({ ...j, flag: flagFor(flags, j.job_id, dept) }))
    .filter(j => j.done < j.total)
    .sort((a, b) => pin(b) - pin(a)
                 || (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999")
                 || String(a.project_id).localeCompare(String(b.project_id)));
}

function jobSheets(rows, jobId) {
  return rows.filter(r => r.job_id === jobId).sort((a, b) => a.sheet_number - b.sheet_number);
}

function pagerFor(rows, jobId, progressId) {
  const list = jobSheets(rows, jobId);
  const at = list.findIndex(r => r.progress_id === progressId);
  return { at, count: list.length, prev: at > 0 ? list[at - 1] : null, next: at >= 0 && at < list.length - 1 ? list[at + 1] : null };
}

function daysLeft(iso, today = new Date()) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
function fmtDate(iso) {
  if (!iso) return "no date";
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1] + " " + d;
}
function daysText(n) {
  if (n === null) return "";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} late`;
  if (n === 0) return "due today";
  return `${n} day${n === 1 ? "" : "s"}`;
}
/** A timestamp as the local date, "YYYY-MM-DD". */
function localISO(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
/** Whole days since a timestamp or date, on the tablet's calendar. */
function daysSince(ts, today = new Date()) {
  if (!ts) return null;
  return -daysLeft(String(ts).length > 10 ? localISO(ts) : ts, today);
}
function agoText(ts, today = new Date()) {
  const n = daysSince(ts, today);
  if (n === null) return "";
  return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`;
}

/** Record a count to send. Only the latest count per sheet matters. */
function setPending(outbox, progressId, qty) {
  return { ...outbox, [progressId]: { qty, at: new Date().toISOString() } };
}

function isNetworkError(err) {
  const m = String((err && (err.message || err.details)) || err || "");
  return /failed to fetch|networkerror|load failed|network request failed|fetch failed|timeout|aborted/i.test(m);
}

/**
 * Send every waiting count. Returns { saved, refused, offline }.
 *
 * A count is sent as the number itself ("4 done"), so sending one twice
 * can never double it. `box` is { get(), set(next) } and is re-read after
 * every send, so a tap made while a count is still sending is never lost.
 */
async function flushOutbox(box, db) {
  const saved = [], refused = [];
  let offline = false;
  for (const id of Object.keys(box.get())) {
    const pending = box.get()[id];
    if (!pending) continue;
    let res;
    try {
      res = await db.from("sheet_progress").update({ qty_done: pending.qty }).eq("id", id).select("id, qty_done, state");
    } catch (e) { res = { error: e }; }

    const forget = (always) => {
      const cur = { ...box.get() };
      // keep it if it was tapped again while this one was on its way
      if (cur[id] && (always || cur[id].qty === pending.qty)) { delete cur[id]; box.set(cur); }
    };
    if (res.error) {
      if (isNetworkError(res.error)) { offline = true; break; }
      refused.push({ id, reason: res.error.message || String(res.error) });
      forget(true);
    } else if (!res.data || res.data.length === 0) {
      refused.push({ id, reason: "This login isn't allowed to change that department's counts." });
      forget(true);
    } else {
      saved.push(res.data[0]);
      forget(false);
    }
  }
  return { saved, refused, offline };
}

function newId() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (c ^ (Math.random() * 16) >> (c / 4)).toString(16));
}

/**
 * Log entries (defects, problems, replies, Arrow, QC, supplies, tasks done)
 * wait in their own box when Wi-Fi drops, in the order they were made.
 * Each carries its own id, so sending one twice can never log it twice.
 */
function queueEntry(box, fn, args, label) {
  const id = newId();
  const withId = "p_client_id" in args ? { ...args, p_client_id: args.p_client_id || id } : args;
  return { box: { ...box, [id]: { fn, args: withId, label, at: new Date().toISOString() } }, id };
}

async function flushLogbox(box, db) {
  const sent = [], refused = [];
  let offline = false;
  const ids = Object.keys(box.get()).sort((a, b) => String(box.get()[a].at).localeCompare(String(box.get()[b].at)));
  for (const id of ids) {
    const e = box.get()[id];
    if (!e) continue;
    let res;
    try { res = await db.rpc(e.fn, e.args); } catch (err) { res = { error: err }; }
    if (res && res.error) {
      if (isNetworkError(res.error)) { offline = true; break; }
      refused.push({ id, label: e.label, reason: friendlyError(res.error) });
    } else {
      sent.push({ id, label: e.label, fn: e.fn, data: res ? res.data : null });
    }
    const cur = { ...box.get() }; delete cur[id]; box.set(cur);
  }
  return { sent, refused, offline };
}

/** Routine tasks pinned to the top of a person's tablet: theirs, or nobody's in their departments, due now. */
function dueForMe(tasks, me, depts) {
  if (!me) return [];
  return (tasks || []).filter(t => !t.done_today && t.days_until <= 0 && !!t.is_test === !!me.is_test &&
      (t.assigned_to === me.id || (!t.assigned_to && (depts || []).includes(t.department))))
    .sort((a, b) => a.days_until - b.days_until || a.name.localeCompare(b.name));
}
function taskWhen(t) {
  if (t.done_today) return `Done today${t.last_done_by ? " by " + t.last_done_by : ""}`;
  const n = t.days_until;
  if (n === 0) return "Due today";
  if (n < 0) return `Overdue by ${-n} day${n === -1 ? "" : "s"}`;
  return `Due in ${n} day${n === 1 ? "" : "s"} · ${fmtDate(t.next_due)}`;
}

/** Where a problem stands, in words. */
function problemState(p) {
  if (p.status === "answered") return { label: "Answered", done: true };
  if (p.came_back) return { label: "Came back", done: false };
  if ((p.thread || []).some(m => m.kind === "office_note")) return { label: "Office replied — still open", done: false };
  return { label: "Waiting on the office", done: false };
}
/** Open ones first (work stopped, then oldest); answered ones while the job is still in production. */
function splitProblems(list) {
  const open = (list || []).filter(p => p.status === "open")
    .sort((a, b) => (b.work_stopped - a.work_stopped) || String(a.raised_at).localeCompare(String(b.raised_at)));
  const answered = (list || []).filter(p => p.status === "answered" && p.job_active !== false)
    .sort((a, b) => String(b.answered_at).localeCompare(String(a.answered_at)));
  return { open, answered };
}

/** Defect counts by type, most first. */
function defectCounts(defects) {
  const by = {};
  for (const d of defects || []) if (!d.voided) by[d.defect_type] = (by[d.defect_type] || 0) + 1;
  return Object.entries(by).map(([type, n]) => ({ type, n })).sort((a, b) => b.n - a.n || a.type.localeCompare(b.type));
}

/** A supply request's state, in words. */
function supplyLine(r, today = new Date()) {
  const who = (n) => n ? ` by ${n}` : "";
  switch (r.state) {
    case "requested": return `Waiting on the office · asked ${fmtDate(localISO(r.requested_at))}${who(r.requested_by_name)}`;
    case "ordered": return `Ordered ${agoText(r.ordered_at, today)}${who(r.ordered_by_name)} — tap Received when it's in hand`;
    case "received": return `Received ${agoText(r.received_at, today)}${who(r.received_by_name)}`;
    case "cancelled": return `Cancelled ${agoText(r.closed_at, today)}${who(r.closed_by_name)}`;
    case "not_ordering": return `Not ordering: ${r.not_ordering_reason || ""}${who(r.closed_by_name)}`;
  }
  return r.state;
}

/** The job picker: type part of the PROJ number or name. In production first, soonest delivery first. */
function filterJobs(jobs, text) {
  const t = String(text || "").trim().toLowerCase().replace(/^proj-?/, "");
  return (jobs || []).filter(j => !t || String(j.project_id).toLowerCase().includes(t) || String(j.job_name || "").toLowerCase().includes(t))
    .sort((a, b) => (b.is_active - a.is_active) || (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999")
                 || String(a.project_id).localeCompare(String(b.project_id)));
}
function sheetsText(nums) {
  const n = (nums || []).slice().sort((a, b) => a - b);
  return n.length ? `sheet${n.length === 1 ? "" : "s"} ${n.join(", ")}` : "";
}

function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. Counts are kept on this tablet and will send when the connection is back.";
  if (/invalid login credentials/i.test(m)) return "That email and password didn't match. Check them and try again.";
  if (/email not confirmed/i.test(m)) return "This login hasn't been confirmed. In Supabase → Authentication → Users, check it was created with Auto Confirm ticked.";
  if (/jwt expired|refresh token/i.test(m)) return "The sign-in has expired. Sign out and back in.";
  if (/could not find the function|schema cache|does not exist/i.test(m)) return "This part isn't set up in the database yet. Tell Luke (the SQL file for it needs running).";
  return m || "Something went wrong. Try again, and if it keeps happening, take a screenshot.";
}

/* ---- Advance: managers set where a sheet is, across departments ---- */

/** Wood work runs through these in order. Metal and Full Custom stand on their own. */
const CHAIN = ["milling", "cnc", "sanding", "finishing", "assembly_qc"];
const DEPT_ORDER = DEPTS.map(d => d[0]);

/** Who gets the Advance tab: managers, and the Test Supervisor (test jobs only — the database enforces both). */
function canAdvance(me) {
  return !!me && (me.role === "manager" || me.role === "admin" || !!me.is_test);
}

/** Jobs to pick from: in production with a work order. Critical and priority flags first, then soonest delivery. */
function advJobs(pickJobs, flags, text) {
  // across every department: the strongest open flag on the job, whole-job or one department's
  const best = (id) => (flags || []).filter(f => f.job_id === id).sort((a, b) => FLAG_RANK[b.level] - FLAG_RANK[a.level])[0] || null;
  const pin = (j) => j.flag && j.flag.level !== "watch" ? FLAG_RANK[j.flag.level] : 0;
  return filterJobs((pickJobs || []).filter(j => j.is_active && j.has_work_order), text)
    .map(j => ({ ...j, flag: best(j.job_id) }))
    .sort((a, b) => pin(b) - pin(a) || (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999")
                 || String(a.project_id).localeCompare(String(b.project_id)));
}

/** A job's rows (one per sheet per department) as sheets, each with its stages in shop order. */
function advSheets(rows) {
  const by = new Map();
  for (const r of rows || []) {
    if (!by.has(r.sheet_id)) by.set(r.sheet_id, {
      sheet_id: r.sheet_id, sheet_number: r.sheet_number, item_code: r.item_code, species: r.species, shape: r.shape,
      width: r.width, length: r.length, thickness: r.thickness, png_path: r.png_path, pdf_path: r.pdf_path,
      pages_ready: r.pages_ready, job_id: r.job_id, project_id: r.project_id, job_name: r.job_name, is_test: !!r.is_test, stages: [] });
    by.get(r.sheet_id).stages.push({ dept: r.department, progress_id: r.progress_id, qty_done: r.qty_done, qty_required: r.qty_required });
  }
  const list = [...by.values()];
  for (const s of list) s.stages.sort((a, b) => DEPT_ORDER.indexOf(a.dept) - DEPT_ORDER.indexOf(b.dept));
  return list.sort((a, b) => a.sheet_number - b.sheet_number);
}

/** The count to show for a stage: the unsaved edit if there is one, otherwise the saved count. */
const advShown = (st, edit) => (edit && st.dept in edit) ? edit[st.dept] : st.qty_done;

/** The wood stages before this one that are on this sheet. */
function advBefore(stages, dept) {
  const i = CHAIN.indexOf(dept);
  if (i <= 0) return [];
  return stages.filter(st => CHAIN.indexOf(st.dept) >= 0 && CHAIN.indexOf(st.dept) < i);
}

/** "It's here": every wood stage before this one is marked complete. It only ever fills — nothing is lowered. */
function advHere(stages, dept, edit) {
  const next = { ...(edit || {}) };
  for (const st of advBefore(stages, dept)) next[st.dept] = st.qty_required;
  return advTidy(stages, next);
}

/** Drop edits that match what's saved, so "changes" only lists real changes. */
function advTidy(stages, edit) {
  const out = {};
  for (const st of stages) if (edit && st.dept in edit && edit[st.dept] !== st.qty_done) out[st.dept] = edit[st.dept];
  return out;
}

/** What Save would change, in shop order. */
function advChanges(stages, edit) {
  return stages.filter(st => edit && st.dept in edit && edit[st.dept] !== st.qty_done)
    .map(st => ({ dept: st.dept, from: st.qty_done, to: edit[st.dept], of: st.qty_required, lower: edit[st.dept] < st.qty_done }));
}

/** Advance saves still waiting to send, laid over what the database last said (oldest first, so the newest wins). */
function withAdvPending(rows, logbox) {
  const waiting = Object.values(logbox || {}).filter(e => e.fn === "advance_sheet")
    .sort((a, b) => String(a.at).localeCompare(String(b.at)));
  if (!waiting.length) return rows;
  return (rows || []).map(r => {
    let q = r.qty_done;
    for (const e of waiting) if (e.args.p_sheet === r.sheet_id && r.department in e.args.p_counts) q = e.args.p_counts[r.department];
    return q === r.qty_done ? r : { ...r, qty_done: q };
  });
}

/* ---- photos ---- */

/** Fit a photo inside max × max pixels, keeping its shape. Never enlarges. */
function fitSize(w, h, max = 1600) {
  const s = Math.min(1, max / Math.max(w, h));
  return { w: Math.max(1, Math.round(w * s)), h: Math.max(1, Math.round(h * s)) };
}
/** Where a photo's file lives: the job's folder, the tablet's own id. The database insists on exactly this. */
function photoPath(projectId, clientId) { return `${projectId}/${clientId}.jpg`; }

function photoError(err) {
  const m = String((err && (err.message || err.error)) || err || "");
  if (/exceeded the maximum|413|too large/i.test(m)) return "The photo is too large, even after shrinking. Take it again a little further back.";
  if (/mime|415/i.test(m)) return "That isn't a photo the system can keep. Use the camera button.";
  if (/row-level security|403|unauthorized/i.test(m)) return "This login can't add photos there.";
  return friendlyError(err);
}

/**
 * Send every photo waiting on the tablet, oldest first. Returns { sent, refused, waiting, offline }.
 *
 * Each photo goes in two steps: the file into storage, then add_photo() records it
 * against its defect, problem or load-out. A photo carries its own id, and the file's
 * name is made from it, so a resend can never add it twice. If the entry it belongs to
 * hasn't reached the database yet, it waits and tries again; if that entry was never
 * going to arrive, it's dropped after three tries, with a plain message.
 * `store` is { list(), put(rec), remove(id) }; isPending(id) says whether that entry is still waiting to send.
 */
async function flushPhotobox(store, db, isPending = () => false) {
  const sent = [], refused = [], waiting = [];
  let offline = false;
  const list = (await store.list()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
  for (const rec of list) {
    let up;
    try {
      up = await db.storage.from("photos").upload(photoPath(rec.projectId, rec.id), rec.blob, { contentType: "image/jpeg", upsert: false });
    } catch (e) { up = { error: e }; }
    if (up && up.error) {
      if (isNetworkError(up.error)) { offline = true; break; }
      const already = /already exists|duplicate|409/i.test(String(up.error.message) + " " + String(up.error.statusCode || "") + " " + String(up.error.error || ""));
      if (!already) { refused.push({ id: rec.id, label: rec.label, reason: photoError(up.error) }); await store.remove(rec.id); continue; }
    }
    let res;
    try {
      res = await db.rpc("add_photo", { p_client_id: rec.id, p_kind: rec.kind, p_parent: rec.parent, p_sheet: rec.sheet ?? null,
                                        p_note: rec.note || null, p_width: rec.width || null, p_height: rec.height || null });
    } catch (e) { res = { error: e }; }
    if (res.error) {
      if (isNetworkError(res.error)) { offline = true; break; }
      refused.push({ id: rec.id, label: rec.label, reason: photoError(res.error) }); await store.remove(rec.id); continue;
    }
    if (res.data && res.data.waiting) {
      const tries = (rec.tries || 0) + 1;
      if (!isPending(rec.parent) && tries >= 3) {
        refused.push({ id: rec.id, label: rec.label, reason: "The entry this photo belonged to wasn't saved, so the photo couldn't be kept." });
        await store.remove(rec.id);
      } else { await store.put({ ...rec, tries }); waiting.push(rec.id); }
      continue;
    }
    sent.push({ id: rec.id, label: rec.label, kind: rec.kind, parent: rec.parent, data: res.data });
    await store.remove(rec.id);
  }
  return { sent, refused, waiting, offline };
}

/** A load-out's sheets: photographed on this truck (or waiting on the tablet), on an earlier truck, or not yet. */
function loadoutSheets(sheets, lo, pending = []) {
  const here = new Set((lo && lo.sheets_here) || []), earlier = new Set((lo && lo.sheets_earlier) || []);
  const hasSheet = (p) => p.sheet !== null && p.sheet !== undefined;
  const waiting = new Set(pending.filter(hasSheet).map(p => p.sheet));
  const list = (sheets || []).map(s => ({ ...s,
    here: here.has(s.sheet_number) || waiting.has(s.sheet_number),
    waiting: waiting.has(s.sheet_number) && !here.has(s.sheet_number),
    earlier: earlier.has(s.sheet_number) }));
  return {
    list, total: list.length,
    done: list.filter(s => s.here || s.earlier).length,
    onTruck: list.filter(s => s.here).map(s => s.sheet_number),
    missing: list.filter(s => !s.here && !s.earlier).map(s => s.sheet_number),
    other: ((lo && lo.other_items) || 0) + pending.filter(p => !hasSheet(p)).length,
  };
}
