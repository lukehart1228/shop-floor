    if (pageUrls.has(path)) return pageUrls.get(path);
    let blob = null;
    if ("caches" in window) {
      const key = new Request(location.origin + "/__sheet-pages__/" + encodeURIComponent(path));
      const cache = await caches.open("sheet-pages-v1");
      const hit = await cache.match(key);
      if (hit) blob = await hit.blob();
      if (!blob) {
        const { data, error } = await db.storage.from("work-orders").download(path);
        if (error) throw error;
        await cache.put(key, new Response(data, { headers: { "Content-Type": "image/png" } }));
        blob = data;
      }
    } else {
      const { data, error } = await db.storage.from("work-orders").download(path);
      if (error) throw error;
      blob = data;
    }
    const url = URL.createObjectURL(blob);
    pageUrls.set(path, url);
    return url;
  }

  let prefetching = false;
  async function prefetchPages() {
    if (prefetching) return; prefetching = true;
    const open = new Set(buildQueue(rowsNow()).map(j => j.job_id));
    for (const r of S.rows) {
      if (!open.has(r.job_id) || !r.png_path || !r.pages_ready || pageUrls.has(r.png_path)) continue;
      try { await pageImage(r.png_path); } catch (e) { break; }
    }
    prefetching = false;
  }

  // ---------- pieces used on several screens ----------
  let toastTimer = null;
  function showToast(text) {
    S.toast = text; render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, 3200);
  }

  function syncBadge() {
    const n = Object.keys(S.outbox).length, m = Object.keys(S.logbox).length, k = S.pending.length;
    if (n || m || k) {
      const parts = [];
      if (n) parts.push(`${n} count${n === 1 ? "" : "s"}`);
      if (m) parts.push(`${m} entr${m === 1 ? "y" : "ies"}`);
      if (k) parts.push(`${k} photo${k === 1 ? "" : "s"}`);
      return `<span class="sync waiting">${parts.join(" and ")} waiting to send</span>`;
    }
    if (!S.online || S.fromCache) return `<span class="sync offline">Offline</span>`;
    return `<span class="sync">All saved</span>`;
  }

  function topBar() {
    const adv = canAdvance(S.me);
    const tabs = S.depts.length > 1 || adv
      ? `<nav class="tabs">${S.depts.map(k => `<button class="tab" data-dept="${k}" aria-current="${k === S.dept && !S.adv}">${esc(DEPT_NAME[k])}</button>`).join("")}${
          adv ? `<button class="tab adv" data-adv="1" aria-current="${!!S.adv}">Advance</button>` : ""}</nav>` : "";
    return `<header class="top"><div class="top-row">
        <span class="brand">SHOP FLOOR</span>${tabs}${syncBadge()}
        <span class="who"><b>${esc(S.me.name)}</b>${S.depts.length === 1 && !adv ? ` · ${esc(DEPT_NAME[S.dept])}` : ""}</span>
      </div></header>`;
  }

  function banners() {
    let out = "";
    if (S.me && S.me.is_test) out += `<div class="banner info"><b>Test login.</b> You're seeing test jobs only. Nothing done here touches real work.</div>`;
    if (S.notice) out += `<div class="banner warn">${esc(S.notice)}</div>`;
    if (S.fromCache && S.rowsAt) {
      const t = new Date(S.rowsAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      out += `<div class="banner info">No connection — showing the list from ${esc(t)}. Counts you enter are kept and will send when the connection is back.</div>`;
    }
    return out;
  }

  function pinnedTasks() {
    const mine = dueForMe(S.tasks, S.me, S.depts);
    if (!mine.length) return "";
    return `<section class="pinned"><h2>Your routine tasks</h2>${mine.map(t => `
      <div class="taskrow"><span class="t"><b>${esc(t.name)}</b>
        <div class="when"><b>${esc(taskWhen(t))}</b> · ${esc(t.department_name)}</div></span>
        <button class="go" data-taskdone="${esc(t.id)}">Done</button></div>`).join("")}</section>`;
  }

  function subTabs() {
    const openHere = (S.problems || []).filter(p => p.status === "open" && p.department === S.dept).length;
    const dueHere = (S.tasks || []).filter(t => t.department === S.dept && !t.done_today && t.days_until <= 0 && !!t.is_test === !!(S.me && S.me.is_test)).length;
    const toReceive = (S.supplies || []).filter(r => r.state === "ordered").length;
    const openLo = (S.loadouts || []).filter(l => l.is_open).length + (S.localLoadouts || []).length;
    const count = { problems: openHere, log: dueHere, supplies: toReceive, loadout: openLo };
    return `<nav class="subtabs" aria-label="${esc(DEPT_NAME[S.dept])}">${tabs().map(t =>
      `<button class="subtab" data-tab="${t}" aria-current="${S.tab === t}">${TAB_NAME[t]}${count[t] ? `<span class="c">${count[t]}</span>` : ""}</button>`).join("")}</nav>`;
  }

  function flagTag(f) {
    if (!f) return "";
    const word = { critical: "Critical", priority: "Priority", watch: "Watch" }[f.level];
    return `<span class="flagtag ${f.level}">${word} — ${esc(f.note)}</span>`;
  }
  function flagBand(f) {
    if (!f) return "";
    const word = { critical: "Critical", priority: "Priority", watch: "Watch" }[f.level];
    return `<div class="band ${f.level}">${word}: ${esc(f.note)}<small>Set by ${esc(f.set_by_name || "the office")}, ${esc(agoText(f.set_at))}${f.department_name ? ` · ${esc(f.department_name)} only` : ""}</small></div>`;
  }
  const stoppedOn = (jobId, sheet) => (S.piece[jobId + "|" + sheet] || { problems: [] }).problems
    .filter(p => p.status === "open" && p.work_stopped && p.department === S.dept);

  function missingNote(part) {
    return S.missing[part] ? `<div class="banner warn">This part isn't set up in the database yet. Tell Luke — its SQL file needs running.</div>` : "";
  }

  // ---------- Work orders ----------
  function queueScreen() {
    const q = buildQueue(rowsNow(), S.flags, S.dept);
    const pieces = q.reduce((a, j) => a + (j.total - j.done), 0);
    const head = `<h1>${esc(DEPT_NAME[S.dept])}</h1>
      <p class="sub">${q.length} job${q.length === 1 ? "" : "s"} · ${pieces} piece${pieces === 1 ? "" : "s"} left</p>`;
    if (!S.rows.length && S.loading) return head + `<div class="empty">Loading…</div>`;
    if (!q.length) return head + `<div class="empty"><b>Nothing waiting</b>Every sheet for ${esc(DEPT_NAME[S.dept])} is finished. New work appears here by itself.</div>`;
    return head + q.map(j => {
      const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
      const dl = daysLeft(j.delivery_date);
      const marks = [flagTag(j.flag), j.materials_ordered ? "" : `<span class="chip">Materials not ordered yet</span>`].filter(Boolean);
      return `<button class="job${j.flag && j.flag.level !== "watch" ? " f-" + j.flag.level : ""}" data-job="${esc(j.job_id)}">
        <div class="job-top"><span class="pid">${j.is_test ? `<span class="tag">TEST</span>` : ""}${esc(j.project_id)}</span><span class="jname">${esc(j.name)}</span>
          <span class="due">Due ${esc(fmtDate(j.delivery_date))}${dl === null ? "" : ` · <b>${esc(daysText(dl))}</b>`}</span></div>
        <div class="tally"><span class="big num">${j.done}</span><span class="of num">/ ${j.total} pieces</span>
          <span class="bar"><i style="width:${pct}%"></i></span></div>
        ${marks.length ? `<div class="marks">${marks.join("")}</div>` : ""}
      </button>`;
    }).join("");
  }

  function jobScreen() {
    const list = jobSheets(rowsNow(), S.view.jobId);
    if (!list.length) { S.view = { screen: "queue" }; return queueScreen(); }
    const j = list[0];
    const done = list.reduce((a, r) => a + Math.min(r.qty_done, r.qty_required), 0);
    const total = list.reduce((a, r) => a + r.qty_required, 0);
    return `<div class="head"><button class="back" data-back="queue">← ${esc(DEPT_NAME[S.dept])}</button>
      <h1>${j.is_test ? `<span class="tag">TEST</span>` : ""}${esc(j.project_id)}</h1>
      <span class="hsub">${esc(j.job_name)} · due ${esc(fmtDate(j.delivery_date))} · ${done} of ${total} pieces done</span></div>
      ${flagBand(flagFor(S.flags, j.job_id, S.dept))}
      ${j.materials_ordered ? "" : `<div class="banner warn">Materials for this job haven't been marked as ordered in Monday yet.</div>`}
      ${list.map(r => {
        const full = r.qty_done >= r.qty_required;
        const size = [r.width, r.length, r.thickness].filter(Boolean).join(" × ");
        return `<button class="sheet${full ? " done" : ""}" data-sheet="${esc(r.progress_id)}">
          <span class="no num">${r.sheet_number}</span>
          <span class="meta"><span class="code">${esc(r.item_code || "Sheet " + r.sheet_number)}</span>
            <span class="desc">${esc([r.species, r.shape, size].filter(Boolean).join(" · "))}</span></span>
          <span class="cnt num">${r.qty_done} / ${r.qty_required}</span></button>`;
      }).join("")}`;
  }

  function sheetScreen() {
    const rows = rowsNow();
    const r = rows.find(x => x.progress_id === S.view.progressId);
    if (!r) { S.view = { screen: "job", jobId: S.view.jobId }; return jobScreen(); }
    const p = pagerFor(rows, r.job_id, r.progress_id);
    const full = r.qty_done >= r.qty_required;
    const pager = `<div class="pager">
      <button data-goto="${p.prev ? esc(p.prev.progress_id) : ""}" ${p.prev ? "" : "disabled"}>← ${p.prev ? `Sheet ${p.prev.sheet_number} · ${esc(p.prev.item_code || "")}` : "Previous"}</button>
      <span class="pos num">${p.at + 1} / ${p.count}</span>
      <button data-goto="${p.next ? esc(p.next.progress_id) : ""}" ${p.next ? "" : "disabled"}>${p.next ? `Sheet ${p.next.sheet_number} · ${esc(p.next.item_code || "")}` : "Next"} →</button>
    </div>`;
    const stopped = stoppedOn(r.job_id, r.sheet_number);
    return `<div class="head"><button class="back" data-back="job">← ${r.is_test ? "TEST " : ""}${esc(r.project_id)}</button>
      <h1>Sheet ${r.sheet_number} · ${esc(r.item_code || "")}</h1>
      <span class="hsub">${esc(r.job_name)}</span></div>
      ${pager}
      ${flagBand(flagFor(S.flags, r.job_id, S.dept))}
      ${stopped.length ? `<div class="band stop">Work is stopped on this sheet — ${esc(stopped[0].body)}<small>Raised by ${esc(stopped[0].raised_by_name)}, ${esc(agoText(stopped[0].raised_at))}. It clears when the office answers.</small></div>` : ""}
      <div class="counter">
        <div class="count-row">
          <button class="step" data-step="-1" ${r.qty_done <= 0 ? "disabled" : ""} aria-label="One fewer">−</button>
          <div class="readout"><div class="n num">${r.qty_done}</div><div class="l">of ${r.qty_required} done<small>${esc(DEPT_NAME[S.dept])}</small></div></div>
          <button class="step" data-step="1" ${full ? "disabled" : ""} aria-label="One more">+</button>
          ${full ? `<div class="complete">Sheet complete</div>` : `<button class="all" data-all="${r.qty_required}">Mark all ${r.qty_required} done</button>`}
        </div>
      </div>
      <div class="page" id="page">${r.png_path && r.pages_ready ? `<div class="missing">Loading the page…</div>` : `<div class="missing">This sheet's page hasn't been uploaded yet.</div>`}</div>
      <div class="actions">
        <button data-print="1" ${r.png_path && r.pages_ready ? "" : "disabled"}>Print this sheet</button>
        <button data-pdf="1" ${r.pdf_path && r.pages_ready ? "" : "disabled"}>Open the PDF</button>
      </div>
      <div class="actions">
        <button data-defect="here">Log a defect</button>
        <button data-problem="here">Flag a problem</button>
        ${S.dept === "assembly_qc" ? `<button data-qcsheet="${r.sheet_number}" data-qcjob="${esc(r.job_id)}">Record QC</button>` : ""}
      </div>
      ${pager}
      ${pieceSection(r)}`;
  }

  function pieceSection(r) {
    const k = S.piece[r.job_id + "|" + r.sheet_number];
    if (!k) return "";
    const items = [
      ...k.problems.map(x => ({ at: x.raised_at, html: `<div class="li ${x.status === "open" ? (x.work_stopped ? "stop" : "open") : ""}">
          <div class="li-top"><b>${esc(x.department_name)}</b><span class="meta2">${x.sheet_number === null ? "whole job · " : ""}${esc(problemState(x).label)} · ${esc(fmtDate(localISO(x.raised_at)))}</span></div>
          <div>${esc(x.body)}</div><div class="meta2">Raised by ${esc(x.raised_by_name)}</div>${photoStrip(photosOn("problem_id", x.id))}</div>` })),
      ...k.defects.map(x => ({ at: x.logged_at, html: `<div class="li"><div class="li-top"><b>${esc(x.department_name)}</b><span class="meta2">Defect · ${esc(fmtDate(localISO(x.logged_at)))}</span></div>
          <div>${esc(x.defect_type)}</div>${x.note ? `<div class="meta2">${esc(x.note)}</div>` : ""}<div class="meta2">Logged by ${esc(x.logged_by_name)}</div>${photoStrip(photosOn("defect_id", x.id))}</div>` })),
      ...k.qc.map(x => ({ at: x.checked_at, html: `<div class="li"><div class="li-top"><b>QC ${x.result === "pass" ? "passed" : "failed"}</b><span class="meta2">${esc(fmtDate(localISO(x.checked_at)))} · ${esc(x.checked_by_name)}</span></div>${x.note ? `<div>${esc(x.note)}</div>` : ""}</div>` })),
    ].sort((a, b) => String(b.at).localeCompare(String(a.at)));
    if (!items.length) return "";
    return `<h2 class="sec">On this piece</h2>${items.map(i => i.html).join("")}
      <p class="sub">Everything logged against this sheet, by any department. It follows the piece down the line.</p>`;
  }

  // ---------- Problems ----------
  function problemCard(p, canAct) {
    const st = problemState(p);
    const thread = (p.thread || []).map(m => `<div class="msg ${esc(m.kind)}"><div>${esc(m.body)}</div>
        <div class="msg-meta">${esc(m.by)} · ${esc(fmtDate(localISO(m.at)))}${m.kind === "answer" ? " · answered" : ""}</div></div>`).join("");
    return `<div class="li ${p.status === "open" ? (p.work_stopped ? "stop" : "open") : ""}">
      <div class="li-top"><b>${p.is_test ? `<span class="tag">TEST</span>` : ""}${esc(p.project_id)}${p.sheet_number !== null ? ` · sheet ${p.sheet_number}` : " · whole job"}</b>
        <span class="meta2">${esc(p.department_name)}</span>
        ${p.status === "open" && p.work_stopped ? `<span class="stoptag">Work stopped</span>` : ""}
        <span class="st${st.done ? " ok" : ""}">${esc(st.label)}</span></div>
      <div class="msg"><div>${esc(p.body)}</div><div class="msg-meta">${esc(p.raised_by_name)} · ${esc(fmtDate(localISO(p.raised_at)))}</div></div>
      ${thread}
      ${photoStrip(photosOn("problem_id", p.id), pendingOn(p.id))}
      ${canAct ? `<div class="rowbtns"><button data-reply="${esc(p.id)}">${p.status === "answered" ? "Reply — this isn't settled" : "Add something"}</button></div>` : ""}
    </div>`;
  }
  function problemsScreen() {
    const all = S.probScope === "all";
    const { open, answered } = splitProblems(S.problems);
    const can = (p) => owns(p.department) && !!p.is_test === !!S.me.is_test && S.me.role === "supervisor";
    return `${missingNote("problems")}
      <div class="seg" style="margin-bottom:14px">
        <button data-scope="mine" aria-pressed="${!all}">${esc(DEPT_NAME[S.dept])}</button>
        <button data-scope="all" aria-pressed="${all}">Every department</button></div>
      <button class="go wide" data-problem="pick">Flag a problem</button>
      <h2 class="sec">Waiting on an answer</h2>
      ${open.length ? open.map(p => problemCard(p, can(p))).join("")
        : `<div class="empty"><b>Nothing open</b>Problems you flag stay here until the office answers them.</div>`}
      <h2 class="sec">Answered — kept while the job is in production</h2>
      ${answered.length ? answered.map(p => problemCard(p, can(p))).join("") : `<div class="empty">No answered problems yet.</div>`}`;
  }

  // ---------- Log ----------
  function tasksSection() {
    const mine = (S.tasks || []).filter(t => t.department === S.dept && !!t.is_test === !!S.me.is_test)
      .sort((a, b) => (a.done_today - b.done_today) || a.days_until - b.days_until || a.name.localeCompare(b.name));
    return `<h2 class="sec">Routine tasks</h2>${missingNote("tasks")}
      ${mine.length ? mine.map(t => {
        const open = S.openTask === t.id;
        return `<div class="taskrow${t.done_today ? " ok" : ""}"><span class="t"><b>${esc(t.name)}</b>
            <div class="when"><b>${esc(taskWhen(t))}</b> · ${esc(t.schedule_text)}${t.assigned_to_name ? ` · ${esc(t.assigned_to_name)}` : ""}</div>
            <button class="linkish" data-taskhist="${esc(t.id)}">${open ? "Hide history" : "History"}</button>
            ${open ? `<div class="hist">${(t.history || []).length ? t.history.map(h => `<div>${esc(fmtDate(h.on))} — ${esc(h.by)}${h.by_id === S.me.id && h.on === localISO(new Date()) ? ` <button class="linkish" data-taskundo="${esc(h.id)}">entered by mistake</button>` : ""}</div>`).join("") : "<div>Never done yet</div>"}</div>` : ""}
          </span>${t.done_today ? "" : `<button class="go" data-taskdone="${esc(t.id)}">Done</button>`}</div>`;
      }).join("") : `<div class="empty">No routine tasks for ${esc(DEPT_NAME[S.dept])}. The office adds them.</div>`}`;
  }

  function defectsSection() {
    const month = localISO(new Date()).slice(0, 7);
    const thisMonth = S.defects.filter(d => localISO(d.logged_at).slice(0, 7) === month).length;
    const counts = defectCounts(S.defects);
    const recent = S.defects.slice(0, 6);
    return `<h2 class="sec">Defects</h2>${missingNote("defects")}
      <button class="btn wide" data-defect="pick">Log a defect</button>
      <div class="card" style="margin-top:12px">
        <div class="countline"><b>Logged this month</b><span class="n num">${thisMonth}</span></div>
        ${counts.map(c => `<div class="countline"><span>${esc(c.type)}</span><span class="n num">${c.n}</span></div>`).join("")}
        ${counts.length ? `<p class="meta2" style="margin:8px 0 0">Counts by type are for all time.</p>` : `<p class="meta2">No defects logged for ${esc(DEPT_NAME[S.dept])} yet.</p>`}
      </div>
      ${recent.length ? `<h2 class="sec">Most recent</h2>` + recent.map(d => `<div class="li">
        <div class="li-top"><b>${d.is_test ? `<span class="tag">TEST</span>` : ""}${esc(d.project_id)}${d.sheet_number !== null ? ` · sheet ${d.sheet_number}` : " · whole job"}</b>
          <span class="meta2">${esc(fmtDate(localISO(d.logged_at)))}</span></div>
        <div>${esc(d.defect_type)}</div>${d.note ? `<div class="meta2">${esc(d.note)}</div>` : ""}
        <div class="meta2">Logged by ${esc(d.logged_by_name)}${d.logged_by === S.me.id ? ` · <button class="linkish" data-voiddefect="${esc(d.id)}">entered by mistake</button>` : ""}</div></div>`).join("") : ""}`;
  }

  function jobPicker(sel, filterText, opts = {}) {
    const jobs = filterJobs(S.pickJobs, filterText).filter(j => !opts.withWorkOrder || j.has_work_order);
    if (sel) {
      const j = S.pickJobs.find(x => x.job_id === sel) || { project_id: "…", job_name: "" };
      return `<div class="chosen"><b>${j.is_test ? `<span class="tag">TEST</span>` : ""}${esc(j.project_id)} <span class="meta2">${esc(j.job_name)}</span></b>
        <button class="btn" data-pickjob="">Change</button></div>`;
    }
    return `<input class="in" data-jobfilter placeholder="Type part of the PROJ number or name" value="${esc(filterText || "")}" inputmode="search" autocomplete="off">
      <div class="picklist">${jobs.length ? jobs.slice(0, 60).map(j => `<button class="pj" data-pickjob="${esc(j.job_id)}"><b>${j.is_test ? "TEST " : ""}${esc(j.project_id)}</b>
          <span>${esc(j.job_name)} · ${j.is_active ? "due " + esc(fmtDate(j.delivery_date)) : esc(j.phase)}</span></button>`).join("")
        : `<div class="meta2" style="padding:14px">${S.pickJobs.length ? "No job matches that." : "Loading the jobs…"}</div>`}</div>`;
  }
  function sheetChips(jobId, chosen, multi, opts = {}) {
    const sheets = (S.pickSheets[jobId] || []).filter(s => !opts.dept || (s.departments || []).includes(opts.dept));
    if (!S.pickSheets[jobId]) return `<div class="meta2">Loading the sheets…</div>`;
    const isOn = (n) => multi ? chosen.includes(n) : chosen === n;
    return `<div class="schips">${opts.allowNone ? `<button class="schip" data-picksheet="" aria-pressed="${chosen === null}">Whole job<small>no sheet</small></button>` : ""}
      ${sheets.map(s => `<button class="schip" data-picksheet="${s.sheet_number}" aria-pressed="${isOn(s.sheet_number)}">${s.sheet_number}<small>${esc(s.item_code || "")}</small></button>`).join("")}
      ${!sheets.length ? `<span class="meta2">${S.sheetsUnavailable === jobId
          ? "No connection, so the sheets can't be listed right now." + (opts.allowNone ? " Log it against the whole job, or wait for the Wi-Fi." : "")
          : opts.allowNone ? "No work order uploaded — this logs against the whole job." : "No sheets."}</span>` : ""}</div>`;
  }

  function arrowSection() {
    const f = S.arrowForm;
    const out = S.arrow.filter(a => a.at_vendor).sort((a, b) => b.days_out - a.days_out);
    const back = S.arrow.filter(a => !a.at_vendor && a.returned_on && daysSince(a.returned_on) <= 92)
      .sort((a, b) => String(b.returned_on).localeCompare(String(a.returned_on)));
    const what = (a) => [sheetsText(a.sheet_numbers), a.description].filter(Boolean).join(" — ");
    const form = f ? `<div class="card">
        <h3 style="margin:0 0 6px">Send to Arrow</h3>
        <label class="f">Job</label>${jobPicker(f.jobId, f.filter)}
        ${f.jobId ? `<label class="f">Sheets that went <span class="meta2">(tick any — or none, for hardware)</span></label>${sheetChips(f.jobId, f.sheets, true)}` : ""}
        <label class="f" for="arDesc">What went</label>
        <input class="in" id="arDesc" data-arfield="description" value="${esc(f.description)}" placeholder="e.g. bases and 8 brackets, black">
        <label class="f">Service</label>
        <div class="seg"><button data-arservice="powdercoat" aria-pressed="${f.service === "powdercoat"}">Powdercoat</button>
          <button data-arservice="paint" aria-pressed="${f.service === "paint"}">Paint</button></div>
        <label class="f" for="arDate">Date sent</label>
        <input class="in" type="date" id="arDate" data-arfield="sentOn" value="${esc(f.sentOn)}" max="${localISO(new Date())}">
        <div class="mdl-btns"><button class="btn" data-arcancel="1">Cancel</button>
          <button class="go" data-arsend="1" ${f.jobId && (f.sheets.length || f.description.trim()) ? "" : "disabled"}>Send to Arrow</button></div>
      </div>` : `<button class="btn wide" data-aropen="1">Send something to Arrow</button>`;
    return `<h2 class="sec">At Arrow</h2>${missingNote("arrow")}${form}
      <h2 class="sec">At Arrow now</h2>
      ${out.length ? out.map(a => `<div class="li"><div class="li-top"><b>${a.is_test ? `<span class="tag">TEST</span>` : ""}${esc(a.project_id)}</b>
          <span class="meta2">${esc(a.service === "paint" ? "Paint" : "Powdercoat")} · sent ${esc(fmtDate(a.sent_on))} by ${esc(a.sent_by_name)}</span>
          <span class="st">${a.days_out} day${a.days_out === 1 ? "" : "s"} out</span></div>
        <div>${esc(what(a))}</div>
        <div class="rowbtns"><button data-arreturn="${esc(a.id)}">Mark returned</button>
          ${owns(a.department) ? `<button data-arvoid="${esc(a.id)}">Entered by mistake</button>` : ""}</div></div>`).join("")
        : `<div class="empty">Nothing at Arrow right now.</div>`}
      ${back.length ? `<h2 class="sec">Returned — last three months</h2>` + back.map(a => `<div class="li">
          <div class="li-top"><b>${esc(a.project_id)}</b><span class="meta2">${esc(fmtDate(a.sent_on))} → ${esc(fmtDate(a.returned_on))} · ${a.days_out} day${a.days_out === 1 ? "" : "s"}${a.returned_by_name ? ` · back by ${esc(a.returned_by_name)}` : ""}</span></div>
          <div>${esc(what(a))}</div></div>`).join("") : ""}`;
  }

  function qcSection() {
    const jobId = S.qcJob;
    let body = "";
    if (jobId) {
      const sheets = (S.pickSheets[jobId] || []).filter(s => (s.departments || []).includes("assembly_qc"));
      const latest = (n) => S.qcEntries.filter(q => q.sheet_number === n).sort((a, b) => String(b.checked_at).localeCompare(String(a.checked_at)))[0];
      body = !S.pickSheets[jobId] ? `<div class="meta2">Loading the sheets…</div>` : sheets.length ? sheets.map(s => {
        const l = latest(s.sheet_number);
        return `<div class="taskrow${l && l.result === "pass" ? " ok" : ""}"><span class="t"><b>Sheet ${s.sheet_number} · ${esc(s.item_code || "")}</b>
          <div class="when">${l ? `${l.result === "pass" ? "Passed" : "Failed"} ${esc(fmtDate(localISO(l.checked_at)))} · ${esc(l.checked_by_name)}${l.note ? " — " + esc(l.note) : ""}` : "Not checked yet"}</div></span>
          <button class="btn" data-qcpass="${s.sheet_number}">Passed</button><button class="btn" data-qcfail="${s.sheet_number}">Failed…</button></div>`;
      }).join("") : `<div class="empty">No sheets on this job come to Assembly / QC.</div>`;
    }
    return `<h2 class="sec">QC</h2>${missingNote("qc")}
      <div class="card"><label class="f" style="margin-top:0">Look up a job</label>${jobPicker(jobId, S.qcFilter, { withWorkOrder: true })}</div>
      ${body}`;
  }

  function logScreen() {
    let out = "";
    if (ARROW_DEPTS.includes(S.dept)) out += arrowSection();
    if (S.dept === "assembly_qc") out += qcSection();
    return tasksSection() + out + defectsSection();
  }

  // ---------- Supplies ----------
  function suppliesScreen() {
    const open = S.supplies.filter(r => r.is_open).sort((a, b) => String(a.requested_at).localeCompare(String(b.requested_at)));
    const closed = S.supplies.filter(r => !r.is_open && daysSince(r.updated_at) <= 14)
      .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
    const f = S.supplyForm;
    return `${missingNote("supplies")}<h2 class="sec" style="margin-top:4px">Open for ${esc(DEPT_NAME[S.dept])}</h2>
      ${open.length ? open.map(r => `<div class="li"><div class="li-top"><b>${r.is_test ? `<span class="tag">TEST</span>` : ""}${esc(r.item)}</b></div>
          ${r.note ? `<div class="meta2">${esc(r.note)}</div>` : ""}
          <div class="meta2">${esc(supplyLine(r))}</div>
          <div class="rowbtns" style="align-items:center">
            ${r.state === "requested" ? `<div class="qty small"><button class="step" data-sqty="${esc(r.id)}" data-d="-1" ${r.qty <= 1 ? "disabled" : ""} aria-label="One fewer">−</button>
              <span class="n num">${r.qty}</span><button class="step" data-sqty="${esc(r.id)}" data-d="1" aria-label="One more">+</button></div>
              <button data-scancel="${esc(r.id)}">Cancel</button>` : `<span class="num" style="font-size:26px;font-weight:700">${r.qty}</span>
              <button class="go" data-sreceive="${esc(r.id)}">Received</button>`}
          </div></div>`).join("")
        : `<div class="empty">Nothing on order for ${esc(DEPT_NAME[S.dept])}.</div>`}
      <div class="card" style="margin-top:18px">
        <label class="f" style="margin-top:0" for="supItem">What do you need?</label>
        <textarea class="in" id="supItem" data-sfield="item" placeholder="e.g. 120 grit discs, 6 inch, hook and loop">${esc(f.item)}</textarea>
        <label class="f">How many?</label>
        <div class="qty"><button class="step" data-snew="-1" ${f.qty <= 1 ? "disabled" : ""} aria-label="One fewer">−</button>
          <span class="n num">${f.qty}</span><button class="step" data-snew="1" aria-label="One more">+</button></div>
        <label class="f" for="supNote">Note <span class="meta2">(optional)</span></label>
        <input class="in" id="supNote" data-sfield="note" value="${esc(f.note)}" placeholder="e.g. the red box, not the blue one">
        <button class="go wide" style="margin-top:16px" data-ssend="1" ${f.item.trim() ? "" : "disabled"}>Send to the office</button>
      </div>
      ${closed.length ? `<h2 class="sec">Closed in the last two weeks</h2>` + closed.map(r => `<div class="li">
          <div class="li-top"><b>${esc(r.qty)} × ${esc(r.item)}</b></div><div class="meta2">${esc(supplyLine(r))}</div></div>`).join("") : ""}`;
  }

  // ---------- Load-out (Delivery) ----------
  // Every item or pallet is photographed against its sheet before the truck leaves,
  // so the photos double as a check that everything's on board.
  function loadoutLine(lo) {
    const pend = S.pending.filter(x => x.parent === lo.client_id), has = (x) => x.sheet !== null && x.sheet !== undefined;
    const done = new Set([...(lo.sheets_here || []), ...(lo.sheets_earlier || []), ...pend.filter(has).map(x => x.sheet)]).size;
    const other = (lo.other_items || 0) + pend.filter(x => !has(x)).length;
    const total = lo.sheets_total ?? (S.pickSheets[lo.job_id] || []).length;
    const count = total ? `${done} of ${total} sheets photographed` : `${done} sheet${done === 1 ? "" : "s"} photographed`;
    return count + (other ? ` · ${other} other item${other === 1 ? "" : "s"}` : "");
  }
  function loadoutScreen() {
    const lo = currentLoadout();
    if (lo) return loadoutDetail(lo);
    const open = [...S.localLoadouts.map(l => ({ ...l, local: true, is_open: true })), ...S.loadouts.filter(l => l.is_open)];
    const done = S.loadouts.filter(l => !l.is_open).sort((a, b) => String(b.finished_at).localeCompare(String(a.finished_at)));
    const f = S.loForm;
    const already = f.jobId && open.find(l => l.job_id === f.jobId);
    return `${missingNote("loadouts")}
      <div class="card"><h3 style="margin:0 0 4px">Start a load-out</h3>
        <p class="sub" style="margin:0 0 6px">Pick the job going on the truck. Then photograph each item or pallet against its sheet.</p>
        ${jobPicker(f.jobId, f.filter)}
        ${already ? `<div class="banner info" style="margin:12px 0 0">${esc(already.project_id)} already has a load-out open, started ${esc(agoText(already.started_at))}. Carry on with it, or start another for a second truck.
            <div class="rowbtns"><button data-loopen="${esc(already.client_id)}">Carry on with it</button></div></div>` : ""}
        <button class="go wide" style="margin-top:14px" data-lostart="1" ${f.jobId ? "" : "disabled"}>Start load-out</button></div>
      <h2 class="sec">Open load-outs</h2>
      ${open.length ? open.map(l => `<button class="job" data-loopen="${esc(l.client_id)}">
          <div class="job-top"><span class="pid">${l.is_test ? `<span class="tag">TEST</span>` : ""}${esc(l.project_id)}</span><span class="jname">${esc(l.job_name)}</span>
            <span class="due">started ${esc(agoText(l.started_at))}${l.started_by_name ? ` by ${esc(l.started_by_name)}` : ""}</span></div>
          <div class="meta2" style="margin-top:6px">${l.local ? "Waiting to send · " : ""}${esc(loadoutLine(l))}</div></button>`).join("")
        : `<div class="empty"><b>No load-out open</b>Start one above when a truck is being loaded.</div>`}
      ${done.length ? `<h2 class="sec">Left in the last two weeks</h2>` + done.map(l => `<div class="li">
          <div class="li-top"><b>${l.is_test ? `<span class="tag">TEST</span>` : ""}${esc(l.project_id)}</b><span class="meta2">${esc(l.job_name)}</span></div>
          <div class="meta2">Left ${esc(fmtDate(localISO(l.finished_at)))}${l.finished_by_name ? ` · ${esc(l.finished_by_name)}` : ""} · ${esc(loadoutLine(l))}</div></div>`).join("") : ""}`;
  }
  function loadoutDetail(lo) {
    const sheets = S.pickSheets[lo.job_id];
    const mine = S.pending.filter(x => x.parent === lo.client_id);
    const p = loadoutSheets(sheets || [], lo, mine);
    const canFinish = !lo.finished_at;
    const photos = S.loPhotos.filter(x => x.loadout_id === lo.id);
    const cap = (x) => x.sheet !== undefined ? (x.sheet !== null ? `Sheet ${x.sheet}` : x.note) : (x.sheet_number !== null ? `Sheet ${x.sheet_number}` : x.note);
    return `<button class="back" data-loback="1">← Load-outs</button>
      <h1>${lo.is_test ? `<span class="tag">TEST</span>` : ""}${esc(lo.project_id)}</h1>
      <p class="sub">${esc(lo.job_name)} · load-out started ${esc(agoText(lo.started_at))}${lo.started_by_name ? ` by ${esc(lo.started_by_name)}` : ""}${lo.id ? "" : " · waiting to send"}</p>
      <div class="lohead">
        ${p.total ? `<div class="tally"><span class="big num">${p.done}</span> <span class="of num">of ${p.total} sheets photographed</span></div>`
                  : `<div><b>No work order uploaded.</b> Photograph each item and say what it is.</div>`}
        <div class="meta2" style="margin-top:6px">On this truck: ${p.onTruck.length ? esc(sheetsText(p.onTruck)) : "no sheets yet"}${p.other ? ` · ${p.other} other item${p.other === 1 ? "" : "s"}` : ""}${
          p.list.some(s => s.earlier) ? ` · went earlier: ${esc(sheetsText(p.list.filter(s => s.earlier).map(s => s.sheet_number)))}` : ""}</div>
      </div>
      ${sheets === undefined ? `<div class="meta2">Loading the sheets…</div>` : ""}
      ${p.list.length ? `<p class="sub" style="margin:0 0 8px">Tap a sheet to photograph it. Tap again for another photo of the same sheet.</p>
        <div class="losheets">${p.list.map(s => `<button class="losheet${s.here ? " here" : s.earlier ? " earlier" : ""}" data-loshoot="${s.sheet_number}">
          <span class="no num">${s.sheet_number}</span><small>${esc(s.item_code || "")}</small>
          <small>${s.waiting ? "Photographed · waiting to send" : s.here ? "Photographed" : s.earlier ? "Went on an earlier truck" : "Not photographed"}</small></button>`).join("")}</div>` : ""}
      <div class="card"><label class="f" style="margin-top:0" for="loItem">Something with no sheet</label>
        <input class="in" id="loItem" data-loitem="1" value="${esc(S.loItem)}" placeholder="e.g. hardware box, 2 of 2">
        <button class="addph" data-loshootitem="1" ${S.loItem.trim() ? "" : "disabled"}>Photograph it</button></div>
      ${photos.length || mine.length ? `<h2 class="sec">Photos on this load-out</h2>
        <div class="phs">${photos.map(x => `<button class="ph" data-viewphoto="${esc(x.id)}"><img alt="" data-photopath="${esc(x.storage_path)}"><span class="cap">${esc(cap(x))}</span></button>`).join("")}
          ${mine.map(x => `<span class="ph"><img alt="" src="${esc(x.url)}"><span class="cap">${esc(cap(x))} · waiting</span></span>`).join("")}</div>` : ""}
      ${canFinish ? `<button class="go wide" style="margin-top:18px" data-lofinish="1">The truck is leaving — finish this load-out</button>` : `<div class="complete">Finished</div>`}
      ${lo.started_by === S.me.id || !lo.id ? `<p style="text-align:center"><button class="linkish" data-lovoid="1">This load-out was started by mistake</button></p>` : ""}`;
  }

  // ---------- modals ----------
  /** Optional photos on a defect, problem or reply: a second tap, never required. */
  function modalPhotos(m) {
    const shots = m.shots || [];
    return `${shots.length ? `<div class="phs">${shots.map((p, i) => `<span class="ph"><img alt="Photo ${i + 1}" src="${esc(p.url)}">
        <button class="x" data-dropshot="${i}" aria-label="Remove photo ${i + 1}">×</button></span>`).join("")}</div>` : ""}
      ${shots.length < PHOTO_MAX_EACH ? `<button class="addph" data-addshot="1">Add a photo <small>optional${shots.length ? ` · ${shots.length} of ${PHOTO_MAX_EACH}` : ""}</small></button>` : ""}`;
  }
  function modalHtml() {
    const m = S.modal;
    if (!m) return "";
    const jobLine = () => {
      const j = S.pickJobs.find(x => x.job_id === m.jobId) || rowsNow().find(x => x.job_id === m.jobId) || {};
      return `${esc(j.project_id || "")}${m.sheet !== null && m.sheet !== undefined ? ` · sheet ${m.sheet}` : " · whole job"} · ${esc(DEPT_NAME[S.dept])}`;
    };
    const picker = m.pick ? `<label class="f" style="margin-top:0">Job</label>${jobPicker(m.jobId, m.filter)}
        ${m.jobId ? `<label class="f">Sheet</label>${sheetChips(m.jobId, m.sheet, false, { allowNone: true })}` : ""}` : "";
    let inner = "";
    if (m.kind === "defect") {
      const types = S.types.filter(t => t.department === S.dept).sort((a, b) => a.sort_order - b.sort_order);
      inner = `<h3>Log a defect</h3>
        <div class="sub">${m.pick ? "" : jobLine() + ". "}Counted in the numbers. Nobody is interrupted.</div>
        ${picker}${!m.pick || m.jobId ? `<label class="f">What happened</label>
        ${types.map(t => `<button class="pick" data-picktype="${esc(t.id)}" aria-pressed="${m.type === t.id}">${esc(t.label)}</button>`).join("") || `<div class="meta2">No defect list for ${esc(DEPT_NAME[S.dept])} yet.</div>`}
        <textarea class="in" data-mfield="note" placeholder="Anything worth adding (optional)">${esc(m.note || "")}</textarea>
        ${modalPhotos(m)}` : ""}
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button>
          <button class="go" data-savedefect="1" ${m.type && m.jobId ? "" : "disabled"}>Log it</button></div>`;
    } else if (m.kind === "problem") {
      inner = `<h3>Flag a problem</h3>
        <div class="sub">${m.pick ? "" : jobLine() + ". "}Goes to the office and stays open until someone answers it.</div>
        ${picker}${!m.pick || m.jobId ? `<label class="f">What's wrong, and what do you need?</label>
        <textarea class="in" data-mfield="text">${esc(m.text || "")}</textarea>
        <label class="chk"><input type="checkbox" data-mstops ${m.stops ? "checked" : ""}>
          <span>Work is stopped on this${m.sheet === null || m.sheet === undefined ? " job" : " sheet"}<small>Shows on the TV and puts it at the top of the office's list.</small></span></label>
        ${modalPhotos(m)}` : ""}
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button>
          <button class="go" data-saveproblem="1" ${m.jobId && (m.text || "").trim() ? "" : "disabled"}>Send it</button></div>`;
    } else if (m.kind === "reply") {
      inner = `<h3>Add to this problem</h3>
        <div class="sub">It goes back to the office with everything said so far.</div>
        <textarea class="in" data-mfield="text" placeholder="What still needs sorting?">${esc(m.text || "")}</textarea>
        ${m.stops !== undefined ? `<label class="chk"><input type="checkbox" data-mstops ${m.stops ? "checked" : ""}><span>Work is stopped<small>Untick when work has started again.</small></span></label>` : ""}
        ${modalPhotos(m)}
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button>
          <button class="go" data-savereply="1" ${(m.text || "").trim() ? "" : "disabled"}>Send it back</button></div>`;
    } else if (m.kind === "qcfail") {
      inner = `<h3>QC failed — sheet ${m.sheet}</h3>
        <div class="sub">It's logged as a "Failed QC" defect on the sheet, so every department sees it on the piece.</div>
        <textarea class="in" data-mfield="text" placeholder="What failed?">${esc(m.text || "")}</textarea>
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button>
          <button class="go" data-saveqcfail="1" ${(m.text || "").trim() ? "" : "disabled"}>Record it</button></div>`;
    } else if (m.kind === "qcpick") {
      inner = `<h3>Record QC — sheet ${m.sheet}</h3><div class="sub">${esc(m.label || "")}</div>
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button>
          <button class="btn" data-qcfail="${m.sheet}" data-qcjob="${esc(m.jobId)}">Failed…</button>
          <button class="go" data-qcpass="${m.sheet}" data-qcjob="${esc(m.jobId)}">Passed</button></div>`;
    } else if (m.kind === "photo") {
      const p = m.photo, what = p.kind === "loadout" ? (p.sheet_number !== null ? `Sheet ${p.sheet_number}` : p.note) : (p.defect_type || p.problem_body || "");
      return `<div class="ovl" data-close="1"><div class="viewer" role="dialog" aria-modal="true" aria-label="Photo">
        <img alt="Photo by ${esc(p.taken_by_name)}" data-photopath="${esc(p.storage_path)}">
        <div class="vcap"><b>${p.is_test ? "TEST " : ""}${esc(p.project_id)}${p.sheet_number !== null ? ` · sheet ${p.sheet_number}` : ""}</b> · ${esc(p.department_name)}
          ${what ? `<div>${esc(what)}</div>` : ""}${p.note && p.kind !== "loadout" ? `<div>${esc(p.note)}</div>` : ""}
          <small>Taken by ${esc(p.taken_by_name)}, ${esc(fmtDate(localISO(p.taken_at)))} ${esc(new Date(p.taken_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))}</small></div>
        <div class="mdl-btns">${p.taken_by === S.me.id && !p.voided ? `<button data-voidphoto="${esc(p.id)}">Entered by mistake</button>` : ""}
          <button data-close="1">Close</button></div></div></div>`;
    } else if (m.kind === "confirm") {
      inner = `<h3>${esc(m.title)}</h3><div class="sub">${esc(m.text)}</div>
        <div class="mdl-btns"><button class="btn" data-close="1">Cancel</button><button class="go" data-confirm="1">${esc(m.yes)}</button></div>`;
    }
    return `<div class="ovl" data-close="1"><div class="mdl" role="dialog" aria-modal="true">${inner}</div></div>`;
  }

  // ---------- Advance (managers): job → sheet → where it is ----------
  function advScreen() {
    if (S.advJob && S.advSheet) return advSheetScreen();
    if (S.advJob) return advJobScreen();
    const list = advJobs(S.pickJobs, S.flags, S.advFilter);
    return `<h1>Advance</h1>
      <p class="sub">Pick a job, then a sheet, then set where it is in the shop. Every change is saved under your name as a manager adjustment.</p>
      <input class="in" data-advfilter placeholder="Type part of the PROJ number or name" value="${esc(S.advFilter)}" inputmode="search" autocomplete="off" style="margin-bottom:12px">
      ${list.length ? list.slice(0, 80).map(j => {
        const dl = daysLeft(j.delivery_date);
        return `<button class="advjob${j.flag && j.flag.level !== "watch" ? " f-" + j.flag.level : ""}" data-advjob="${esc(j.job_id)}">
          <span class="pid">${j.is_test ? `<span class="tag">TEST</span>` : ""}${esc(j.project_id)}</span><span class="jname">${esc(j.job_name)}</span>
          <span class="due">Due ${esc(fmtDate(j.delivery_date))}${dl === null ? "" : ` · <b>${esc(daysText(dl))}</b>`}</span>
          ${j.flag ? `<span style="flex-basis:100%">${flagTag(j.flag)}</span>` : ""}</button>`;
      }).join("") : `<div class="empty">${S.pickJobs.length
          ? (S.advFilter ? "<b>No job matches that</b>Check the number, or clear the box." : "<b>No jobs to advance</b>Jobs show here once they're in production and their work order is uploaded.")
          : "Loading the jobs…"}</div>`}`;
  }

  const advJobInfo = () => S.pickJobs.find(j => j.job_id === S.advJob) || (advNow()[0] || {});
  function advCachedNote() {
    if (!S.advCached || !S.advAt) return "";
    const t = new Date(S.advAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return `<div class="banner info">No connection — showing this job's counts from ${esc(t)}. Anything you save is kept and sends when the connection is back.</div>`;
  }

  function advJobScreen() {
    const sheets = advNow(), j = advJobInfo();
    const head = `<div class="head"><button class="back" data-advback="jobs">← All jobs</button>
      <h1>${j.is_test ? `<span class="tag">TEST</span>` : ""}${esc(j.project_id || "")}</h1>
      <span class="hsub">${esc(j.job_name || "")}${j.delivery_date ? ` · due ${esc(fmtDate(j.delivery_date))}` : ""} · ${sheets.length} sheet${sheets.length === 1 ? "" : "s"}</span></div>`;
    if (!sheets.length) return head + advCachedNote() + `<div class="empty">${S.advLoading ? "Loading the sheets…"
      : "<b>No sheets to show</b>This job's work order has no counted sheets, or it couldn't be loaded. Try again with a connection."}</div>`;
    return head + advCachedNote() + sheets.map(s => {
      const size = [s.width, s.length, s.thickness].filter(Boolean).join(" × ");
      return `<button class="advsheet" data-advsheet="${esc(s.sheet_id)}">
        <div class="top2"><span class="no num">${s.sheet_number}</span><span class="meta"><b>${esc(s.item_code || "Sheet " + s.sheet_number)}</b>
          <span class="meta2">${esc([s.species, s.shape, size].filter(Boolean).join(" · "))}</span></span></div>
        <div class="stgs">${s.stages.map(st => {
          const cls = st.qty_done >= st.qty_required ? " done" : st.qty_done > 0 ? " part" : "";
          return `<span class="stg${cls}">${esc(DEPT_NAME[st.dept])} <span class="num">${st.qty_done}/${st.qty_required}</span></span>`;
        }).join("")}</div></button>`;
    }).join("");
  }

  function advSheetScreen() {
    const sheets = advNow(), at = sheets.findIndex(x => x.sheet_id === S.advSheet), s = sheets[at];
    if (!s) { S.advSheet = null; return advJobScreen(); }
    const prev = sheets[at - 1], next = sheets[at + 1];
    const pager = `<div class="pager">
      <button data-advgo="${prev ? esc(prev.sheet_id) : ""}" ${prev ? "" : "disabled"}>← ${prev ? `Sheet ${prev.sheet_number} · ${esc(prev.item_code || "")}` : "Previous"}</button>
      <span class="pos num">${at + 1} / ${sheets.length}</span>
      <button data-advgo="${next ? esc(next.sheet_id) : ""}" ${next ? "" : "disabled"}>${next ? `Sheet ${next.sheet_number} · ${esc(next.item_code || "")}` : "Next"} →</button></div>`;
    const row = (st) => {
      const n = advShown(st, S.advEdit), full = n >= st.qty_required, changed = st.dept in S.advEdit;
      const state = changed ? `was ${st.qty_done}` : full ? "Complete" : n > 0 ? "Part done" : "Not started";
      return `<div class="advrow${changed ? " changed" : full ? " done" : ""}">
        <div class="nm">${esc(DEPT_NAME[st.dept])}<small>${esc(state)}</small></div>
        <div class="cnt"><button class="step" data-advstep="-1" data-d="${st.dept}" ${n <= 0 ? "disabled" : ""} aria-label="One fewer, ${esc(DEPT_NAME[st.dept])}">−</button>
          <span class="n num">${n}<small> / ${st.qty_required}</small></span>
          <button class="step" data-advstep="1" data-d="${st.dept}" ${full ? "disabled" : ""} aria-label="One more, ${esc(DEPT_NAME[st.dept])}">+</button></div>
        <div class="btns">${advBefore(s.stages, st.dept).length ? `<button data-advhere="${st.dept}">It's here</button>` : ""}
          ${full ? `<span class="isdone">Complete</span>` : `<button data-advall="${st.dept}">All ${st.qty_required} done</button>`}</div></div>`;
    };
    const wood = s.stages.filter(st => CHAIN.includes(st.dept)), own = s.stages.filter(st => !CHAIN.includes(st.dept));
    const ch = advChanges(s.stages, S.advEdit);
    return `<div class="head"><button class="back" data-advback="job">← ${s.is_test ? "TEST " : ""}${esc(s.project_id)}</button>
        <h1>Sheet ${s.sheet_number} · ${esc(s.item_code || "")}</h1><span class="hsub">${esc(s.job_name)}</span></div>
      ${pager}${advCachedNote()}
      ${wood.length ? `<div class="lane">In order <small>— “It's here” marks every stage before it complete</small></div>${wood.map(row).join("")}` : ""}
      ${own.length ? `<div class="lane">On their own</div>${own.map(row).join("")}` : ""}
      ${ch.length ? `<div class="advsave"><div class="what">Will save: ${ch.map(c => `${esc(DEPT_NAME[c.dept])} ${c.from} → <b>${c.to}</b>`).join(" · ")}</div>
        ${ch.some(c => c.lower) ? `<div class="meta2">This lowers a count — you'll be asked to confirm.</div>` : ""}
        <div class="rowbtns"><button class="go" data-advsave="1">Save</button><button data-advundo="1">Undo changes</button></div></div>`
        : `<p class="sub" style="margin-top:10px">Nothing changes until you press Save.</p>`}
      <div class="page" id="advpage">${s.png_path && s.pages_ready ? `<div class="missing">Loading the page…</div>` : `<div class="missing">This sheet's page hasn't been uploaded yet.</div>`}</div>`;
  }

  async function advShowPage() {
    const s = advNow().find(x => x.sheet_id === S.advSheet);
    const el = document.getElementById("advpage");
    if (!s || !el || !s.png_path || !s.pages_ready) return;
    try {
      const url = await pageImage(s.png_path);
      const now = document.getElementById("advpage");
      if (!now || S.advSheet !== s.sheet_id) return;             // moved on while it loaded
      now.innerHTML = `<img alt="Work order ${esc(s.project_id)} sheet ${s.sheet_number}" src="${url}">`;
    } catch (e) {
      el.innerHTML = `<div class="missing">${esc(isNetworkError(e) ? "No connection, and this page hasn't been opened on this tablet before." : friendlyError(e))}</div>`;
    }
  }

  function render() {
    if (!S.me) return;
    let body;
    if (S.adv) body = advScreen();
    else if (S.tab === "work" && S.view.screen === "sheet") body = sheetScreen();
    else if (S.tab === "work" && S.view.screen === "job") body = jobScreen();
    else {
      const top = S.tab === "problems" ? problemsScreen() : S.tab === "log" ? logScreen() : S.tab === "supplies" ? suppliesScreen()
                : S.tab === "loadout" ? loadoutScreen() : queueScreen();
      body = subTabs() + top;
    }
    const topLevel = S.adv ? !S.advJob : !(S.tab === "work" && S.view.screen !== "queue");
    const foot = topLevel ? `<div class="foot"><button class="link" data-signout="1">Sign out</button></div>` : "";
    const scroll = S.modal ? (document.querySelector(".mdl") || {}).scrollTop : null;
    app.innerHTML = topBar() + `<main>${banners()}${pinnedTasks()}${body}${foot}</main>` + modalHtml()
      + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
    if (scroll) { const m = document.querySelector(".mdl"); if (m) m.scrollTop = scroll; }
    wire();
    fillPhotos();
    if (S.adv) { if (S.advJob && S.advSheet) advShowPage(); }
    else if (S.tab === "work" && S.view.screen === "sheet") showPage();
  }

  async function showPage() {
    const r = rowsNow().find(x => x.progress_id === S.view.progressId);
    const el = document.getElementById("page");
    if (!r || !el || !r.png_path || !r.pages_ready) return;
    try {
      const url = await pageImage(r.png_path);
      if (S.view.progressId !== r.progress_id) return;       // moved on while it loaded
      const now = document.getElementById("page");
      if (!now) return;
      now.innerHTML = `<img alt="Work order ${esc(r.project_id)} sheet ${r.sheet_number}" src="${url}">`;
      document.getElementById("printArea").innerHTML = `<img alt="" src="${url}">`;
    } catch (e) {
      el.innerHTML = `<div class="missing">${esc(isNetworkError(e) ? "No connection, and this page hasn't been opened on this tablet before. It will show once the connection is back." : friendlyError(e))}</div>`;
    }
  }

  function setCount(r, qty) {
    qty = Math.max(0, Math.min(r.qty_required, qty));
    S.outbox = setPending(S.outbox, r.progress_id, qty);
    store.set("outbox", S.outbox);
    S.notice = null;
    render();
    flush();
  }

  async function openSheet(progressId) {
    S.view = { screen: "sheet", jobId: S.view.jobId, progressId };
    render(); scrollTo(0, 0);
    const r = rowsNow().find(x => x.progress_id === progressId);
    if (r) { await loadPiece(r); if (S.view.progressId === progressId) render(); }
  }

  async function pickJobFor(target, jobId) {
    target.jobId = jobId || null;
    if (target.sheets) target.sheets = [];
    if ("sheet" in target) target.sheet = null;
    render();
    if (jobId && !S.pickSheets[jobId]) { await loadPickSheets(jobId); render(); }
  }

  /** Leaving an Advance sheet with changes not yet saved asks first. */
  function advLeave(go) {
    const s = S.adv && S.advSheet ? advNow().find(x => x.sheet_id === S.advSheet) : null;
    if (!s || !advChanges(s.stages, S.advEdit).length) return go();
    S.modal = { kind: "confirm", title: "Leave without saving?", text: `Your changes to sheet ${s.sheet_number} haven't been saved.`,
                yes: "Leave without saving", run: () => { S.advEdit = {}; go(); } };
    render();
  }

  /** A department tab: exactly what it always did, and it leaves Advance. */
  async function pickDept(dept) {
    S.adv = false; store.set("adv", false);
    S.dept = dept; store.set("dept", S.dept);
    if (!tabs().includes(S.tab)) S.tab = tabs()[0];
    S.view = { screen: "queue" }; S.rows = (store.get("rows_" + S.dept, { rows: [] })).rows; S.problems = []; S.defects = []; S.supplies = []; S.qcJob = null;
    render();
    await loadTab(); render();
  }

  const projectOf = (jobId) => (S.pickJobs.find(x => x.job_id === jobId) || rowsNow().find(x => x.job_id === jobId) || {}).project_id;
  function wire() {
    const on = (sel, fn) => app.querySelectorAll(sel).forEach(el => el.onclick = (ev) => fn(el, ev));
    on("[data-dept]", (b) => advLeave(() => pickDept(b.dataset.dept)));

    // ---- Advance ----
    on("[data-adv]", async () => {
      if (S.adv) { if (S.advJob) advLeave(() => { S.advJob = null; S.advSheet = null; render(); scrollTo(0, 0); }); return; }
      S.adv = true; store.set("adv", true); S.notice = null; S.advSheet = null; render(); scrollTo(0, 0);
      await Promise.all([loadPickJobs(), loadFlags(), S.advJob ? loadAdvRows(S.advJob) : null]); render();
    });
    app.querySelectorAll("[data-advfilter]").forEach(inp => inp.oninput = () => {
      S.advFilter = inp.value;
      const pos = inp.selectionStart; render();
      const again = app.querySelector("[data-advfilter]"); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    });
    on("[data-advjob]", async (b) => {
      S.advJob = b.dataset.advjob; S.advSheet = null; S.advEdit = {}; S.advCached = false;
      const cached = store.get("advrows_" + S.advJob, null);
      S.advRows = cached ? cached.rows : []; S.advAt = cached ? cached.at : null;
      render(); scrollTo(0, 0);
      await loadAdvRows(S.advJob); render();
    });
    on("[data-advback]", (b) => advLeave(async () => {
      if (b.dataset.advback === "jobs") { S.advJob = null; S.advSheet = null; render(); scrollTo(0, 0); await loadPickJobs(); render(); }
      else { S.advSheet = null; render(); scrollTo(0, 0); await loadAdvRows(S.advJob); render(); }
    }));
    const openAdvSheet = (id) => advLeave(() => { S.advSheet = id; S.advEdit = {}; render(); scrollTo(0, 0); });
    on("[data-advsheet]", (b) => openAdvSheet(b.dataset.advsheet));
    on("[data-advgo]", (b) => { if (b.dataset.advgo) openAdvSheet(b.dataset.advgo); });
    const advCur = () => advNow().find(x => x.sheet_id === S.advSheet);
    on("[data-advstep]", (b) => {
      const s = advCur(); if (!s) return;
      const st = s.stages.find(x => x.dept === b.dataset.d); if (!st) return;
      const n = Math.max(0, Math.min(st.qty_required, advShown(st, S.advEdit) + Number(b.dataset.advstep)));
      S.advEdit = advTidy(s.stages, { ...S.advEdit, [st.dept]: n }); render();
    });
    on("[data-advall]", (b) => {
      const s = advCur(); if (!s) return;
      const st = s.stages.find(x => x.dept === b.dataset.advall); if (!st) return;
      S.advEdit = advTidy(s.stages, { ...S.advEdit, [st.dept]: st.qty_required }); render();
    });
    on("[data-advhere]", (b) => { const s = advCur(); if (s) { S.advEdit = advHere(s.stages, b.dataset.advhere, S.advEdit); render(); } });
    on("[data-advundo]", () => { S.advEdit = {}; render(); });
    on("[data-advsave]", () => {
      const s = advCur(); if (!s) return;
      const ch = advChanges(s.stages, S.advEdit);
      if (!ch.length) return;
      const save = () => {
        S.advEdit = {};
        send("advance_sheet", { p_sheet: s.sheet_id, p_counts: Object.fromEntries(ch.map(c => [c.dept, c.to])), p_client_id: null },
             `${s.project_id} sheet ${s.sheet_number}`);
      };
      const lower = ch.filter(c => c.lower);
      if (!lower.length) return save();
      S.modal = { kind: "confirm", title: "Lower a count?",
                  text: `${lower.map(c => `${DEPT_NAME[c.dept]} goes from ${c.from} back to ${c.to}`).join("; ")}. The old number stays in the history.`,
                  yes: "Yes, save it", run: save };
      render();
    });
    on("[data-tab]", async (b) => {
      S.tab = b.dataset.tab; store.set("tab", S.tab); S.view = { screen: "queue" }; S.notice = null; render(); scrollTo(0, 0);
      if (S.tab !== "work" && !S.pickJobs.length) loadPickJobs();
      await loadTab(); render();
    });
    on("[data-job]", (b) => { S.view = { screen: "job", jobId: b.dataset.job }; render(); scrollTo(0, 0); });
    on("[data-sheet]", (b) => openSheet(b.dataset.sheet));
    on("[data-goto]", (b) => { if (b.dataset.goto) openSheet(b.dataset.goto); });
    on("[data-back]", async (b) => {
      S.view = b.dataset.back === "queue" ? { screen: "queue" } : { screen: "job", jobId: S.view.jobId };
      render();
      if (b.dataset.back === "queue") { await loadRows(); render(); }
    });
    const current = () => rowsNow().find(x => x.progress_id === S.view.progressId);
    on("[data-step]", (b) => { const r = current(); if (r) setCount(r, r.qty_done + Number(b.dataset.step)); });
    on("[data-all]", () => { const r = current(); if (r) setCount(r, r.qty_required); });
    on("[data-print]", () => window.print());
    on("[data-pdf]", async () => {
      const r = current(); if (!r) return;
      const { data, error } = await db.storage.from("work-orders").createSignedUrl(r.pdf_path, 600);
      if (error) { S.notice = friendlyError(error); render(); return; }
      window.open(data.signedUrl, "_blank");
    });
    on("[data-signout]", async () => {
      const waiting = Object.keys(S.outbox).length + Object.keys(S.logbox).length + S.pending.length;
      if (waiting && !confirm("Some counts, entries or photos haven't sent yet. Signing out will throw them away. Sign out anyway?")) return;
      await db.auth.signOut();
      S.me = null; S.outbox = {}; S.logbox = {}; store.set("outbox", {}); store.set("logbox", {}); store.set("me", null);
      for (const x of await photoStore.list()) await photoStore.remove(x.id);
      S.pending = []; S.localLoadouts = []; store.set("loadouts_local", []);
      signIn();
    });

    // ---- routine tasks ----
    on("[data-taskdone]", (b) => {
      const t = S.tasks.find(x => x.id === b.dataset.taskdone);
      send("complete_routine_task", { p_task: b.dataset.taskdone, p_client_id: null }, t ? `"${t.name}"` : "Routine task");
    });
    on("[data-taskhist]", (b) => { S.openTask = S.openTask === b.dataset.taskhist ? null : b.dataset.taskhist; render(); });
    on("[data-taskundo]", (b) => {
      S.modal = { kind: "confirm", title: "Undo this?", text: "It's kept in history as entered by mistake, and the task is due again.", yes: "Undo it",
                  run: () => send("void_task_completion", { p_log: b.dataset.taskundo }, "Undo") };
      render();
    });

    // ---- defects and problems ----
    const fromSheet = () => { const r = current(); return r ? { jobId: r.job_id, sheet: r.sheet_number, pick: false } : null; };
    on("[data-defect]", (b) => {
      const at = b.dataset.defect === "here" ? fromSheet() : { jobId: null, sheet: null, pick: true, filter: "" };
      S.modal = { kind: "defect", type: null, note: "", ...at }; render();
      if (at.pick && !S.pickJobs.length) loadPickJobs().then(render);
    });
    on("[data-problem]", (b) => {
      const at = b.dataset.problem === "here" ? fromSheet() : { jobId: null, sheet: null, pick: true, filter: "" };
      S.modal = { kind: "problem", text: "", stops: false, ...at }; render();
      if (at.pick && !S.pickJobs.length) loadPickJobs().then(render);
    });
    on("[data-picktype]", (b) => { S.modal.type = b.dataset.picktype; render(); });
    on("[data-savedefect]", () => {
      const m = S.modal, t = S.types.find(x => x.id === m.type);
      send("log_defect", { p_job: m.jobId, p_department: S.dept, p_type: m.type, p_sheet: m.sheet ?? null, p_note: (m.note || "").trim() || null, p_client_id: newId() },
           t ? t.label : "Defect", null, m.shots, { kind: "defect", projectId: projectOf(m.jobId), label: "Defect photo" });
    });
    on("[data-saveproblem]", () => {
      const m = S.modal;
      send("flag_problem", { p_job: m.jobId, p_department: S.dept, p_body: m.text.trim(), p_sheet: m.sheet ?? null, p_work_stopped: !!m.stops, p_client_id: newId() },
           "Problem", null, m.shots, { kind: "problem", projectId: projectOf(m.jobId), label: "Problem photo" });
    });
    on("[data-reply]", (b) => {
      const p = S.problems.find(x => x.id === b.dataset.reply);
      S.modal = { kind: "reply", id: b.dataset.reply, text: "", stops: p && p.work_stopped ? true : undefined }; render();
    });
    on("[data-savereply]", () => {
      const m = S.modal;
      const pr = S.problems.find(x => x.id === m.id) || {};
      send("reply_problem", { p_problem: m.id, p_body: m.text.trim(), p_work_stopped: m.stops === undefined ? null : !!m.stops, p_client_id: null }, "Reply",
           null, m.shots, { kind: "problem", parent: m.id, projectId: pr.project_id, label: "Problem photo" });
    });
    on("[data-scope]", async (b) => { S.probScope = b.dataset.scope; S.problems = []; render(); await loadProblems(); render(); });
    on("[data-voiddefect]", (b) => {
      S.modal = { kind: "confirm", title: "Entered by mistake?", text: "It stays in history but stops being counted.", yes: "Yes, a mistake",
                  run: () => send("void_defect", { p_defect: b.dataset.voiddefect }, "Entered by mistake") };
      render();
    });

    // ---- the job and sheet pickers (in a modal, the Arrow form or QC) ----
    app.querySelectorAll("[data-jobfilter]").forEach(inp => inp.oninput = () => {
      const tgt = S.modal || (inp.closest(".card") && inp.closest(".card").querySelector("#arDesc") ? S.arrowForm : null) || (S.tab === "loadout" ? S.loForm : null);
      if (tgt) tgt.filter = inp.value; else S.qcFilter = inp.value;
      const pos = inp.selectionStart; render();
      const again = app.querySelector("[data-jobfilter]"); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    });
    app.querySelectorAll("[data-pickjob]").forEach(b => b.onclick = async () => {
      const inArrow = !S.modal && b.closest(".card") && b.closest(".card").querySelector("#arDesc");
      if (S.modal) return pickJobFor(S.modal, b.dataset.pickjob);
      if (inArrow) return pickJobFor(S.arrowForm, b.dataset.pickjob);
      if (S.tab === "loadout") { S.loForm.jobId = b.dataset.pickjob || null; render(); return; }
      S.qcJob = b.dataset.pickjob || null; S.qcEntries = []; render();
      if (S.qcJob) { await Promise.all([loadPickSheets(S.qcJob), loadQc(S.qcJob)]); render(); }
    });
    on("[data-picksheet]", (b) => {
      const n = b.dataset.picksheet === "" ? null : Number(b.dataset.picksheet);
      if (S.modal) S.modal.sheet = n;
      else if (S.arrowForm) {
        const i = S.arrowForm.sheets.indexOf(n);
        if (i >= 0) S.arrowForm.sheets.splice(i, 1); else S.arrowForm.sheets.push(n);
      }
      render();
    });

    // ---- modal typing (no re-render while typing, so the keyboard stays up) ----
    app.querySelectorAll("[data-mfield]").forEach(el => el.oninput = () => {
      S.modal[el.dataset.mfield] = el.value;
      const ready = { savedefect: !!(S.modal.type && S.modal.jobId), saveproblem: !!(S.modal.jobId && (S.modal.text || "").trim()),
                      savereply: !!(S.modal.text || "").trim(), saveqcfail: !!(S.modal.text || "").trim() };
      for (const [k, v] of Object.entries(ready)) { const btn = app.querySelector(`[data-${k}]`); if (btn) btn.disabled = !v; }
    });
    app.querySelectorAll("[data-mstops]").forEach(el => el.onchange = () => { S.modal.stops = el.checked; });
    app.querySelectorAll("[data-close]").forEach(el => el.onclick = (e) => { if (e.target !== el) return; S.modal = null; render(); });
    on("[data-confirm]", () => { const run = S.modal && S.modal.run; S.modal = null; render(); if (run) run(); });

    // ---- photos ----
    on("[data-addshot]", () => takePhoto((shot) => {
      if (!S.modal) return;
      S.modal.shots = [...(S.modal.shots || []), { ...shot, url: URL.createObjectURL(shot.blob) }].slice(0, PHOTO_MAX_EACH);
      render();
    }));
    on("[data-dropshot]", (b) => { const i = Number(b.dataset.dropshot), x = S.modal.shots[i]; if (x) URL.revokeObjectURL(x.url); S.modal.shots.splice(i, 1); render(); });
    on("[data-viewphoto]", (b) => {
      const p = S.photos.concat(S.loPhotos).find(x => x.id === b.dataset.viewphoto); if (!p) return;
      S.modal = { kind: "photo", photo: p }; render();
    });
    on("[data-voidphoto]", (b) => {
      const id = b.dataset.voidphoto;
      for (const x of S.photos.concat(S.loPhotos)) if (x.id === id) x.voided = true;
      send("void_photo", { p_photo: id }, "Photo");
    });

    // ---- load-outs ----
    const lo = currentLoadout();
    on("[data-lostart]", () => {
      const j = S.pickJobs.find(x => x.job_id === S.loForm.jobId); if (!j) return;
      const cid = newId();
      S.localLoadouts.push({ client_id: cid, job_id: j.job_id, project_id: j.project_id, job_name: j.job_name, is_test: !!j.is_test,
                             started_at: new Date().toISOString(), started_by: S.me.id, started_by_name: S.me.name });
      store.set("loadouts_local", S.localLoadouts);
      S.loView = cid; S.loPhotos = []; S.loForm = { jobId: null, filter: "" };
      if (!S.pickSheets[j.job_id]) loadPickSheets(j.job_id).then(render);
      send("start_loadout", { p_job: j.job_id, p_client_id: cid }, "Load-out");
    });
    on("[data-loopen]", async (b) => { S.loView = b.dataset.loopen; S.loPhotos = []; S.loItem = ""; render(); scrollTo(0, 0); await loadLoadouts(); render(); });
    on("[data-loback]", async () => { S.loView = null; render(); await loadLoadouts(); render(); });
    const shootFor = (sheet, note, label) => takePhoto(async (shot) => {
      if (!lo) return;
      await queuePhotos([shot], { kind: "loadout", parent: lo.client_id, projectId: lo.project_id, sheet, note, label });
      render(); flushPhotos();
    });
    on("[data-loshoot]", (b) => shootFor(Number(b.dataset.loshoot), null, `Sheet ${b.dataset.loshoot}`));
    app.querySelectorAll("[data-loitem]").forEach(el => el.oninput = () => {
      S.loItem = el.value; const btn = app.querySelector("[data-loshootitem]"); if (btn) btn.disabled = !S.loItem.trim();
    });
    on("[data-loshootitem]", () => { const note = S.loItem.trim(); if (!note) return; S.loItem = ""; shootFor(null, note, note); });
    on("[data-lofinish]", () => {
      if (!lo) return;
      const p = loadoutSheets(S.pickSheets[lo.job_id] || [], lo, S.pending.filter(x => x.parent === lo.client_id));
      S.modal = { kind: "confirm", title: "The truck is leaving?",
        text: p.missing.length ? `${sheetsText(p.missing)} ${p.missing.length === 1 ? "isn't" : "aren't"} photographed. Finish anyway? That's fine if ${p.missing.length === 1 ? "it's" : "they're"} going on another truck.`
                               : p.total ? `All ${p.total} sheets are photographed. This records that the truck left now.` : "This records that the truck left now.",
        yes: "Finish load-out",
        run: () => send("finish_loadout", { p_loadout: lo.client_id, p_note: null }, "Load-out", () => { S.loView = null; }) };
      render();
    });
    on("[data-lovoid]", () => {
      if (!lo) return;
      S.modal = { kind: "confirm", title: "Started by mistake?", text: "It comes off the list and stays in history, with any photos.", yes: "Yes, a mistake",
        run: () => send("void_loadout", { p_loadout: lo.client_id }, "Load-out", () => {
          S.localLoadouts = S.localLoadouts.filter(l => l.client_id !== lo.client_id); store.set("loadouts_local", S.localLoadouts);
          S.loadouts = S.loadouts.filter(l => l.client_id !== lo.client_id); S.loView = null; }) };
      render();
    });

    // ---- Arrow ----
    on("[data-aropen]", () => { S.arrowForm = { jobId: null, filter: "", sheets: [], description: "", service: "powdercoat", sentOn: localISO(new Date()) }; render();
                                if (!S.pickJobs.length) loadPickJobs().then(render); });
    on("[data-arcancel]", () => { S.arrowForm = null; render(); });
    on("[data-arservice]", (b) => { S.arrowForm.service = b.dataset.arservice; render(); });
    app.querySelectorAll("[data-arfield]").forEach(el => el.oninput = () => {
      S.arrowForm[el.dataset.arfield] = el.value;
      const btn = app.querySelector("[data-arsend]"); if (btn) btn.disabled = !(S.arrowForm.jobId && (S.arrowForm.sheets.length || S.arrowForm.description.trim()));
    });
    on("[data-arsend]", () => {
      const f = S.arrowForm;
      send("send_to_arrow", { p_job: f.jobId, p_department: S.dept, p_service: f.service, p_sheets: f.sheets, p_description: f.description.trim() || null,
                              p_sent_on: f.sentOn || null, p_client_id: null }, "Arrow", () => { S.arrowForm = null; render(); });
    });
    on("[data-arreturn]", (b) => {
      const a = S.arrow.find(x => x.id === b.dataset.arreturn);
      S.modal = { kind: "confirm", title: "Back from Arrow?", text: `${a ? a.project_id + " — " + [sheetsText(a.sheet_numbers), a.description].filter(Boolean).join(" — ") : ""}. Marks it returned today, under your name.`,
                  yes: "Mark returned", run: () => send("return_from_arrow", { p_item: b.dataset.arreturn }, "Arrow return") };
      render();
    });
    on("[data-arvoid]", (b) => {
      S.modal = { kind: "confirm", title: "Entered by mistake?", text: "It comes off the Arrow lists and stays in history.", yes: "Yes, a mistake",
                  run: () => send("void_arrow", { p_item: b.dataset.arvoid }, "Arrow") };
      render();
    });

    // ---- QC ----
    on("[data-qcsheet]", (b) => { S.modal = { kind: "qcpick", sheet: Number(b.dataset.qcsheet), jobId: b.dataset.qcjob, label: (current() || {}).project_id }; render(); });
    on("[data-qcpass]", (b) => {
      const jobId = b.dataset.qcjob || S.qcJob;
      send("record_qc", { p_job: jobId, p_sheet: Number(b.dataset.qcpass), p_result: "pass", p_note: null, p_client_id: null }, "QC");
    });
    on("[data-qcfail]", (b) => { S.modal = { kind: "qcfail", sheet: Number(b.dataset.qcfail), jobId: b.dataset.qcjob || S.qcJob, text: "" }; render(); });
    on("[data-saveqcfail]", () => {
      const m = S.modal;
      send("record_qc", { p_job: m.jobId, p_sheet: m.sheet, p_result: "fail", p_note: m.text.trim(), p_client_id: null }, "QC");
    });

    // ---- Supplies ----
    app.querySelectorAll("[data-sfield]").forEach(el => el.oninput = () => {
      S.supplyForm[el.dataset.sfield] = el.value;
      const btn = app.querySelector("[data-ssend]"); if (btn) btn.disabled = !S.supplyForm.item.trim();
    });
    on("[data-snew]", (b) => { S.supplyForm.qty = Math.max(1, S.supplyForm.qty + Number(b.dataset.snew)); render(); });
    on("[data-ssend]", () => {
      const f = S.supplyForm;
      send("request_supply", { p_department: S.dept, p_item: f.item.trim(), p_qty: f.qty, p_note: f.note.trim() || null, p_client_id: null }, "Supply request",
           () => { S.supplyForm = { item: "", qty: 1, note: "" }; render(); });
    });
    on("[data-sqty]", (b) => {
      const r = S.supplies.find(x => x.id === b.dataset.sqty); if (!r) return;
      const qty = Math.max(1, r.qty + Number(b.dataset.d));
      r.qty = qty; render();                                              // shown straight away; the number itself is sent
      send("set_supply_qty", { p_request: r.id, p_qty: qty }, "Quantity");
    });
    on("[data-scancel]", (b) => {
      S.modal = { kind: "confirm", title: "Cancel this request?", text: "The office won't order it. It stays in history.", yes: "Cancel it",
                  run: () => send("cancel_supply", { p_request: b.dataset.scancel }, "Cancel") };
      render();
    });
    on("[data-sreceive]", (b) => send("receive_supply", { p_request: b.dataset.sreceive }, "Received"));
  }

  function signIn(message) {
    app.innerHTML = `<form class="signin" id="f">
        <h1>Shop Floor</h1><p class="sub" style="margin:0">Sign in once — this tablet remembers you.</p>
        <label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
        <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
        <button class="go" id="g">Sign in</button>
        <div class="banner warn" id="err" style="margin:14px 0 0" ${message ? "" : "hidden"}>${esc(message || "")}</div>
      </form>`;
    document.getElementById("f").onsubmit = async (ev) => {
      ev.preventDefault();
      const g = document.getElementById("g"); g.disabled = true;
      const { data, error } = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      g.disabled = false;
      if (error) { const e = document.getElementById("err"); e.textContent = friendlyError(error); e.hidden = false; return; }
      start(data.user);
    };
  }

  async function start(user) {
    let me;
    try { me = await loadMe(user); } catch (e) { return signIn(friendlyError(e)); }
    if (!me) return signIn("This login has no role yet. In Supabase, give it one (walkthrough 1, step 8).");
    if (!S.depts.length) return signIn("This login isn't assigned to a department yet. In Supabase, add one to its profile.");
    const cached = store.get("rows_" + S.dept, null);
    if (cached) { S.rows = cached.rows; S.rowsAt = cached.at; }
    await refreshPending();
    render();
    await loadRows(); render();
    flush();
    await Promise.all([loadFlags(), loadTasks(), loadTypes(), S.tab === "problems" ? null : loadProblems()]);
    if (S.tab !== "work") await loadTab();
    render();
    flushLog();
    loadPickJobs().then(() => { if (S.adv) render(); });
  }

  // ---------- keep things current ----------
  window.addEventListener("online", () => { S.online = true; flush(); flushLog(); loadRows().then(render); });
  window.addEventListener("offline", () => { S.online = false; render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) { flush(); flushLog(); if (S.view.screen === "queue" && !S.modal) refreshAll().then(render); } });
  setInterval(() => { if (S.me && !document.hidden) { flush(); flushLog(); if (S.view.screen === "queue" && !S.modal) refreshAll().then(render); } }, 60000);
  // Advance: a job's counts stay current while it's open, unless there are changes not yet saved
  setInterval(() => { if (S.me && S.adv && S.advJob && !document.hidden && !S.modal && !Object.keys(S.advEdit).length) loadAdvRows(S.advJob).then(render); }, 60000);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  db.auth.getSession().then(({ data }) => {
    if (data.session) return start(data.session.user);
    const me = store.get("me", null);             // offline, but signed in before
    if (me && !navigator.onLine) { S.me = me; S.depts = departmentsFor(me); if (!S.depts.includes(S.dept)) S.dept = S.depts[0]; start({ id: me.id, email: me.email }); return; }
    signIn();
  });
})();

/* lets the core be tested outside a browser */
if (typeof module !== "undefined") module.exports = { keyProblem, departmentsFor, tabsFor, isLogOnly, withPending, flagFor, buildQueue, jobSheets, pagerFor,
  daysLeft, daysText, fmtDate, localISO, daysSince, agoText, setPending, flushOutbox, newId, queueEntry, flushLogbox, dueForMe, taskWhen,
  problemState, splitProblems, defectCounts, supplyLine, filterJobs, sheetsText, isNetworkError, friendlyError, DEPTS,
  fitSize, photoPath, photoError, flushPhotobox, loadoutSheets,
  CHAIN, canAdvance, advJobs, advSheets, advShown, advBefore, advHere, advTidy, advChanges, withAdvPending };
</script>
</body>
