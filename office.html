        <section class="panel">${closed.map(feedbackLine).join("")}</section></details>` : ""}`;
  }
  function feedbackText(list) {
    return list.map(f => `${fbWhen(f.created_at)} — ${f.person_name}${f.is_test ? " (TEST)" : ""} — ${fbPageName(f.page)}${f.screen ? ": " + f.screen : ""}\n${f.body}`).join("\n\n");
  }

  /** Arrow on Operations (11 Nov, was the Arrow tab): waiting to go, at Arrow now, and what came back. Its POs are in
   *  Purchasing › POs; the TV's alert days in Setup. */
  function arrowSection() {
    const out = (S.arrow || []).filter(a => a.at_vendor && !a.waiting).sort((a, b) => b.days_out - a.days_out);
    const wait = (S.arrow || []).filter(a => a.at_vendor && a.waiting).sort((a, b) => String(a.queued_on || a.sent_on).localeCompare(String(b.queued_on || b.sent_on)));
    const back = (S.arrow || []).filter(a => !a.at_vendor).sort((a, b) => String(b.returned_on).localeCompare(String(a.returned_on)));
    const what = (a) => [a.sheet_numbers && a.sheet_numbers.length ? `sheet${a.sheet_numbers.length === 1 ? "" : "s"} ${a.sheet_numbers.join(", ")}` : "", a.description].filter(Boolean).join(" — ");
    const keep = (k) => S.openDetails.has(k) ? "open" : "";
    const head = [wait.length ? `${wait.length} waiting to go` : "", out.length ? `${out.length} at Arrow` : ""].filter(Boolean).join(" · ");
    return `<section class="ops-flags" id="opsarrow"><h2>Arrow${head ? ` <span class="meta2" style="font-weight:600">· ${head}</span>` : ""}</h2>
      ${wait.length ? `<h3 class="setsub">Waiting to go to Arrow</h3>
        <p class="sub" style="margin:0 0 8px">Done by Metal and sent on, not taken over yet. Whoever takes it taps Gone to Arrow on their tablet.</p>
        <div class="panel">${wait.map(a => `<div class="line"><span class="qty">${a.days_out}</span>
          <span class="body"><b>${testTag(a)}${esc(a.project_id)}</b> <span class="meta2">· ${esc(a.job_name)}</span>
            <div>${esc(what(a))}</div>
            <div class="meta2">${a.service === "paint" ? "Paint" : "Powdercoat"} · sent on ${esc(fmtDay(a.queued_on || a.sent_on))} by ${esc(a.queued_by_name || a.sent_by_name)} · waiting ${a.days_out} day${a.days_out === 1 ? "" : "s"}</div></span>
          <span class="btns" style="margin:0"><button class="plain" data-argone="${esc(a.id)}">Gone to Arrow</button></span></div>`).join("")}</div>` : ""}
      ${out.length ? `${wait.length ? `<h3 class="setsub" style="margin-top:14px">At Arrow now</h3>` : ""}<div class="panel">${out.map(a => `<div class="line"><span class="qty">${a.days_out}</span>
          <span class="body"><b>${testTag(a)}${esc(a.project_id)}</b> <span class="meta2">· ${esc(a.job_name)}</span>
            <div>${esc(what(a))}</div>
            <div class="meta2">${a.service === "paint" ? "Paint" : "Powdercoat"} · sent ${esc(fmtDay(a.sent_on))} by ${esc(a.sent_by_name)} (${esc(a.department_name)})${a.gone_by_name ? ` · taken by ${esc(a.gone_by_name)}` : ""} · ${a.days_out} day${a.days_out === 1 ? "" : "s"} out${a.days_out > S.arrowDays ? " — <b>over " + S.arrowDays + " days</b>" : ""}</div></span>
          <span class="btns" style="margin:0"><button class="plain" data-arret="${esc(a.id)}">Mark returned</button><button class="link" data-arvoid="${esc(a.id)}">Entered by mistake</button></span></div>`).join("")}</div>`
        : wait.length ? "" : `<div class="empty"><b>Nothing at Arrow</b>Items the floor sends to Arrow show here until they're back.</div>`}
      <p class="meta2" style="margin:10px 0 0">The floor makes the Arrow POs on the tablets' Arrow department; they're listed in Purchasing, under POs.</p>
      <details class="more" data-keep="arrowback" ${keep("arrowback")}><summary>Back from Arrow — last three months (${back.length})</summary>
        ${back.map(a => `<div class="line"><span class="qty">${a.days_out}</span><span class="body"><b>${testTag(a)}${esc(a.project_id)}</b> <span class="meta2">· ${esc(what(a))}</span>
          <div class="meta2">${esc(fmtDay(a.sent_on))} → ${esc(fmtDay(a.returned_on))} · ${a.days_out}-day turnaround · back by ${esc(a.returned_by_name)}</div></span></div>`).join("") || `<p class="sub">None.</p>`}
      </details></section>`;
  }

  // ---------- Routine tasks ----------
  function routineSection() {
    const f = S.taskForm;
    const byDept = LOG_DEPTS.map(d => ({ d, list: (S.routine || []).filter(t => t.department === d).sort((a, b) => a.days_until - b.days_until) })).filter(g => g.list.length);
    const people = S.people.filter(p => f.is_test ? p.is_test : !p.is_test);
    return `<div id="set-routine" class="setgroup"><h2 class="sethead">Routine tasks</h2>
      <p class="sub">Recurring jobs on the floor, Monday to Thursday. Each shows on its department's Tasks tab, with a ! when one is due; one that's overdue waits on Operations. Only managers add or remove them. Removing one keeps its history.</p>
      ${S.msg && S.msgFrom === "routine" ? `<div class="banner ${S.msg.ok ? "ok" : "warn"}">${esc(S.msg.text)}</div>` : ""}
      <section class="panel"><h2>Add a routine task</h2>
        <div class="grid2">
          <div><label for="tfName">Task</label><input class="in" id="tfName" data-tf="name" value="${esc(f.name)}" placeholder="e.g. Change dust collector filter"></div>
          <div><label for="tfDept">Department</label><select class="in" id="tfDept" data-tf="department">${LOG_DEPTS.map(d => `<option value="${d}" ${f.department === d ? "selected" : ""}>${esc(DEPT_NAME[d])}</option>`).join("")}</select></div>
          <div><label for="tfWho">Assigned to</label><select class="in" id="tfWho" data-tf="assigned_to"><option value="">Anyone in the department</option>
            ${people.map(p => `<option value="${esc(p.id)}" ${f.assigned_to === p.id ? "selected" : ""}>${esc(p.full_name)}</option>`).join("")}</select></div>
          <div><label for="tfType">How often</label><select class="in" id="tfType" data-tf="schedule_type">
            <option value="weekly" ${f.schedule_type === "weekly" ? "selected" : ""}>Weekly</option><option value="monthly" ${f.schedule_type === "monthly" ? "selected" : ""}>Monthly</option></select></div>
          ${f.schedule_type === "weekly"
            ? `<div><label for="tfEvery">Every how many weeks</label><input class="in" id="tfEvery" type="number" min="1" max="12" data-tf="week_interval" value="${esc(f.week_interval)}"></div>`
            : `<div><label for="tfOcc">Which one in the month</label><select class="in" id="tfOcc" data-tf="monthly_occurrence">${[[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "4th"], [-1, "Last"]].map(([v, l]) => `<option value="${v}" ${Number(f.monthly_occurrence) === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>`}
          <div><label for="tfDay">Day</label><select class="in" id="tfDay" data-tf="weekday">${Object.entries(WEEKDAYS).map(([v, l]) => `<option value="${v}" ${Number(f.weekday) === Number(v) ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div><label for="tfStart">Starting from</label><input class="in" id="tfStart" type="date" data-tf="start_date" value="${esc(f.start_date || localISO(new Date()))}"></div>
        </div>
        <label class="meta2" style="display:flex; gap:8px; align-items:center; margin-top:12px"><input type="checkbox" data-tftest ${f.is_test ? "checked" : ""}> Test task — only the Test Supervisor sees it (for the bench run)</label>
        <div class="btns"><button class="go" data-addtask="1" ${f.name.trim() && !S.busy ? "" : "disabled"}>Add the task</button></div>
      </section>
      ${byDept.length ? byDept.map(g => `<section class="panel"><h3 class="setsub">${esc(DEPT_NAME[g.d])}</h3>${g.list.map(t => `<div class="line">
          <span class="body"><b>${testTag(t)}${esc(t.name)}</b>
            <div class="meta2">${esc(t.schedule_text)} · ${esc(t.assigned_to_name || "anyone in " + DEPT_NAME[g.d])}</div>
            <div class="meta2">${esc(taskWhen(t))}${t.last_done_on && !t.done_today ? ` · last done ${esc(fmtDay(t.last_done_on))} by ${esc(t.last_done_by)}` : ""}</div></span>
          <button class="link" data-retiretask="${esc(t.id)}">Remove</button></div>`).join("")}</section>`).join("")
        : `<div class="empty"><b>No routine tasks yet</b>Add them above.</div>`}</div>`;
  }

  // ---------- Needs you: everything waiting on the office, most urgent first ----------
  // Problems (work stopped first), supplies to order, flags over two weeks old, Arrow items out too
  // long, the photo archive when it's due, then handoffs. A section shows only when it has something.
  // What's done or just for reference is folded away at the bottom.
  function needsScreen() {
    const { open, answered } = officeIssues(S.problems, S.defects);
    const groups = needToOrder(S.supplies);
    const stale = staleFlags(S.flags);
    const late = (S.arrow || []).filter(a => a.at_vendor && !a.waiting && a.days_out > S.arrowDays).sort((a, b) => b.days_out - a.days_out);
    const ho = S.columns.find(c => c.key === "handed_off");
    const connected = ho && ho.column_id && (ho.col_type === "checkbox" || ho.yes_label);
    const handoffs = buildTasks(S.tasks);
    const nLines = groups.reduce((a, g) => a + g.lines.length, 0);
    const who = (r) => `${esc(r.requested_by_name)} · ${esc(fmtDay(r.requested_at))}`;
    const scope = (x) => x.department_name ? `${x.department_name} only` : "whole job";
    const what = (a) => [a.sheet_numbers && a.sheet_numbers.length ? `sheet${a.sheet_numbers.length === 1 ? "" : "s"} ${a.sheet_numbers.join(", ")}` : "", a.description].filter(Boolean).join(" — ");
    const strip = [];   // 20 Oct: one tile per section that has something, up top
    const sec = (key, title, n, body) => { strip.push({ key, title, n }); return `<section class="need" id="need-${key}" data-need="${key}"><h2>${title}${n ? ` <span class="cnt num">${n}</span>` : ""}</h2>${body}</section>`; };
    const keep = (k) => S.openDetails.has(k) ? "open" : "";
    const parts = [];

    // 4 Nov: the save runs every 30 minutes from any tab, but after Chrome restarts it waits for one click; the click lives here too
    if (savePaused()) parts.push(sec("savepaused", "Saving to OneDrive is paused", 0, `<div class="panel"><p class="sub" style="margin:0 0 10px">Chrome wants permission again before it can save into the folders on this computer: it asks after a restart. Nothing is lost. Press Resume saving and the save carries on, then runs by itself every 30 minutes while this page is open.${S.save.status && S.save.status.good_at
          ? ` The last save that reached both OneDrive and the backup folder was ${S.save.status.days_since_good ? `${S.save.status.days_since_good} day${S.save.status.days_since_good === 1 ? "" : "s"} ago` : "today"}.` : ""}</p>
        <div class="btns"><button class="go" data-saveresume="1">Resume saving</button><button class="link" data-tab="photos">Open OneDrive</button></div></div>`));

    if (open.length) parts.push(sec("problems", "Issues from the floor", open.length, `<p class="sub">Issues, and defects the floor asked you about. Work stopped comes first.</p>${open.map(issueCard).join("")}`));

    // 10 Nov (Luke): buying left Operations for Purchasing › Buy. One line stays here while requests wait, counted as before.
    if (groups.length) parts.push(sec("ordering", "Supplies to order", nLines, `<div class="panel"><div class="line">
        <span class="body"><b>${nLines} supply request${nLines === 1 ? " is" : "s are"} waiting</b> from ${groups.map(g => esc(g.name)).join(", ")}.
          <div class="meta2">They're ordered in Purchasing now, under Buy: log the purchase, put them on a PO, or say why not.</div></span>
        <span class="btns" style="margin:0"><button class="go" data-section="purchasing">Open Purchasing</button></span></div></div>`));

    if (stale.length) parts.push(sec("flags", "Flags older than two weeks — still right?", stale.length, `<div class="panel">${stale.map(x => `<div class="line">
        <span class="body"><span class="flagtag ${x.level}">${LEVEL_NAME[x.level]}</span> <b>${testTag(x)}${pidLink(x)}</b> <span class="meta2">${esc(x.job_name)} · ${esc(scope(x))}</span>
          <div>${esc(x.note)}</div><div class="meta2">Set by ${esc(x.set_by_name)}, ${x.age_days} days ago</div></span>
        <span class="btns" style="margin:0"><button class="plain" data-clearflag="${esc(x.id)}">Clear it</button><button class="link" data-jump="opsflags">See it under Flags</button></span></div>`).join("")}</div>`));

    const overdue = overdueRoutine(S.routine);
    if (overdue.length) parts.push(sec("routine", "Routine tasks overdue", overdue.length, `<p class="sub">Past their day and not ticked off on the tablet. Each clears when the department ticks it. Add or remove tasks in Setup.</p>
      <div class="panel">${overdue.map(t => `<div class="line"><span class="qty">${-t.days_until}</span>
        <span class="body"><b>${testTag(t)}${esc(t.name)}</b> <span class="meta2">· ${esc(DEPT_NAME[t.department] || t.department)}</span>
          <div class="meta2">${esc(taskWhen(t))} · ${esc(t.schedule_text || "")} · ${esc(t.assigned_to_name || "anyone in " + (DEPT_NAME[t.department] || t.department))}${t.last_done_on ? ` · last done ${esc(fmtDay(t.last_done_on))}${t.last_done_by ? " by " + esc(t.last_done_by) : ""}` : " · never done yet"}</div></span></div>`).join("")}</div>`));

    if (late.length) parts.push(sec("arrow", `At Arrow over ${S.arrowDays} days`, late.length, `<div class="panel">${late.map(a => `<div class="line"><span class="qty">${a.days_out}</span>
        <span class="body"><b>${testTag(a)}${pidLink(a)}</b> <span class="meta2">· ${esc(a.job_name)}</span><div>${esc(what(a))}</div>
          <div class="meta2">${a.service === "paint" ? "Paint" : "Powdercoat"} · sent ${esc(fmtDay(a.sent_on))} by ${esc(a.sent_by_name)} (${esc(a.department_name)}) · ${a.days_out} days out</div></span>
        <button class="plain" data-arret="${esc(a.id)}">Mark returned</button></div>`).join("")}</div>`));

    const sv = S.save && S.save.status;
    if (sv && sv.due && !S.save.missing && !savePaused()) parts.push(sec("saving", "Saving to OneDrive", 0, `<div class="panel"><p class="sub" style="margin:0 0 10px">${!sv.ever
        ? "Saving the Production app's files to OneDrive and the hard drive hasn't been set up yet. Choose the two folders on OneDrive (in the ☰ menu), on the computer that stays open in the office."
        : !sv.good_at ? "No save has reached both OneDrive and the backup folder yet. OneDrive (in the ☰ menu) says what's in the way."
        : `The last save that reached both OneDrive and the backup folder was ${sv.days_since_good} days ago${sv.good_by ? `, on ${esc(sv.good_by)}'s computer` : ""}. Open the office page there, or check OneDrive (in the ☰ menu) for what's in the way.`}</p>
        <button class="go" data-tab="photos">Open OneDrive</button></div>`));

    if ((S.inv || []).length) parts.push(sec("inventory", "Inventory", S.inv.length, `<div class="panel">${S.inv.map(n => `
        <div class="task"><div class="what">${esc(n.text)}</div><div class="detail"><button class="link" data-section="inventory" style="padding:0">Open Inventory</button></div></div>`).join("")}</div>`));

    if ((S.metal || []).length) parts.push(sec("metal", "Needs metal cut sheets", S.metal.length, `<p class="sub">Jobs where Monday's Metal Status says “Not Ready”. Each clears by itself within 15 minutes of Metal Status changing in Monday.</p>
      <div class="panel">${S.metal.map(t => { const d = daysLeft(t.delivery_date); return `
        <div class="task">
          <div class="what">Needs metal cut sheets: ${pidLink(t)}</div>
          <div class="when">${d === null ? `<div class="l">no delivery date</div>`
              : `<div class="d num">${Math.abs(d)}</div><div class="l">${d < 0 ? "days late" : d === 1 ? "day left" : "days left"}</div>`}</div>
          <div class="detail">${esc(t.job_name)} · ${esc(t.phase)} · due ${esc(fmtDate(t.delivery_date))} · Monday says “${esc(t.metal_status)}”</div>
        </div>`; }).join("")}</div>`));

    if (!connected) parts.push(sec("handoffs", "Handoffs", 0, `<div class="banner warn">The Handed Off column hasn't been found on the Monday board yet, so this list can't be worked out. In the Supabase SQL Editor, run <b>select * from setup_monday_columns();</b> and then <b>select run_monday_sync();</b></div>`));
    else if (handoffs.length) parts.push(sec("handoffs", "Handoffs", handoffs.length, `<p class="sub">Jobs Monday doesn't show as Handed Off, soonest delivery first. Each clears by itself within 15 minutes of Handed Off being set to Yes in Monday.</p>
      <div class="panel">${handoffs.map(t => `
        <div class="task">
          <div class="what">Prepare <span class="pid">${esc(t.project_id)}</span> for handoff</div>
          <div class="when">${t.days === null ? `<div class="l">no delivery date</div>`
              : `<div class="d num">${Math.abs(t.days)}</div><div class="l">${t.days < 0 ? "days late" : t.days === 1 ? "day left" : "days left"}</div>`}</div>
          <div class="detail">${esc(t.job_name)} · ${esc(t.phase)} · due ${esc(fmtDate(t.delivery_date))}${t.handed_off_text ? ` · Monday says “${esc(t.handed_off_text)}”` : ""}</div>
        </div>`).join("")}</div>`));

    const openFl = openFlags(S.flags), stopped = open.filter(x => x.work_stopped).length;
    const tiles = strip.map(t => `<button class="st${(t.key === "problems" && stopped) || !t.n ? " hot" : ""}" data-jump="need-${t.key}"><span class="n num">${t.n || "!"}</span><span class="l">${esc(t.title)}${t.key === "problems" && stopped ? `<small>${stopped} work stopped</small>` : ""}</span></button>`)
      .concat([`<button class="st${openFl.length ? "" : " zero"}" data-jump="opsflags"><span class="n num">${openFl.length}</span><span class="l">Flags open${stale.length ? `<small>${stale.length} older than two weeks</small>` : ""}</span></button>`,
               `<button class="st" data-tab="jobs"><span class="n num">${(S.activeJobs || []).length}</span><span class="l">Jobs in production<small>open the list</small></span></button>`]);
    return `<h1>Operations</h1>
      <p class="sub">What's waiting on the office, most urgent first, then the flags in front of the floor.</p>
      <div class="status">${tiles.join("")}</div>
      ${missingNote()}${S.msgFrom === "flags" ? "" : msgBanner()}${syncAlertHtml()}
      <h2 class="opshead">Needs you</h2>
      ${parts.length ? parts.join("") : syncProblem() ? "" : `<div class="empty"><b>Nothing needs you</b>No issues waiting, nothing to order, nothing overdue, no handoffs.</div>`}
      ${flagsSection()}
      ${arrowSection()}
      <section class="later">
        <details class="more" data-keep="answered" ${keep("answered")}><summary>Answered issues — last 30 days (${answered.length})</summary>${answered.map(issueCard).join("") || `<p class="sub">None.</p>`}</details>
        <details class="more" data-keep="defects" ${keep("defects")}><summary>Defects logged</summary>${defectsPanel()}</details>
      </section>`;
  }

  function departmentsSection() {
    const last = lastChanges(S.liveLog);
    const live = S.depts.filter(d => d.is_live).map(d => d.name);
    return `<section class="panel" id="set-departments"><h2>Departments</h2>
      <p class="sub">Which departments are live on the floor. The TV shows live departments only — right now: <b>${esc(live.join(", ") || "none")}</b>. Every department's tablet queue works whether it's live or not. Going live is flipping the switch, creating the supervisor's login, and handing over a tablet.</p>
      <div class="panel">${S.depts.map(d => {
        const l = last[d.key];
        if (d.log_only) return `<div class="dept"><span class="nm">${esc(d.name)}</span>
          <span class="hist">Log-only: issues, defects, Arrow and routine tasks — no work orders, so no queue and nothing on the TV.</span></div>`;
        return `<div class="dept">
          <span class="nm">${esc(d.name)}</span>
          <button class="switch" role="switch" aria-checked="${d.is_live}" aria-label="${esc(d.name)} live" data-live="${esc(d.key)}" ${S.busy ? "disabled" : ""}></button>
          <span class="state">${d.is_live ? "Live" : "Off"}</span>
          <span class="hist">${l ? `Switched ${l.is_live ? "on" : "off"} by ${esc(S.names[l.changed_by] || "someone")}, ${esc(ago(l.changed_at))}` : ""}</span>
        </div>`;
      }).join("")}</div></section>`;
  }

  function setupScreen() {
    const cols = [...S.columns].sort((a, b) => a.sort_order - b.sort_order);
    const colFacts = cols.map(c => `<div class="fact"><div class="k">${esc(c.what)}</div>
      <div class="v${c.column_id ? "" : " missing"}">${c.column_id ? `“${esc(c.title)}”` : "Not found yet"}</div></div>`).join("");
    const sync = S.lastSync
      ? `<p class="sub" style="margin:0">Last sync ${esc(ago(S.lastSync.run_at))}: ${esc(S.lastSync.summary)}</p>`
      : `<p class="sub" style="margin:0">The sync hasn't run yet.</p>`;

    // catch-up rules
    const groups = groupRules(S.rules, S.columns);
    const rulesHtml = groups.length ? groups.map(g => {
      const depts = ruleDepartments(g.key);
      return `<div class="scroll"><table class="rules"><caption>When Monday's ${esc(g.title || g.what)} says…</caption>
        <tr><th>Label</th>${depts.map(d => `<th>${esc(DEPT_NAME[d])}</th>`).join("")}<th></th></tr>
        ${g.rows.map(r => `<tr><td>${esc(r.label)}</td>${depts.map(d =>
          `<td><input type="checkbox" aria-label="${esc(r.label)}: ${esc(DEPT_NAME[d])} done" data-rule="${esc(g.key)}" data-label="${esc(r.label)}" data-dept="${d}" ${(r.departments || []).includes(d) ? "checked" : ""}></td>`).join("")}
          <td class="changed">${r.set_by ? "changed" : "suggested"}</td></tr>`).join("")}
      </table></div>`;
    }).join("") : `<div class="banner warn">No stage columns found yet. Run <b>select * from setup_monday_columns();</b> in the SQL Editor, then <b>select run_monday_sync();</b></div>`;

    // catch-up preview
    const pv = S.preview || [];
    const t = catchUpTotals(pv, S.ticked);
    const previewHtml = !pv.length ? `<div class="empty"><b>No uploaded jobs in production</b>Upload work orders first; they'll appear here.</div>`
      : pv.map(p => {
          const can = p.pieces_to_fill > 0;
          return `<label class="cu${can ? "" : " none"}">
            <input type="checkbox" data-tick="${esc(p.job_id)}" ${can ? "" : "disabled"} ${can && S.ticked.has(p.job_id) ? "checked" : ""}>
            <span class="body"><span class="t">${esc(p.project_id)}</span> <span class="m">${esc(p.job_name)}</span><br>
              <span class="m">Monday: ${esc(p.monday_says)}</span><br><span class="l">${esc(p.line)}</span></span>
          </label>`;
        }).join("");
    const result = S.cuResult ? `<div class="result banner ${S.cuResult.ok ? "ok" : "warn"}">${esc(S.cuResult.summary)}
        ${(S.cuResult.lines || []).length ? `<ul>${S.cuResult.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}</div>` : "";

    // test jobs
    const real = S.uploaded.filter(u => !u.is_test && u.is_active).sort((a, b) => a.project_id.localeCompare(b.project_id));

        ${S.fbMissing ? `<div class="banner warn" style="margin:0">Finish-by dates aren't set up in the database yet. Run <b>finish_by.sql</b> in the SQL Editor, wait a minute, then reload.</div>`
          : (S.msg && S.msgFrom === "fb" ? `<div class="banner ${S.msg.ok ? "ok" : "warn"}" style="margin:0 0 8px">${esc(S.msg.text)}</div>` : "")

            + ((S.fbHist || []).some(h => h.set_by_name !== "Starting number") ? `<details class="more"><summary>Every change</summary>
                ${(S.fbHist || []).filter(h => h.set_by_name !== "Starting number").map(h => `<div class="typ"><span>${esc(DEPT_NAME[h.department] || h.department)}: ${h.days} days</span>

  // ---------- Photos ----------
  const photoUrls = new Map();
  async function photoUrl(path) {
    const hit = photoUrls.get(path);
    if (hit && hit.until > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("photos").createSignedUrl(path, 3600);
    if (error || !data) throw error || new Error("no link");
    photoUrls.set(path, { url: data.signedUrl, until: Date.now() + 50 * 60000 });
    return data.signedUrl;
  }
  function fillPhotos() {
    app.querySelectorAll("img[data-photopath]:not([src])").forEach(async (img) => {
      try { img.src = await photoUrl(img.dataset.photopath); }
      catch (e) { const b = img.closest(".ph"); if (b) { b.classList.add("nofile"); b.textContent = "Photo not available"; } }
    });
  }
  const tripWord = (l) => l.kind === "shipping" ? (l.pickup_steps ? "BOL pickup" : "Shipment") : l.kind === "customer_pickup" ? "Customer pickup" : "Delivery";
  const photoWhat = (p) => p.kind === "loadout" ? (p.truck ? `Truck ${p.truck}, loaded` : p.stage === "bol" ? (p.note || "BOL") : p.pallet ? `Pallet ${p.pallet}, wrapped` : p.sheet_number !== null ? `Sheet ${p.sheet_number}${p.piece ? ` · table ${p.piece}` : ""}${p.stage === "site" ? " · at the site" : ""}` : p.note || "")
                                                : `${p.department_name}${p.sheet_number !== null ? " · sheet " + p.sheet_number : ""}`;
  /** The floor TV's view of a job's white glove site photos (tv_photos.sql), by photo id, for the viewer's hide switch. */
  function rememberTvPics(rows) { S.tvPics = S.tvPics || {}; (rows || []).forEach(r => { S.tvPics[r.photo_id] = r; }); }
  /** The job page's Floor TV line: what shows, what's hidden, and the switch. */
  function tvJobHtml(J) {
    const tv = J.tv; if (!tv || !tv.length) return "";
    const showing = tv.filter(t => t.showing).length, withCopy = tv.filter(t => t.has_copy).length, jobHidden = tv[0].job_hidden;
    const words = jobHidden ? `This job's pictures are hidden from the floor TV.`
      : showing ? `${showing} picture${showing === 1 ? "" : "s"} of this job ${showing === 1 ? "shows" : "show"} on the floor TV (one per kind of table, for 14 days after delivery).`
      : withCopy ? `None of this job's pictures show on the floor TV right now (delivered more than 14 days ago, or the delivery isn't finished).`
      : `This job's site photos have no TV copy (taken before the TV showed pictures), so none show on the floor TV.`;
    return `<section class="panel"><h2>Floor TV</h2><p class="sub" style="margin:0 0 8px">${esc(words)}</p>
      ${jobHidden ? `<button class="plain" data-tvjob="${esc(J.id)}" data-hide="0">Let this job's pictures show again</button>`
                  : withCopy ? `<button class="plain" data-tvjob="${esc(J.id)}" data-hide="1">Hide this job's pictures from the TV</button>` : ""}
      <p class="meta2" style="margin:8px 0 0">To hide one picture, open it under Photos and deliveries below and use the button under it.</p></section>`;
  }
  /** Thumbnails; a photo off Supabase says where it is: an archive batch's zip, or OneDrive (off_supabase.sql, 31 Oct). */
  function photoStrip(list, caption = false) {
    const shown = (list || []).filter(p => !p.voided);
    if (!shown.length) return "";
    return `<div class="phs">${shown.map(p => p.in_cloud === false
      ? `<span class="ph nofile" title="${esc(p.archive_name || "")}">${p.archive_batch ? `Archived in batch ${esc(p.archive_batch)}` : "Off Supabase · in OneDrive"}</span>`
      : `<button class="ph" data-viewphoto="${esc(p.id)}" aria-label="Photo by ${esc(p.taken_by_name)}"><img alt="" data-photopath="${esc(p.storage_path)}">${caption ? `<span class="cap">${esc(photoWhat(p))}</span>` : ""}</button>`).join("")}</div>`;
  }
  function viewerHtml() {
    const p = S.viewer; if (!p) return "";
    const what = p.kind === "loadout" ? `Load-out · ${photoWhat(p)}` : p.kind === "defect" ? `Defect: ${p.defect_type || ""}` : `Issue: ${p.problem_body || ""}`;
    return `<div class="ovl" data-closeviewer="1"><div class="viewer" role="dialog" aria-modal="true" aria-label="Photo">
      <img alt="Photo by ${esc(p.taken_by_name)}" data-photopath="${esc(p.storage_path)}">
      <div class="vcap"><b>${p.is_test ? "TEST " : ""}${esc(p.project_id)}${p.sheet_number !== null ? ` · sheet ${p.sheet_number}` : ""}</b> · ${esc(p.department_name)}
        <div>${esc(what)}</div>${p.note && p.kind !== "loadout" ? `<div>${esc(p.note)}</div>` : ""}
        <small>Taken by ${esc(p.taken_by_name)}, ${esc(fmtDay(p.taken_at))} ${esc(new Date(p.taken_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))}</small></div>
      <div class="btns">${tvPicButton(p)}<button data-voidphoto="${esc(p.id)}">Entered by mistake</button><button data-closeviewer="1">Close</button></div></div></div>`;
  }

  /** Hide from the floor TV / show again, for a white glove site photo the TV knows about. */
  function tvPicButton(p) {
    const t = S.tvPics && S.tvPics[p.id]; if (!t || !t.has_copy) return "";
    return t.hidden ? `<button data-tvpic="${esc(p.id)}" data-hide="0">Show on the floor TV again</button>`
                    : `<button data-tvpic="${esc(p.id)}" data-hide="1">Hide from the floor TV</button>`;
  }
  async function findJobPhotos(project) {
    const [ph, lo, dl] = await Promise.all([soft(db.from("v_photos").select("*").eq("project_id", project)),
                                            soft(db.from("v_loadouts").select("*").eq("project_id", project)),
                                            quiet(db.from("v_deliveries").select("*").eq("project_id", project))]);
    S.phJob = { project, photos: ph || [], loadouts: (lo || []).sort((a, b) => String(b.started_at).localeCompare(String(a.started_at))),
                deliveries: dl, filing: dl !== null };
    const jobId = (ph && ph[0] && ph[0].job_id) || (lo && lo[0] && lo[0].job_id);
    rememberTvPics(jobId ? await quiet(db.rpc("tv_job_pictures", { p_job: jobId })) : null);
    S.jobZip = null;
    const byId = new Map(S.photos.map(p => [p.id, p])); for (const x of S.phJob.photos) byId.set(x.id, x); S.photos = [...byId.values()];
  }

  /** A job's photos and what left the building (OneDrive's Look up a job until 11 Nov; now at the foot of the job page). */
  function jobPhotosHtml(j) {
      const live = j.photos.filter(p => !p.voided);

      const offSaved = away.filter(p => !p.archive_batch).length;
      const mistakes = j.photos.length - live.length;
      const time = (ts) => `${fmtDay(ts)} ${new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      return !j.photos.length && !j.loadouts.length ? `<div class="empty" style="margin-top:12px"><b>No photos yet</b>Photos taken on this job's defects, issues and trips show here.</div>`
        : `
        ${j.filing ? `<div class="btns"><button class="go" data-jobzip="1" ${S.jobZip && S.jobZip.busy ? "disabled" : ""}>Download this job's photos</button>
            <span class="meta2">One zip: a folder per item (TB-03/TB-03-2 Delivery Picture.jpg), the trucks, the delivery tickets and signed tickets, and a spreadsheet.</span></div>
          ${S.jobZip ? `<div class="banner ${S.jobZip.ok === false ? "warn" : "ok"}" style="margin-top:10px">${esc(S.jobZip.text)}</div>` : ""}` : ""}
        ${j.loadouts.length ? `<div class="deptname">What left the building</div>` + j.loadouts.map(l => { const mine = live.filter(p => p.loadout_id === l.id);
            const dl = (j.deliveries || []).find(x => x.id === l.id);
            const done = new Set([...(l.sheets_here || []), ...(l.sheets_earlier || [])]).size;
            const ship = l.kind === "shipping", pk = l.kind === "customer_pickup" || (ship && l.pickup_steps), v2 = l.pieces_total !== undefined;
            const tables = v2 ? new Set([...(l.pieces_here || []), ...(l.pieces_earlier || [])]).size : 0;
            return `<div class="li"><div class="li-top"><b>${l.is_test ? `<span class="tag">TEST</span> ` : ""}${pk ? `${esc(tripWord(l))} · ` : ship ? "Shipment · " : v2 ? "Delivery · " : ""}${pk ? (l.completed_at ? `Picked up ${esc(time(l.completed_at))}` : l.ready_at ? `Ready since ${esc(time(l.ready_at))}` : "Not picked up yet")
                  : l.finished_at ? `${ship ? "Picked up" : "Left"} ${esc(time(l.finished_at))}` : `${ship ? "Shipment" : "Load-out"} still open`}</b>
              <span class="meta2">started ${esc(time(l.started_at))} by ${esc(l.started_by_name)}</span></div>
              ${ship && (l.carrier || l.tracking) ? `<div class="meta2">${esc([l.carrier, l.tracking ? `${pk ? "BOL" : "tracking"} ${l.tracking}` : ""].filter(Boolean).join(" · "))}</div>` : ""}
              ${l.ready_at && l.scheduled_by_name ? `<div class="meta2">Set up by ${esc(l.scheduled_by_name)}</div>` : ""}
              ${l.scheduled_for ? `<div class="meta2">Scheduled for ${esc(fmtWhen(l.scheduled_for))}${l.scheduled_by_name ? ` by ${esc(l.scheduled_by_name)}` : ""}</div>` : ""}
              ${l.part ? `<div class="meta2">${esc(`${l.part.went} of ${countWords(l.part.went + l.part.left, "table", "tables")} went · still to come: ${[l.part.left ? `${countWords(l.part.left, "table", "tables")} (${piecesWords(l.part.left_pieces)})` : null, l.part.extras_left ? countWords(l.part.extras_left, "extra", "extras") : null].filter(Boolean).join(" and ")} · the rest ${restState(l.part)} · ${l.part.reason}`)}</div>` : ""}
              ${l.rest ? `<div class="meta2">${esc(`The rest of ${l.rest.of_at ? fmtWhen(l.rest.of_at) : "an earlier trip"}'s ${l.rest.of_kind === "shipping" || l.rest.of_kind === "customer_pickup" ? "pickup" : "delivery"} · ${countWords(l.rest.count, "table", "tables")}${l.rest.extras ? ` and ${countWords(l.rest.extras, "extra", "extras")}` : ""} · ${l.rest.reason}`)}</div>` : ""}
              ${l.completed_at && pk && ship ? `<div><b>${l.part ? "Part picked up" : "Picked up"} ${esc(fmtWhen(l.completed_at))}</b>${l.completed_by_name ? ` · ${esc(l.completed_by_name)}` : ""} · BOL photos: ${l.bol_here || 0}</div>`
                : l.completed_at ? `<div><b>${l.part ? (pk ? "Part picked up" : "Part delivered") : pk ? "Picked up" : "Delivered"} ${esc(fmtWhen(l.completed_at))}</b> · ${l.signed_name ? `signed by ${esc(l.signed_name)}` : `not signed (${esc(l.no_sign_reason || "")})`}${(l.site_here || []).length ? ` · ${(l.site_here || []).length} of ${l.pieces_total} tables photographed at the site` : ""}
                  ${dl ? ` <button class="link" data-signedpdf="${esc(l.id)}">Signed ticket</button>` : ""}</div>
                  ${dl && dl.customer_note ? `<div class="meta2">Customer's note: ${esc(dl.customer_note)}</div>` : ""}` : ""}
              ${v2 && l.site_steps && l.kind === "delivery" ? `<div class="meta2">Truck photos: ${(l.trucks_here || []).length}${l.other_items ? ` · ${l.other_items} other item${l.other_items === 1 ? "" : "s"}` : ""}</div>`
                : v2 ? `<div class="meta2">${l.pieces_total ? `Tables on this ${pk ? "pickup" : ship ? "shipment" : "truck"}: ${(l.pieces_here || []).length} · ${tables} of ${l.pieces_total} photographed so far` : `${(l.pieces_here || []).length} photographed`}${ship ? ` · ${(l.pallets_here || []).length} wrapped pallet${(l.pallets_here || []).length === 1 ? "" : "s"}` : ""}${l.other_items ? ` · ${l.other_items} other item${l.other_items === 1 ? "" : "s"}` : ""}</div>` : `<div class="meta2">On this truck: ${(l.sheets_here || []).length ? `sheet${l.sheets_here.length === 1 ? "" : "s"} ${esc(l.sheets_here.join(", "))}` : "no sheets"}${l.other_items ? ` · ${l.other_items} other item${l.other_items === 1 ? "" : "s"}` : ""}${l.sheets_total ? ` · ${done} of ${l.sheets_total} sheets photographed so far` : ""}</div>`}
              ${photoStrip(mine, true)}</div>`; }).join("") : ""}
        ${onEntries.length ? `<div class="deptname">On defects and issues</div>${photoStrip(onEntries, true)}` : ""}
        ${archived.length ? `<p class="sub" style="margin-top:12px">Some of this job's photos have been archived: ${archived.map(b => `photo-archive-${esc(b)}.zip, folder ${esc(j.project)}`).join("; ")}.</p>` : ""}
        ${offSaved ? `<p class="sub" style="margin-top:12px">${offSaved} of this job's photos ${offSaved === 1 ? "is" : "are"} off Supabase: ${offSaved === 1 ? "it's" : "they're"} in the job's OneDrive folder (${esc(SAVE_DIR)}) and the backup folder.</p>` : ""}
        ${mistakes ? `<p class="sub">${mistakes} photo${mistakes === 1 ? " was" : "s were"} marked entered by mistake and ${mistakes === 1 ? "isn't" : "aren't"} shown.</p>` : ""}`;
  }

  function photosScreen() {

      const a = S.arch;                                // an earlier archive batch, downloaded again

        : a && a.stage === "failed" ? `<div class="banner warn">${esc(a.text)}</div>` : "";
      const batches = (st.batches || []).filter(b => b.state !== "building");
      const n = (k, one, many) => `${k} ${k === 1 ? one : many}`;
      space = `<p class="sub" style="margin:0">Storage used: <b>${esc(fmtBytes(used.bytes_all))}</b> of about 1 GB on Supabase's free plan — photos ${esc(fmtBytes(used.bytes_photos))}${off ? `, delivery files ${esc(fmtBytes(off.bytes_deliveries))}` : ""}, work orders ${esc(fmtBytes(used.bytes_work_orders))}.</p>

          : off ? `<p class="sub">${off.off_so_far ? `<b>${n(off.off_so_far, "file has", "files have")}</b> come off so far. ` : ""}${off.due
              ? `<b>${n(off.due, "file is", "files are")}</b> due now: ${off.due === 1 ? "it goes" : "they go"} once the save has found ${off.due === 1 ? "it" : "them"} in both OneDrive and the backup folder on two different days.`
              : off.next_due_at ? `Nothing is due yet. The next files are due on ${esc(fmtDay(off.next_due_at))}.`
              : "Nothing is due yet: a job's files are due 60 days after it leaves the floor."}</p>` : ""}
        ${progress}
        ${st.to_remove > 0 ? `<div class="banner warn">${st.to_remove} file${st.to_remove === 1 ? " has" : "s have"} been kept in both places for a month and can come off Supabase now.
            <div class="btns"><button class="go" data-archremove="1" ${S.busy ? "disabled" : ""}>Remove ${st.to_remove === 1 ? "it" : "them"} from Supabase</button></div></div>` : ""}
        ${batches.length ? `<details class="more" style="margin-top:12px"><summary>Earlier archive zips (${batches.length})</summary>${batches.map(b => `<div class="batch">
            <b>${esc(b.id)}</b> <span>${esc(BATCH_STATE[b.state])}</span> <span class="meta2">${b.photos} photos · ${esc(fmtBytes(b.bytes))} · made ${esc(fmtDay(b.made_at))} by ${esc(b.made_by || "")}</span>
            ${b.files_left > 0 ? `<button class="link" data-archagain="${esc(b.id)}">Download again</button>` : ""}</div>`).join("")}</details>` : ""}`;
    }
    return `<h1>OneDrive</h1>
      <p class="sub">Saving everything to OneDrive and the hard drive, and the space photos and delivery files take on Supabase.</p>
      ${msgBanner()}
      ${savePanel()}
      <p class="sub">A job's photos and what left the building are on its page: open it on Jobs.</p>
      <section class="panel"><h2>Space on Supabase</h2>
        <p class="sub">Supabase's free plan holds about 1 GB. A job's photos and delivery files come off it by themselves once the job has been past Delivery for 60 days and the save above has found each file, on two different days, in both its OneDrive folder on this PC and the backup folder. The save can see a file is in the OneDrive folder on this PC; it can't see whether OneDrive has sent it on, so the day in between is there for OneDrive's icon to show a problem. Every record stays for good, and the files stay in OneDrive.</p>
        ${space}</section>`;
  }

  // ---------- the archive, step by step ----------
  function saveBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  // ---------- zips in the filing layout (deliveries.sql): photos, delivery files, signed tickets ----------
  async function pdfLib() {
    if (window.PDFLib) return window.PDFLib;
    await new Promise((res, rej) => { const s = document.createElement("script"); s.integrity = PDF_LIB_SRI; s.crossOrigin = "anonymous"; s.src = PDF_LIB_URL; s.onload = res;
      s.onerror = () => rej(new Error("The PDF helper couldn't load. Check the connection and try again.")); document.head.appendChild(s); });
    return window.PDFLib;
  }
  async function fileBytes(bucket, path) {
    const r = await db.storage.from(bucket || "photos").download(path);
    if (r.error || !r.data) throw r.error || new Error("That file isn't there.");
    return new Uint8Array(await r.data.arrayBuffer());
  }
  async function signedTicketFor(d, have = new Map()) {
    const lib = await pdfLib();
    const t = d.ticket && d.ticket.in_cloud !== false ? { bytes: have.get(d.ticket.path) || await fileBytes("deliveries", d.ticket.path), mime: d.ticket.mime } : null;
    const s = d.signature_path ? (have.get(d.signature_path) || await fileBytes("deliveries", d.signature_path)) : null;
    return new Uint8Array(await buildSignedTicket(lib, d, t, s));
  }
  /** Download every file in the list; signed tickets are put together from the ticket and the signature. */
  async function collectFiles(list, progress = () => {}) {
    const files = [], missing = [], have = new Map();
    let bytes = 0, done = 0;
    for (const x of list.filter(x => x.source !== "signed")) {
      if (x.in_cloud === false) { missing.push(x.name); continue; }
      try { const data = await fileBytes(x.bucket, x.path); have.set(x.path, data); bytes += data.length; files.push({ name: x.name, data, date: atDate(x.at) }); }
      catch (e) { missing.push(x.name); }
      progress(++done, list.length);
    }
    const signed = list.filter(x => x.source === "signed");
    if (signed.length) {
      const rows = await quiet(db.from("v_deliveries").select("*").in("id", signed.map(x => x.loadout_id || x.id))) || [];
      for (const x of signed) {
        const d = rows.find(r => r.id === (x.loadout_id || x.id));
        try { if (!d || x.in_cloud === false) throw new Error("gone"); const data = await signedTicketFor(d, have); bytes += data.length; files.push({ name: x.name, data, date: atDate(x.at) }); }
        catch (e) { missing.push(x.name); }
        progress(++done, list.length);
      }
    }
    return { files, missing, bytes };
  }
  async function buildZip(info) {
    if (info.files) return buildFilingZip(info);
    const list = info.photos || [];
    S.arch = { batch: info.batch, stage: "downloading", done: 0, total: list.length }; render();
    const files = [], missing = [];
    let bytes = 0;
    for (const p of list) {
      if (!p.in_cloud) { missing.push(p.name); continue; }
      let r; try { r = await db.storage.from("photos").download(p.path); } catch (e) { r = { error: e }; }
      if (r.error || !r.data) { missing.push(p.name); continue; }
      const data = new Uint8Array(await r.data.arrayBuffer());
      bytes += data.length;
      const [d, t] = String(p.at).split(" ");
      files.push({ name: p.name, data, date: new Date(`${d}T${t || "00:00"}:00`) });
      S.arch.done += 1;
      if (S.arch.done % 5 === 0 || S.arch.done === list.length) render();
    }
    if (missing.length) {
      S.arch = { batch: info.batch, stage: "failed", text: `${missing.length} photo${missing.length === 1 ? "" : "s"} couldn't be downloaded (${missing.slice(0, 3).join(", ")}${missing.length > 3 ? "…" : ""}), so no zip was made and nothing is marked saved. Check the connection and press Download archive again.` };
      return render();
    }
    files.push({ name: "photos.csv", data: utf8(photoCsv(list, info.batch)), date: new Date() });
    saveBlob(new Blob([makeZip(files)], { type: "application/zip" }), `photo-archive-${info.batch}.zip`);
    S.arch = { batch: info.batch, stage: "ready", total: list.length, bytes };
    render();
  }
  // the archive, filed by job, item and table, with the delivery files and signed tickets
  async function buildFilingZip(info) {
    const list = info.files || [];
    S.arch = { batch: info.batch, stage: "downloading", done: 0, total: list.length }; render();
    const r = await collectFiles(list, (done) => { S.arch.done = done; if (done % 5 === 0 || done === list.length) render(); });
    if (r.missing.length) {
      S.arch = { batch: info.batch, stage: "failed", text: `${r.missing.length} file${r.missing.length === 1 ? "" : "s"} couldn't be downloaded (${r.missing.slice(0, 3).join(", ")}${r.missing.length > 3 ? "…" : ""}), so no zip was made and nothing is marked saved. Check the connection and press Download archive again.` };
      return render();
    }
    r.files.push({ name: "photos.csv", data: utf8(fileCsv(list, info.batch)), date: new Date() });
    saveBlob(new Blob([makeZip(r.files)], { type: "application/zip" }), `photo-archive-${info.batch}.zip`);
    S.arch = { batch: info.batch, stage: "ready", total: list.length, bytes: r.bytes };
    render();
  }
  /** After prepare_photo_archive(): the batch's delivery files join it, and everything is named the filing way. */
  async function withFiling(info) {
    const { data, error } = await db.rpc("file_archive_batch", { p_batch: info.batch });
    return error ? info : { ...info, files: data.files };
  }
  async function removeDeliveryDocs() {
    const { data, error } = await db.rpc("delivery_docs_to_remove");
    if (error || !data || !data.length) return [];
    const byBatch = {}, said = [];
    for (const x of data) (byBatch[x.batch] = byBatch[x.batch] || []).push(x.path);
    for (const [batch, paths] of Object.entries(byBatch)) {
      for (let i = 0; i < paths.length; i += 100) {
        const r = await db.storage.from("deliveries").remove(paths.slice(i, i + 100));
        if (r.error) { said.push(`Batch ${batch}: ${friendlyError(r.error)}`); break; }
      }
      const m = await db.rpc("mark_delivery_docs_removed", { p_batch: batch });
      if (m.error) said.push(friendlyError(m.error)); else if (m.data.summary) said.push(m.data.summary);
    }
    return said;
  }
  async function removeReleased(list) {
    const byBatch = {};
    for (const x of list || []) (byBatch[x.batch] = byBatch[x.batch] || []).push(x.path);
    const said = [];
    for (const [batch, paths] of Object.entries(byBatch)) {
      for (let i = 0; i < paths.length; i += 100) {
        const r = await db.storage.from("photos").remove(paths.slice(i, i + 100));
        if (r.error) { said.push(`Batch ${batch}: ${friendlyError(r.error)}`); break; }
      }
      const { data, error } = await db.rpc("mark_photo_files_removed", { p_batch: batch });
      said.push(error ? friendlyError(error) : data.summary);
    }
    return said.concat(await removeDeliveryDocs());       // delivery files leave with their batch (deliveries.sql)
  }

  // ---------- saving to OneDrive and the hard drive (onedrive_save.sql, 6 Oct; off_supabase.sql, 31 Oct) ----------
  // While this page is open on the computer where the two folders were chosen, it saves on opening and every 30
  // minutes: each real job's photos, files, signed tickets and records go into "Production" inside its own OneDrive
  // folder (Delivery, Photos, Job Data), and to the backup folder (hard drive) first. Files are written once and never
  // overwritten; records are rewritten only when they've changed. A job's old "shop-floor data" folder is moved into
  // Production once, then removed. A photo or delivery file whose job has been past Delivery for 60 days comes off
  // Supabase once this save has found it in both places (the database decides; its record stays).
  const SAVE_EVERY_MS = 30 * 60 * 1000, SAVE_FIRST_MS = 20 * 1000, SAVE_OVERLAP_MS = 2 * 86400 * 1000, SAVE_BATCH = 20;
  S.save = { supported: typeof window.showDirectoryPicker === "function", od: null, bk: null, sys: null, perm: { od: null, bk: null, sys: null },
             running: false, progress: "", result: null, status: null, missing: false, started: false };
  // where the two folders are remembered: this browser's own storage (a folder can't be written down any other way)
  const saveKv = {
    mem: new Map(),
    open() {
      if (!window.indexedDB) return Promise.resolve(null);
      return this.p || (this.p = new Promise((res) => { const r = indexedDB.open("sf-save", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }));
    },
    async get(k) { const d = await this.open(); if (!d) return this.mem.get(k);
      return new Promise((res) => { const t = d.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
    async set(k, v) { const d = await this.open(); if (!d) { this.mem.set(k, v); return; }
      return new Promise((res, rej) => { const tx = d.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  };
  async function saveState() { const v = await saveKv.get("state"); return v && v.since ? v : { since: { od: null, bk: null }, retry: [] }; }
  async function loadSaveStatus() {
    let r; try { r = await db.rpc("save_status"); } catch (e) { r = { error: e }; }
    if (r.error) { S.save.missing = /does not exist|schema cache|could not find/i.test(String(r.error.message)); return; }
    S.save.missing = false; S.save.status = r.data;
  }
  async function saveLoadHandles() {
    S.save.od = (await saveKv.get("onedrive")) || null; S.save.bk = (await saveKv.get("backup")) || null; S.save.sys = (await saveKv.get("system")) || null;
    for (const k of ["od", "bk", "sys"]) {
      const h = S.save[k];
      S.save.perm[k] = h ? await h.queryPermission({ mode: "readwrite" }).catch(() => "prompt") : null;
    }
  }
  function saveShow(text) {
    S.save.progress = text; const el = document.getElementById("saveProgress"); if (el) el.textContent = text;
    const b = document.querySelector("[data-savenow]"); if (b) b.disabled = !!S.save.running;   // a save is running (the half-hourly one too)
  }
  async function saveStart() {
    if (S.save.started || !isManager(S.me) || !S.save.supported) return;
    S.save.started = true;
    await saveLoadHandles();
    render();                                   // show the remembered folders (and Resume saving, if the browser wants permission)
    saveSoon(SAVE_FIRST_MS);
    setInterval(() => saveRun("auto"), SAVE_EVERY_MS);
  }
  function saveSoon(ms) { clearTimeout(S.save.soon); S.save.soon = setTimeout(() => saveRun("auto"), ms); }
  async function savePick(which) {
    let h;
    try { h = await window.showDirectoryPicker({ id: ({ od: "sf-onedrive", bk: "sf-backup", sys: "sf-system" })[which], mode: "readwrite" }); }
    catch (e) { if (e && e.name === "AbortError") return; S.msg = { ok: false, text: friendlyError(e) }; return render(); }
    if (which === "sys") {                         // Claudes Shop System Folder: the library and the Arrow POs (1 Nov)
      for (const k of ["od", "bk"]) {
        const o = S.save[k]; if (!o) continue;
        const same = await h.isSameEntry(o).catch(() => false);
        const inside = (await o.resolve(h).catch(() => null)) || (k === "bk" && await h.resolve(o).catch(() => null));
        if (same || inside) {
          S.msg = { ok: false, text: `Claudes Shop System Folder has to be its own folder: not the ${k === "od" ? "OneDrive projects folder or one inside it" : "backup folder, inside it, or holding it"}. Nothing was changed; pick Production › Production Software › Claudes Shop System Folder.` };
          return render();
        }
      }
      await saveKv.set("system", h); S.save.sys = h; S.save.perm.sys = "granted";
      S.msg = { ok: true, text: `Shop system folder chosen: ${h.name}. The next save files library files into its Database folder and writes Database index.csv there.` };
      render(); saveSoon(3000); return;
    }
    const other = S.save[which === "od" ? "bk" : "od"];
    if (other) {
      const same = await h.isSameEntry(other).catch(() => false);
      const inside = (await other.resolve(h).catch(() => null)) || (await h.resolve(other).catch(() => null));
      if (same || inside) {
        S.msg = { ok: false, text: "The backup folder has to be separate from the OneDrive projects folder: not the same folder, and not one inside the other. Nothing was changed; pick another folder." };
        return render();
      }
    }
    await saveKv.set(which === "od" ? "onedrive" : "backup", h);
    const st = await saveState(); st.since[which] = null; if (which === "od") st.retry = []; await saveKv.set("state", st);
    S.save[which] = h; S.save.perm[which] = "granted";
    S.msg = { ok: true, text: which === "od"
      ? `OneDrive projects folder chosen: ${h.name}. Saves look for each job's folder in it and in the folders one level inside.`
      : `Backup folder chosen: ${h.name}. The next save copies everything it's missing there.` };
    render(); saveSoon(3000);
  }
  async function saveResume() {
    for (const k of ["od", "bk", "sys"]) {
      const h = S.save[k]; if (!h) continue;
      try { S.save.perm[k] = await h.requestPermission({ mode: "readwrite" }); } catch (e) { S.save.perm[k] = "prompt"; }
    }
    render(); if (S.save.perm.od === "granted") saveSoon(1000);
  }
  /** All rows of a request, 500 at a time (Supabase returns at most 1,000 a request; the tests make pages tiny) */
  async function allRows(make) {
    const size = window.SF_SAVE_PAGE || 500, out = [];
    for (let from = 0; ; from += size) {
      const rows = await q(make().range(from, from + size - 1));
      out.push(...rows); if (rows.length < size) return out;
    }
  }
  /** Everything a batch of jobs needs, in six requests (plus paging) */
  async function saveBatchData(jobs) {
    const ids = jobs.map(j => j.job_id), projects = jobs.map(j => j.project_id);
    const [files, prod, defs, probs, flags, arrow] = await Promise.all([
      allRows(() => db.from("v_filing").select("*").in("project_id", projects).eq("is_test", false).order("source").order("id")),
      db.rpc("save_production_record", { p_job_ids: ids }).then(r => { if (r.error) throw r.error; return r.data || []; }),
      allRows(() => db.from("v_defects").select("*").in("job_id", ids).order("id")),
      allRows(() => db.from("v_problems").select("*").in("job_id", ids).order("id")),
      allRows(() => db.from("v_flags").select("*").in("job_id", ids).order("id")),
      allRows(() => db.from("v_outside_jobs").select("*").in("job_id", ids).order("id"))]);
    const by = new Map(jobs.map(j => [j.job_id, { files: [], production: [], defects: [], problems: [], flags: [], arrow: [] }]));
    const jobOf = new Map(jobs.map(j => [j.project_id, j.job_id]));
    for (const f of files) { const id = jobOf.get(f.project_id); if (id) by.get(id).files.push(filingItem(f)); }
    for (const [list, key] of [[prod, "production"], [defs, "defects"], [probs, "problems"], [flags, "flags"], [arrow, "arrow"]])
      for (const r of list) if (by.has(r.job_id)) by.get(r.job_id)[key].push(r);
    for (const d of by.values()) d.files.sort((a, b) => a.name.localeCompare(b.name));
    return by;
  }
  /** One job into each target folder, the backup first. Returns how many files it wrote. `due`: the job has files due off
   *  Supabase, so what's found in each place is reported (off_supabase.sql). */
  async function saveOneJob(job, d, targets, res, due = false) {
    const have = new Map();                         // a file downloaded for the first target is reused for the second
    let deliveries = null;
    const bytesOf = async (x) => {
      if (have.has(x.name)) return have.get(x.name);
      let data;
      if (x.source === "signed") {
        if (!deliveries) deliveries = await quiet(db.from("v_deliveries").select("*").in("id", d.files.filter(f => f.source === "signed").map(f => f.loadout_id || f.id))) || [];
        const row = deliveries.find(r => r.id === (x.loadout_id || x.id));
        if (!row) throw new Error("its trip couldn't be read");
        data = await signedTicketFor(row);
      } else data = await fileBytes(x.bucket, x.path);
      have.set(x.name, data); return data;
    };
    const records = jobRecords(d);
    let wrote = 0;
    for (const [key, label, open] of targets) {
      try {
        const jobDir = await open();
        try {                                                          // the old layout, once: moved into Production, then removed
          const m = await moveOldSave(jobDir, d.files);
          if (m) {
            res.moved += m.moved; if (m.removed) res.oldGone++;
            if (m.kept.length) {
              res.retry.set(job.job_id, { job_id: job.job_id, project_id: job.project_id, name: job.name });
              if (res.problems.length < 50) res.problems.push(`${job.project_id}: the old “${SAVE_DIR_OLD}” folder in ${label} is kept: ${m.kept.length === 1 ? "a file in it isn't" : `${m.kept.length} files in it aren't`} where the save puts things (${m.kept.slice(0, 3).join(", ")}${m.kept.length > 3 ? "…" : ""}). Move ${m.kept.length === 1 ? "it" : "them"} into “${SAVE_DIR}” or delete ${m.kept.length === 1 ? "it" : "them"}, and the next save removes the old folder.`);
            }
          }
        } catch (e) {
          res.retry.set(job.job_id, { job_id: job.job_id, project_id: job.project_id, name: job.name });
          if (res.problems.length < 50) res.problems.push(`${job.project_id}: the old “${SAVE_DIR_OLD}” folder in ${label} couldn't be moved yet (${e && e.message ? e.message : e}). Nothing in it was lost; it's tried again next time.`);
        }
        const dir = await fsDir(jobDir, [SAVE_DIR], true);
        const dirs = new Map([["", dir]]);
        const sub = async (segs) => { const k = segs.join("/"); if (!dirs.has(k)) dirs.set(k, await fsDir(dir, segs, true)); return dirs.get(k); };
        for (const x of d.files) {
          const segs = saveRelPath(x.name); if (!segs.length) continue;
          const folder = await sub([saveTop(x), ...segs.slice(0, -1)]), name = segs[segs.length - 1];
          let size = await fsSize(folder, name);
          if (x.old_name) {                                            // filed under its longer name before 3 Nov: renamed here, not downloaded again
            const o = saveRelPath(x.old_name), oname = o[o.length - 1];
            const ofolder = o.slice(0, -1).join("/") === segs.slice(0, -1).join("/") ? folder : await fsDirIf(dir, [saveTop(x), ...o.slice(0, -1)]);
            const osize = ofolder ? await fsSize(ofolder, oname) : -1;
            if (osize === 0) await ofolder.removeEntry(oname);          // an empty file left by a write that failed: it holds nothing
            else if (osize > 0 && size <= 0) {
              const old = await (await ofolder.getFileHandle(oname)).getFile();
              size = await fsWrite(folder, name, new Uint8Array(await old.arrayBuffer()));
              await ofolder.removeEntry(oname); res.renamed++; wrote++;
            } else if (osize > 0 && osize === size) { await ofolder.removeEntry(oname); res.renamed++; }   // both there, the same: the old one goes
          }
          if (size <= 0) {                                             // already saved files are never touched again
            if (x.in_cloud === false) continue;                       // off Supabase already (an archive zip, or saved here and in the backup)
            let data;
            try { data = await bytesOf(x); }
            catch (e) {                                              // not complete: tried again next save, and not counted as a good save
              res[key] = false; res.retry.set(job.job_id, { job_id: job.job_id, project_id: job.project_id, name: job.name });
              if (res.problems.length < 50) res.problems.push(`${job.project_id}: ${segs.join("/")} couldn't be downloaded (${e && e.message ? e.message : e}), so it wasn't saved to ${label}. It's tried again next time.`);
              continue;
            }
            size = await fsWrite(folder, name, data); res.bytes += size; res.files++; wrote++;
          }
          if (due && x.in_cloud !== false && size > 0) {
            res.copies.push({ source: x.source, id: x.id, place: key === "od" ? "onedrive" : "backup", bytes: size });
            if (x.bytes && Number(x.bytes) !== size && res.problems.length < 50)      // the database won't let it go: say why
              res.problems.push(`${job.project_id}: ${[saveTop(x), ...segs].join("/")} in ${label} isn't the same size as the copy on Supabase, so it stays on Supabase. If the saved one was changed by mistake, delete it and the next save puts the original back.`);
          }
        }
        const rdir = await sub([SAVE_SUB.data]);
        for (const [name, text] of Object.entries(records)) {
          if (await fsSame(rdir, name, text)) continue;              // unchanged
          res.bytes += await fsWrite(rdir, name, text); res.files++; wrote++;
        }
      } catch (e) {
        res[key] = false;
        if (res.problems.length < 50) res.problems.push(`${job.project_id}: couldn't save to ${label} (${e && e.message ? e.message : e}).`);
        if (key === "od") res.retry.set(job.job_id, { job_id: job.job_id, project_id: job.project_id, name: job.name });
      }

      ${skipped.length ? `<div class="banner warn">${skipped.length} job${skipped.length === 1 ? " was" : "s were"} skipped in OneDrive and will be tried again next time:
          <ul style="margin:6px 0 0 18px; padding:0">${skipped.slice(0, 30).map(x => `<li><b>${esc(x.project_id)}</b>: ${x.why === "Two folders"
            ? `two folders${x.paths && x.paths.length ? ` (${x.paths.map(esc).join(" and ")})` : ""}. Move or rename one.` : "no OneDrive folder yet. Make it and the next save fills it."}</li>`).join("")}</ul>
          ${skipped.length > 30 ? `<p class="meta2">…and ${skipped.length - 30} more.</p>` : ""}</div>` : ""}
      ${problems.length ? `<div class="banner warn"><ul style="margin:0 0 0 18px; padding:0">${problems.slice(0, 20).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      <p class="meta2" style="margin-top:10px">Each job's photos, files, signed tickets and records go into a folder called “${SAVE_DIR}” inside its own OneDrive folder (${SAVE_SUB.delivery}, ${SAVE_SUB.photos} and ${SAVE_SUB.data}), and a copy into the backup folder first. A file already saved is never overwritten. A job's old “${SAVE_DIR_OLD}” folder is moved into “${SAVE_DIR}” once, then removed.
        Files from dropped zips go into ${SAVE_SUB.files}, or into the library (Claudes Shop System Folder › ${LIB_DIR}, with ${LIB_INDEX} kept up to date), and come off Supabase once the save has found them in both places on two different days.</p>
    </section>`;
  }

  function render() {
    if (!S.me) return;
    showSections();
    if (S.locked) return pinScreen("unlock");
    if (S.section) { app.innerHTML = topBar() + menuHtml(); wire(); return; }
    const screens = { jobs: jobsScreen, setup: setupScreen, photos: photosScreen, feedback: feedbackScreen };
    const body = S.jobView ? jobScreen() : (screens[S.tab] || needsScreen)();
    // a redraw mustn't pull the cursor out of Find a job while someone is typing in it
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-jobfind]");
    app.innerHTML = topBar() + menuHtml() + `<main${S.jobView ? ' class="wide"' : ""}>${S.notice ? `<div class="banner warn">${esc(S.notice)}</div>` : ""}${body}
      <p style="text-align:center; margin-top:30px"><button class="link" data-signout="1">Sign out</button></p></main>` + viewerHtml() + (S.jobView ? designOvlHtml() : "");
    wire();
    if (S.d3 && S.jobView) showDesign3();
    if (typing) { const f = app.querySelector("[data-jobfind]"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
    fillPhotos();
  }

  function wire() {
    app.querySelectorAll("[data-tab]").forEach(b => b.onclick = async () => {
      S.tab = b.dataset.tab; store.set("tab", S.tab); S.msg = null; S.menu = false; S.jobView = null; S.job = null;
      if (S.section) { S.section = null; store.set("section", null); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
      render(); scrollTo(0, 0); await loadTab(); render();
    });
    // ☰ menu
    app.querySelectorAll("[data-menu]").forEach(b => b.onclick = () => { S.menu = !S.menu; render(); });
    app.querySelectorAll("[data-menuclose]").forEach(b => b.onclick = () => { S.menu = false; render(); });
    app.querySelectorAll("[data-section]").forEach(b => b.onclick = () => openSection(b.dataset.section));
    // Feedback: filter by page; copy what's shown, to paste into a chat
    app.querySelectorAll("[data-fbkpage]").forEach(b => b.onclick = () => { S.fbkPage = b.dataset.fbkpage; S.msg = null; render(); });
    app.querySelectorAll("[data-fbkcopy]").forEach(b => b.onclick = async () => {
      const text = feedbackText(feedbackShown());
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
        const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
        try { ok = document.execCommand("copy"); } catch (e2) {} t.remove();
      }
      S.msg = ok ? { ok: true, text: "Copied. Paste it into a chat to plan changes." } : { ok: false, text: "This browser wouldn't copy. Select the notes on the page instead." };
      render();
    });
    // Jobs: only the list under the search box redraws while typing, so the box keeps its place
    const find = app.querySelector("[data-jobfind]");
    if (find) {
      const hits = app.querySelector("#jobhits");
      const redraw = () => { hits.innerHTML = jobsListHtml(); hits.querySelectorAll("[data-openjob]").forEach(b => b.onclick = () => openJob(b.dataset.openjob)); };
      find.oninput = () => { S.jobFind = find.value; redraw(); };
      find.onkeydown = (ev) => {
        if (ev.key === "Enter") { const first = hits.querySelector("[data-openjob]"); if (first && S.jobFind.trim()) openJob(first.dataset.openjob); }
        if (ev.key === "Escape") { S.jobFind = ""; find.value = ""; redraw(); }

    }
    app.querySelectorAll("main [data-openjob]").forEach(b => b.onclick = () => openJob(b.dataset.openjob));
    app.querySelectorAll("[data-d3]").forEach(b => b.onclick = () => openDesign3(b.dataset.d3));
    app.querySelectorAll("[data-d3close]").forEach(b => b.onclick = () => { S.d3 = null; render(); });
    app.querySelectorAll("[data-jobback]").forEach(b => b.onclick = async () => {
      S.d3 = null; S.jobView = null; S.job = null; S.tab = S.jobBack || S.tab; render(); scrollTo(0, 0); await loadTab(); render();
    });
    app.querySelectorAll("[data-jobphotos]").forEach(b => b.onclick = () => { const el = document.getElementById("jobphotos"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" }); });
    // 11 Nov: one item (a work order sheet) of the open job
    app.querySelectorAll("[data-item]").forEach(b => b.onclick = () => {
      const st = S.job && S.job.st; if (!st) return;
      const i = (st.sheets || []).findIndex(x => String(x.n) === b.dataset.item); if (i < 0) return;
      S.item = i; S.pgBig = false; S.d3 = null; render(); scrollTo(0, 0); });
    app.querySelectorAll("[data-itemback]").forEach(b => b.onclick = () => { S.item = null; S.d3 = null; render(); scrollTo(0, 0); });

    app.querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { S.locked = true; S.pinEntry = ""; render(); });
    app.querySelectorAll("[data-live]").forEach(b => b.onclick = async () => {
      const d = S.depts.find(x => x.key === b.dataset.live); if (!d) return;
      const turnOn = !d.is_live;
      if (!confirm(`${turnOn ? "Switch" : "Take"} ${d.name} ${turnOn ? "live" : "off"}? ${turnOn ? "The TV will start showing it." : "The TV will stop showing it."}`)) return;
      S.busy = true; render();
      const { error } = await db.rpc("set_department_live", { p_department: d.key, p_live: turnOn });
      S.busy = false;
      if (error) S.notice = friendlyError(error);
      await loadTab(); render();
    });
    app.querySelectorAll("[data-rule]").forEach(box => box.onchange = async () => {
      const key = box.dataset.rule, label = box.dataset.label;
      const depts = [...app.querySelectorAll("[data-rule]")].filter(x => x.dataset.rule === key && x.dataset.label === label && x.checked).map(x => x.dataset.dept);
      const { error } = await db.rpc("set_stage_map", { p_column: key, p_label: label, p_departments: depts });
      if (error) { S.notice = friendlyError(error); render(); return; }
      S.cuResult = null;
      await loadPreview(); render();
    });
    app.querySelectorAll("[data-tick]").forEach(box => box.onchange = () => {
      box.checked ? S.ticked.add(box.dataset.tick) : S.ticked.delete(box.dataset.tick);
      render();
    });
    app.querySelectorAll("[data-refresh]").forEach(b => b.onclick = async () => { S.cuResult = null; await loadPreview(); render(); });
    app.querySelectorAll("[data-apply]").forEach(b => b.onclick = async () => {
      const t = catchUpTotals(S.preview, S.ticked);
      if (!t.jobs || !confirm(`Mark ${t.pieces} pieces complete across ${t.jobs} job${t.jobs === 1 ? "" : "s"}? Each one is recorded as "Catch-up from Monday" under your name. Counts can be corrected afterwards on a tablet, but the record stays.`)) return;
      S.busy = true; render();
      const { data, error } = await db.rpc("catch_up_apply", { p_jobs: t.ids });
      S.busy = false;
      S.cuResult = error ? { ok: false, summary: friendlyError(error) } : data;
      await loadPreview(); render();
    });
    app.querySelectorAll("[data-maketest]").forEach(b => b.onclick = async () => {
      const from = document.getElementById("copyFrom").value; if (!from) return;
      S.busy = true; render();
      const { data, error } = await db.rpc("make_test_job", { p_project: from });
      S.busy = false;
      S.testMsg = error ? { ok: false, text: friendlyError(error) } : { ok: true, text: data.summary + " Sign in on a tablet as the Test Supervisor to see it." };
      await loadTab(); render();
    });
    app.querySelectorAll("[data-retire]").forEach(b => b.onclick = async () => {
      if (!confirm(`Retire ${b.dataset.retire}? It leaves the test tablet; its history is kept.`)) return;
      const { data, error } = await db.rpc("retire_test_job", { p_project: b.dataset.retire });
