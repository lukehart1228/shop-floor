<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181D2E">
<title>Office · Shop Floor</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#181D2E; --orange:#ED5E0F; --bright:#F0A721; --teal:#00B4B2;
    --teal-ink:#00807E; --teal-bg:#DDF2F1; --sawdust:#FFF4D5; --gray:#C2BAA0;
    --paper:#EFEDE6; --line:#E4DFCF; --ink2:#6B7082; --warn:#8A4B00;
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--midnight)}
  body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; line-height:1.45}
  button{font:inherit; color:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bright); outline-offset:2px}
  .num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* the header: one row — brand, the tabs, who's signed in */
  .top{position:sticky; top:0; z-index:10; background:var(--midnight); color:var(--sawdust); padding:0 24px}
  .top-row{display:flex; align-items:center; gap:14px; min-height:50px}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.14em; color:var(--orange); font-size:17px}
  .place{font-weight:600; font-size:18px}
  .who{margin-left:auto; font-size:15px; color:#CFC9B8; white-space:nowrap}
  .who b{color:var(--sawdust)}
  .lockbtn{background:#2C3348; border:none; color:var(--sawdust); border-radius:8px; padding:6px 14px; font-weight:600; font-size:15px}
  .tabs{display:flex; gap:2px; overflow-x:auto; align-self:stretch; min-width:0; flex:0 1 auto; scrollbar-width:none}
  .tab{background:none; border:none; color:#9AA0B4; padding:0 13px; font-weight:600; border-top:4px solid transparent; border-bottom:4px solid transparent; white-space:nowrap}
  .tab[aria-current="true"]{color:var(--sawdust); border-bottom-color:var(--orange)}
  .tab .n{font-family:'Barlow Condensed',sans-serif; margin-left:6px; color:var(--bright)}
  @media (max-width: 900px){ .place{display:none} }
  @media (max-width: 520px){ .top{padding:0 12px} .tab{padding:0 10px} .brand{display:none} main{padding:18px 14px 60px} }

  main{max-width:1040px; margin:0 auto; padding:20px 20px 80px}

  /* Needs you */
  .need{margin-bottom:22px}
  .need > h2{display:flex; align-items:baseline; gap:10px; margin:0 0 10px}
  .need > h2 .cnt{font-size:20px; color:var(--ink2)}
  .need .panel{padding:8px 22px}
  .later{margin-top:28px; border-top:1px solid var(--line); padding-top:8px}
  .later > details{border-bottom:1px solid var(--line); padding:4px 0}
  .later > details[open]{padding-bottom:12px}
  h1{font-size:28px; margin:0 0 4px}
  h2{font-size:21px; margin:0 0 4px}
  .sub{color:var(--ink2); margin:0 0 18px; max-width:70ch}
  .banner{border-radius:10px; padding:12px 16px; margin-bottom:16px; font-weight:600}
  .banner.warn{background:var(--sawdust); color:var(--warn); border-left:5px solid var(--bright)}
  .banner.ok{background:var(--teal-bg); color:var(--teal-ink)}
  .panel{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:18px}
  .panel > .sub:last-child{margin-bottom:0}
  .empty{border:1px dashed var(--gray); border-radius:12px; padding:28px 20px; text-align:center; color:var(--ink2); background:#fff}
  .empty b{display:block; color:var(--midnight); font-size:19px; margin-bottom:4px}
  .go{background:var(--orange); color:#fff; border:none; border-radius:9px; padding:12px 20px; font-weight:700}
  .go:disabled{opacity:.45; cursor:default}
  .plain{background:#fff; border:1px solid var(--gray); border-radius:9px; padding:10px 16px; font-weight:600}
  .link{background:none; border:none; color:var(--ink2); text-decoration:underline; padding:6px}
  .link:disabled{opacity:.3; text-decoration:none; cursor:default}

  /* your tasks */
  .task{display:grid; grid-template-columns:1fr auto; gap:4px 18px; padding:14px 0; border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task .what{font-weight:700}
  .task .what .pid{letter-spacing:.02em}
  .task .detail{color:var(--ink2); font-size:15px; grid-column:1}
  .task .when{grid-row:1 / span 2; grid-column:2; text-align:right; align-self:center}
  .task .when .d{font-size:30px; font-weight:700; line-height:1}
  .task .when .l{font-size:14px; color:var(--ink2)}

  /* live switches */
  .dept{display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line)}
  .dept:last-child{border-bottom:none}
  .dept .nm{font-weight:700; font-size:19px; min-width:150px}
  .dept .hist{color:var(--ink2); font-size:14px; flex:1}
  .switch{position:relative; width:64px; height:34px; border-radius:99px; border:2px solid var(--gray); background:var(--paper); flex-shrink:0; padding:0}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; border:1px solid var(--gray); transition:left .15s}
  .switch[aria-checked="true"]{background:var(--orange); border-color:var(--orange)}
  .switch[aria-checked="true"]::after{left:33px; border-color:var(--orange)}
  .switch:disabled{opacity:.5}
  .state{width:44px; font-weight:700; font-size:15px}
  @media (prefers-reduced-motion: reduce){ .switch::after{transition:none} }

  /* setup */
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px; margin:10px 0 0}
  .fact{border-top:1px solid var(--line); padding-top:8px}
  .fact .k{font-size:14px; color:var(--ink2)}
  .fact .v{font-weight:600}
  .fact .v.missing{color:var(--warn)}
  table.rules{border-collapse:collapse; width:100%; margin:6px 0 18px; font-size:15px}
  .rules caption{text-align:left; font-weight:700; font-size:17px; padding:8px 0 6px}
  .rules th,.rules td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center}
  .rules th{font-weight:600; color:var(--ink2); font-size:14px}
  .rules td:first-child,.rules th:first-child{text-align:left}
  .rules input{width:22px; height:22px; accent-color:var(--orange)}
  .rules .changed{color:var(--ink2); font-size:13px}
  .scroll{overflow-x:auto}
  .cu{display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line)}
  .cu:last-child{border-bottom:none}
  .cu input{width:24px; height:24px; margin-top:2px; accent-color:var(--orange); flex-shrink:0}
  .cu .body{flex:1}
  .cu .t{font-weight:700}
  .cu .m{color:var(--ink2); font-size:15px}
  .cu .l{font-size:15px}
  .cu.none .t,.cu.none .l{color:var(--ink2); font-weight:500}
  .bar-actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px}
  .result{margin-top:14px}
  .result ul{margin:6px 0 0 18px; padding:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  select{font:inherit; padding:10px 12px; border:1px solid var(--gray); border-radius:9px; background:#fff; min-width:280px}
  .tj{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line)}
  .tj:last-child{border-bottom:none}
  .tag{border:1.5px solid var(--midnight); border-radius:4px; font-size:12px; font-weight:700; letter-spacing:.06em; padding:1px 5px}
  .tj .nm{flex:1}
  .tj .nm span{color:var(--ink2)}

  /* the floor log: problems, flags, ordering, Arrow, routine tasks */
  .li{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px}
  .li.open{border-left:6px solid var(--midnight)}
  .li.stop{border-left:6px solid var(--warn)}
  .li-top{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .meta2{font-size:15px; color:var(--ink2)}
  .st{font-size:13px; font-weight:700; padding:2px 8px; border-radius:5px; border:1.5px solid var(--midnight)}
  .st.ok{background:var(--teal-bg); color:var(--teal-ink); border-color:transparent}
  .stoptag{font-size:13px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--sawdust); color:var(--warn); border:1.5px solid var(--warn)}
  .msg{background:var(--paper); border-radius:9px; padding:10px 12px; margin-top:8px}
  .msg.answer,.msg.office_note{background:#fff; border:1.5px solid var(--midnight)}
  .msg-meta{font-size:13px; color:var(--ink2); margin-top:3px; font-weight:600}
  textarea.in,input.in,select.in{width:100%; font:inherit; padding:11px 12px; border:1px solid var(--gray); border-radius:9px; background:#fff; color:var(--midnight); min-width:0}
  textarea.in{min-height:78px; resize:vertical}
  .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .flagtag{display:inline-block; font-size:14px; font-weight:700; padding:3px 10px; border-radius:6px}
  .flagtag.critical{background:var(--orange); color:#fff}
  .flagtag.priority{background:var(--bright); color:var(--midnight)}
  .flagtag.watch{border:1.5px solid var(--midnight)}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 16px}
  .grid2 label{display:block; font-weight:600; margin:10px 0 4px}
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg button{background:#fff; border:1.5px solid var(--gray); border-radius:9px; padding:9px 14px; font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .line{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:none}
  .line input[type=checkbox]{width:24px; height:24px; margin-top:2px; accent-color:var(--orange); flex-shrink:0}
  .line .body{flex:1; min-width:0}
  .line .qty{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; min-width:44px; text-align:right}
  .deptname{font-weight:700; margin:14px 0 2px; color:var(--ink2); font-size:15px}
  .deptname:first-child{margin-top:0}
  .countline{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
  .countline:last-child{border-bottom:none}
  .countline .n{margin-left:auto; font-weight:700}
  details.more > summary{cursor:pointer; font-weight:600; color:var(--ink2); padding:6px 0}
  .tvlink{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px}
  .tvlink code{background:var(--paper); padding:8px 10px; border-radius:8px; word-break:break-all; flex:1 1 300px; font-size:14px}
  .typ{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line)}
  .typ:last-child{border-bottom:none}
  .typ span{flex:1}
  .typ.off span{color:var(--ink2); text-decoration:line-through}
  .typ small{display:block; color:var(--ink2); font-size:14px}
  .typ.off small{text-decoration:none}
  .supform{background:var(--paper); border-radius:10px; padding:12px 14px; margin:8px 0}
  .supform label{display:block; font-weight:600; font-size:14px; color:var(--ink2); margin:10px 0 4px}
  .supform label:first-child{margin-top:0}
  .supform .grp{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2.4fr); gap:8px; margin-top:6px}

  /* photos */
  .phs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .ph{position:relative; width:112px; height:112px; padding:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper); flex-shrink:0}
  .ph img{display:block; width:100%; height:100%; object-fit:cover}
  .ph .cap{position:absolute; left:0; right:0; bottom:0; background:rgba(24,29,46,.78); color:var(--sawdust); font-size:12px; font-weight:600; padding:2px 5px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ph.nofile{display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--ink2); padding:6px}
  .ovl{position:fixed; inset:0; background:rgba(24,29,46,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:40}
  .viewer{background:var(--midnight); border-radius:14px; width:100%; max-width:960px; max-height:94vh; overflow:auto; padding:14px; color:var(--sawdust)}
  .viewer img{display:block; max-width:100%; max-height:72vh; margin:0 auto; border-radius:6px}
  .viewer .vcap{margin:10px 2px 0}
  .viewer .vcap small{display:block; color:#CFC9B8; font-size:14px}
  .viewer .btns button{background:#2C3348; color:var(--sawdust); border:none}
  .meter{height:12px; background:var(--paper); border-radius:99px; overflow:hidden; margin:8px 0 4px; max-width:520px}
  .meter i{display:block; height:100%; background:var(--gray); border-radius:99px}
  .batch{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid var(--line)}
  .batch:last-child{border-bottom:none}
  .batch b{min-width:90px}

  /* sign in and PIN */
  .card{max-width:440px; margin:8vh auto 0; background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px}
  .card label{display:block; font-weight:600; margin:14px 0 4px}
  .card input{width:100%; font:inherit; padding:13px; border:1px solid var(--gray); border-radius:10px}
  .card .go{width:100%; margin-top:18px; padding:15px}
  .pinwrap{max-width:340px; margin:8vh auto 0; text-align:center}
  .dots{display:flex; justify-content:center; gap:16px; margin:18px 0 22px}
  .dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--midnight)}
  .dot.on{background:var(--midnight)}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .key{background:#fff; border:1px solid var(--gray); border-radius:12px; padding:16px 0; font-size:26px; font-weight:700}
  .key.small{font-size:16px}
  .alarm{max-width:560px; margin:8vh auto 0; background:var(--midnight); color:var(--sawdust); border-radius:14px; padding:24px}
  .alarm h1{color:var(--bright)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   THE TWO SETTINGS — the same two lines as upload.html and index.html.
   Publishable key only. NEVER the secret key — this file is public.
   ===================================================================== */
const SUPABASE_URL = "https://fueyfxjxlicqekaqtydi.supabase.co";
const SUPABASE_KEY = "sb_publishable_A5rEVQSSejSsQW7nhAX6iw_gNA5EZ9A";

/* How long the office view waits, untouched, before asking for the PIN again. */
const LOCK_AFTER_MINUTES = 15;


/* ---- core: no screen code in here, so it can be tested on its own ---- */

const DEPT_ORDER = ["milling", "cnc", "sanding", "finishing", "full_custom", "metal", "assembly_qc"];
const DEPT_NAME = { milling: "Milling", cnc: "CNC", sanding: "Sanding", finishing: "Finishing",
                    full_custom: "Full Custom", metal: "Metal", assembly_qc: "Assembly / QC", delivery: "Delivery" };
/* every department that logs, counted or not (Delivery is log-only) */
const LOG_DEPTS = [...DEPT_ORDER, "delivery"];
const LEVEL_NAME = { critical: "Critical", priority: "Priority", watch: "Watch" };

/* ---- supply lists ---- */
/** "Ash, Maple ,, White Oak" → ["Ash", "Maple", "White Oak"] */
function parseOptions(text) { return String(text || "").split(",").map(x => x.trim()).filter(Boolean); }
/** The form's two rows → what set_supply_item() takes. A row left completely blank is skipped. */
function choicesFromForm(groups) {
  return (groups || []).map(g => ({ label: String(g.label || "").trim(), options: parseOptions(g.options) }))
    .filter(g => g.label || g.options.length);
}
/** An item's choices as one line: "Wood: Ash, Maple · Thickness: 1/4, 1/2" */
function choiceSummary(choices) {
  return (choices || []).map(g => `${g.label}: ${(g.options || []).join(", ")}`).join(" · ");
}
/** One department's list: live items in their order, then retired ones. */
function supplyListFor(items, dept) {
  const mine = (items || []).filter(i => i.department === dept);
  const byOrder = (a, b) => (a.sort_order - b.sort_order) || String(a.name).localeCompare(String(b.name));
  return { live: mine.filter(i => !i.retired).sort(byOrder), retired: mine.filter(i => i.retired).sort(byOrder) };
}
const WEEKDAYS = { 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday" };

function keyProblem(url, key) {
  if (!url || !key || url.includes("PASTE-") || key.includes("PASTE-"))
    return { secret: false, text: "The project address and key haven't been filled in yet. Copy the two SUPABASE lines from upload.html into this file." };
  const secret = { secret: true, text: "This is the SECRET key, not the publishable one. It bypasses every security rule, and this file is public. Take it out of the file now and use the publishable key — the same one upload.html has. If this file was already put on GitHub with it, create a new secret key in Supabase so the old one stops working." };
  if (key.startsWith("sb_secret_")) return secret;
  const parts = key.split(".");
  if (parts.length === 3) {
    try { if (JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role") return secret; }
    catch (e) { /* not a readable token */ }
  }
  if (!/^https:\/\//.test(url)) return { secret: false, text: "The project address should start with https:// — copy it from upload.html." };
  return null;
}

function isManager(me) { return !!me && (me.role === "manager" || me.role === "admin"); }

function daysLeft(iso, today = new Date()) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
function fmtDate(iso) {
  if (!iso) return "no date";
  const [y, m, d] = iso.split("-").map(Number);
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1] + " " + d;
}
function daysText(n) {
  if (n === null) return "";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} late`;
  if (n === 0) return "due today";
  return `${n} day${n === 1 ? "" : "s"} left`;
}
function ago(ts, now = new Date()) {
  if (!ts) return "never";
  const mins = Math.round((now - new Date(ts)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}

/** Handoff tasks, soonest delivery first; jobs with no date go last. */
function buildTasks(rows, today = new Date()) {
  return [...(rows || [])]
    .map(r => ({ ...r, days: daysLeft(r.delivery_date, today) }))
    .sort((a, b) => (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999")
                 || String(a.project_id).localeCompare(String(b.project_id)));
}

/** The latest change per department, from the switch history. */
function lastChanges(log) {
  const out = {};
  for (const r of [...(log || [])].sort((a, b) => String(b.changed_at).localeCompare(String(a.changed_at))))
    if (!out[r.department]) out[r.department] = r;
  return out;
}

/** Catch-up rules, grouped by Monday column in the board's own order. */
function groupRules(rules, columns) {
  const cols = (columns || []).filter(c => c.key !== "handed_off" && c.column_id).sort((a, b) => a.sort_order - b.sort_order);
  return cols.map(c => {
    const order = (c.labels || []);
    const rows = (rules || []).filter(r => r.column_key === c.key)
      .sort((a, b) => (order.indexOf(a.label) + 1 || 999) - (order.indexOf(b.label) + 1 || 999) || a.label.localeCompare(b.label));
    return { key: c.key, what: c.what, title: c.title, rows };
  });
}

/** Which departments a catch-up rule column offers as tick boxes. */
function ruleDepartments(columnKey) {
  if (columnKey === "wood") return ["milling", "cnc", "sanding", "finishing"];
  if (columnKey === "assembly_qc") return ["milling", "cnc", "sanding", "finishing", "full_custom", "metal", "assembly_qc"];
  return [columnKey];
}

/** What "Apply ticked" would do, for the confirm message. */
function catchUpTotals(preview, ticked) {
  const chosen = (preview || []).filter(p => p.pieces_to_fill > 0 && ticked.has(p.job_id));
  return { jobs: chosen.length, pieces: chosen.reduce((a, p) => a + p.pieces_to_fill, 0), ids: chosen.map(p => p.job_id) };
}

/* A device PIN: a speed bump on a shared computer, NOT security — the
   database decides what a login can do. It's stored on this device only. */
function pinHash(pin, salt) {
  let h = 2166136261;
  for (const c of String(salt) + ":" + String(pin)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function validPin(pin) { return /^\d{4}$/.test(String(pin)); }

function isNetworkError(err) {
  const m = String((err && (err.message || err.details)) || err || "");
  return /failed to fetch|networkerror|load failed|network request failed|fetch failed|timeout|aborted/i.test(m);
}

function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. Check the connection and try again.";

    const date = ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);

  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);

        if (j) S.activeJobs = j.sort((a, b) => (a.is_test - b.is_test) || String(a.project_id).localeCompare(String(b.project_id)));
        return;
      }
      if (S.tab === "arrow") {
        const [a, set] = await Promise.all([soft(db.from("v_outside_jobs").select("*").eq("voided", false)), soft(db.from("app_settings").select("*"))]);
        if (a) S.arrow = a.filter(x => x.at_vendor || daysSince(x.returned_on) <= 92);
        if (set) { const s = set.find(x => x.key === "arrow_alert_days"); if (s) S.arrowDays = Number(s.value); }
        return;
      }
      if (S.tab === "routine") {
        const [t, p] = await Promise.all([soft(db.from("v_routine_tasks").select("*")), soft(db.from("profiles").select("id, full_name, role, departments, is_test, active"))]);
        if (t) S.routine = t;
        if (p) S.people = p.filter(x => x.active).sort((a, b) => a.full_name.localeCompare(b.full_name));
        return;
      }
      if (S.tab === "departments") {
        S.depts = await q(db.from("departments").select("*").order("sort_order"));
        S.liveLog = await q(db.from("department_live_log").select("*").order("changed_at", { ascending: false }).limit(50));
        const people = await q(db.from("profiles").select("id, full_name"));
        S.names = Object.fromEntries((people || []).map(p => [p.id, p.full_name]));
      } else if (S.tab === "setup") {
        const [ty, set] = await Promise.all([soft(db.from("defect_types").select("*")), soft(db.from("app_settings").select("*"))]);
        if (ty) S.types = ty;
        try { S.supItems = await q(db.from("supply_items").select("*")) || []; S.supMissing = false; }
        catch (e) { if (/does not exist|schema cache|could not find/i.test(String(e.message))) S.supMissing = true; else S.notice = friendlyError(e); }
        if (set) { const t = set.find(s => s.key === "tv_link_made"); S.tvMade = t || null; }
        S.columns = await q(db.from("monday_columns").select("*"));
        const log = await q(db.from("monday_sync_log").select("run_at, ok, summary, problems").order("run_at", { ascending: false }).limit(1));
        S.lastSync = (log || [])[0] || null;
        S.uploaded = await q(db.from("v_uploaded_jobs").select("*"));
        if (S.preview === null) await loadPreview();
        else S.rules = await q(db.from("monday_stage_map").select("*"));
      }
    } catch (e) { S.notice = friendlyError(e); }
  }

  async function loadPreview() {
    const { data, error } = await db.rpc("catch_up_preview");
    if (error) { S.notice = friendlyError(error); S.preview = []; return; }
    S.preview = data || [];
    S.ticked = new Set(S.preview.filter(p => p.pieces_to_fill > 0).map(p => p.job_id));   // every job ticked by default
    S.rules = await q(db.from("monday_stage_map").select("*"));
  }

  // ---------- screens ----------
  function counts() {
    const c = {
      handoffs: S.tasks.length,
      problems: officeProblems(S.problems).open.length,
      flags: staleFlags(S.flags).length,
      ordering: needToOrder(S.supplies).reduce((a, g) => a + g.lines.length, 0),
      arrow: (S.arrow || []).filter(a => a.at_vendor && a.days_out > S.arrowDays).length,
      photos: S.photoStatus && S.photoStatus.due ? 1 : 0,
    };
    // everything that needs the office is on one tab, so only that tab carries a number
    c.tasks = c.handoffs + c.problems + c.flags + c.ordering + c.arrow + c.photos;
    return c;
  }
  function topBar() {
    const c = counts();
    return `<header class="top"><div class="top-row">
        <span class="brand">SHOP FLOOR</span><span class="place">Office</span>
        <nav class="tabs">${TABS.map(([k, label]) =>
          `<button class="tab" data-tab="${k}" aria-current="${S.tab === k}">${label}${k === "tasks" && c.tasks ? `<span class="n">${c.tasks}</span>` : ""}</button>`).join("")}</nav>

  // ---------- Needs you: everything waiting on the office, most urgent first ----------
  // Problems (work stopped first), supplies to order, flags over two weeks old, Arrow items out too
  // long, the photo archive when it's due, then handoffs. A section shows only when it has something.
  // What's done or just for reference is folded away at the bottom.
  function needsScreen() {
    const { open, answered } = officeProblems(S.problems);
    const groups = needToOrder(S.supplies);
    const ordered = orderedNotReceived(S.supplies);
    const closed = (S.supplies || []).filter(r => !r.is_open).sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
    const stale = staleFlags(S.flags);
    const late = (S.arrow || []).filter(a => a.at_vendor && a.days_out > S.arrowDays).sort((a, b) => b.days_out - a.days_out);
    const ps = S.photoStatus;
    const ho = S.columns.find(c => c.key === "handed_off");
    const connected = ho && ho.column_id && (ho.col_type === "checkbox" || ho.yes_label);
    const handoffs = buildTasks(S.tasks);
    const nLines = groups.reduce((a, g) => a + g.lines.length, 0);
    const nTicked = groups.reduce((a, g) => a + g.lines.filter(l => S.oticked.has(l.id)).length, 0);
    const who = (r) => `${esc(r.requested_by_name)} · ${esc(fmtDay(r.requested_at))}`;
    const scope = (x) => x.department_name ? `${x.department_name} only` : "whole job";
    const what = (a) => [a.sheet_numbers && a.sheet_numbers.length ? `sheet${a.sheet_numbers.length === 1 ? "" : "s"} ${a.sheet_numbers.join(", ")}` : "", a.description].filter(Boolean).join(" — ");
    const sec = (key, title, n, body) => `<section class="need" data-need="${key}"><h2>${title}${n ? ` <span class="cnt num">${n}</span>` : ""}</h2>${body}</section>`;
    const keep = (k) => S.openDetails.has(k) ? "open" : "";
    const parts = [];

    if (open.length) parts.push(sec("problems", "Problems from the floor", open.length, open.map(problemCard).join("")));

    if (groups.length) parts.push(sec("ordering", "Supplies to order", nLines, `<div class="panel">
        ${groups.map(g => `<div class="deptname">${esc(g.name)}</div>${g.lines.map(r => `<div class="line">
          <input type="checkbox" data-otick="${esc(r.id)}" ${S.oticked.has(r.id) ? "checked" : ""} aria-label="Ordered: ${esc(r.item)}">
          <span class="qty">${r.qty}</span>

    if (late.length) parts.push(sec("arrow", `At Arrow over ${S.arrowDays} days`, late.length, `<div class="panel">${late.map(a => `<div class="line"><span class="qty">${a.days_out}</span>

          <div class="meta2">${a.service === "paint" ? "Paint" : "Powdercoat"} · sent ${esc(fmtDay(a.sent_on))} by ${esc(a.sent_by_name)} (${esc(a.department_name)}) · ${a.days_out} days out</div></span>

    if (ps && ps.due) parts.push(sec("photos", "Photo archive", 0, `<div class="panel"><p class="sub" style="margin:0 0 10px">${ps.to_remove > 0

    // test jobs

      <section class="panel">

        <p class="sub">For jobs already partway through the shop when their work order was uploaded. It reads the stage Monday shows and marks the departments <b>before</b> that stage as complete. It only fills counts that are still at zero, never lowers one, and skips anything a supervisor has counted. The stage Monday names is left for the supervisor to enter.</p>
        <details ${groups.length && !groups.some(g => g.rows.some(r => r.set_by)) ? "open" : ""}>
          <summary style="cursor:pointer; font-weight:600; margin-bottom:8px">The rules: which departments count as done for each Monday label</summary>

          <button class="go" data-apply="1" ${t.jobs && !S.busy ? "" : "disabled"}>Apply ticked — ${t.jobs} job${t.jobs === 1 ? "" : "s"}, ${t.pieces} pieces</button>

      <section class="panel">

        <p class="sub" style="margin:0">${S.tvMade ? `Last link made ${esc(ago(S.tvMade.updated_at))} by ${esc(S.tvMade.updated_by_name || "someone")}.` : "No TV link has been made yet."}</p>

      <section class="panel">

          return `<details class="more"><summary>${esc(DEPT_NAME[d])} — ${list.filter(t => t.active).length}</summary>

        ${S.supMissing ? `<div class="banner warn" style="margin:0">Supply lists aren't set up in the database yet. Run <b>supply_lists.sql</b> in the SQL Editor, wait a minute, then reload.</div>`
          : (S.msg && S.msgFrom === "sup" && !(S.supEdit && !S.msg.ok) ? `<div class="banner ${S.msg.ok ? "ok" : "warn"}" style="margin:0 0 8px">${esc(S.msg.text)}</div>` : "")

        <div style="margin-top:12px">${tests.length ? tests.map(u => `<div class="tj">
            <span class="tag">TEST</span><span class="nm"><b>${esc(u.project_id)}</b> <span>${esc(u.job_name)} · ${u.sheets} sheets, ${u.pieces} pieces</span></span>
            <button class="plain" data-retire="${esc(u.project_id)}">Retire</button></div>`).join("")
          : `<p class="sub" style="margin:0">No test jobs at the moment.</p>`}</div>
      </section>`;
  }

  // ---------- Photos ----------
  const photoUrls = new Map();
  async function photoUrl(path) {
    const hit = photoUrls.get(path);
    if (hit && hit.until > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("photos").createSignedUrl(path, 3600);
    if (error || !data) throw error || new Error("no link");
    photoUrls.set(path, { url: data.signedUrl, until: Date.now() + 50 * 60000 });
    return data.signedUrl;
  }
  function fillPhotos() {
    app.querySelectorAll("img[data-photopath]:not([src])").forEach(async (img) => {
      try { img.src = await photoUrl(img.dataset.photopath); }
      catch (e) { const b = img.closest(".ph"); if (b) { b.classList.add("nofile"); b.textContent = "Photo not available"; } }
    });
  }
  const photoWhat = (p) => p.kind === "loadout" ? (p.truck ? `Truck ${p.truck}, loaded` : p.pallet ? `Pallet ${p.pallet}, wrapped` : p.sheet_number !== null ? `Sheet ${p.sheet_number}${p.piece ? ` · table ${p.piece}` : ""}${p.stage === "site" ? " · at the site" : ""}` : p.note || "")
                                                : `${p.department_name}${p.sheet_number !== null ? " · sheet " + p.sheet_number : ""}`;
  /** Thumbnails; an archived photo says which batch holds it. */
  function photoStrip(list, caption = false) {
    const shown = (list || []).filter(p => !p.voided);
    if (!shown.length) return "";
    return `<div class="phs">${shown.map(p => p.in_cloud === false
      ? `<span class="ph nofile" title="${esc(p.archive_name || "")}">Archived in batch ${esc(p.archive_batch)}</span>`
      : `<button class="ph" data-viewphoto="${esc(p.id)}" aria-label="Photo by ${esc(p.taken_by_name)}"><img alt="" data-photopath="${esc(p.storage_path)}">${caption ? `<span class="cap">${esc(photoWhat(p))}</span>` : ""}</button>`).join("")}</div>`;
  }
  function viewerHtml() {
    const p = S.viewer; if (!p) return "";
    const what = p.kind === "loadout" ? `Load-out · ${photoWhat(p)}` : p.kind === "defect" ? `Defect: ${p.defect_type || ""}` : `Problem: ${p.problem_body || ""}`;
    return `<div class="ovl" data-closeviewer="1"><div class="viewer" role="dialog" aria-modal="true" aria-label="Photo">
      <img alt="Photo by ${esc(p.taken_by_name)}" data-photopath="${esc(p.storage_path)}">
      <div class="vcap"><b>${p.is_test ? "TEST " : ""}${esc(p.project_id)}${p.sheet_number !== null ? ` · sheet ${p.sheet_number}` : ""}</b> · ${esc(p.department_name)}

  }

  async function findJobPhotos(project) {
    const [ph, lo, dl] = await Promise.all([soft(db.from("v_photos").select("*").eq("project_id", project)),
                                            soft(db.from("v_loadouts").select("*").eq("project_id", project)),
                                            quiet(db.from("v_deliveries").select("*").eq("project_id", project))]);
    S.phJob = { project, photos: ph || [], loadouts: (lo || []).sort((a, b) => String(b.started_at).localeCompare(String(a.started_at))),
                deliveries: dl, filing: dl !== null };
    S.jobZip = null;
    const byId = new Map(S.photos.map(p => [p.id, p])); for (const x of S.phJob.photos) byId.set(x.id, x); S.photos = [...byId.values()];
  }

    else if (!st) arch = `<p class="sub">Loading…</p>`;

        : a && a.stage === "ready" ? `<div class="banner ok"><b>photo-archive-${esc(a.batch)}.zip</b> has downloaded: ${a.total} photos, ${esc(fmtBytes(a.bytes))}.

          : st.eligible > 0 || st.building ? `<p><b>${st.eligible} photo${st.eligible === 1 ? "" : "s"}</b> (${esc(fmtBytes(st.eligible_bytes))}) ${st.eligible === 1 ? "is" : "are"} ready to move off: ${st.eligible === 1 ? "its job" : "their jobs"} left the floor more than 60 days ago.</p>

            ${b.files_left > 0 ? `<button class="link" data-archagain="${esc(b.id)}">Download again</button>` : ""}</div>`).join("")}</details>` : ""}`;
    }
    return `<h1>Photos</h1>

          <button class="go" data-phfind="1">Show</button></div>
        ${jobHtml}</section>
      <section class="panel"><h2>Photo archive</h2>
        <p class="sub">Supabase's free plan holds about 1 GB. Once a month, old photos move to your own storage as a zip. Each batch stays in Supabase for one more month after it's downloaded, then its files come off. Every photo's record stays for good, saying which zip holds it.</p>
        ${arch}</section>`;
  }

  // ---------- the archive, step by step ----------
  function saveBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  // ---------- zips in the filing layout (deliveries.sql): photos, delivery files, signed tickets ----------
  async function pdfLib() {
    if (window.PDFLib) return window.PDFLib;
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = PDF_LIB_URL; s.onload = res;
      s.onerror = () => rej(new Error("The PDF helper couldn't load. Check the connection and try again.")); document.head.appendChild(s); });
    return window.PDFLib;
  }
  async function fileBytes(bucket, path) {
    const r = await db.storage.from(bucket || "photos").download(path);
    if (r.error || !r.data) throw r.error || new Error("That file isn't there.");
    return new Uint8Array(await r.data.arrayBuffer());
  }
  async function signedTicketFor(d, have = new Map()) {
    const lib = await pdfLib();
    const t = d.ticket && d.ticket.in_cloud !== false ? { bytes: have.get(d.ticket.path) || await fileBytes("deliveries", d.ticket.path), mime: d.ticket.mime } : null;
    const s = d.signature_path ? (have.get(d.signature_path) || await fileBytes("deliveries", d.signature_path)) : null;
    return new Uint8Array(await buildSignedTicket(lib, d, t, s));
  }
  /** Download every file in the list; signed tickets are put together from the ticket and the signature. */
  async function collectFiles(list, progress = () => {}) {
    const files = [], missing = [], have = new Map();
    let bytes = 0, done = 0;
    for (const x of list.filter(x => x.source !== "signed")) {
      if (x.in_cloud === false) { missing.push(x.name); continue; }
      try { const data = await fileBytes(x.bucket, x.path); have.set(x.path, data); bytes += data.length; files.push({ name: x.name, data, date: atDate(x.at) }); }
      catch (e) { missing.push(x.name); }
      progress(++done, list.length);
    }
    const signed = list.filter(x => x.source === "signed");
    if (signed.length) {
      const rows = await quiet(db.from("v_deliveries").select("*").in("id", signed.map(x => x.loadout_id || x.id))) || [];
      for (const x of signed) {
        const d = rows.find(r => r.id === (x.loadout_id || x.id));
        try { if (!d || x.in_cloud === false) throw new Error("gone"); const data = await signedTicketFor(d, have); bytes += data.length; files.push({ name: x.name, data, date: atDate(x.at) }); }
        catch (e) { missing.push(x.name); }
        progress(++done, list.length);
      }
    }
    return { files, missing, bytes };
  }
  async function buildZip(info) {
    if (info.files) return buildFilingZip(info);
    const list = info.photos || [];
    S.arch = { batch: info.batch, stage: "downloading", done: 0, total: list.length }; render();
    const files = [], missing = [];
    let bytes = 0;
    for (const p of list) {
      if (!p.in_cloud) { missing.push(p.name); continue; }
      let r; try { r = await db.storage.from("photos").download(p.path); } catch (e) { r = { error: e }; }
      if (r.error || !r.data) { missing.push(p.name); continue; }
      const data = new Uint8Array(await r.data.arrayBuffer());
      bytes += data.length;
      const [d, t] = String(p.at).split(" ");
      files.push({ name: p.name, data, date: new Date(`${d}T${t || "00:00"}:00`) });
      S.arch.done += 1;
      if (S.arch.done % 5 === 0 || S.arch.done === list.length) render();
    }
    if (missing.length) {
      S.arch = { batch: info.batch, stage: "failed", text: `${missing.length} photo${missing.length === 1 ? "" : "s"} couldn't be downloaded (${missing.slice(0, 3).join(", ")}${missing.length > 3 ? "…" : ""}), so no zip was made and nothing is marked saved. Check the connection and press Download archive again.` };
      return render();
    }
    files.push({ name: "photos.csv", data: utf8(photoCsv(list, info.batch)), date: new Date() });
    saveBlob(new Blob([makeZip(files)], { type: "application/zip" }), `photo-archive-${info.batch}.zip`);
    S.arch = { batch: info.batch, stage: "ready", total: list.length, bytes };
    render();
  }
  // the archive, filed by job, item and table, with the delivery files and signed tickets
  async function buildFilingZip(info) {
    const list = info.files || [];
    S.arch = { batch: info.batch, stage: "downloading", done: 0, total: list.length }; render();
    const r = await collectFiles(list, (done) => { S.arch.done = done; if (done % 5 === 0 || done === list.length) render(); });
    if (r.missing.length) {
      S.arch = { batch: info.batch, stage: "failed", text: `${r.missing.length} file${r.missing.length === 1 ? "" : "s"} couldn't be downloaded (${r.missing.slice(0, 3).join(", ")}${r.missing.length > 3 ? "…" : ""}), so no zip was made and nothing is marked saved. Check the connection and press Download archive again.` };
      return render();
    }
    r.files.push({ name: "photos.csv", data: utf8(fileCsv(list, info.batch)), date: new Date() });
    saveBlob(new Blob([makeZip(r.files)], { type: "application/zip" }), `photo-archive-${info.batch}.zip`);
    S.arch = { batch: info.batch, stage: "ready", total: list.length, bytes: r.bytes };
    render();
  }
  /** After prepare_photo_archive(): the batch's delivery files join it, and everything is named the filing way. */
  async function withFiling(info) {
    const { data, error } = await db.rpc("file_archive_batch", { p_batch: info.batch });
    return error ? info : { ...info, files: data.files };
  }
  async function removeDeliveryDocs() {
    const { data, error } = await db.rpc("delivery_docs_to_remove");
    if (error || !data || !data.length) return [];
    const byBatch = {}, said = [];
    for (const x of data) (byBatch[x.batch] = byBatch[x.batch] || []).push(x.path);
    for (const [batch, paths] of Object.entries(byBatch)) {
      for (let i = 0; i < paths.length; i += 100) {
        const r = await db.storage.from("deliveries").remove(paths.slice(i, i + 100));
        if (r.error) { said.push(`Batch ${batch}: ${friendlyError(r.error)}`); break; }
      }
      const m = await db.rpc("mark_delivery_docs_removed", { p_batch: batch });
      if (m.error) said.push(friendlyError(m.error)); else if (m.data.summary) said.push(m.data.summary);
    }
    return said;
  }
  async function removeReleased(list) {
    const byBatch = {};
    for (const x of list || []) (byBatch[x.batch] = byBatch[x.batch] || []).push(x.path);
    const said = [];
    for (const [batch, paths] of Object.entries(byBatch)) {
      for (let i = 0; i < paths.length; i += 100) {
        const r = await db.storage.from("photos").remove(paths.slice(i, i + 100));
        if (r.error) { said.push(`Batch ${batch}: ${friendlyError(r.error)}`); break; }
      }
      const { data, error } = await db.rpc("mark_photo_files_removed", { p_batch: batch });
      said.push(error ? friendlyError(error) : data.summary);
    }
    return said.concat(await removeDeliveryDocs());       // delivery files leave with their batch (deliveries.sql)
  }

  function render() {
    if (!S.me) return;
    if (S.locked) return pinScreen("unlock");
    const screens = { departments: departmentsScreen, setup: setupScreen, flags: flagsScreen, photos: photosScreen,
                      arrow: arrowScreen, routine: routineScreen };
    const body = (screens[S.tab] || needsScreen)();
    app.innerHTML = topBar() + `<main>${S.notice ? `<div class="banner warn">${esc(S.notice)}</div>` : ""}${body}
      <p style="text-align:center; margin-top:30px"><button class="link" data-signout="1">Sign out</button></p></main>` + viewerHtml();
    wire();
    fillPhotos();
  }

  function wire() {
    app.querySelectorAll("[data-tab]").forEach(b => b.onclick = async () => {
      S.tab = b.dataset.tab; store.set("tab", S.tab); S.msg = null; render(); await loadTab(); render();
    });
    app.querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { S.locked = true; S.pinEntry = ""; render(); });
    app.querySelectorAll("[data-live]").forEach(b => b.onclick = async () => {
      const d = S.depts.find(x => x.key === b.dataset.live); if (!d) return;
      const turnOn = !d.is_live;
      if (!confirm(`${turnOn ? "Switch" : "Take"} ${d.name} ${turnOn ? "live" : "off"}? ${turnOn ? "The TV will start showing it." : "The TV will stop showing it."}`)) return;
      S.busy = true; render();
      const { error } = await db.rpc("set_department_live", { p_department: d.key, p_live: turnOn });
      S.busy = false;
      if (error) S.notice = friendlyError(error);
      await loadTab(); render();
    });
    app.querySelectorAll("[data-rule]").forEach(box => box.onchange = async () => {

      const { error } = await db.rpc("set_stage_map", { p_column: key, p_label: label, p_departments: depts });

      S.cuResult = null;
      await loadPreview(); render();
    });
    app.querySelectorAll("[data-tick]").forEach(box => box.onchange = () => {
      box.checked ? S.ticked.add(box.dataset.tick) : S.ticked.delete(box.dataset.tick);
      render();
    });
    app.querySelectorAll("[data-refresh]").forEach(b => b.onclick = async () => { S.cuResult = null; await loadPreview(); render(); });
    app.querySelectorAll("[data-apply]").forEach(b => b.onclick = async () => {
      const t = catchUpTotals(S.preview, S.ticked);
      if (!t.jobs || !confirm(`Mark ${t.pieces} pieces complete across ${t.jobs} job${t.jobs === 1 ? "" : "s"}? Each one is recorded as "Catch-up from Monday" under your name. Counts can be corrected afterwards on a tablet, but the record stays.`)) return;
      S.busy = true; render();
      const { data, error } = await db.rpc("catch_up_apply", { p_jobs: t.ids });

    });
    app.querySelectorAll("[data-maketest]").forEach(b => b.onclick = async () => {

      S.busy = false;

      await loadTab(); render();
    });
    app.querySelectorAll("[data-retire]").forEach(b => b.onclick = async () => {
      if (!confirm(`Retire ${b.dataset.retire}? It leaves the test tablet; its history is kept.`)) return;
      const { data, error } = await db.rpc("retire_test_job", { p_project: b.dataset.retire });
      S.testMsg = error ? { ok: false, text: friendlyError(error) } : { ok: true, text: data };
      await loadTab(); render();
    });
    app.querySelectorAll("[data-signout]").forEach(b => b.onclick = async () => {
      await db.auth.signOut(); S.me = null; store.set("pin", null); signIn();
    });

    // ---- the floor log ----
    const on = (sel, fn) => app.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
    const act = async (fn, args, after, from = null) => {      // one database call, its plain answer shown at the top
      S.busy = true; S.msg = null; S.msgFrom = from; render();

      S.busy = false;
      S.msg = error ? { ok: false, text: friendlyError(error) } : { ok: true, text: typeof data === "string" ? data : (data && data.summary) || "Done." };

                                   () => { delete S.drafts[b.dataset.answer]; }));
    on("[data-deffrom]", (b) => { S.defFrom = b.dataset.deffrom; render(); });

    app.querySelectorAll("[data-ff]").forEach(el => el.oninput = el.onchange = () => {
      S.flagForm[el.dataset.ff] = el.value;

      act("set_flag", { p_job: f.jobId, p_level: f.level, p_note: f.note.trim(), p_department: f.department || null },

    on("[data-addtask]", () => { const f = S.taskForm;
      act("add_routine_task", { p_name: f.name.trim(), p_department: f.department, p_schedule_type: f.schedule_type, p_weekday: Number(f.weekday),
          p_week_interval: Number(f.week_interval) || 1, p_monthly_occurrence: f.schedule_type === "monthly" ? Number(f.monthly_occurrence) : null,
          p_start_date: f.start_date || localISO(new Date()), p_assigned_to: f.assigned_to || null, p_is_test: !!f.is_test },
          () => { S.taskForm = { ...S.taskForm, name: "", assigned_to: "" }; }); });
    on("[data-retiretask]", (b) => { if (confirm("Remove this routine task? Its history is kept.")) act("retire_routine_task", { p_task: b.dataset.retiretask }); });

    on("[data-tvnew]", () => {

      act("new_tv_link", {}, (data) => { S.tvKey = data.key; });

    // ---- supply lists ----
    const supOpen = (d, item) => {
      const g = [0, 1].map(i => { const c = item && (item.choices || [])[i]; return { label: c ? c.label : "", options: c ? c.options.join(", ") : "" }; });
      S.supEdit = { id: item ? item.id : null, dept: d, name: item ? item.name : "", groups: g };
      S.openDetails.add("sup_" + d); S.msg = null; S.msgFrom = null; render();
      const n = app.querySelector("#supName"); if (n) n.focus();
    };
    on("[data-supadd]", (b) => supOpen(b.dataset.supadd, null));
    on("[data-supedit]", (b) => { const i = S.supItems.find(x => x.id === b.dataset.supedit); if (i) supOpen(i.department, i); });
    on("[data-supcancel]", () => { S.supEdit = null; render(); });
    app.querySelectorAll("[data-supf]").forEach(el => el.oninput = () => {
      S.supEdit.name = el.value;
      const go = app.querySelector("[data-supsave]"); if (go) go.disabled = !el.value.trim();
    });
    app.querySelectorAll("[data-supg]").forEach(el => el.oninput = () => { S.supEdit.groups[Number(el.dataset.supg)][el.dataset.part] = el.value; });
    on("[data-supsave]", () => { const e = S.supEdit;
      act("set_supply_item", { p_id: e.id, p_department: e.dept, p_name: e.name.trim(), p_choices: choicesFromForm(e.groups) }, () => { S.supEdit = null; }, "sup"); });
    on("[data-supmove]", (b) => act("move_supply_item", { p_id: b.dataset.supmove, p_up: b.dataset.up === "1" }, null, "sup"));
    on("[data-supretire]", (b) => { if (confirm("Retire this item? It comes off the tablets. Past requests keep it, and you can bring it back.")) act("retire_supply_item", { p_id: b.dataset.supretire, p_retire: true }, null, "sup"); });
    on("[data-supback]", (b) => act("retire_supply_item", { p_id: b.dataset.supback, p_retire: false }, null, "sup"));
    on("[data-typeset]", (b) => act("set_defect_type", { p_department: b.dataset.typeset, p_label: b.dataset.label, p_active: b.dataset.active === "1" }));
    // ---- photos ----
    on("[data-viewphoto]", (b) => { S.viewer = S.photos.find(x => x.id === b.dataset.viewphoto) || null; render(); });
    app.querySelectorAll("[data-closeviewer]").forEach(el => el.onclick = (e) => { if (e.target !== el) return; S.viewer = null; render(); });
    on("[data-voidphoto]", (b) => {
      if (!confirm("Mark this photo entered by mistake? It's hidden everywhere, and kept in history.")) return;
      S.viewer = null;
      act("void_photo", { p_photo: b.dataset.voidphoto, p_reason: null }, () => { const x = S.photos.find(p => p.id === b.dataset.voidphoto); if (x) x.voided = true; });
    });
    const phFind = async () => { const i = app.querySelector("#phJob"); S.phText = i ? i.value : ""; if (!S.phText.trim()) return;
      S.msg = null; await findJobPhotos(normProject(S.phText)); render(); };
    on("[data-phfind]", phFind);
    app.querySelectorAll("#phJob").forEach(i => i.onkeydown = (e) => { if (e.key === "Enter") phFind(); });
    on("[data-archstart]", async () => {
      S.busy = true; S.msg = null; render();
      const { data, error } = await db.rpc("prepare_photo_archive");
      S.busy = false;
      if (error) { S.msg = { ok: false, text: friendlyError(error) }; await loadPhotoStatus(); return render(); }
      await buildZip(await withFiling(data)); await loadPhotoStatus(); render();
    });
    on("[data-archagain]", async (b) => {
      const { data, error } = await db.rpc("photo_archive_files", { p_batch: b.dataset.archagain });
      if (error) { S.msg = { ok: false, text: friendlyError(error) }; return render(); }
      await buildZip(await withFiling(data));
    });
    // the whole job, now, in the filing layout (e.g. for a damage claim)
    on("[data-jobzip]", async () => {
      const j = S.phJob; if (!j) return;
      S.jobZip = { busy: true, text: "Gathering the files…" }; render();
      const rows = await quiet(db.from("v_filing").select("*").eq("project_id", j.project));
      if (!rows) { S.jobZip = { ok: false, text: "The filing part isn't in the database yet. Run deliveries.sql (Walkthrough 11)." }; return render(); }
      const list = rows.map(filingItem).sort((a, b) => a.name.localeCompare(b.name));
      const away = list.filter(x => x.in_cloud === false);
      const r = await collectFiles(list.filter(x => x.in_cloud !== false), (done, total) => { S.jobZip = { busy: true, text: `Downloading ${done} of ${total}… keep this page open.` }; if (done % 5 === 0) render(); });
      if (!r.files.length) { S.jobZip = { ok: false, text: away.length ? "Every file on this job has been archived; they're in the archive zips." : "There's nothing to download on this job yet." }; return render(); }
      r.files.push({ name: `${j.project}/photos.csv`, data: utf8(fileCsv(list, "")), date: new Date() });
      saveBlob(new Blob([makeZip(r.files)], { type: "application/zip" }), `${j.project} photos ${shopDate(new Date())}.zip`);
      const batches = [...new Set(away.map(x => x.archive_batch).filter(Boolean))];
      S.jobZip = { ok: !r.missing.length, text: `${j.project} photos ${shopDate(new Date())}.zip has downloaded: ${r.files.length - 1} file${r.files.length === 2 ? "" : "s"}, ${fmtBytes(r.bytes)}.`
        + (away.length ? ` ${away.length} archived file${away.length === 1 ? " is" : "s are"} in ${batches.map(b => `photo-archive-${b}.zip`).join(", ") || "the archive"} instead.` : "")
        + (r.missing.length ? ` ${r.missing.length} couldn't be downloaded: ${r.missing.slice(0, 3).join(", ")}.` : "") };
      render();
    });
    on("[data-signedpdf]", async (b) => {
      const d = ((S.phJob && S.phJob.deliveries) || []).find(x => x.id === b.dataset.signedpdf); if (!d) return;
      try { saveBlob(new Blob([await signedTicketFor(d)], { type: "application/pdf" }), signedFileName(d)); }
      catch (e) { S.msg = { ok: false, text: friendlyError(e) }; render(); }
    });
    on("[data-archsaved]", async (b) => {
      S.busy = true; render();
      const { data, error } = await db.rpc("confirm_photo_archive", { p_batch: b.dataset.archsaved });
      if (error) { S.busy = false; S.msg = { ok: false, text: friendlyError(error) }; return render(); }
      const said = [data.summary, ...(await removeReleased(data.remove))];
      S.busy = false; S.arch = null; S.msg = { ok: true, text: said.join(" ") };
      await loadPhotoStatus(); render();
    });
    on("[data-archremove]", async () => {
      S.busy = true; render();
      const { data, error } = await db.rpc("photo_files_to_remove");
      const said = error ? [friendlyError(error)] : await removeReleased(data);
      S.busy = false; S.msg = { ok: !error, text: said.join(" ") };
      await loadPhotoStatus(); render();
    });

    on("[data-typeadd]", (b) => { const i = app.querySelector(`[data-newtype="${b.dataset.typeadd}"]`);
      if (i && i.value.trim()) act("set_defect_type", { p_department: b.dataset.typeadd, p_label: i.value.trim(), p_active: true }); });
  }

  // ---------- PIN ----------
  function pinScreen(mode) {   // mode: "set" | "unlock"
    const title = mode === "set" ? "Set a PIN for this computer" : "Office";
    const sub = mode === "set"
      ? (S.pinFirst ? "Enter the same four digits again." : "Four digits. The office view locks after " + LOCK_AFTER_MINUTES + " minutes untouched, and asks for it.")
      : (S.pinBad ? "That PIN was wrong. Try again." : "Enter your PIN.");
    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, "clear", 0, "back"];
    app.innerHTML = `<div class="pinwrap"><h1>${esc(title)}</h1><p class="sub" id="pinsub" style="margin:0">${esc(sub)}</p>
      <div class="dots">${[0, 1, 2, 3].map(i => `<span class="dot${S.pinEntry.length > i ? " on" : ""}"></span>`).join("")}</div>
      <div class="pad">${keys.map(k => k === "clear" ? `<button class="key small" data-k="clear">Clear</button>`
          : k === "back" ? `<button class="key small" data-k="back">⌫</button>` : `<button class="key num" data-k="${k}">${k}</button>`).join("")}</div>
      <p>${mode === "set" ? `<button class="link" data-nopin="1">This is my own computer — no PIN</button>`
          : `<button class="link" data-forgot="1">Forgot the PIN? Sign in again</button>`}</p></div>`;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pinKey(mode, b.dataset.k));
    app.querySelectorAll("[data-nopin]").forEach(b => b.onclick = () => { store.set("pin", { none: true }); S.locked = false; openOffice(); });
    app.querySelectorAll("[data-forgot]").forEach(b => b.onclick = async () => { await db.auth.signOut(); S.me = null; store.set("pin", null); S.locked = false; signIn(); });
  }
  function pinKey(mode, k) {
    if (k === "clear") S.pinEntry = "";
    else if (k === "back") S.pinEntry = S.pinEntry.slice(0, -1);
    else if (S.pinEntry.length < 4) S.pinEntry += k;
    if (S.pinEntry.length < 4) return pinScreen(mode);
    const entered = S.pinEntry; S.pinEntry = "";
    if (mode === "set") {
      if (!S.pinFirst) { S.pinFirst = entered; return pinScreen("set"); }
      if (S.pinFirst !== entered) { S.pinFirst = null; pinScreen("set"); document.getElementById("pinsub").textContent = "Those didn't match. Start again."; return; }
      const salt = Math.random().toString(36).slice(2);
      store.set("pin", { salt, hash: pinHash(entered, salt) }); S.pinFirst = null; S.locked = false;
      return openOffice();
    }
    const saved = store.get("pin", null);
    if (saved && saved.hash === pinHash(entered, saved.salt)) { S.locked = false; S.pinBad = 0; touch(); render(); return; }
    S.pinBad += 1;
    if (S.pinBad >= 5) { db.auth.signOut(); S.me = null; store.set("pin", null); S.locked = false; S.pinBad = 0; return signIn("Five wrong PINs, so this computer was signed out. Sign in again."); }
    pinScreen("unlock");
  }
  let lastTouch = Date.now();
  function touch() { lastTouch = Date.now(); }
  ["click", "keydown", "pointerdown"].forEach(ev => document.addEventListener(ev, touch, true));
  setInterval(() => {
    const p = store.get("pin", null);
    if (S.me && p && p.hash && !S.locked && Date.now() - lastTouch > LOCK_AFTER_MINUTES * 60000) { S.locked = true; S.pinEntry = ""; render(); }
  }, 20000);

  // ---------- sign in ----------
  function signIn(message) {
    app.innerHTML = `<form class="card" id="f">
        <h1>Office</h1><p class="sub" style="margin:0">Sign in with your manager login.</p>
        <label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
        <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
        <button class="go" id="g">Sign in</button>
        <div class="banner warn" id="err" style="margin:14px 0 0" ${message ? "" : "hidden"}>${esc(message || "")}</div>
      </form>`;
    document.getElementById("f").onsubmit = async (ev) => {
      ev.preventDefault();
      const g = document.getElementById("g"); g.disabled = true;
      const { data, error } = await db.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      g.disabled = false;
      if (error) { const e = document.getElementById("err"); e.textContent = friendlyError(error); e.hidden = false; return; }
      start(data.user, true);
    };
  }

  async function start(user, justSignedIn) {
    const { data, error } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
    if (error) return signIn(friendlyError(error));
    if (!data) return signIn("This login has no profile yet. In Supabase, give it one.");
    if (!isManager({ role: data.role })) {
      await db.auth.signOut();
      return signIn(`${data.full_name} is a ${data.role} login. The office view is for managers — supervisors use the tablet app.`);
    }
    S.me = { id: user.id, name: data.full_name, role: data.role };
    const pin = store.get("pin", null);
    if (!pin) return pinScreen("set");
    if (pin.hash && !justSignedIn) { S.locked = true; return pinScreen("unlock"); }
    openOffice();
  }

  async function openOffice() {
    touch();
    render();
    await loadTab();
    if (S.tab !== "tasks") { try { S.tasks = await q(db.from("v_handoff_tasks").select("*")); } catch (e) {} await loadCounts(); }
    render();
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me && !S.locked && S.tab === "tasks") loadTab().then(render); });

  db.auth.getSession().then(({ data }) => data.session ? start(data.session.user, false) : signIn());
})();

/* lets the core be tested outside a browser */
if (typeof module !== "undefined") module.exports = { keyProblem, isManager, daysLeft, fmtDate, daysText, ago, buildTasks, lastChanges, groupRules, ruleDepartments, catchUpTotals, pinHash, validPin, isNetworkError, friendlyError,
  localISO, daysSince, problemState, officeProblems, staleFlags, openFlags, needToOrder, orderedNotReceived, defectSummary, tvLink, taskWhen,
  crc32, makeZip, photoCsv, csvCell, fmtBytes, normProject, BATCH_STATE,
  fileCsv, filingItem, atDate, buildSignedTicket, pdfText, wrapText, signedFileName, fmtWhen, shopDate,
  parseOptions, choicesFromForm, choiceSummary, supplyListFor };
</script>
</body>
</html>
