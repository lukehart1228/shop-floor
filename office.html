<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181D2E">
<title>Office · Production</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sf-style-2026-10-20.1.css">   <!-- the colours and the scale: one sheet for every page (20 Oct) -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--midnight)}
  body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; line-height:1.45}
  button{font:inherit; color:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bright); outline-offset:2px}
  .num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* the header: one row — brand, the tabs, who's signed in */
  .top{position:sticky; top:0; z-index:10; background:var(--midnight); color:var(--sawdust); padding:0 24px}
  .top-row{display:flex; align-items:center; gap:14px; min-height:50px}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.14em; color:var(--orange); font-size:17px}
  .place{font-weight:600; font-size:18px}
  .who{margin-left:auto; font-size:15px; color:#CFC9B8; white-space:nowrap}
  .who b{color:var(--sawdust)}
  .lockbtn{background:#2C3348; border:none; color:var(--sawdust); border-radius:8px; padding:6px 14px; font-weight:600; font-size:15px}
  .tabs{display:flex; gap:2px; overflow-x:auto; align-self:stretch; min-width:0; flex:0 1 auto; scrollbar-width:none}
  .tab{background:none; border:none; color:var(--dim); padding:0 13px; font-weight:600; border-top:4px solid transparent; border-bottom:4px solid transparent; white-space:nowrap}
  .tab[aria-current="true"]{color:var(--sawdust); border-bottom-color:var(--orange)}
  .tab .n{font-family:'Barlow Condensed',sans-serif; margin-left:6px; color:var(--bright)}
  @media (max-width: 900px){ .place{display:none} }
  @media (max-width: 520px){ .top{padding:0 12px} .tab{padding:0 10px} .brand{display:none} main{padding:18px 14px 60px} }

  main{max-width:1160px; margin:0 auto; padding:16px 24px 80px}

  /* Needs you */
  .need{margin-bottom:22px}
  .need > h2{display:flex; align-items:baseline; gap:8px; margin:0 0 6px; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink2)}
  .need > h2 .cnt{font-family:'Barlow Condensed',sans-serif; font-size:17px; color:var(--midnight); letter-spacing:0}
  .need > .sub{font-size:15px; margin-bottom:8px}
  .need{scroll-margin-top:72px}
  .need .panel{padding:8px 22px}
  .later{margin-top:28px; border-top:1px solid var(--line); padding-top:8px}
  .later > details{border-bottom:1px solid var(--line); padding:4px 0}
  .later > details[open]{padding-bottom:12px}
  h1{font-size:26px; margin:0 0 4px}
  h2{font-size:20px; margin:0 0 4px}
  .sub{color:var(--ink2); margin:0 0 18px; max-width:70ch}
  .banner{border-radius:10px; padding:12px 16px; margin-bottom:16px; font-weight:600}
  .banner.warn{background:var(--sawdust); color:var(--warn); border-left:5px solid var(--bright)}
  .banner.ok{background:var(--teal-bg); color:var(--teal-ink)}
  .panel{background:#fff; border:none; border-radius:10px; padding:16px 18px; margin-bottom:16px}
  .panel[id], .setgroup, .ops-flags{scroll-margin-top:84px}
  .jumps{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 20px}
  .jumps button{min-height:44px}
  .sethead{font-size:24px; margin:26px 0 4px}
  .setsub{font-size:18px; margin:0 0 6px}
  .opshead, .ops-flags > h2{font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink2); margin:22px 0 12px; padding-bottom:6px; border-bottom:2px solid var(--line)}
  .ops-flags{margin-top:30px}
  .ops-flags > h2 .meta2{text-transform:none; letter-spacing:0}
  .panel > .sub:last-child{margin-bottom:0}
  .empty{border:1px dashed var(--gray); border-radius:12px; padding:28px 20px; text-align:center; color:var(--ink2); background:#fff}
  .empty b{display:block; color:var(--midnight); font-size:19px; margin-bottom:4px}
  .go{background:var(--orange); color:#fff; border:none; border-radius:9px; padding:12px 20px; font-weight:700}
  .go:disabled{opacity:.45; cursor:default}
  .plain{background:#fff; border:1px solid var(--gray); border-radius:9px; padding:10px 16px; font-weight:600}
  .link{background:none; border:none; color:var(--ink2); text-decoration:underline; padding:6px}
  .link:disabled{opacity:.3; text-decoration:none; cursor:default}

  /* ☰ menu: the other pages, Setup, sign out */
  .menubtn{display:flex; align-items:center; justify-content:center; width:44px; height:40px; border:none; border-radius:8px; background:#2C3348; flex-shrink:0}
  /* the office app's sections (Deliveries, Inventory, Pace, Upload): each its own page, shown under the header */
  #secs{position:fixed; left:0; right:0; bottom:0; top:56px; z-index:5; background:var(--bg, #F4F1EA)}
  #secs iframe{display:block; width:100%; height:100%; border:0}
  html.in-section, html.in-section body{overflow:hidden}
  .mshade{position:fixed; inset:0; z-index:30; background:rgba(24,29,46,.35); border:none; padding:0; cursor:default}
  .menu{position:fixed; z-index:31; top:0; left:0; bottom:0; width:min(320px, 88vw); background:#fff; box-shadow:8px 0 28px rgba(24,29,46,.25); padding:14px 12px; display:flex; flex-direction:column; gap:2px; overflow:auto}
  .menu .mhead{display:flex; align-items:center; justify-content:space-between; padding:2px 6px 10px 12px}
  .menu .mhead b{font-family:'Barlow Condensed',sans-serif; letter-spacing:.14em; color:var(--orange)}
  .menu .mlabel{font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--ink2); padding:6px 12px; text-transform:uppercase}
  .menu a,.menu .mitem{display:flex; flex-direction:column; justify-content:center; min-height:56px; padding:4px 14px; border-radius:10px; color:var(--midnight); text-decoration:none; font-weight:700; background:none; border:none; text-align:left; width:100%}
  .menu a small,.menu .mitem small{font-size:14px; font-weight:400; color:var(--ink2)}
  .menu a:hover,.menu .mitem:hover{background:var(--paper)}
  .menu [aria-current="page"],.menu [aria-current="true"]{background:var(--midnight); color:var(--sawdust)}
  .menu [aria-current="page"] small,.menu [aria-current="true"] small{color:#CFC9B8}
  .menu .mline{border-top:1px solid var(--line); margin:10px 4px}
  .menu .ver{margin-top:auto; padding:12px 14px 4px; font-size:14px; color:var(--ink2)}

  /* find a job, in the header */
  .find{position:relative; margin-left:auto; flex:0 1 250px; min-width:150px}
  .find input{width:100%; background:#2C3348; border:none; border-radius:8px; color:var(--sawdust); padding:8px 12px; font-size:15px}
  .find input::placeholder{color:var(--dim)}
  .hits{position:absolute; right:0; top:calc(100% + 6px); width:min(420px, 92vw); background:#fff; color:var(--midnight); border:1px solid var(--gray); border-radius:12px; box-shadow:0 12px 32px rgba(24,29,46,.25); padding:6px; z-index:32}
  .hits button{display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:10px 12px}
  .hits button:hover,.hits button.first{background:var(--paper)}
  .hits b{white-space:nowrap}
  .hits .hn{flex:1 1 auto; min-width:0; color:var(--ink2); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hits .hp{margin-left:auto; font-size:13px; color:var(--ink2); white-space:nowrap}
  .hits .none{padding:10px 12px; color:var(--ink2)}
  .who{margin-left:0}
  .pidlink{background:none; border:none; padding:0; font-weight:700; color:inherit; border-bottom:1.5px solid var(--orange); cursor:pointer}

  /* the Monday sync alert, top of Needs you */
  .syncalert{display:flex; gap:18px; align-items:flex-start; background:var(--sawdust); border:2px solid var(--bright); border-radius:12px; padding:16px 20px; margin-bottom:22px; color:var(--warn)}
  .syncalert h2{margin:0 0 4px; color:var(--warn)}
  .syncalert .reply{color:var(--ink2); font-size:15px; margin-top:8px}
  .syncalert .go{background:var(--midnight); white-space:nowrap}

  /* the job page */
  .jobhead h1{font-size:26px; margin-bottom:8px}
  .jobhead .jn{font-size:20px; font-weight:600; margin-left:10px}
  .jobband{border-radius:10px; padding:10px 16px; font-weight:700; margin:0 0 16px}
  .jobband.priority{background:var(--bright); color:var(--midnight)}
  .jobband.critical{background:var(--orange); color:#fff}
  .jobband.watch{background:#fff; border:1.5px solid var(--midnight)}
  .jobband small{font-weight:400; margin-left:8px; font-size:15px}
  .jobcols{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; align-items:start}
  /* 11 Nov: the Jobs tab, the one sentence, and an item's page */
  .jobsearch{display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--midnight); border-radius:10px; padding:0 14px; margin:4px 0 14px; max-width:560px; color:var(--ink2)}
  .jobsearch input{flex:1; min-width:0; border:none; outline:none; background:transparent; font:inherit; font-size:17px; padding:12px 0; color:var(--midnight)}
  .joblist{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .jrow{display:grid; grid-template-columns:140px minmax(0,1.4fr) minmax(0,1fr) 170px; gap:14px; align-items:center; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:12px 16px; min-height:56px; font-size:16px; color:var(--midnight); font-weight:400}
  .jrow:last-child{border-bottom:none}
  .jrow:hover, .jrow.first{background:#F7F5EF}
  .jrow .pid{font-family:'Barlow Condensed',sans-serif; font-size:19px; white-space:nowrap}
  .jrow .sum, .jrow .due{color:var(--ink2)} .jrow .due{text-align:right}
  @media (max-width: 760px){ .jrow{grid-template-columns:1fr; gap:2px} .jrow .due{text-align:left} }
  .say{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:6px 0 12px}
  .say p{margin:0; font-size:20px; line-height:1.4; font-weight:500}
  .say small{color:var(--ink2)}
  .grid .gs .itemlink{background:none; border:none; padding:0; min-height:0; text-align:left; color:var(--midnight); font:inherit; cursor:pointer}
  .grid .gs .itemlink b{text-decoration:underline; text-underline-offset:3px}
  .grid .gs .itemlink small{display:block; color:var(--ink2); font-size:14px; font-weight:400}
  .drow{display:grid; grid-template-columns:minmax(0,1fr) 120px; gap:4px 10px; padding:10px 0; border-top:1px solid var(--line)}
  .drow .dn{font-weight:600} .drow .why{display:block; font-weight:400; font-size:14px; color:var(--ink2)}
  .drow .prog .num{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:18px}
  .drow .tbar{display:block; height:8px; background:var(--paper); border-radius:99px; overflow:hidden; margin-top:3px}
  .drow .tbar i{display:block; height:100%; background:var(--orange); border-radius:99px} .drow .tbar i.full{background:var(--teal)}
  .drow .due{grid-column:1 / -1; font-size:14px; color:var(--ink2)}
  .drow.done .dn{color:var(--teal-ink)}
  .pg{display:block; width:100%; padding:0; border:1px solid var(--line); background:#fff; border-radius:8px; overflow:hidden; cursor:zoom-in; min-height:0}
  .pg img{display:block; width:100%; max-height:560px; object-fit:contain}
  .pg.big{cursor:zoom-out} .pg.big img{max-height:none}
  .pgwait{padding:40px 20px; text-align:center; color:var(--ink2); background:var(--paper); border-radius:8px}
  @media (max-width: 1000px){ .jobcols{grid-template-columns:minmax(0,1fr)} }
  .grid{display:grid; gap:6px; font-size:15px; min-width:min-content}
  .grid .gh{font-weight:700; text-align:center; padding:4px 2px; line-height:1.15; align-self:end}
  .grid .gh .fbd{display:block; font-weight:400; font-size:12px; color:var(--ink2); margin-top:3px}
  .grid .gh .fbd b{color:var(--midnight); font-weight:600}
  .fbrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap}
  .fbrow .nm{flex:0 0 140px; font-weight:600; white-space:nowrap}
  .panel .fbrow input.in{width:84px; flex:none; text-align:center}
  .fbrow .who{flex:1 1 200px; color:var(--ink2); font-size:13px}
  .grid .gs{padding:6px 0; line-height:1.15; white-space:nowrap}
  .grid .gs small{display:block; color:var(--ink2); font-size:14px}
  .grid .c{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums; text-align:center; border-radius:8px; padding:9px 4px; font-weight:700; font-size:18px}
  .grid .c.done{background:var(--teal); color:var(--midnight)}
  .grid .c.part{background:var(--sawdust); border:1px solid var(--gray)}
  .grid .c.zero{background:#fff; border:1px solid var(--gray); color:var(--ink2)}
  .grid .c.no{color:var(--gray); font-weight:600}
  .grid .tot{padding:4px 2px 8px; border-bottom:1px solid var(--line)}
  .grid .tot .c{padding:2px; font-size:18px}
  .grid .tbar{height:8px; background:var(--paper); border-radius:99px; overflow:hidden}
  .grid .tbar i{display:block; height:100%; background:var(--orange); border-radius:99px}
  .grid .tbar i.full{background:var(--teal)}
  .gkey{display:flex; flex-wrap:wrap; gap:14px; font-size:14px; color:var(--ink2); align-items:center}
  .gkey span{display:inline-flex; align-items:center; gap:6px}
  .gkey i{display:inline-block; width:14px; height:14px; border-radius:3px}
  main.wide{max-width:1300px}
  .brand{white-space:nowrap}
  @media (max-width: 1420px){ .place{display:none} }
  .side .panel{padding:12px 16px; margin-bottom:12px}
  .side h2{font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink2); margin:0 0 4px}
  .side .row{font-size:15px; padding:6px 0; border-top:1px solid var(--line)}
  .side .row:first-of-type{border-top:none}

  /* your tasks */
  .task{display:grid; grid-template-columns:1fr auto; gap:4px 18px; padding:14px 0; border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task .what{font-weight:700}
  .task .what .pid{letter-spacing:.02em}
  .task .detail{color:var(--ink2); font-size:15px; grid-column:1}
  .task .when{grid-row:1 / span 2; grid-column:2; text-align:right; align-self:center}
  .task .when .d{font-size:30px; font-weight:700; line-height:1}
  .task .when .l{font-size:14px; color:var(--ink2)}

  /* live switches */
  .dept{display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line)}
  .dept:last-child{border-bottom:none}
  .dept .nm{font-weight:700; font-size:19px; min-width:150px}
  .dept .hist{color:var(--ink2); font-size:14px; flex:1}
  .switch{position:relative; width:64px; height:34px; border-radius:99px; border:2px solid var(--gray); background:var(--paper); flex-shrink:0; padding:0}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; border:1px solid var(--gray); transition:left .15s}
  .switch[aria-checked="true"]{background:var(--orange); border-color:var(--orange)}
  .switch[aria-checked="true"]::after{left:33px; border-color:var(--orange)}
  .switch:disabled{opacity:.5}
  .state{width:44px; font-weight:700; font-size:15px}
  @media (prefers-reduced-motion: reduce){ .switch::after{transition:none} }

  /* setup */
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px; margin:10px 0 0}
  .fact{border-top:1px solid var(--line); padding-top:8px}
  .fact .k{font-size:14px; color:var(--ink2)}
  .fact .v{font-weight:600}
  .fact .v.missing{color:var(--warn)}
  table.rules{border-collapse:collapse; width:100%; margin:6px 0 18px; font-size:15px}
  .rules caption{text-align:left; font-weight:700; font-size:17px; padding:8px 0 6px}
  .rules th,.rules td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center}
  .rules th{font-weight:600; color:var(--ink2); font-size:14px}
  .rules td:first-child,.rules th:first-child{text-align:left}
  .rules input{width:22px; height:22px; accent-color:var(--orange)}
  .rules .changed{color:var(--ink2); font-size:13px}
  .scroll{overflow-x:auto}
  .cu{display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line)}
  .cu:last-child{border-bottom:none}
  .cu input{width:24px; height:24px; margin-top:2px; accent-color:var(--orange); flex-shrink:0}
  .cu .body{flex:1}
  .cu .t{font-weight:700}
  .cu .m{color:var(--ink2); font-size:15px}
  .cu .l{font-size:15px}
  .cu.none .t,.cu.none .l{color:var(--ink2); font-weight:500}
  .bar-actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px}
  .result{margin-top:14px}
  .result ul{margin:6px 0 0 18px; padding:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  select{font:inherit; padding:10px 12px; border:1px solid var(--gray); border-radius:9px; background:#fff; min-width:280px}
  .tj{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line)}
  .tj:last-child{border-bottom:none}
  .tag{border:1.5px solid var(--midnight); border-radius:4px; font-size:12px; font-weight:700; letter-spacing:.06em; padding:1px 5px}
  .tj .nm{flex:1}
  .tj .nm span{color:var(--ink2)}

  /* the floor log: problems, flags, ordering, Arrow, routine tasks */
  .li{background:#fff; border:none; border-radius:10px; padding:12px 16px; margin-bottom:8px}
  .li.open{border-left:6px solid var(--midnight)}
  .li.stop{border-left:6px solid var(--warn)}
  .li-top{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .meta2{font-size:15px; color:var(--ink2)}
  .st{font-size:13px; font-weight:700; padding:2px 8px; border-radius:5px; border:1.5px solid var(--midnight)}
  .st.quiet{border-color:var(--gray); color:var(--ink2)}
  .ktag{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:4px; margin-right:2px}
  .ktag.issue{background:var(--midnight); color:var(--sawdust)}
  .ktag.defect{border:1.5px solid var(--midnight); color:var(--midnight); padding:1px 6px}
  .st.ok{background:var(--teal-bg); color:var(--teal-ink); border-color:transparent}
  .stoptag{font-size:13px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--sawdust); color:var(--warn); border:1.5px solid var(--warn)}
  .msg{background:var(--paper); border-radius:6px; padding:8px 12px; margin-top:6px}
  .msg.answer,.msg.office_note{background:#fff; border:1.5px solid var(--midnight)}
  .msg-meta{font-size:13px; color:var(--ink2); margin-top:3px; font-weight:600}
  textarea.in,input.in,select.in{width:100%; font:inherit; padding:11px 12px; border:1px solid var(--gray); border-radius:9px; background:#fff; color:var(--midnight); min-width:0}
  textarea.in{min-height:78px; resize:vertical}
  .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .flagtag{display:inline-block; font-size:14px; font-weight:700; padding:3px 10px; border-radius:6px}
  .flagtag.critical{background:var(--orange); color:#fff}
  .flagtag.priority{background:var(--bright); color:var(--midnight)}
  .flagtag.watch{border:1.5px solid var(--midnight)}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 16px}
  .grid2 label{display:block; font-weight:600; margin:10px 0 4px}
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg button{background:#fff; border:1.5px solid var(--gray); border-radius:9px; padding:9px 14px; font-weight:700}
  .seg button[aria-pressed="true"]{background:var(--midnight); color:var(--sawdust); border-color:var(--midnight)}
  .line{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:none}
  .line input[type=checkbox]{width:24px; height:24px; margin-top:2px; accent-color:var(--orange); flex-shrink:0}
  .line .body{flex:1; min-width:0}
  .line .qty{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; min-width:44px; text-align:right}
  .deptname{font-weight:700; margin:14px 0 2px; color:var(--ink2); font-size:15px}
  .deptname:first-child{margin-top:0}
  .countline{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
  .countline:last-child{border-bottom:none}
  .countline .n{margin-left:auto; font-weight:700}

<body>
<div id="app"></div>

<!-- the Supabase library, checked: the browser refuses it if even one byte differs from the published file -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="sf-common-2026-10-05.1.js"></script>
<script>
/* The two settings (project address, publishable key), the key check, the connection test, the id maker and the
   Feedback button are in the shared file loaded above, sf-common-2026-10-05.1.js. */

/* How long the office view waits, untouched, before asking for the PIN again. */
const LOCK_AFTER_MINUTES = 15;


/* ---- core: no screen code in here, so it can be tested on its own ---- */

const DEPT_ORDER = ["milling", "cnc", "sanding", "finishing", "full_custom", "metal", "assembly_qc"];
const DEPT_NAME = { milling: "Milling", cnc: "CNC", sanding: "Sanding", finishing: "Finishing",
                    full_custom: "Full Custom", metal: "Metal", assembly_qc: "Assembly / QC", delivery: "Delivery" };
/* every department that logs, counted or not (Delivery is log-only) */
const LOG_DEPTS = [...DEPT_ORDER, "delivery"];
const LEVEL_NAME = { critical: "Critical", priority: "Priority", watch: "Watch" };

/* ---- supply lists ---- */
/** "Ash, Maple ,, White Oak" → ["Ash", "Maple", "White Oak"] */
function parseOptions(text) { return String(text || "").split(",").map(x => x.trim()).filter(Boolean); }
/** The form's two rows → what set_supply_item() takes. A row left completely blank is skipped. */
function choicesFromForm(groups) {
  return (groups || []).map(g => ({ label: String(g.label || "").trim(), options: parseOptions(g.options) }))
    .filter(g => g.label || g.options.length);
}
/** An item's choices as one line: "Wood: Ash, Maple · Thickness: 1/4, 1/2" */
function choiceSummary(choices) {
  return (choices || []).map(g => `${g.label}: ${(g.options || []).join(", ")}`).join(" · ");
}
/** One department's list: live items in their order, then retired ones. */
function supplyListFor(items, dept) {
  const mine = (items || []).filter(i => i.department === dept);
  const byOrder = (a, b) => (a.sort_order - b.sort_order) || String(a.name).localeCompare(String(b.name));
  return { live: mine.filter(i => !i.retired).sort(byOrder), retired: mine.filter(i => i.retired).sort(byOrder) };
}
const WEEKDAYS = { 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday" };


function isManager(me) { return !!me && (me.role === "manager" || me.role === "admin"); }

function daysLeft(iso, today = new Date()) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
function fmtDate(iso) {
  if (!iso) return "no date";
  const [y, m, d] = iso.split("-").map(Number);
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1] + " " + d;
}
function daysText(n) {
  if (n === null) return "";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} late`;
  if (n === 0) return "due today";
  return `${n} day${n === 1 ? "" : "s"} left`;
}
function ago(ts, now = new Date()) {
  if (!ts) return "never";
  const mins = Math.round((now - new Date(ts)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}

/** Handoff tasks, soonest delivery first; jobs with no date go last. */
function buildTasks(rows, today = new Date()) {
  return [...(rows || [])]
    .map(r => ({ ...r, days: daysLeft(r.delivery_date, today) }))
    .sort((a, b) => (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999")
                 || String(a.project_id).localeCompare(String(b.project_id)));
}

/** The latest change per department, from the switch history. */
function lastChanges(log) {
  const out = {};
  for (const r of [...(log || [])].sort((a, b) => String(b.changed_at).localeCompare(String(a.changed_at))))
    if (!out[r.department]) out[r.department] = r;
  return out;
}

/** Catch-up rules, grouped by Monday column in the board's own order. */
function groupRules(rules, columns) {
  const cols = (columns || []).filter(c => c.key !== "handed_off" && c.column_id).sort((a, b) => a.sort_order - b.sort_order);
  return cols.map(c => {
    const order = (c.labels || []);
    const rows = (rules || []).filter(r => r.column_key === c.key)
      .sort((a, b) => (order.indexOf(a.label) + 1 || 999) - (order.indexOf(b.label) + 1 || 999) || a.label.localeCompare(b.label));
    return { key: c.key, what: c.what, title: c.title, rows };
  });
}

/** Which departments a catch-up rule column offers as tick boxes. */
function ruleDepartments(columnKey) {
  if (columnKey === "wood") return ["milling", "cnc", "sanding", "finishing"];
  if (columnKey === "assembly_qc") return ["milling", "cnc", "sanding", "finishing", "full_custom", "metal", "assembly_qc"];
  return [columnKey];
}

/** What "Apply ticked" would do, for the confirm message. */
function catchUpTotals(preview, ticked) {
  const chosen = (preview || []).filter(p => p.pieces_to_fill > 0 && ticked.has(p.job_id));
  return { jobs: chosen.length, pieces: chosen.reduce((a, p) => a + p.pieces_to_fill, 0), ids: chosen.map(p => p.job_id) };
}

/* A device PIN: a speed bump on a shared computer, NOT security — the
   database decides what a login can do. It's stored on this device only. */
function pinHash(pin, salt) {
  let h = 2166136261;
  for (const c of String(salt) + ":" + String(pin)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function validPin(pin) { return /^\d{4}$/.test(String(pin)); }


function friendlyError(err) {
  const m = String((err && (err.message || err.error_description || err.error)) || err || "");
  if (isNetworkError(err)) return "Can't reach the database right now. Check the connection and try again.";
  if (/invalid login credentials/i.test(m)) return "That email and password didn't match. Check them and try again.";
  if (/email not confirmed/i.test(m)) return "This login hasn't been confirmed. In Supabase → Authentication → Users, check it was created with Auto Confirm ticked.";
  if (/jwt expired|refresh token/i.test(m)) return "The sign-in has expired. Sign out and back in.";
  if (/could not find the function|does not exist|schema cache/i.test(m)) return "The database doesn't have this part yet. Run the SQL file for it in Supabase (see the walkthrough), then reload this page.";
  return m || "Something went wrong. Try again, and if it keeps happening, take a screenshot.";
}

/** A timestamp as the local date, "YYYY-MM-DD", and whole days since it. */
function localISO(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daysSince(ts, today = new Date()) {
  if (!ts) return null;
  return -daysLeft(String(ts).length > 10 ? localISO(ts) : ts, today);
}
const fmtDay = (ts) => ts ? fmtDate(String(ts).length > 10 ? localISO(ts) : ts) : "";

/** Where a problem stands, in words (the same words the tablet uses). */
function problemState(p) {
  if (p.status === "answered") return { label: "Answered", done: true };
  if (p.came_back) return { label: "Came back", done: false };
  if ((p.thread || []).some(m => m.kind === "office_note")) return { label: "You replied — still open", done: false };
  return { label: "Waiting for you", done: false };
}
/** The office queue: work stopped first, then came back, then oldest. Answered: the last 30 days. */
function officeProblems(list, today = new Date()) {
  const open = (list || []).filter(p => p.status === "open")
    .sort((a, b) => (b.work_stopped - a.work_stopped) || (b.came_back - a.came_back) || String(a.raised_at).localeCompare(String(b.raised_at)));
  const answered = (list || []).filter(p => p.status === "answered" && daysSince(p.answered_at, today) <= 30)
    .sort((a, b) => String(b.answered_at).localeCompare(String(a.answered_at)));
  return { open, answered };
}

/** Where a defect stands for the office. Only counted, unless the floor asked the office about it. */
function defectOfficeState(d) {
  if (d.office_status === "answered") return { label: "Answered", done: true };
  if (d.office_status === "open") {
    if (d.came_back) return { label: "Came back", done: false };
    if ((d.thread || []).some(m => m.kind === "office_note")) return { label: "You replied — still open", done: false };
    return { label: "Waiting for you", done: false };
  }
  return { label: "Counted", done: true, quiet: true };
}
/** Everything the floor has asked the office: issues, and defects with Ask the office.
 *  Work stopped first, then came back, then oldest. Answered: the last 30 days. */
function officeIssues(problems, defects, today = new Date()) {
  const P = (problems || []).map(p => ({ ...p, kind: "issue", at: p.raised_at }));
  const D = (defects || []).filter(d => !d.voided && d.office_status)
    .map(d => ({ ...d, kind: "defect", at: d.logged_at, status: d.office_status, work_stopped: false }));
  const all = P.concat(D);
  const open = all.filter(x => x.status === "open")
    .sort((a, b) => (b.work_stopped - a.work_stopped) || (b.came_back - a.came_back) || String(a.at).localeCompare(String(b.at)));
  const answered = all.filter(x => x.status === "answered" && daysSince(x.answered_at, today) <= 30)
    .sort((a, b) => String(b.answered_at).localeCompare(String(a.answered_at)));
  return { open, answered };
}

/** Flags older than two weeks are surfaced for review — stale flags stop meaning anything. */
function staleFlags(flags, days = 14) {
  return (flags || []).filter(f => f.is_open && f.age_days > days).sort((a, b) => b.age_days - a.age_days);
}
function openFlags(flags) {
  return (flags || []).filter(f => f.is_open)
    .sort((a, b) => ({ critical: 0, priority: 1, watch: 2 }[a.level] - { critical: 0, priority: 1, watch: 2 }[b.level])
                 || String(a.project_id).localeCompare(String(b.project_id)));
}

/** Ordering: one line per request, grouped by department, oldest first. No grouping by item. */
function needToOrder(reqs) {
  const groups = [];
  for (const d of LOG_DEPTS) {
    const lines = (reqs || []).filter(r => r.state === "requested" && r.department === d)
      .sort((a, b) => String(a.requested_at).localeCompare(String(b.requested_at)));
    if (lines.length) groups.push({ department: d, name: DEPT_NAME[d], lines });
  }
  return groups;
}
function orderedNotReceived(reqs) {
  return (reqs || []).filter(r => r.state === "ordered").sort((a, b) => String(a.ordered_at).localeCompare(String(b.ordered_at)));
}

/** Defects per department (and per type) since a date. */
function defectSummary(defects, fromISO = "0000") {
  const out = [];
  for (const d of LOG_DEPTS) {
    const mine = (defects || []).filter(x => !x.voided && x.department === d && localISO(x.logged_at) >= fromISO);
    if (!mine.length) continue;
    const by = {};
    for (const x of mine) by[x.defect_type] = (by[x.defect_type] || 0) + 1;
    out.push({ department: d, name: DEPT_NAME[d], n: mine.length,
               types: Object.entries(by).map(([type, n]) => ({ type, n })).sort((a, b) => b.n - a.n || a.type.localeCompare(b.type)) });
  }
  return out.sort((a, b) => b.n - a.n);
}

/** The TV's address: tv.html next to this page, with the secret after the # (never sent to GitHub). */
function tvLink(pageUrl, key) {
  const u = new URL("tv.html", pageUrl);
  return u.origin + u.pathname + "#k=" + key;
}

/** Routine tasks past their due day and not done — they wait on Operations, most overdue first */
function overdueRoutine(tasks) {
  return (tasks || []).filter(t => !t.done_today && Number(t.days_until) < 0).sort((a, b) => a.days_until - b.days_until);
}
function taskWhen(t) {
  if (t.done_today) return `Done today${t.last_done_by ? " by " + t.last_done_by : ""}`;
  const n = t.days_until;
  if (n === 0) return "Due today";
  if (n < 0) return `Overdue by ${-n} day${n === -1 ? "" : "s"}`;
  return `Due in ${n} day${n === 1 ? "" : "s"} · ${fmtDate(t.next_due)}`;
}

/* ---- photos: the archive zip, built in the browser (nothing to install) ---- */

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const utf8 = (text) => new TextEncoder().encode(text);

/** A zip of the given files, stored as they are (photos don't shrink further). files: [{ name, data: Uint8Array, date }] */
function makeZip(files) {
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = utf8(f.name), d = f.date instanceof Date && !isNaN(f.date) ? f.date : new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    const date = ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const crc = crc32(f.data), size = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, x) => a + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((a, x) => a + x.length, 0));
  let at = 0;
  for (const x of all) { out.set(x, at); at += x.length; }
  return out;
}

/** One spreadsheet cell. Text that starts with = + - @ (or a tab or return) gets a leading ' so Excel shows it as
 *  typed instead of running it as a formula ("-2 legs short" stays text). Numbers are left alone. (Review finding R-12, 6 Oct.) */
function csvCell(v) {
  let t = v === null || v === undefined ? "" : String(v);
  if (typeof v !== "number" && /^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
/** The spreadsheet inside the zip: every photo, so the archive can be searched without the app. */
function photoCsv(list, batch) {
  const head = ["File", "Project", "Job", "Sheet", "Department", "Kind", "What", "Note", "Taken by", "Taken at", "Entered by mistake", "Test job", "Batch"];
  const rows = (list || []).map(p => [p.name, p.project_id, p.job_name, p.sheet ?? "", p.department, p.kind, p.what, p.note, p.by, p.at,
                                      p.mistake ? "yes" : "", p.test ? "yes" : "", batch]);
  return "\uFEFF" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
/** The spreadsheet for the filing layout (deliveries.sql): every photo and delivery file, by job, item and table. */
function fileCsv(list, batch) {
  const head = ["File", "Project", "Job", "Sheet", "Table", "What", "Note", "By", "When", "Where (GPS)", "Entered by mistake", "Test job", "Batch"];
  const rows = (list || []).map(p => [p.name, p.project_id, p.job_name, p.sheet ?? "", p.table ?? "", p.kind, p.note, p.by, p.at, p.gps || "",
                                      p.mistake ? "yes" : "", p.test ? "yes" : "", batch || ""]);
  return "﻿" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
/** A v_filing row as a file for the zip: PROJ-00418/TB-03/TB-03-2 Delivery Picture.jpg */
function filingItem(f) {

const SYNC_ALERT_MINUTES = 60;

// Is the Monday sync healthy? last = the newest log row, good = the newest row that worked.
// Returns null when all is well, or what the alert should say.
function syncHealth(last, good, now = new Date()) {
  const mins = (ts) => (now - new Date(ts)) / 60000;
  if (good && mins(good.run_at) <= SYNC_ALERT_MINUTES) return null;
  if (!last) return { title: "The Monday sync hasn't run yet", since: null, reply: null, stopped: true };
  const since = good ? good.run_at : null;
  const running = mins(last.run_at) <= 30;          // the timer is still calling Monday, and Monday is failing
  return { title: since ? `Monday hasn't synced for ${agoWords(since, now)}` : "The Monday sync has never worked",
           since, reply: !last.ok ? (last.summary || null) : null, stopped: !running };
}
function agoWords(ts, now = new Date()) {
  const m = Math.max(0, Math.round((now - new Date(ts)) / 60000));
  if (m < 90) return `${m} minute${m === 1 ? "" : "s"}`;
  const h = Math.round(m / 60);
  if (h < 36) return `${h} hour${h === 1 ? "" : "s"}`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"}`;
}

// jobs matching what's typed in Find a job: "418" finds PROJ-00418; words search the name too
function jobMatches(jobs, text, max = 8) {
  const t = String(text || "").trim().toLowerCase();
  if (!t) return [];
  const digits = t.replace(/\D/g, "");
  const hit = (j) => {
    const pid = String(j.project_id || "").toLowerCase(), name = String(j.name || "").toLowerCase();
    if (/^\d+$/.test(t)) return pid.replace(/\D/g, "").replace(/^0+/, "").includes(t.replace(/^0+/, "") || "0");
    if (digits && /^proj/.test(t)) return pid.includes(t) || pid.replace(/\D/g, "").endsWith(digits);
    return pid.includes(t) || name.includes(t);
  };
  return jobs.filter(hit)
    .sort((a, b) => (b.is_active - a.is_active) || (a.is_test - b.is_test) || String(b.project_id).localeCompare(String(a.project_id)))
    .slice(0, max);
}

    let r, o; try { [r, o] = await Promise.all([db.rpc("photo_archive_status"), db.rpc("off_supabase_status")]); } catch (e) { r = o = { error: e }; }
    if (o && !o.error) { S.offMissing = false; S.offStatus = o.data; }
    else S.offMissing = !!(o && o.error && /does not exist|schema cache|could not find/i.test(String(o.error.message)));
    if (r.error) { S.photoMissing = /does not exist|schema cache|could not find/i.test(String(r.error.message)); return; }
    S.photoMissing = false; S.photoStatus = r.data;
  }
  async function loadPhotosWhere(field, values) {
    if (!values.length) return;
    let r; try { r = await db.from("v_photos").select("*").in(field, values); } catch (e) { return; }
    if (r.error || !r.data) return;
    const byId = new Map(S.photos.map(p => [p.id, p]));
    for (const x of r.data) byId.set(x.id, x);
    S.photos = [...byId.values()];
  }

  async function loadTab() {
    S.notice = null; S.missing = false;
    if (!isManager(S.me)) return;
    try {
      if (S.tab === "jobs") {
        S.allJobs = null;
        // every job, a page at a time: Supabase hands back 1,000 rows a request, and the jobs table only grows
        const [jj, fb] = await Promise.all([allRows(() => db.from("jobs").select("id, project_id, name, phase, delivery_date, is_active, is_test").order("id")).catch(() => null),
          allRows(() => db.from("v_finish_by").select("job_id, department, department_name, pieces_done, pieces_required").eq("is_active", true).order("job_id").order("department")).catch(() => null)]);
        S.allJobs = jj || [];
        const prog = {}; for (const r of fb || []) if (r.pieces_required > 0) (prog[r.job_id] = prog[r.job_id] || []).push({ key: r.department, name: r.department_name, done: r.pieces_done, req: r.pieces_required });
        const order = Object.keys(DEPT_NAME); for (const k in prog) prog[k].sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
        S.jobProg = prog;
        return;
      }
      if (S.tab === "photos") {
        await loadPhotoStatus();
        return;
      }
      if (S.tab === "tasks") {          // Operations: problems, ordering, stale flags, overdue routine tasks, Arrow, saving, handoffs, then flags
        await loadCounts();
        await Promise.all([loadFlags(), loadRoutine()]);
        const ar = await soft(db.from("v_outside_jobs").select("*").eq("voided", false));   // 11 Nov: Arrow's list lives on Operations
        if (ar) S.arrow = ar.filter(x => x.at_vendor || daysSince(x.returned_on) <= 92);
        const [h, cols, r] = await Promise.all([soft(db.from("v_handoff_tasks").select("*")), soft(db.from("monday_columns").select("*")),
          soft(db.from("v_supply_requests").select("*"))]);
        if (h) S.tasks = h;
        if (cols) S.columns = cols;
        if (r) S.supplies = r.filter(x => x.is_open || daysSince(x.updated_at) <= 60);
        await loadPhotosWhere("problem_id", (S.problems || []).map(p => p.id));
        await loadPhotosWhere("defect_id", (S.defects || []).filter(d => d.office_status).map(d => d.id));
        return;
      }
      if (S.tab === "feedback") {        // feedback.sql; feedback_close.sql (20 Oct) adds v_feedback: each note open, solved or not relevant
        const missing = (e) => !!(e && /does not exist|schema cache|could not find|42P01|PGRST205/i.test(String(e.message) + " " + String(e.code)));
        let r = await db.from("v_feedback").select("*").order("created_at", { ascending: false }).limit(1000);
        S.fbkCanClose = !r.error;
        if (missing(r.error)) r = await db.from("feedback").select("*").order("created_at", { ascending: false }).limit(1000);   // before feedback_close.sql: every note, as before
        S.fbkMissing = missing(r.error);
        if (r.error && !S.fbkMissing) S.notice = friendlyError(r.error); else S.feedback = r.data || [];
        return;
      }
      if (S.tab === "setup") {
        await Promise.all([loadRoutine(), loadDepartments()]);
        const [ty, set] = await Promise.all([soft(db.from("defect_types").select("*")), soft(db.from("app_settings").select("*"))]);
        if (ty) S.types = ty;
        if (set) { const t = set.find(s => s.key === "tv_link_made"); S.tvMade = t || null;
                   const a = set.find(s => s.key === "arrow_alert_days"); if (a) S.arrowDays = Number(a.value); }
        const [fbd, fbh] = await Promise.all([quiet(db.from("v_finish_by_days").select("*")),
          quiet(db.from("finish_by_days").select("*").order("set_at", { ascending: false }))]);   // finish_by.sql
        S.fbMissing = !fbd; if (fbd) { S.fbDays = fbd.sort((a, b) => a.sort_order - b.sort_order); S.fbHist = fbh || []; }
        S.columns = await q(db.from("monday_columns").select("*"));
        const log = await q(db.from("monday_sync_log").select("run_at, ok, summary, problems").order("run_at", { ascending: false }).limit(1));
        S.lastSync = (log || [])[0] || null;
        S.uploaded = await q(db.from("v_uploaded_jobs").select("*"));
        if (S.preview === null) await loadPreview();
        else S.rules = await q(db.from("monday_stage_map").select("*"));
      }
    } catch (e) { S.notice = friendlyError(e); }
  }

  /** The Jobs tab's list (11 Nov): every job in production, soonest delivery first; typing finds any job, in production or not. */
  function jobProgress(id) {
    const L = (S.jobProg || {})[id]; if (!L || !L.length) return "";
    const done = L.reduce((a, d) => a + d.done, 0), req = L.reduce((a, d) => a + d.req, 0);
    if (!req) return "";
    if (done >= req) return "Built";
    if (!done) return "Not started";
    let pct = Math.round(100 * done / req); if (pct === 100) pct = 99; if (pct === 0) pct = 1;
    const act = L.filter(d => d.done > 0 && d.done < d.req);
    return act.length ? `In ${act[0].name}${act.length > 1 ? " +" + (act.length - 1) : ""} · ${pct}%` : `${pct}% done`;
  }
  function jobsListHtml() {
    if (!S.allJobs) return `<div class="empty">Loading the jobs…</div>`;
    const q = S.jobFind.trim();
    const list = q ? jobMatches(S.allJobs, q).slice().sort((a, b) => a.is_test - b.is_test)   // a real job before its test copy
      : S.allJobs.filter(j => j.is_active).sort((a, b) => (a.is_test - b.is_test) || String(a.delivery_date || "9999").localeCompare(String(b.delivery_date || "9999")) || String(a.project_id).localeCompare(String(b.project_id)));
    if (!list.length) return `<div class="empty"><b>${q ? `No job matches “${esc(q)}”` : "No jobs in production"}</b>${q ? "Try the PROJ number, or fewer letters of the name." : "Jobs show here when Monday's Phase says In Production."}</div>`;
    return `<div class="joblist">${list.map((j, i) => `<button class="jrow${i === 0 && q ? " first" : ""}" data-openjob="${esc(j.id)}">
        <b class="pid">${testTag(j)}${esc(j.project_id || "(no PROJ number)")}</b><span class="nm">${esc(j.name)}</span>
        <span class="sum">${esc(j.is_active ? jobProgress(j.id) || "In production" : j.phase || "Not in production")}</span>
        <span class="due">${j.delivery_date ? `${esc(fmtDate(j.delivery_date))}${daysLeft(j.delivery_date) !== null ? ` · ${esc(daysText(daysLeft(j.delivery_date)))}` : ""}` : "no date"}</span></button>`).join("")}</div>`;
  }

  async function loadAllJobs() {
    if (S.allJobs) return;
    const j = await quiet(db.from("jobs").select("id, project_id, name, phase, delivery_date, is_active, is_test"));
    if (j) S.allJobs = j;

  async function loadJob(id) {
    const job = (await quiet(db.from("jobs").select("id, project_id, name, phase, delivery_date, is_active, is_test").eq("id", id)) || [])[0];
    if (!job) { S.job = { id, missing: true }; return; }
    const wos = await quiet(db.from("work_orders").select("id, version, is_current, created_at").eq("job_id", id)) || [];
    const cur = wos.find(w => w.is_current) || null;
    const sheets = cur ? (await quiet(db.from("sheets").select("id, sheet_number, item_code").eq("work_order_id", cur.id)) || []) : [];
    const [progress, flags, problems, arrow, defects, loadouts, photos] = await Promise.all([
      sheets.length ? quiet(db.from("sheet_progress").select("sheet_id, department, qty_done, qty_required").in("sheet_id", sheets.map(s => s.id))) : [],
      quiet(db.from("v_flags").select("*").eq("job_id", id).eq("is_open", true)),
      quiet(db.from("v_problems").select("*").eq("job_id", id)),
      quiet(db.from("v_outside_jobs").select("*").eq("job_id", id).eq("voided", false)),
      quiet(db.from("v_defects").select("*").eq("job_id", id).eq("voided", false)),
      quiet(db.from("v_loadouts").select("*").eq("job_id", id)),
      quiet(db.from("v_photos").select("id").eq("job_id", id).eq("voided", false))]);
    const finishBy = await quiet(db.from("v_finish_by").select("*").eq("job_id", id));   // finish_by.sql; the grid goes without if it isn't there
    const tv = await quiet(db.rpc("tv_job_pictures", { p_job: id }));                     // tv_photos.sql; nothing shows if it isn't there
    const designs = job.project_id ? await quiet(db.from("item_designs").select(D3_COLS).eq("project_id", job.project_id).is("superseded_at", null)) : null;   // design_viewer.sql; no 3D buttons without it
    if (S.jobView !== id) return;                     // they moved on while it loaded
    S.job = { id, job, wo: cur, sheets, progress: progress || [], flags: flags || [], problems: problems || [], arrow: arrow || [],
              defects: defects || [], loadouts: loadouts || [], photoCount: photos ? photos.length : null, finishBy: finishBy || [], tv: tv || null, designs: designs || [] };
    rememberTvPics(tv);
    // 11 Nov: where it is in one sentence and item by item (job_status.sql + job_items.sql), and its photos and trips
    const [st] = await Promise.all([job.project_id || job.name ? quiet(db.rpc("job_lookup", { p_q: job.project_id || job.name })) : null,
                                    job.project_id ? findJobPhotos(job.project_id).catch(() => {}) : null]);
    if (S.jobView !== id || !S.job) return;
    S.job.st = st && Array.isArray(st.jobs) ? st.jobs.find(x => x.job_id === id) || null : null;
    S.job.at = st && st.at;
    if (!job.project_id) S.phJob = null;
  }

  function jobScreen() {
    const J = S.job;
    if (J && S.item !== null && S.item !== undefined && J.st) return itemScreen();
    const back = `<button class="link" data-jobback="1" style="padding-left:0">← ${S.jobBack === "jobs" ? "Jobs" : "Back"}</button>`;

    if (J.missing) return back + `<div class="empty"><b>Can't find that job</b>It may have been removed from Monday, or the connection dropped.</div>`;
    const j = J.job;
    const g = jobGrid(J.sheets, J.progress);
    const pieces = J.sheets.length ? g.totals.reduce((a, t) => a + t.req, 0) : 0;
    const flag = J.flags.slice().sort((a, b) => ({ critical: 0, priority: 1, watch: 2 }[a.level] - { critical: 0, priority: 1, watch: 2 }[b.level]))[0];
    const facts = [j.phase || (j.is_active ? "In Production" : "Not in production"), j.delivery_date ? `due ${fmtDate(j.delivery_date)}` : "no delivery date",
                   J.wo ? `work order version ${J.wo.version} · ${J.sheets.length} sheet${J.sheets.length === 1 ? "" : "s"}` : "no work order uploaded"];
    const openP = J.problems.filter(p => p.status === "open"), answeredP = J.problems.filter(p => p.status !== "open");
    const askedD = J.defects.filter(d => d.office_status === "open");
    const atArrow = J.arrow.filter(a => a.at_vendor && !a.waiting), back2 = J.arrow.filter(a => !a.at_vendor);

    const defectGroups = {}; J.defects.forEach(d => { defectGroups[d.defect_type] = (defectGroups[d.defect_type] || 0) + 1; });
    const what = (a) => [a.sheet_numbers && a.sheet_numbers.length ? `sheet${a.sheet_numbers.length === 1 ? "" : "s"} ${a.sheet_numbers.join(", ")}` : "", a.description].filter(Boolean).join(" — ");
    const cols = `grid-template-columns: minmax(110px, auto) repeat(${Math.max(1, g.depts.length)}, minmax(76px, 1fr))`;

    const grid = !J.wo ? `<div class="empty"><b>No work order uploaded</b>Counts start once the job’s zip is dropped on Project Handoff.</div>`
      : `<div class="gkey" style="margin-bottom:10px"><span><i style="background:var(--teal)"></i>Complete</span><span><i style="background:var(--sawdust); border:1px solid var(--gray)"></i>Started</span>
           <span><i style="background:#fff; border:1px solid var(--gray)"></i>Not started</span><span>— not this department</span></div>
         <div class="scroll"><div class="grid" style="${cols}">
           <div></div>${g.depts.map(d => { const f = finishByLabel(J.finishBy.find(x => x.department === d));
             return `<div class="gh">${esc(DEPT_NAME[d])}${f ? `<small class="fbd">${esc(f.main)}${f.when ? `<br><b>${esc(f.when)}</b>` : ""}</small>` : ""}</div>`; }).join("")}
           <div class="gs tot"><b>Whole job</b><small>${pieces} pieces</small></div>
           ${g.totals.map(t => `<div class="tot"><div class="c">${t.done}/${t.req}</div><div class="tbar"><i class="${t.done >= t.req ? "full" : ""}" style="width:${t.pct}%"></i></div></div>`).join("")}
           ${g.rows.map(r => `<div class="gs">${J.st && (J.st.sheets || []).some(x => x.n === r.n) ? `<button class="itemlink" data-item="${r.n}" aria-label="Sheet ${r.n}, ${esc(r.code)}: open the item"><b>Sheet ${r.n}</b> ›<small>${esc(r.code)}</small></button>` : `<b>Sheet ${r.n}</b><small>${esc(r.code)}</small>`}${d3Button(J, r.code)}</div>${r.cells.map(c => `<div class="c ${c.kind}">${esc(c.text)}</div>`).join("")}`).join("")}
         </div></div>`;

    // 20 Oct: one Status card, a line per fact, instead of six panels
    const first = openP[0] || askedD[0];
    const issuesV = !first ? `None open${answeredP.length ? ` · ${answeredP.length} answered` : ""}`
      : `${first.sheet_number !== null ? `Sheet ${first.sheet_number}` : "Whole job"} · ${esc(first.department_name)}${first.work_stopped ? ` <span class="stoptag">Work stopped</span>` : ""}: ${esc(first.body || first.defect_type || "")}${first.note ? ` — ${esc(first.note)}` : ""}
         <span class="m">${esc(first.raised_by_name || first.logged_by_name || "")}, ${esc(ago(first.raised_at || first.logged_at))}${openP.length + askedD.length > 1 ? ` · ${openP.length + askedD.length - 1} more` : ""}${answeredP.length ? ` · ${answeredP.length} answered` : ""}</span>`;
    const arrowV = toGo.concat(atArrow).map(a => `<div>${esc(what(a))}<span class="m">${esc(a.service === "paint" ? "Paint" : "Powdercoat")} · ${a.waiting ? `<b>waiting to go</b> · sent on ${esc(fmtDate(a.queued_on || a.sent_on))} by ${esc(a.queued_by_name || a.sent_by_name)}` : `sent ${esc(fmtDate(a.sent_on))} by ${esc(a.sent_by_name)} · <b>${a.days_out} day${a.days_out === 1 ? "" : "s"} out</b>`}</span></div>`).join("")
      || `Nothing at Arrow${back2.length ? `<span class="m">${back2.length} returned</span>` : ""}`;
    const defectsV = Object.entries(defectGroups).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${esc(t)} ×${n}`).join(", ") || "None logged";
    const tv = J.tv || [], showing = tv.filter(t => t.showing).length, withCopy = tv.filter(t => t.has_copy).length, jobHidden = tv.length && tv[0].job_hidden;
    const tvV = !tv.length ? "" : jobHidden ? "Hidden from the floor TV" : showing ? `${showing} picture${showing === 1 ? "" : "s"} on the floor TV` : withCopy ? "Not on the floor TV right now" : "No TV copy of its site photos";
    const tvA = !tv.length ? "" : jobHidden ? `<button class="a" data-tvjob="${esc(J.id)}" data-hide="0">Show again</button>` : withCopy ? `<button class="a" data-tvjob="${esc(J.id)}" data-hide="1">Hide from the TV</button>` : "";
    const loV = J.loadouts.slice().sort((a, b) => String(b.scheduled_for || b.started_at).localeCompare(String(a.scheduled_for || a.started_at))).map(l => `<div><b>${esc(tripWord(l))}</b> · ${l.completed_at ? `${l.kind === "delivery" ? "delivered" : "picked up"} ${esc(fmtWhen(l.completed_at))}${l.signed_name ? ` · signed by ${esc(l.signed_name)}` : ""}`
              : l.scheduled_for ? `scheduled ${esc(fmtWhen(l.scheduled_for))}` : l.ready_at ? `ready for pickup since ${esc(fmtWhen(l.ready_at))}` : l.is_open ? `started ${esc(fmtWhen(l.started_at))}` : `finished ${esc(fmtWhen(l.finished_at))}`}
            ${l.pieces_total ? `<span class="m">${l.pieces_here || 0} of ${l.pieces_total} pieces${l.scheduled_by_name ? ` · scheduled by ${esc(l.scheduled_by_name)}` : ""}</span>` : ""}</div>`).join("") || "None yet";
    const side = `
      <section class="panel"><h2>Status</h2>
        <div class="srow"><span class="k">Issues${openP.length + askedD.length ? `<span class="n">${openP.length + askedD.length} open</span>` : ""}</span><span class="v">${issuesV}</span>${openP.length + askedD.length ? `<button class="a" data-tab="tasks">Answer</button>` : "<span></span>"}</div>
        <div class="srow"><span class="k">Arrow${toGo.length + atArrow.length ? `<span class="n">${toGo.length + atArrow.length}</span>` : ""}</span><span class="v">${arrowV}</span><button class="a" data-arrowjump="1">On Operations</button></div>
        <div class="srow"><span class="k">Defects${J.defects.length ? `<span class="n">${J.defects.length}</span>` : ""}</span><span class="v">${defectsV}</span><span></span></div>
        <div class="srow"><span class="k">Photos${J.photoCount ? `<span class="n">${J.photoCount}</span>` : ""}</span><span class="v">${J.photoCount ? `${J.photoCount} photo${J.photoCount === 1 ? "" : "s"}` : "None yet"}</span>${J.photoCount ? `<button class="a" data-jobphotos="1">See them</button>` : "<span></span>"}</div>
        ${tv.length ? `<div class="srow"><span class="k">Floor TV</span><span class="v">${tvV}<span class="m">To hide one picture, open it under Photos and deliveries below and use the button under it.</span></span>${tvA || "<span></span>"}</div>` : ""}
        <div class="srow"><span class="k">Load-outs</span><span class="v">${loV}</span><span></span></div>
      </section>`;

    const done = J.sheets.length ? g.totals.reduce((a, t) => a + t.done, 0) : 0;
    return `${back}
      <div class="jobhead"><h1>${testTag(j)}${esc(j.project_id || "(no PROJ number)")}<span class="jn">${esc(j.name)}</span></h1></div>
      ${J.st ? `<div class="say"><p>${esc(JS.summary(J.st, J.st.departments || []))}</p><small>The sentence sales see on their Job status page${J.at ? ` · updated ${esc(clockOf(J.at))}` : ""}</small></div>` : ""}
      <div class="facts">
        <div class="fact"><small>Phase</small><b>${esc(facts[0])}</b></div>
        <div class="fact"><small>Delivery</small><b>${esc(j.delivery_date ? fmtDate(j.delivery_date) : "no date")}${j.delivery_date && daysLeft(j.delivery_date) !== null ? ` · ${esc(daysText(daysLeft(j.delivery_date)))}` : ""}</b></div>
        <div class="fact"><small>Work order</small><b>${J.wo ? `v${J.wo.version} · ${J.sheets.length} sheet${J.sheets.length === 1 ? "" : "s"} · ${pieces} pieces` : "none uploaded"}</b></div>
        ${J.st ? `<div class="fact"><small>Trip</small><b>${esc(JS.tripFact(J.st))}</b></div>` : ""}
        ${J.wo ? `<div class="fact"><small>Steps done</small><b>${done} of ${g.totals.reduce((a, t) => a + t.req, 0)}</b></div>` : ""}
        ${flag ? `<div class="fact flag ${flag.level}"><small>${esc(LEVEL_NAME[flag.level])} · set by ${esc(flag.set_by_name)}, ${esc(ago(flag.set_at))}${flag.department_name ? ` · ${esc(flag.department_name)} only` : ""}</small><b>${esc(flag.note)}</b></div>` : ""}
      </div>
      <div class="jobcols"><section class="panel"><h2 style="margin-bottom:4px">Items, by department</h2>${J.st && (J.st.sheets || []).length ? `<p class="sub" style="margin:0 0 10px">One row per work order sheet. Tap a sheet for its work order page, its 3D design and where it is.</p>` : ""}${grid}</section><div class="side">${side}</div></div>
      <section class="panel" id="jobphotos"><h2>Photos and deliveries</h2>${!j.project_id ? `<p class="sub">This job has no PROJ number, so its photos can't be looked up.</p>`
        : S.phJob && S.phJob.project === j.project_id ? jobPhotosHtml(S.phJob) : `<p class="sub">Loading…</p>`}</section>`;
  }

  // ---------- one item of the open job (11 Nov; Job status's item page, inside the office) ----------
  function itemScreen() {
    const J = S.job, j = J.st, s = j.sheets[S.item], L = JS.itemDepts(j, s), prev = j.sheets[S.item - 1], next = j.sheets[S.item + 1];
    const design = (J.designs || []).find(x => d3Norm(x.item) === d3Norm(s.code));
    const rows = L.map(D => {
      const w = JS.itemWhy(j, s, D, L), done = JS.itemComplete(s, D), pct = D.total ? Math.round(100 * D.done / D.total) : 0;
      const dt = D.done >= D.total ? "Done" : D.finish_by ? `Done by ${fmtDate(D.finish_by)}` : "";
      return `<div class="drow${done ? " done" : ""}"><div class="dn">${esc(D.name)}${w ? `<span class="why">${esc(w)}</span>` : ""}</div>
        <div class="prog"><span class="num">${D.done}/${D.total}</span><span class="tbar"><i class="${D.done >= D.total ? "full" : ""}" style="width:${pct}%"></i></span></div><div class="due">${esc(dt)}</div></div>`;
    }).join("");
    const a = s.arrow, arrow = !a ? "" : a.back ? `Back from Arrow ${fmtDate(a.back)}${a.po ? ` (${a.po})` : ""}` : a.waiting ? "Waiting to go to Arrow" : `At Arrow${a.po ? " on " + a.po : ""} since ${fmtDate(a.since)}`;
    const img = s.page ? S.pgImg[s.page] : null, err = s.page ? S.pgErr[s.page] : null;
    if (s.page && !img && !err) loadItemPage(s.page);
    const pic = !("page" in s) ? `<div class="pgwait">The work order page shows here once job_items.sql has run.</div>`
      : !s.page ? `<div class="pgwait">This sheet's page hasn't been uploaded.</div>`
      : img ? `<button class="pg${S.pgBig ? " big" : ""}" data-pgbig="1" aria-label="${S.pgBig ? "Make the page smaller" : "Make the page bigger"}"><img src="${esc(img)}" alt="Work order page for sheet ${s.n}"></button>`
      : `<div class="pgwait">${esc(err || "Loading the work order page…")}</div>`;
    return `<button class="link" data-itemback="1" style="padding-left:0">← ${esc(J.job.project_id || "Job")}</button>
      <div class="jobhead"><h1>${testTag(J.job)}Sheet ${s.n}${s.code ? " · " + esc(s.code) : ""}<span class="jn">${s.qty} ${s.qty === 1 ? "piece" : "pieces"}</span></h1></div>
      <div class="say"><p>${esc(JS.itemSentence(j, s))}</p><small>${esc(J.job.project_id || "")} · ${esc(J.job.name)}</small></div>
      <div class="facts"><div class="fact"><small>This item's trip</small><b>${esc(JS.itemTripFact(j, s))}</b></div>
        ${arrow ? `<div class="fact"><small>Arrow</small><b>${esc(arrow)}</b></div>` : ""}
        ${s.issue ? `<div class="fact"><small>Open issue · ${esc(s.issue.dept)}${s.issue.stopped ? " · work stopped" : ""}</small><b>${esc(s.issue.text)}</b></div>` : ""}</div>
      <div class="jobcols"><section class="panel"><h2>Work order page</h2>${pic}${s.page && img ? `<p class="sub" style="margin:6px 0 0">Tap the page to make it ${S.pgBig ? "smaller" : "bigger"}.</p>` : ""}</section>
        <div class="side"><section class="panel"><h2>Departments</h2>${rows || `<p class="sub">No departments on this sheet.</p>`}
          ${design ? `<button class="go" style="width:100%; margin-top:12px" data-d3="${esc(design.id)}">Open the 3D design</button>` : ""}
          <div class="btns" style="margin-top:12px">${prev ? `<button class="plain" data-item="${prev.n}">‹ Sheet ${prev.n}</button>` : ""}${next ? `<button class="plain" data-item="${next.n}">Sheet ${next.n} ›</button>` : ""}</div></section></div></div>`;
  }
  async function loadItemPage(path) {
    if (S.pgBusy[path]) return; S.pgBusy[path] = true;
    try {
      const { data, error } = await db.storage.from("work-orders").createSignedUrl(path, 3600);
      if (error || !data || !data.signedUrl) throw error || new Error("no link");
      S.pgImg[path] = data.signedUrl;
    } catch (e) { S.pgErr[path] = isNetworkError(e) ? "No connection right now. The page shows once you're back online." : "The work order page couldn't be loaded."; }
    S.pgBusy[path] = false;
    if (S.jobView && S.item !== null) render();
  }
  const clockOf = (iso) => { const t = new Date(iso); let h = t.getHours(); const m = String(t.getMinutes()).padStart(2, "0"); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };

  /* Where a job is, in words: COPIED FROM status.html, word for word (test_job_status_same.js keeps them equal), so the
     office and the sales logins read the same sentence. Change status.html's and paste it here, never this one alone. */
  const JS = (() => {
  // ---------- dates, in the words the shop pages already use ----------
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d = (s) => { const [y, m, dd] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, dd); };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const diffDays = (s) => Math.round((d(s) - today()) / 86400000);
  const fmtDate = (s) => { const x = d(s); return `${MON[x.getMonth()]} ${x.getDate()}`; };
  const days = (n) => `${n} ${n === 1 ? "day" : "days"}`;
  const daysText = (n) => n < 0 ? `${days(-n)} late` : n === 0 ? "due today" : `${days(n)} left`;     // the office's delivery words
  const finishWords = (n) => n > 0 ? `${days(n)} left` : n === 0 ? "today" : `${days(-n)} past`;   // the tablet's done-by words
  const andList = (a) => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const pieces = (n) => `${n} ${n === 1 ? "piece" : "pieces"}`;
  const clock = (iso) => { const t = new Date(iso); let h = t.getHours(); const m = String(t.getMinutes()).padStart(2, "0"); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };

  // ---------- working out where a job is (from job_lookup's reply) ----------
  const out = (j) => (j.arrow || []).filter(a => !a.waiting);
  const isComplete = (j, D) => D.done >= D.total && !(D.key === "metal" && out(j).length);
  const overall = (L) => {
    const done = L.reduce((a, D) => a + D.done, 0), total = L.reduce((a, D) => a + D.total, 0);
    let pct = total ? Math.round(100 * done / total) : 0;
    if (done > 0 && pct === 0) pct = 1; if (done < total && pct === 100) pct = 99;
    return { done, total, pct };
  };
  const trips = (j) => {
    const T = j.trips || [], went = T.filter(t => t.done_on).reduce((a, t) => a + (t.went || 0), 0);
    const of = T.length ? Math.max(...T.map(t => t.of || 0)) : 0;
    return { T, done: T.filter(t => t.done_on), open: T.find(t => !t.done_on), went, of };
  };
  const tripPhrase = (t) => t.day
    ? `${t.kind.toLowerCase()} ${fmtDate(t.day)}${t.time ? " at " + t.time : ""}, ${daysText(diffDays(t.day))}`
    : `ready for ${t.kind.toLowerCase().replace(/ delivery$/, "")}, not picked up yet`;
  const dateClause = (j, open) => {
    if (open && open.day) return cap(tripPhrase(open)) + ".";
    if (!j.delivery) return "No delivery date on Monday yet.";
    return `Delivery ${fmtDate(j.delivery)}, ${daysText(diffDays(j.delivery))}.`;
  };
  function why(j, D) {
    if (D.key === "metal" && D.done >= D.total && out(j).length) { const a = out(j)[0]; return `At Arrow since ${fmtDate(a.since)} · ${days(Math.max(0, -diffDays(a.since)))} out`; }
    if (D.done > 0 || D.done >= D.total) return "";
    if (D.ready > 0) return `${pieces(D.ready)} ready`;
    if (D.held) return "Waiting on hand-off";
    if ((D.waiting || []).length) return "Waiting on " + andList(D.waiting.map(w => w === "arrow" ? "Arrow" : w));
    return "Not started";
  }
  function dateOf(D) {
    if (D.done >= D.total) return { main: D.done_on ? `Done ${fmtDate(D.done_on)}` : "Done", when: "" };
    if (D.finish_by) return { main: `Done by ${fmtDate(D.finish_by)}`, when: finishWords(diffDays(D.finish_by)) };
    return null;                                                   // look-up logins get no done-by dates
  }
  function summary(j, L) {
    if (!(j.sheets || []).length)
      return j.phase && j.phase !== "In Production" ? `Not on the floor yet. Monday shows ${j.phase}. ${dateClause(j, null)}`
                                                    : `In production on Monday; its work order isn't uploaded yet. ${dateClause(j, null)}`;
    const t = trips(j), built = L.some(D => D.key === "assembly_qc") ? "Built and through QC." : "Built.";
    if (t.done.length && t.went >= t.of) return `Delivered ${fmtDate(t.done[t.done.length - 1].done_on)}. All ${pieces(t.of)}${t.done.length > 1 ? `, in ${t.done.length} trips` : ""}.`;
    const allDone = L.every(D => isComplete(j, D));
    if (t.done.length) {
      const rest = t.of - t.went, who = rest === 1 ? "The last one is" : `The other ${rest} are`;
      const head = `Part delivered ${fmtDate(t.done[t.done.length - 1].done_on)}: ${t.went} of ${pieces(t.of)} went.`;
      if (allDone) return `${head} ${who} built${t.open ? ": " + tripPhrase(t.open) : ", not scheduled yet"}.`;
      const act = L.filter(D => D.done > 0 && D.done < D.total);
      return `${head} ${who} in ${andList((act.length ? act : L.filter(D => !isComplete(j, D))).map(D => D.name))}.`;
    }
    if (allDone) {
      if (t.open) return `${built} ${cap(tripPhrase(t.open))}.`;
      if (!j.active) return `${built} Monday shows ${j.phase || "it's left production"}.`;
      return `${built} Not scheduled for delivery yet.${j.delivery ? ` Monday’s date is ${fmtDate(j.delivery)}.` : ""}`;
    }
    const o = overall(L);
    if (o.done === 0) return j.handed_off === false ? `Not handed off to the floor yet. ${dateClause(j, t.open)}` : `On the floor, nothing started yet. ${dateClause(j, t.open)}`;
    const active = L.filter(D => D.done > 0 && D.done < D.total);
    let s;
    if (active.length) s = `In ${andList(active.map(D => D.name))}, ${o.pct}% done overall.`;
    else { const ready = L.filter(D => D.done === 0 && D.ready > 0); s = ready.length ? `Ready for ${andList(ready.map(D => D.name))}, ${o.pct}% done overall.` : `${o.pct}% done overall.`; }
    if (out(j).length) s += ` Part of it is at Arrow, ${days(Math.max(0, -diffDays(out(j)[0].since)))} so far.`;
    const late = L.filter(D => D.done < D.total && D.finish_by).map(D => ({ D, n: -diffDays(D.finish_by) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n)[0];
    if (late) s += ` ${late.D.name} is ${days(late.n)} past its done-by date.`;
    return `${s} ${dateClause(j, t.open)}`;
  }
  function shortStatus(j) {
    const L = j.departments || [];
    if (!(j.sheets || []).length) return j.phase || "No work order yet";
    const t = trips(j);
    if (t.done.length && t.went >= t.of) return `Delivered ${fmtDate(t.done[t.done.length - 1].done_on)}`;
    if (t.done.length) return "Part delivered";
    if (L.every(D => isComplete(j, D))) return t.open ? (t.open.day ? `${t.open.kind.replace(/ delivery$/, "")} ${fmtDate(t.open.day)}` : "Ready for pickup") : "Built, not scheduled";
    const o = overall(L);
    if (o.done === 0) return j.handed_off === false ? "Not handed off" : "Not started";
    const active = L.filter(D => D.done > 0 && D.done < D.total);
    return active.length ? `In ${active[0].name}${active.length > 1 ? " +" + (active.length - 1) : ""} · ${o.pct}%` : `${o.pct}% done`;
  }
  function tripFact(j) {
    const t = trips(j); if (!t.T.length) return "Not scheduled yet";
    const parts = [];
    if (t.done.length) parts.push(`${t.went} of ${t.of} delivered ${fmtDate(t.done[t.done.length - 1].done_on)}`);
    if (t.open) parts.push(t.open.day ? `${t.open.kind} ${fmtDate(t.open.day)}${t.open.time ? ", " + t.open.time : ""}` : `${t.open.kind}, ready`);
    else if (t.went < t.of) parts.push("rest not scheduled");
    return cap(parts.join("; "));
  }

  // ---------- one item (one work order sheet): 4 Nov ----------
  const SHORT = { full_custom: "FC", milling: "Mill", cnc: "CNC", sanding: "Sand", finishing: "Fin", metal_paint: "Paint", metal: "Metal", assembly_qc: "QC" };
  const WOOD = ["milling", "cnc", "sanding", "finishing"];
  const itemDepts = (j, s) => (j.departments || []).filter(D => (s.p || {})[D.key])
    .map(D => ({ key: D.key, name: D.name, finish_by: D.finish_by, done: s.p[D.key].done, total: s.p[D.key].of }));
  const arrowOut = (s) => !!(s.arrow && !s.arrow.back);
  const itemComplete = (s, D) => D.done >= D.total && !(D.key === "metal" && arrowOut(s));
  function itemReady(j, s, D) {                                     // pieces of this sheet ready for D, from the sheet's own counts
    const v = (k) => (s.p || {})[k] ? s.p[k].done : null;
    if (D.key === "assembly_qc") {
      let a = s.qty;
      if (v("finishing") != null) a = Math.min(a, v("finishing")); else if (v("full_custom") != null) a = Math.min(a, v("full_custom"));
      if (v("metal") != null) a = Math.min(a, arrowOut(s) ? 0 : v("metal"));
      return Math.max(0, a - D.done);
    }
    const i = WOOD.indexOf(D.key);
    for (let x = i - 1; x >= 0; x--) if (v(WOOD[x]) != null) return Math.max(0, v(WOOD[x]) - D.done);
    if (i > 0 && v("full_custom") != null) return Math.max(0, (v("full_custom") >= s.qty ? s.qty : 0) - D.done);
    return j.handed_off === false ? 0 : Math.max(0, D.total - D.done);
  }
  function itemWaits(s, D, L) {
    const has = (k) => L.find(x => x.key === k);
    if (D.key === "assembly_qc") {
      const w = [], f = has("finishing"), fc = has("full_custom"), m = has("metal");
      if (f && !itemComplete(s, f)) w.push(f.name); else if (!f && fc && !itemComplete(s, fc)) w.push(fc.name);
      if (m && m.done < m.total) w.push(m.name); else if (m && arrowOut(s)) w.push("Arrow");
      return w;
    }
    const i = WOOD.indexOf(D.key);
    for (let x = i - 1; x >= 0; x--) { const p = has(WOOD[x]); if (p) return [p.name]; }
    return i > 0 && has("full_custom") ? ["Full Custom"] : [];
  }
  function itemWhy(j, s, D, L) {
    if (D.key === "metal" && D.done >= D.total && arrowOut(s))
      return s.arrow.waiting ? "Waiting to go to Arrow" : `At Arrow${s.arrow.po ? " on " + s.arrow.po : ""} since ${fmtDate(s.arrow.since)}`;
    if (D.done > 0) return "";
    const r = itemReady(j, s, D); if (r > 0) return `${pieces(r)} ready`;
    const w = itemWaits(s, D, L); if (w.length) return "Waiting on " + andList(w);
    return j.handed_off === false ? "Waiting on hand-off" : "Not started";
  }
  function itemSentence(j, s) {
    const L = itemDepts(j, s), open = trips(j).open, went = s.went || 0;
    if (s.qty && went >= s.qty) return `Delivered ${fmtDate(s.went_on)}: all ${pieces(s.qty)} went${s.went_kind ? ` (${s.went_kind.toLowerCase()})` : ""}.`;
    let x = went ? `${went} of ${pieces(s.qty)} went ${fmtDate(s.went_on)}. ` : "";
    if (L.every(D => itemComplete(s, D))) {
      const head = went ? "The rest is built" : "Built and through QC";
      x += open ? `${head}. Goes on the ${tripPhrase(open)}.` : `${head}, waiting for ${went ? "a" : "its"} trip.`;
    } else {
      const act = L.filter(D => D.done > 0 && D.done < D.total);
      if (act.length === 1) x += `In ${act[0].name}: ${act[0].done} of ${pieces(act[0].total)} done.`;
      else if (act.length) x += `In ${andList(act.map(D => D.name))}.`;
      else {
        const nx = L.find(D => !itemComplete(s, D));
        if (nx) { const r = itemReady(j, s, nx), w = itemWaits(s, nx, L);
          x += r > 0 ? `Ready for ${nx.name}: ${pieces(r)} waiting to start.`
             : !w.length && j.handed_off === false ? "Not handed off to the floor yet." : `${nx.name} next${w.length ? ": waiting on " + andList(w) : ""}.`; }
      }
      if (arrowOut(s)) x += s.arrow.waiting ? " Its metal is waiting to go to Arrow."
                                            : ` Its metal is at Arrow${s.arrow.po ? " on " + s.arrow.po : ""}, ${days(Math.max(0, -diffDays(s.arrow.since)))} so far.`;
    }
    if (s.issue) x += ` ${s.issue.dept} has an open issue${s.issue.stopped ? " (work stopped)" : ""}.`;
    const late = L.filter(D => D.done < D.total && D.finish_by).map(D => ({ D, n: -diffDays(D.finish_by) })).filter(z => z.n > 0).sort((a, b) => b.n - a.n)[0];
    if (late) x += ` ${late.D.name} is ${days(late.n)} past its done-by date.`;
    return x.trim();
  }
  function itemShort(j, s) {
    const L = itemDepts(j, s), went = s.went || 0;
    if (s.qty && went >= s.qty) return `Delivered ${fmtDate(s.went_on)}`;
    if (went) return `${went} of ${s.qty} delivered`;
    if (L.every(D => itemComplete(s, D))) return "Built";
    const act = L.filter(D => D.done > 0 && D.done < D.total); if (act.length) return `In ${act[0].name}`;
    if (arrowOut(s)) return s.arrow.waiting ? "Waiting for Arrow" : "At Arrow";
    const nx = L.find(D => !itemComplete(s, D)); return nx ? `${nx.name} next` : "";
  }
  function dots(j, s) {
    return itemDepts(j, s).map(D => {
      const cls = D.key === "metal" && D.done >= D.total && arrowOut(s) ? "arrow" : D.done >= D.total ? "done" : D.done > 0 ? "part" : "zero";
      return `<span class="dot ${cls}" title="${esc(D.name)}: ${D.done} of ${D.total}${cls === "arrow" ? ", at Arrow" : ""}">${esc(SHORT[D.key] || D.name)}</span>`;
    }).join("");

  function itemTripFact(j, s) {
    const went = s.went || 0, open = trips(j).open;
    const nxt = open ? (open.day ? `${open.kind} ${fmtDate(open.day)}${open.time ? ", " + open.time : ""}` : `${open.kind}, ready`) : "";
    if (s.qty && went >= s.qty) return `Went ${fmtDate(s.went_on)} · ${s.went_kind || "trip"}`;
    if (went) return `${went} of ${s.qty} went ${fmtDate(s.went_on)}; the rest ${nxt ? "on the " + nxt : "isn't scheduled yet"}`;
    return nxt || "Not scheduled yet";
  }
    return { summary, tripFact, itemDepts, itemComplete, itemWhy, itemSentence, itemTripFact };

  async function showDesign3() {
    const st = S.d3, host = document.getElementById("d3host");

    st.busy = true;
    const row = ((S.job && S.job.designs) || []).find(x => x.id === st.id);
    const say = (t) => { if (S.d3 !== st) return; st.msg = t; const h = document.getElementById("d3host"); if (h && !st.view) h.innerHTML = `<div class="d3wait">${esc(t)}</div>`; };
    try {

        } });

  // ---------- Arrow ----------
  // ---------- Feedback (5 Oct): what people sent with the Feedback button. A record for planning changes; no replies ----------
  const FB_PAGES = [["", "All pages"], ["index", "Tablets & phone"], ["office", "Office"], ["delivery", "Deliveries"], ["inventory", "Inventory"], ["pace", "Pace"], ["drop", "Drop a zip"], ["upload", "Upload"]];

  // 20 Oct (feedback_close.sql): a note dealt with is closed as Solved or Not relevant. It moves to Closed, folded at the
  // bottom, with who closed it and when, and Put it back undoes it. Nothing is deleted. Before the file runs, every note shows as open.
  const fbIsOpen = (f) => !f.state || f.state === "open";
  const fbOnPage = (f) => !S.fbkPage || f.page === S.fbkPage;
  const feedbackShown = () => (S.feedback || []).filter(f => fbOnPage(f) && fbIsOpen(f));
  const feedbackClosed = () => (S.feedback || []).filter(f => fbOnPage(f) && !fbIsOpen(f))
    .sort((a, b) => String(b.closed_at || "").localeCompare(String(a.closed_at || "")));
  const FB_STATE = { solved: "Solved", not_relevant: "Not relevant" };
  function feedbackLine(f) {

    return `<div class="line"><span class="body">

          ${!S.fbkCanClose ? "" : open
            ? `<div class="btns" style="margin-top:8px"><button class="plain" data-fbk="${esc(f.id)}" data-fbkstate="solved"${off}>Solved</button><button class="plain" data-fbk="${esc(f.id)}" data-fbkstate="not_relevant"${off}>Not relevant</button></div>`

    const none = !list.length && !closed.length;
